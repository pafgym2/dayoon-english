<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ 🎯 단어 퀴즈 · 🗣️ 따라 말하기 · 📤 백업/복원 · PWA ============ */

/* --- speak 확장: 두 번째 인자로 속도 (0.6 = 천천히) --- */
function speak(t,rate){
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않아요."); return;}
  t=String(t).replace(/[()]/g," ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
  if(!t)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=rate||0.85; u.pitch=1.05;
  const v=speechSynthesis.getVoices().find(function(v){return v.lang&&v.lang.indexOf("en")===0;});
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* --- 🎯 단어 퀴즈: 진도까지 배운 새 단어에서 5문제 --- */
function quizWordPool(){
  const upto=Math.min(getProg().m, MONTHS.length-1);
  let ws=[];
  for(let i=0;i<=upto;i++)MONTHS[i].weeks.forEach(function(wk){wk.days.forEach(function(d){(d.words||[]).forEach(function(w){
    if(/[a-zA-Z]/.test(w[0])&&w[1]&&/[가-힣]/.test(w[1]))ws.push({en:w[0],ko:w[1]});
  });});});
  const seen={};
  return ws.filter(function(w){if(seen[w.en])return false; seen[w.en]=true; return true;});
}
let quiz={qs:[],i:0,score:0,rewarded:false,locked:false};
function quizTodayKey(){const t=new Date(); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();}
function quizRewardLeft(){
  const q=lsGet('dayoon_quizq',{d:'',n:0});
  return q.d===quizTodayKey()?Math.max(0,3-q.n):3;
}
function quizUseReward(){
  const q=lsGet('dayoon_quizq',{d:'',n:0});
  if(q.d!==quizTodayKey()){q.d=quizTodayKey();q.n=0;}
  q.n++; lsSet('dayoon_quizq',q);
}
function openQuiz(){
  const pool=quizWordPool();
  if(pool.length<4){showToast('퀴즈 낼 단어가 아직 부족해요! 조금 더 배우고 와요 🌱'); return;}
  const shuffled=pool.slice().sort(function(){return Math.random()-0.5;});
  const qs=shuffled.slice(0,Math.min(5,shuffled.length)).map(function(w){
    const wrong=pool.filter(function(x){return x.en!==w.en;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
    return {w:w, mode:Math.random()<0.5?'en2ko':'ko2en',
            choices:wrong.concat([w]).sort(function(){return Math.random()-0.5;})};
  });
  quiz={qs:qs,i:0,score:0,rewarded:quizRewardLeft()>0,locked:false};
  if(quiz.rewarded)quizUseReward();
  document.getElementById('quizov').style.display='flex';
  quizShow();
}
function quizShow(){
  const q=quiz.qs[quiz.i];
  const label=q.mode==='en2ko'?'이 단어의 뜻은?':'이 뜻의 영어 단어는?';
  const prompt=q.mode==='en2ko'?q.w.en:q.w.ko;
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-num">'+(quiz.i+1)+' / '+quiz.qs.length+(quiz.rewarded?'':' · 연습 모드 (오늘 코인 획득 끝!)')+'</div>'
    +'<div class="qz-label">'+label+'</div>'
    +'<div class="qz-word">'+prompt+(q.mode==='en2ko'?' <button class="spk" type="button" onclick="speak(quiz.qs[quiz.i].w.en)">🔊</button>':'')+'</div>'
    +'<div class="qz-choices">'+q.choices.map(function(c,i){
      return '<button type="button" class="qz-c" onclick="quizAnswer('+i+')">'+(q.mode==='en2ko'?c.ko:c.en)+'</button>';
    }).join('')+'</div>';
  if(q.mode==='en2ko')speak(q.w.en);
}
function quizAnswer(i){
  if(quiz.locked)return; quiz.locked=true;
  const q=quiz.qs[quiz.i], ok=q.choices[i].en===q.w.en;
  document.querySelectorAll('.qz-c').forEach(function(b,bi){
    if(q.choices[bi].en===q.w.en)b.classList.add('right');
    else if(bi===i)b.classList.add('wrong');
    b.disabled=true;
  });
  if(ok)quiz.score++;
  setTimeout(function(){
    quiz.locked=false; quiz.i++;
    if(quiz.i<quiz.qs.length)quizShow(); else quizEnd();
  },900);
}
function quizEnd(){
  let coins=0;
  if(quiz.rewarded){
    coins=quiz.score*2+(quiz.score===quiz.qs.length?10:0);
    if(coins)setCoins(getCoins()+coins);
  }
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-word" style="margin-top:10px">'+(quiz.score===quiz.qs.length?'💯 완벽해요!':'🎉 잘했어요!')+'</div>'
    +'<div class="qz-label">'+quiz.score+' / '+quiz.qs.length+' 정답'+(coins?' · +'+coins+' 🪙':'')+'</div>'
    +'<div class="qz-choices" style="margin-top:12px"><button type="button" class="qz-c" onclick="openQuiz()">한 번 더!</button>'
    +'<button type="button" class="qz-c" onclick="closeQuiz()">닫기</button></div>';
  if(coins)showToast('퀴즈 보상 +'+coins+' 🪙');
}
function closeQuiz(){document.getElementById('quizov').style.display='none'; if("speechSynthesis" in window)speechSynthesis.cancel();}

/* --- 🗣️ 따라 말하기: 듣기 → 녹음 → 내 발음 비교 --- */
let shadow={list:[],i:0}, shRec=null, shChunks=[], shURL=null;
function shadowSentences(){
  if(cur.m<0)return [];
  const d=MONTHS[cur.m].weeks&&MONTHS[cur.m].weeks[cur.w]?MONTHS[cur.m].weeks[cur.w].days[cur.d]:null; if(!d)return [];
  return [].concat(d.main||[],d.role||[],d.wrap||[])
    .filter(function(l){return l[0]==='D'&&/[a-zA-Z]/.test(l[1]);})
    .map(function(l){return {en:l[1].replace(/[()]/g,'').replace(/\s+/g,' ').trim(), ko:(l[2]||'')};});
}
function openShadow(){
  const ls=shadowSentences();
  if(!ls.length){showToast('이 날은 따라 말할 문장이 없어요'); return;}
  shadow={list:ls,i:0};
  document.getElementById('shadov').style.display='flex';
  shadowShow();
}
function shadowShow(){
  const s=shadow.list[shadow.i];
  document.getElementById('sh-num').textContent=(shadow.i+1)+' / '+shadow.list.length+' · 듣고 → 녹음하고 → 비교해요';
  document.getElementById('sh-en').textContent=s.en;
  document.getElementById('sh-ko').textContent=s.ko;
  const au=document.getElementById('sh-au'); au.style.display='none'; au.removeAttribute('src');
  const rb=document.getElementById('sh-rec'); rb.classList.remove('on'); rb.textContent='🎙️ 녹음';
  if(shURL){URL.revokeObjectURL(shURL); shURL=null;}
  speak(s.en);
}
function shadowNext(){ shadow.i=(shadow.i+1)%shadow.list.length; shadowShow(); }
function shadowRec(){
  const btn=document.getElementById('sh-rec');
  if(shRec&&shRec.state==='recording'){shRec.stop(); return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('이 환경에선 마이크를 쓸 수 없어요 😢'); return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    shRec=new MediaRecorder(stream); shChunks=[];
    shRec.ondataavailable=function(e){shChunks.push(e.data);};
    shRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      if(shURL)URL.revokeObjectURL(shURL);
      shURL=URL.createObjectURL(new Blob(shChunks,{type:shRec.mimeType||'audio/mp4'}));
      const au=document.getElementById('sh-au'); au.src=shURL; au.style.display='block';
      au.play().catch(function(){});
      btn.classList.remove('on'); btn.textContent='🎙️ 다시 녹음';
    };
    shRec.start(); btn.classList.add('on'); btn.textContent='⏹ 그만';
  }).catch(function(){showToast('마이크 권한이 필요해요 😢');});
}
function closeShadow(){
  document.getElementById('shadov').style.display='none';
  if(shRec&&shRec.state==='recording')shRec.stop();
  if("speechSynthesis" in window)speechSynthesis.cancel();
}
function injectShadowBtn(){
  if(cur.m<0)return;
  const seg=document.querySelector('#main .seg.main');
  if(!seg||seg.querySelector('.shadow-btn'))return;
  if(!shadowSentences().length)return;
  const b=document.createElement('button');
  b.type='button'; b.className='shadow-btn';
  b.textContent='🗣️ 따라 말하기 연습 (듣고 → 녹음 → 비교)';
  b.onclick=openShadow;
  seg.appendChild(b);
}

/* --- 📤 백업 / 📥 복원 (부모용) --- */
const BK_KEYS=['dayoon_stamps','dayoon_coins','dayoon_prog','dayoon_avatar','dayoon_bonuspaid','dayoon_pos_v3','dayoon_fs','dayoon_quizq','dayoon_quizq2','dayoon_gift1','dayoon_ach','dayoon_stats','dayoon_mute','dayoon_wrongw','dayoon_done','dayoon_mastery'];
function exportData(){
  const o={};
  BK_KEYS.forEach(function(k){try{const v=localStorage.getItem(k); if(v!==null)o[k]=v;}catch(e){}});
  const code='DY1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  function fallback(){prompt('아래 코드를 길게 눌러 복사한 뒤, 카톡 "나에게 보내기"로 보관하세요 📋',code);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){showToast('백업 코드 복사 완료! 카톡 "나에게 보내기"에 붙여넣어 보관하세요 📋');},fallback);
  } else fallback();
}
function importData(){
  const code=prompt('백업 코드를 붙여넣으세요');
  if(!code)return;
  try{
    const j=JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/^DY1\./,'')))));
    let n=0; BK_KEYS.forEach(function(k){if(j[k]!==undefined){localStorage.setItem(k,j[k]); n++;}});
    if(!n)throw 0;
    render(); showToast('복원 완료! 도장·코인·진도를 불러왔어요 ✅');
  }catch(e){showToast('코드가 올바르지 않아요 😢 다시 확인해주세요');}
}

/* --- render 확장: 스크립트 화면에 따라 말하기 버튼 --- */
const _renderPrev=render;
render=function(){ _renderPrev(); injectShadowBtn(); };

/* --- UI 주입: 🎯 버튼 + 퀴즈/따라말하기 오버레이 --- */
document.body.insertAdjacentHTML('beforeend',
  '<div id="quizov" onclick="if(event.target===this)closeQuiz()"><div class="card">'
  +'<div class="rtitle">🎯 단어 퀴즈</div>'
  +'<div class="rsub">정답마다 🪙 획득 + 만점 보너스! 같은 단어는 2번 맞히면 졸업하고 새 단어가 나와요 🎓</div>'
  +'<div id="quizbody"></div></div></div>'
  +'<div id="shadov" onclick="if(event.target===this)closeShadow()"><div class="card">'
  +'<div class="rtitle">🗣️ 따라 말하기</div><div class="rsub" id="sh-num"></div>'
  +'<div class="sh-en" id="sh-en"></div><div class="sh-ko" id="sh-ko"></div>'
  +'<audio id="sh-au" controls style="display:none;width:100%;margin-top:10px"></audio>'
  +'<div class="btns">'
  +'<button type="button" class="b1" onclick="speak(shadow.list[shadow.i].en)">🔊 듣기</button>'
  +'<button type="button" class="b1" onclick="speak(shadow.list[shadow.i].en,0.6)">🐢 천천히</button>'
  +'<button type="button" class="b2" id="sh-rec" onclick="shadowRec()">🎙️ 녹음</button>'
  +'<button type="button" class="b2" onclick="shadowNext()">다음 →</button>'
  +'<button type="button" class="b3" onclick="closeShadow()">닫기</button>'
  +'</div></div></div>');
(function(){
  const fb=document.querySelector('.fontbtn');
  const qz=document.createElement('button');
  qz.className='toolbtn'; qz.textContent='🎯'; qz.title='단어 퀴즈'; qz.type='button'; qz.onclick=openQuiz;
  fb.insertBefore(qz,fb.firstChild);
})();

/* --- PWA: 서비스워커 등록 (깃허브 페이지에서만 — 오프라인 사용 가능) --- */
if('serviceWorker' in navigator && location.hostname.indexOf('github.io')>-1){
  try{navigator.serviceWorker.register('./sw.js');}catch(e){}
}

/* 따라 말하기 버튼 반영해서 다시 그리기 */
render();
</script>

<style>
  /* ===== 🆘 수업 SOS 100문장 ===== */
  .sos-intro{background:#fff0f7;border:1px solid #ffd9ec;border-radius:14px;padding:12px 14px;margin-bottom:14px;
    font-size:13.5px;color:var(--pink-d);font-weight:700;line-height:1.6;}
  .sos-cat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    margin-bottom:12px;overflow:hidden;}

function sos100HTML(){
  let h='<div class="sos-intro">🆘 수업 중에 막히면 이 문장들을 쓰면 돼요!<br>'
    +'특히 <b>"Can you say that again, please?"</b> 와 <b>"Can I go to the bathroom, please?"</b> 는 꼭 외워두기 💪<br>'
    +'문장 옆 🔊 를 누르면 발음을 들려줘요.</div>';
  SOS100.forEach(function(cat,ci){
    h+='<div class="sos-cat'+(ci===0?' open':'')+'"><h3 onclick="this.parentNode.classList.toggle(\'open\')">'
      +'<span>'+cat.emoji+'</span> '+cat.t+'<span class="cnt">'+cat.items.length+'문장</span><span class="arw">›</span></h3>'
      +'<div class="sos-list">';
    cat.items.forEach(function(it){
      h+='<div class="sos-item"><div class="sos-en">'+it[0]+'</div>'
        +'<div class="sos-ko">'+it[1]+'</div>'
        +'<div class="sos-when">💡 '+it[2]+'</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}

/* SOS 문장에 발음 버튼 부착 (.sos-en 텍스트) */
function addSosSpeakers(){
  document.querySelectorAll('#main .sos-en').forEach(function(el){
    if(el.querySelector('.spk'))return;
    let t=el.textContent.trim();
    if(!/[a-zA-Z]/.test(t))return;
    el.appendChild(spkBtn(t));
  });
}

function addSosChip(active){
  const b=document.createElement('button');
  b.className='mchip'+(active?' active':'');
  b.innerHTML='🆘<small>수업 SOS</small>';
  b.onclick=function(){cur={m:-4,d:0}; render();};
  // 홈 다음, 안내 앞에 넣기 (홈=첫번째)
  const home=monthsEl.children[0];
  if(home&&home.nextSibling)monthsEl.insertBefore(b,home.nextSibling);
  else monthsEl.appendChild(b);
}

const _renderBeforeSos=render;
render=function(){
  if(cur.m===-4){
    renderMonths(); addTestChip(false); addHomeChip(false); addSosChip(true);
    tabsEl.style.display='none';
    qEl.innerHTML='<b>🆘 수업 SOS</b> · 화상영어 중에 막힐 때 쓰는 100문장';
    mainEl.innerHTML='<div class="panel">'+sos100HTML()+'</div>';
    addSosSpeakers();
    try{localStorage.setItem('dayoon_pos_v3',JSON.stringify(cur));}catch(e){}
    window.scrollTo({top:0});
    return;
  }
  _renderBeforeSos();
  addSosChip(false);
};
render();

(function(){
  try{
    if(!localStorage.getItem('dayoon_gift1')){
      localStorage.setItem('dayoon_gift1','1');

        render();
      },700);
    }
  }catch(e){}

<script>
/* ============ 고도화: 🔊효과음 · 🏅업적 · 🎁뽑기연출 · 🧠오답복습 · 🖼️그림문제 ============ */

/* --- 🔊 효과음 (내장 신디사이저, 파일 없음) + 음소거 --- */
let __actx=null;
function sfx(type){
  if(lsGet('dayoon_mute',0))return;
  try{
    __actx=__actx||new (window.AudioContext||window.webkitAudioContext)();
    if(__actx.state==='suspended')__actx.resume();
    const t=__actx.currentTime;
    const seq={stamp:[[660,0,.09],[880,.08,.14]], coin:[[1320,0,.07],[1760,.06,.1]],
      gacha:[[523,0,.12],[659,.12,.12],[784,.24,.22]], good:[[784,0,.08],[1047,.07,.13]], bad:[[220,0,.2]]}[type]||[];
    seq.forEach(function(n){
      const o=__actx.createOscillator(), g=__actx.createGain();
      o.type='triangle'; o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,t+n[1]);
      g.gain.exponentialRampToValueAtTime(.16,t+n[1]+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+n[1]+n[2]);
      o.connect(g); g.connect(__actx.destination);
      o.start(t+n[1]); o.stop(t+n[1]+n[2]+.03);
    });
  }catch(e){}
}
function toggleMute(){
  lsSet('dayoon_mute', lsGet('dayoon_mute',0)?0:1);
  showToast(lsGet('dayoon_mute',0)?'효과음을 껐어요 🔇':'효과음을 켰어요 🔊');
  if(!lsGet('dayoon_mute',0))sfx('coin');
  render();
}

/* --- 🏅 업적 12종 (달성 시 코인 보상) --- */
function getStats(){ return lsGet('dayoon_stats',{qp:0,ga:0}); }
function saveStats(s){ lsSet('dayoon_stats',s); }
const ACH=[
  {id:'a_stamp1',  e:'🎯',n:'첫 도장',      d:'도장 1개 찍기',      c:20,  f:function(){return stampSet().size>=1;}},
  {id:'a_streak7', e:'🔥',n:'일주일 불꽃',  d:'7일 연속 연습',      c:50,  f:function(){return currentStreak()>=7;}},
  {id:'a_stamp28', e:'🏆',n:'꾸준왕',       d:'도장 28개 모으기',   c:100, f:function(){return stampSet().size>=28;}},
  {id:'a_streak30',e:'🌟',n:'한 달 불꽃',   d:'30일 연속 연습',     c:300, f:function(){return currentStreak()>=30;}},
  {id:'a_stamp100',e:'💯',n:'백 개의 도장', d:'도장 100개 모으기',  c:300, f:function(){return stampSet().size>=100;}},
  {id:'a_quiz1',   e:'🧠',n:'퀴즈 천재',    d:'퀴즈 첫 만점',       c:30,  f:function(){return getStats().qp>=1;}},
  {id:'a_quiz10',  e:'🎓',n:'단어 박사',    d:'퀴즈 만점 10번',     c:150, f:function(){return getStats().qp>=10;}},
  {id:'a_gacha1',  e:'🎁',n:'첫 뽑기',      d:'랜덤 뽑기 1번',      c:20,  f:function(){return getStats().ga>=1;}},
  {id:'a_col10',   e:'🧸',n:'수집가',       d:'아이템 10개 모으기', c:50,  f:function(){return getAva().owned.length>=10;}},
  {id:'a_col30',   e:'👑',n:'대수집가',     d:'아이템 30개 모으기', c:200, f:function(){return getAva().owned.length>=30;}},
  {id:'a_m1',      e:'🚀',n:'1개월차 완주', d:'2개월차 진입',       c:100, f:function(){return getProg().m>=1;}},
  {id:'a_half',    e:'⛳',n:'반환점',       d:'전체 진도 50%',      c:300, f:function(){return progPct()>=50;}}

function getAchs(){ return lsGet('dayoon_ach',[]); }
function checkAch(){
  const got=getAchs(); let gained=[], coins=0;
  ACH.forEach(function(a){
    if(got.indexOf(a.id)<0){ try{ if(a.f()){ got.push(a.id); gained.push(a); coins+=a.c; } }catch(e){} }
  });
  if(gained.length){
    lsSet('dayoon_ach',got); setCoins(getCoins()+coins); sfx('gacha');
    showToast('🏅 업적 달성! '+gained[0].e+' '+gained[0].n+(gained.length>1?' 외 '+(gained.length-1)+'개':'')+' — +'+coins+' 🪙');
    render();
  }
}

/* --- 🧠 퀴즈 오답 복습: 틀린 단어를 기억했다가 우선 출제 --- */
function wrongList(){ return lsGet('dayoon_wrongw',[]); }
function pushWrong(en){ const l=wrongList(); if(l.indexOf(en)<0){ l.push(en); if(l.length>30)l.shift(); lsSet('dayoon_wrongw',l); } }
function clearWrong(en){ const l=wrongList(); const i=l.indexOf(en); if(i>-1){ l.splice(i,1); lsSet('dayoon_wrongw',l); } }
function openQuiz(){
  const pool=quizWordPool();
  if(pool.length<4){showToast('퀴즈 낼 단어가 아직 부족해요! 조금 더 배우고 와요 🌱'); return;}
  // 틀렸던 단어 최대 2개 우선 + 나머지 랜덤
  const wl=wrongList();
  const wrongPool=pool.filter(function(w){return wl.indexOf(w.en)>-1;}).sort(function(){return Math.random()-0.5;}).slice(0,2);
  const restPool=pool.filter(function(w){return wrongPool.indexOf(w)<0;}).sort(function(){return Math.random()-0.5;});
  const picked=wrongPool.concat(restPool).slice(0,Math.min(5,pool.length)).sort(function(){return Math.random()-0.5;});
  const qs=picked.map(function(w){
    const wrong=pool.filter(function(x){return x.en!==w.en;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
    return {w:w, mode:Math.random()<0.5?'en2ko':'ko2en',
            choices:wrong.concat([w]).sort(function(){return Math.random()-0.5;})};
  });
  quiz={qs:qs,i:0,score:0,rewarded:quizRewardLeft()>0,locked:false};
  if(quiz.rewarded)quizUseReward();
  document.getElementById('quizov').style.display='flex';
  quizShow();
}
function quizAnswer(i){
  if(quiz.locked)return; quiz.locked=true;
  const q=quiz.qs[quiz.i], ok=q.choices[i].en===q.w.en;
  document.querySelectorAll('.qz-c').forEach(function(b,bi){
    if(q.choices[bi].en===q.w.en)b.classList.add('right');
    else if(bi===i)b.classList.add('wrong');
    b.disabled=true;
  });
  if(ok){ quiz.score++; sfx('good'); clearWrong(q.w.en); addMastery(q.w.en); }
  else { sfx('bad'); pushWrong(q.w.en); resetMastery(q.w.en); }
  setTimeout(function(){
    quiz.locked=false; quiz.i++;
    if(quiz.i<quiz.qs.length)quizShow(); else quizEnd();
  },900);
}
function quizEnd(){
  let coins=0;
  if(quiz.rewarded){
    coins=quiz.score*2+(quiz.score===quiz.qs.length?10:0);
    if(coins)setCoins(getCoins()+coins);
  }
  if(quiz.score===quiz.qs.length){ const s=getStats(); s.qp++; saveStats(s); }
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-word" style="margin-top:10px">'+(quiz.score===quiz.qs.length?'💯 완벽해요!':'🎉 잘했어요!')+'</div>'
    +'<div class="qz-label">'+quiz.score+' / '+quiz.qs.length+' 정답'+(coins?' · +'+coins+' 🪙':'')
    +(wrongList().length?'<br>틀린 단어 '+wrongList().length+'개는 다음 퀴즈에 다시 나와요 💪':'')+'</div>'
    +'<div class="qz-choices" style="margin-top:12px"><button type="button" class="qz-c" onclick="openQuiz()">한 번 더!</button>'
    +'<button type="button" class="qz-c" onclick="closeQuiz()">닫기</button></div>';
  if(coins)showToast('퀴즈 보상 +'+coins+' 🪙');
  checkAch();
}

/* --- 🎁 뽑기 연출: 상자 두구두구 → 짜잔! --- */
function gacha(){
  const a=getAva(), c=getCoins();
  if(c<GACHA){ showToast('뽑기는 🪙'+GACHA+' 필요해요! 도장 '+Math.ceil((GACHA-c)/10)+'개만 더 💪'); return; }
  const pool=ITEMS.filter(function(i){return i.p>0 && a.owned.indexOf(i.id)<0;});
  if(!pool.length){ showToast('벌써 다 모았어요! 진짜 대단해요 🏆'); return; }
  setCoins(c-GACHA);
  const it=pool[Math.floor(Math.random()*pool.length)];
  a.owned.push(it.id); a.eq[it.slot]=it.id; saveAva(a);
  const s=getStats(); s.ga++; saveStats(s);
  const ov=document.getElementById('gachaov');
  ov.style.display='flex';
  document.getElementById('gbody').innerHTML='<div class="gbox">🎁</div><div class="glabel">두구두구...</div>';
  setTimeout(function(){
    sfx('gacha');
    document.getElementById('gbody').innerHTML=
      '<div class="gitem">'+it.e+'</div>'
      +'<div class="gname">'+it.n+'</div>'
      +'<div class="grare gr-'+it.r+'">'+RLBL[it.r]+' 등급!</div>'
      +'<button type="button" class="gclose" onclick="closeGacha()">착용하고 닫기 ✨</button>';
    render(); checkAch();
  },1100);
}

/* --- ✅ 연습 완료 체크: 진도 포인터 기준으로 월·주·일 탭에 표시 --- */
function progIdxNow(){ const p=getProg(); return p.m*28+p.w*7+p.d; }
function dayDone(m,w,d){ return m*28+w*7+d < progIdxNow(); }
function weekDone(m,w){ return m*28+w*7+6 < progIdxNow(); }
function weekDoneCount(m,w){ let c=0; for(let d=0;d<7;d++)if(dayDone(m,w,d))c++; return c; }
function monthDone(m){ return (m+1)*28-1 < progIdxNow(); }
function addBadge(el,cls,txt){ if(!el.querySelector('.tick'))el.insertAdjacentHTML('beforeend','<span class="tick '+cls+'">'+txt+'</span>'); }
function markDone(){
  // 월 칩: 완주 ✓ / 진행 중이면 N일
  const chips=Array.prototype.filter.call(monthsEl.children,function(b){return b.textContent.indexOf('개월차')>-1;});
  chips.forEach(function(b,m){
    if(monthDone(m))addBadge(b,'','✓');
    else{ let c=0; for(let w=0;w<4;w++)c+=weekDoneCount(m,w); if(c>0)addBadge(b,'part',c+'일'); }
  });
  if(cur.m<0)return;
  const tabs=Array.prototype.filter.call(tabsEl.children,function(el){return el.classList&&el.classList.contains('tab');});
  const wks=tabs.filter(function(t){return t.classList.contains('wk');});
  const dds=tabs.filter(function(t){return !t.classList.contains('wk');});
  wks.forEach(function(b,w){
    if(weekDone(cur.m,w))addBadge(b,'','✓');
    else{ const c=weekDoneCount(cur.m,w); if(c>0)addBadge(b,'part',c+'/7'); }
  });
  const p=getProg();
  dds.forEach(function(b,d){
    if(dayDone(cur.m,cur.w,d))addBadge(b,'','✓');
    else if(p.m===cur.m&&p.w===cur.w&&p.d===d)addBadge(b,'now','▶');
  });
  // 페이지 안 제목에도 완료 표시
  const dt=document.querySelector('#main .daytitle');
  if(dt&&!dt.querySelector('.done-chip')){
    if(dayDone(cur.m,cur.w,cur.d))dt.insertAdjacentHTML('beforeend','<span class="done-chip">✅ 연습 완료</span>');
    else if(p.m===cur.m&&p.w===cur.w&&p.d===cur.d)dt.insertAdjacentHTML('beforeend','<span class="done-chip todo">📌 오늘 할 차례</span>');
  }
}

/* --- ✔ 일자별 완료 체크: 각 스크립트 날을 개별로 체크 (하루에 여러 날 가능) --- */
function doneSet(){ return new Set(lsGet('dayoon_done',[])); }
function saveDone(s){ lsSet('dayoon_done',Array.from(s)); }
/* 첫 실행 마이그레이션: 기존 진도 포인터 앞의 날들은 완료로 인정 */
(function(){ try{
  if(localStorage.getItem('dayoon_done')===null){
    const pi=progIdxNow(), arr=[];
    for(let i=0;i<pi;i++)arr.push(i);
    lsSet('dayoon_done',arr);
  }
}catch(e){} })();
/* 완료 표시·진도율을 체크 기반으로 전환 */
function dayDone(m,w,d){ return doneSet().has(m*28+w*7+d); }
function weekDone(m,w){ const s=doneSet(); for(let d=0;d<7;d++)if(!s.has(m*28+w*7+d))return false; return true; }
function weekDoneCount(m,w){ const s=doneSet(); let c=0; for(let d=0;d<7;d++)if(s.has(m*28+w*7+d))c++; return c; }
function monthDone(m){ const s=doneSet(); for(let i=m*28;i<(m+1)*28;i++)if(!s.has(i))return false; return true; }
function progPct(){ return Math.min(100,Math.round(doneSet().size/336*100)); }
function advanceToNextUndone(){
  const s=doneSet(); let i=progIdxNow();
  while(i<335&&s.has(i))i++;
  saveProg({m:Math.floor(i/28), w:Math.floor((i%28)/7), d:i%7});
}
function setDayDone(idx,on,silent){
  const s=doneSet();
  if(on&&!s.has(idx)){ s.add(idx); saveDone(s); if(!silent){ setCoins(getCoins()+10); showToast('✔ 완료 체크! +10 🪙'); } }
  else if(!on&&s.has(idx)){ s.delete(idx); saveDone(s); if(!silent){ setCoins(getCoins()-10); showToast('체크를 취소했어요'); } }
}
function toggleDayDone(idx){
  const on=!doneSet().has(idx);
  setDayDone(idx,on,false);
  if(on){ sfx('stamp'); if(idx===progIdxNow())advanceToNextUndone(); }
  render(); checkAch();
}
function injectDayCheck(){
  if(cur.m<0)return;
  if(document.querySelector('#main .daycheck'))return;
  const idx=cur.m*28+cur.w*7+cur.d, done=doneSet().has(idx);
  const b=document.createElement('button');
  b.type='button'; b.className='daycheck'+(done?' on':'');
  b.innerHTML=done
    ?'✅ 이 날 연습 완료!<small>잘했어요 · 다시 누르면 취소</small>'
    :'이 날 연습 끝! 완료 체크 ✔<small>체크 = 🪙10 · 하루에 여러 날 해도 각각 체크!</small>';
  b.onclick=function(){ toggleDayDone(idx); };
  const panel=document.querySelector('#main .panel');
  if(panel)panel.appendChild(b);
}

/* --- 홈 "도장 쾅"과 연동: 도장 = 오늘 날짜 기록 + 지금 할 차례 날을 자동 체크 --- */
function stampToday(){
  const d=new Date(); const k=dkey(d); const s=stampSet();
  if(s.has(k)){
    s.delete(k); saveStamps(s); coinOnRemove();
    shiftProg(-1); setDayDone(progIdxNow(),false,true); // 마지막 자동 체크 되돌리기
  } else {
    s.add(k); justStamped=k; saveStamps(s); coinOnAdd(); sfx('stamp');
    setDayDone(progIdxNow(),true,true); // 지금 할 차례를 완료로
    advanceToNextUndone();
  }
  calView={y:d.getFullYear(), m:d.getMonth()+1};
  render(); checkAch();
}
function toggleStamp(key){
  const s=stampSet();
  const isToday = key===dkey(new Date());
  if(s.has(key)){
    s.delete(key); saveStamps(s); coinOnRemove();
    if(isToday){ shiftProg(-1); setDayDone(progIdxNow(),false,true); }
  } else {
    s.add(key); justStamped=key; saveStamps(s); coinOnAdd(); sfx('stamp');
    if(isToday){ setDayDone(progIdxNow(),true,true); advanceToNextUndone(); }
  }
  render(); checkAch();
}

/* --- 🎯 퀴즈 모드 선택 (퀴즈1 뜻 맞히기 · 퀴즈2 스펠링 쓰기) --- */
function qrnd(){ return Math.random()-0.5; }
function openQuiz(){
  document.getElementById('quizov').style.display='flex';
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-label" style="margin-top:12px">어떤 퀴즈로 놀까?</div>'
    +'<div class="qz-choices" style="margin-top:10px">'
    +'<button type="button" class="qz-c qz-mode" onclick="startQuiz1()">🎯 퀴즈 1<small>뜻 맞히기 · 정답 +2🪙</small></button>'
    +'<button type="button" class="qz-c qz-mode" onclick="startQuiz2()">🔤 퀴즈 2<small>스펠링 쓰기 · 정답 +3🪙</small></button></div>';
}
/* 🎓 단어 졸업: 2번 맞힌 단어는 출제에서 제외 (틀리면 다시 등장) */
function getMastery(){ return lsGet('dayoon_mastery',{}); }
function addMastery(en){ const m=getMastery(); m[en]=(m[en]||0)+1; lsSet('dayoon_mastery',m); }
function resetMastery(en){ const m=getMastery(); if(m[en]){ m[en]=0; lsSet('dayoon_mastery',m); } }
function masteredCount(){ const m=getMastery(); let c=0; for(var k in m)if(m[k]>=2)c++; return c; }
function freshPool(pool){
  const m=getMastery();
  const fresh=pool.filter(function(w){return (m[w.en]||0)<2;});
  if(fresh.length>=5)return fresh;
  // 새 단어가 부족하면 졸업한 단어를 섞어 채움 (퀴즈는 항상 가능)
  const grad=pool.filter(function(w){return (m[w.en]||0)>=2;}).sort(qrnd);
  return fresh.concat(grad).slice(0,Math.max(8,fresh.length));
}
function startQuiz1(){
  const pool=quizWordPool();
  if(pool.length<4){showToast('퀴즈 낼 단어가 아직 부족해요! 조금 더 배우고 와요 🌱'); return;}
  const qpool=freshPool(pool);
  const wl=wrongList();
  const wrongPool=qpool.filter(function(w){return wl.indexOf(w.en)>-1;}).sort(qrnd).slice(0,2);
  const restPool=qpool.filter(function(w){return wrongPool.indexOf(w)<0;}).sort(qrnd);
  const picked=wrongPool.concat(restPool).slice(0,Math.min(5,qpool.length)).sort(qrnd);
  const qs=picked.map(function(w){
    const seen={}; seen[w.ko]=1; // 같은 뜻이 보기에 겹치지 않게
    const wrong=pool.filter(function(x){return x.en!==w.en;}).sort(qrnd)
      .filter(function(x){ if(seen[x.ko])return false; seen[x.ko]=1; return true; }).slice(0,3);
    return {w:w, mode:Math.random()<0.5?'en2ko':'ko2en',
            choices:wrong.concat([w]).sort(qrnd)};
  });
  quiz={qs:qs,i:0,score:0,rewarded:true,locked:false}; // 매판 점수만큼 코인!
  document.getElementById('quizov').style.display='flex';
  quizShow();
}
function quizEnd(){
  let coins=0;
  if(quiz.rewarded){
    coins=quiz.score*2+(quiz.score===quiz.qs.length?10:0);
    if(coins)setCoins(getCoins()+coins);
  }
  if(quiz.score===quiz.qs.length){ const s=getStats(); s.qp++; saveStats(s); }
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-word" style="margin-top:10px">'+(quiz.score===quiz.qs.length?'💯 완벽해요!':'🎉 잘했어요!')+'</div>'
    +'<div class="qz-label">'+quiz.score+' / '+quiz.qs.length+' 정답'+(coins?' · +'+coins+' 🪙':'')
    +'<br>🎓 졸업한 단어(2번 맞힘): '+masteredCount()+'개'
    +(wrongList().length?'<br>틀린 단어 '+wrongList().length+'개는 다음 퀴즈에 다시 나와요 💪':'')+'</div>'
    +'<div class="qz-choices" style="margin-top:12px"><button type="button" class="qz-c" onclick="startQuiz1()">한 번 더!</button>'
    +'<button type="button" class="qz-c" onclick="openQuiz()">퀴즈 고르기</button></div>'
    +'<div class="qz-choices" style="margin-top:8px"><button type="button" class="qz-c" onclick="closeQuiz()">닫기</button></div>';
  if(coins)showToast('퀴즈 보상 +'+coins+' 🪙');
  checkAch();
}

/* --- 🔤 퀴즈 2: 스펠링 조립 (글자 타일 눌러 단어 완성) --- */
let sp={qs:[],i:0,score:0,rewarded:false,ans:[],tiles:[],hist:[],locked:false};
function spellPool(){ return quizWordPool().filter(function(w){return /^[a-zA-Z]{3,10}$/.test(w.en);}); }
function quiz2TodayKey(){ const t=new Date(); return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(); }
function quiz2RewardLeft(){ const q=lsGet('dayoon_quizq2',{d:'',n:0}); return q.d===quiz2TodayKey()?Math.max(0,3-q.n):3; }
function quiz2UseReward(){ const q=lsGet('dayoon_quizq2',{d:'',n:0}); if(q.d!==quiz2TodayKey()){q.d=quiz2TodayKey();q.n=0;} q.n++; lsSet('dayoon_quizq2',q); }
function startQuiz2(){
  const pool=spellPool();
  if(pool.length<3){showToast('스펠링 퀴즈 낼 단어가 아직 부족해요 🌱'); return;}
  const qpool=freshPool(pool);
  const wl=wrongList();
  const wrongPool=qpool.filter(function(w){return wl.indexOf(w.en)>-1;}).sort(qrnd).slice(0,2);
  const rest=qpool.filter(function(w){return wrongPool.indexOf(w)<0;}).sort(qrnd);
  sp={qs:wrongPool.concat(rest).slice(0,Math.min(5,qpool.length)).sort(qrnd), i:0, score:0,
      rewarded:true, ans:[], tiles:[], hist:[], locked:false}; // 매판 점수만큼 코인!
  document.getElementById('quizov').style.display='flex';
  spShow();
}
function spShow(){
  const q=sp.qs[sp.i];
  sp.ans=[]; sp.hist=[]; sp.locked=false;
  sp.tiles=q.en.toLowerCase().split('').sort(qrnd);
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-num">'+(sp.i+1)+' / '+sp.qs.length+(sp.rewarded?'':' · 연습 모드 (오늘 코인 획득 끝!)')+'</div>'
    +'<div class="qz-label">이 뜻의 영어 단어를 글자로 만들어봐!</div>'
    +'<div class="qz-word">'+q.ko+' <button class="spk" type="button" onclick="speak(sp.qs[sp.i].en)">🔊</button></div>'
    +'<div class="sp-slots" id="spslots"></div>'
    +'<div class="sp-tiles" id="sptiles"></div>'
    +'<div class="sp-ctl"><button type="button" class="qz-c" onclick="spBack()">⌫ 지우기</button></div>';
  spRender();
  speak(q.en);
}
function spRender(){
  const q=sp.qs[sp.i], n=q.en.length;
  let s='';
  for(let i=0;i<n;i++)s+='<span class="sp-slot'+(sp.ans[i]?' fill':'')+'">'+(sp.ans[i]||'')+'</span>';
  document.getElementById('spslots').innerHTML=s;
  document.getElementById('sptiles').innerHTML=sp.tiles.map(function(t,i){
    return '<button type="button" class="sp-tile"'+(t===null?' disabled':'')+' onclick="spPick('+i+')">'+(t===null?'&nbsp;':t)+'</button>';
  }).join('');
}
function spPick(i){
  if(sp.locked||sp.tiles[i]===null)return;
  sp.ans.push(sp.tiles[i]); sp.hist.push(i); sp.tiles[i]=null;
  spRender();
  if(sp.ans.length===sp.qs[sp.i].en.length)spCheck();
}
function spBack(){
  if(sp.locked||!sp.ans.length)return;
  const i=sp.hist.pop(); sp.tiles[i]=sp.ans.pop();
  spRender();
}
function spCheck(){
  sp.locked=true;
  const q=sp.qs[sp.i], ok=sp.ans.join('')===q.en.toLowerCase();
  const slots=document.getElementById('spslots');
  slots.classList.add(ok?'ok':'no');
  if(ok){ sp.score++; sfx('good'); clearWrong(q.en); addMastery(q.en); }
  else {
    sfx('bad'); pushWrong(q.en); resetMastery(q.en);
    slots.insertAdjacentHTML('afterend','<div class="sp-correct">정답: <b>'+q.en+'</b> — 눈으로 한 번 따라 읽어봐!</div>');
    speak(q.en,0.7);
  }
  setTimeout(function(){
    sp.i++;
    if(sp.i<sp.qs.length)spShow(); else spEnd();
  }, ok?800:2200);
}
function spEnd(){
  let coins=0;
  if(sp.rewarded){ coins=sp.score*3+(sp.score===sp.qs.length?10:0); if(coins)setCoins(getCoins()+coins); }
  if(sp.score===sp.qs.length){ const s=getStats(); s.qp++; s.sp=(s.sp||0)+1; saveStats(s); }
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-word" style="margin-top:10px">'+(sp.score===sp.qs.length?'💯 스펠링 마스터!':'🎉 잘했어요!')+'</div>'
    +'<div class="qz-label">'+sp.score+' / '+sp.qs.length+' 정답'+(coins?' · +'+coins+' 🪙':'')
    +'<br>🎓 졸업한 단어(2번 맞힘): '+masteredCount()+'개'
    +(wrongList().length?'<br>틀린 단어는 다음 퀴즈에 또 나와요 💪':'')+'</div>'
    +'<div class="qz-choices" style="margin-top:12px"><button type="button" class="qz-c" onclick="startQuiz2()">한 번 더!</button>'
    +'<button type="button" class="qz-c" onclick="openQuiz()">퀴즈 고르기</button></div>'
    +'<div class="qz-choices" style="margin-top:8px"><button type="button" class="qz-c" onclick="closeQuiz()">닫기</button></div>';
  if(coins)showToast('스펠링 퀴즈 +'+coins+' 🪙');
  checkAch();
}

/* --- 📖 내 아이템 도감: 산 것 한눈에 보기 (누르면 착용) --- */
function openColl(){
  const a=getAva();
  const cats=[['person','🧒 사람'],['top','👕 상의'],['bottom','👖 하의'],['pet','🐾 동물 친구'],['hat','🎩 머리'],['face','🕶️ 얼굴'],['neck','🎀 목'],['hand','🎈 손'],['bg','🖼️ 배경']];
  const own=ITEMS.filter(function(i){return a.owned.indexOf(i.id)>-1;}).length;
  let h='<div class="rtitle">📖 다윤이의 아이템</div>'
    +'<div class="rsub">모은 아이템 '+own+' / '+ITEMS.length+' · 누르면 바로 착용!</div>';
  cats.forEach(function(ct){
    const items=ITEMS.filter(function(i){return i.slot===ct[0];});
    const ownedN=items.filter(function(i){return a.owned.indexOf(i.id)>-1;}).length;
    h+='<div class="coll-cat">'+ct[1]+' <span>'+ownedN+' / '+items.length+'</span></div><div class="coll-grid">';
    items.forEach(function(it){
      const owned=a.owned.indexOf(it.id)>-1, eq=a.eq[it.slot]===it.id;
      if(owned)h+='<button type="button" class="citem'+(eq?' eq':'')+'" onclick="collWear(\''+it.id+'\')">'
        +(eq?'<span class="ceq">착용중</span>':'')+'<span class="ce">'+it.e+'</span><span class="cn">'+it.n+'</span></button>';
      else h+='<div class="citem lock"><span class="ce">🔒</span><span class="cn">'+it.n+'</span></div>';
    });
    h+='</div>';
  });
  h+='<button type="button" class="gclose" onclick="closeColl()">닫기</button>';
  document.getElementById('collbody').innerHTML=h;
  document.getElementById('collov').style.display='flex';
}
function collWear(id){ tapItem(id); openColl(); }
function closeColl(){ document.getElementById('collov').style.display='none'; }

<script>

<script>

    mon:monthCount(y,m), prev:monthCount(py,pm),

}
function copyReport(){

  } else fb();
}
function reportHTML(){

<script>
/* --- 🔧 도장↔완료체크 정밀 연동 ---
   문제1: 스크립트에서 오늘 이미 완료 체크한 뒤 도장을 찍으면 "다음 날"까지 완료 처리(진도 이중 소진)
   문제2: 도장 취소 시 항상 포인터-1칸만 되돌려서, 여러 날 체크한 경우 엉뚱한 날이 지워짐
   해결: 오늘 체크한 날 목록(dayoon_chk)과 도장이 자동 체크한 날(dayoon_auto)을 기억해 정확히 연동 */
function chkToday(){ const t=dkey(new Date()); const o=lsGet('dayoon_chk',{k:'',list:[]}); return o.k===t?o:{k:t,list:[]}; }
const _setDayDoneTrack=setDayDone;
setDayDone=function(idx,on,silent){
  const had=doneSet().has(idx);
  _setDayDoneTrack(idx,on,silent);
  const has=doneSet().has(idx);
  const o=chkToday();
  if(has&&!had){ if(o.list.indexOf(idx)<0)o.list.push(idx); lsSet('dayoon_chk',o); }
  else if(!has&&had){ const i=o.list.indexOf(idx); if(i>-1){ o.list.splice(i,1); lsSet('dayoon_chk',o); } }
};
function stampAddLink(k){
  if(chkToday().list.length===0 && !doneSet().has(progIdxNow())){
    const idx=progIdxNow();
    setDayDone(idx,true,true); lsSet('dayoon_auto',{k:k,i:idx});
    advanceToNextUndone();
  } else lsSet('dayoon_auto',null); // 오늘 이미 체크했으면 도장은 도장만 (진도 이중 소진 방지)
}
function stampRemoveLink(k){
  const au=lsGet('dayoon_auto',null);
  if(au&&au.k===k){ // 도장이 자동 체크했던 바로 그 날만 되돌림
    setDayDone(au.i,false,true);
    saveProg({m:Math.floor(au.i/28),w:Math.floor((au.i%28)/7),d:au.i%7});
    lsSet('dayoon_auto',null);
  }
}
stampToday=function(){
  const d=new Date(), k=dkey(d), s=stampSet();
  if(s.has(k)){ s.delete(k); saveStamps(s); coinOnRemove(); stampRemoveLink(k); }
  else { s.add(k); justStamped=k; saveStamps(s); coinOnAdd(); sfx('stamp'); stampAddLink(k); }
  calView={y:d.getFullYear(),m:d.getMonth()+1};
  render(); checkAch();
};
toggleStamp=function(key){
  const s=stampSet(), isToday=key===dkey(new Date());
  if(s.has(key)){ s.delete(key); saveStamps(s); coinOnRemove(); if(isToday)stampRemoveLink(key); }
  else { s.add(key); justStamped=key; saveStamps(s); coinOnAdd(); sfx('stamp'); if(isToday)stampAddLink(key); }
  render(); checkAch();
};
/* 구버전 백업(완료체크 도입 전) 복원 시 진도 포인터 기준으로 완료 날들을 시드 */
importData=function(){
  const code=prompt('백업 코드를 붙여넣으세요');
  if(!code)return;
  try{
    const j=JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/^DY1\./,'')))));
    let n=0; BK_KEYS.forEach(function(k){if(j[k]!==undefined){localStorage.setItem(k,j[k]); n++;}});
    if(!n)throw 0;
    if(j['dayoon_done']===undefined){
      const pi=progIdxNow(), arr=[]; for(let i=0;i<pi;i++)arr.push(i);
      lsSet('dayoon_done',arr);
    }
    render(); showToast('복원 완료! 도장·코인·진도를 불러왔어요 ✅');
    if(typeof syncMark==='function')syncMark(); // 복원한 기록을 클라우드에도 반영
  }catch(e){showToast('코드가 올바르지 않아요 😢 다시 확인해주세요');}
};
</script>

<script>
/* --- ☁️ 클라우드 자동 동기화 (Supabase) ---
   기록이 바뀌면 4초 뒤 자동 업로드, 앱을 열 때마다 서버가 최신이면 내려받음.
   기기별 마지막 수정시각(dayoon_mts, ISO 문자열)을 비교해 최신 쪽이 이김.
   오프라인이면 조용히 건너뜀(다음 온라인 때 밀어올림) — PWA 오프라인 동작 유지. */
const SYNC_URL='https://dzmxwsxcwtugnyyfvnja.supabase.co/rest/v1/dayoon_sync';
const SYNC_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6bXh3c3hjd3R1Z255eWZ2bmphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMzUxNjcsImV4cCI6MjA5NjgxMTE2N30.PkzQD7JJuFdtMGWzm2FC9HFzf1wVW1Wh9wg41SxJKzg';
const SYNC_ID='dy_fam_dayoon';
function syncHdrs(){ return {'apikey':SYNC_KEY,'Authorization':'Bearer '+SYNC_KEY,'Content-Type':'application/json'}; }
function syncState(){ const o={}; BK_KEYS.forEach(function(k){ const v=localStorage.getItem(k); if(v!==null)o[k]=v; }); return o; }
let syncTimer=null, syncReady=false;
setTimeout(function(){syncReady=true;},3000); // 로드 직후 자동 저장(웰컴선물·마이그레이션)은 변경으로 안 침 — 신규 기기가 가족 기록을 덮어쓰는 사고 방지
function syncMark(){
  if(!syncReady)return;
  try{localStorage.setItem('dayoon_mts',new Date().toISOString());}catch(e){}
  clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,4000);
}
function syncPush(){
  if(!navigator.onLine)return;
  const mts=localStorage.getItem('dayoon_mts');
  if(!mts)return; // 이 기기에서 실제 변경이 있었던 적이 없으면 올리지 않음
  fetch(SYNC_URL+'?on_conflict=id',{method:'POST',
    headers:Object.assign(syncHdrs(),{'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:SYNC_ID,payload:syncState(),mts:mts}),keepalive:true})
    .then(function(r){ if(r.ok)try{localStorage.setItem('dayoon_synced',mts);}catch(e){} })
    .catch(function(){});
}
function syncPull(){
  if(!navigator.onLine)return;
  fetch(SYNC_URL+'?id=eq.'+SYNC_ID+'&select=payload,mts',{headers:syncHdrs()})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(rows){
      if(!rows)return;
      if(!rows.length){ if(localStorage.getItem('dayoon_mts'))syncPush(); return; } // 서버가 비었으면 내 기록을 올림
      const row=rows[0], localM=localStorage.getItem('dayoon_mts')||'';
      const rT=Date.parse(row.mts||0)||0, lT=Date.parse(localM||0)||0; // 형식 무관 시각 비교
      if(rT>lT){
        Object.keys(row.payload||{}).forEach(function(k){
          if(BK_KEYS.indexOf(k)>-1)try{localStorage.setItem(k,row.payload[k]);}catch(e){}
        });
        try{localStorage.setItem('dayoon_mts',row.mts); localStorage.setItem('dayoon_synced',row.mts);}catch(e){}
        render(); showToast('☁️ 다른 기기 기록을 불러왔어요');
      } else if(lT>rT)syncPush(); // 내가 더 최신(오프라인 연습 등) → 올림
    }).catch(function(){});
}
/* 저장 훅: 의미 있는 변경은 전부 lsSet 또는 saveStamps를 지나감 */
const _lsSetSync=lsSet;
lsSet=function(k,v){ _lsSetSync(k,v); if(BK_KEYS.indexOf(k)>-1)syncMark(); };
const _saveStampsSync=saveStamps;
saveStamps=function(s){ _saveStampsSync(s); syncMark(); };
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ clearTimeout(syncTimer); syncPush(); } else syncPull();
});
/* 부모 박스에 동기화 안내 한 줄 */
function injectSyncNote(){
  if(cur.m!==-3)return;
  const pb=document.querySelector('#main .parentbox');
  if(pb&&!pb.querySelector('.syncnote'))
    pb.insertAdjacentHTML('beforeend','<span class="syncnote">☁️ 자동 동기화 켜짐 — 인터넷만 되면 집 맥·폰·다른 기기와 기록이 저절로 맞춰져요</span>');
}
const _renderSync=render;
render=function(){ _renderSync(); injectSyncNote(); };
render();
syncPull();
</script>

<script>
/* --- 🎉 연출 업그레이드: ZzFX 아케이드 효과음 + 이모지 컨페티 --- */
const ZZS={
  stamp:[2,,331,.01,.06,.16,1,2.4,,,,,,.6,,.15,,.8,.04],
  coin:[,,1675,,.06,.24,1,1.82,,,837,.06],
  gacha:[,,539,0,.04,.29,1,1.92,,,567,.02,.02,,,,.04],
  good:[,,685,.02,.05,.13,1,1.4,,,397,.06],
  bad:[,,172,.01,.06,.19,2,.7,-3]
};
sfx=function(t){
  if(lsGet('dayoon_mute',0))return;
  try{
    zzfxX=zzfxX||new (window.AudioContext||window.webkitAudioContext)();
    if(zzfxX.state==='suspended')zzfxX.resume();
    if(ZZS[t])zzfx.apply(null,ZZS[t]);
  }catch(e){}
};
let _jcInst=null;
function burst(emojis,n){
  try{
    if(!window.JSConfetti)return;
    if(!_jcInst){
      const cv=document.createElement('canvas');
      cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
      document.body.appendChild(cv);
      _jcInst=new JSConfetti({canvas:cv});
    }
    _jcInst.addConfetti({emojis:emojis,emojiSize:56,confettiNumber:n||34});
  }catch(e){}
}
/* 업적 달성 → 컨페티 */
const _achRevealFx=achReveal;
achReveal=function(g,c){ _achRevealFx(g,c); burst(['🏅','⭐','🎉']); };
/* 동물 성장(레벨업) → 컨페티 */
const _petAddXpFx=petAddXp;
petAddXp=function(pid,delta){
  const before=petLv(petXp(pid));
  _petAddXpFx(pid,delta);
  if(delta>0&&petLv(petXp(pid))>before)setTimeout(function(){burst(['❤️','🐾','⭐'],40);},200);
};
/* 퀴즈 만점 → 컨페티 */
const _quizEndFx=quizEnd;
quizEnd=function(){ _quizEndFx(); if(quiz.qs.length&&quiz.score===quiz.qs.length)burst(['💯','🎉','🪙']); };
const _spEndFx=spEnd;
spEnd=function(){ _spEndFx(); if(sp.qs.length&&sp.score===sp.qs.length)burst(['💯','🔤','🎉']); };
/* 뽑기 짜잔 순간 → 컨페티 */
const _gachaFx=gacha;
gacha=function(){ const c0=getCoins(); _gachaFx(); if(getCoins()<c0)setTimeout(function(){burst(['🎁','✨','🎊']);},1150); };
</script>

<script>
/* --- 👂 퀴즈 3: 듣기 퀴즈 (단어를 듣고 뜻 고르기 — 글자 안 보여줌) --- */
function startQuiz3(){
  const pool=quizWordPool();
  if(pool.length<4){showToast('퀴즈 낼 단어가 아직 부족해요! 조금 더 배우고 와요 🌱'); return;}
  const qpool=freshPool(pool), wl=wrongList();
  const wrongPool=qpool.filter(function(w){return wl.indexOf(w.en)>-1;}).sort(qrnd).slice(0,2);
  const rest=qpool.filter(function(w){return wrongPool.indexOf(w)<0;}).sort(qrnd);
  const picked=wrongPool.concat(rest).slice(0,Math.min(5,qpool.length)).sort(qrnd);
  const qs=picked.map(function(w){
    const seen={}; seen[w.ko]=1;
    const wrong=pool.filter(function(x){return x.en!==w.en;}).sort(qrnd)
      .filter(function(x){ if(seen[x.ko])return false; seen[x.ko]=1; return true; }).slice(0,3);
    return {w:w, mode:'listen', choices:wrong.concat([w]).sort(qrnd)};
  });
  quiz={qs:qs,i:0,score:0,rewarded:true,locked:false};
  document.getElementById('quizov').style.display='flex';
  quizShow();
}
const _quizShowL=quizShow;
quizShow=function(){
  const q=quiz.qs[quiz.i];
  if(!q||q.mode!=='listen')return _quizShowL();
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-num">'+(quiz.i+1)+' / '+quiz.qs.length+'</div>'
    +'<div class="qz-label">👂 잘 듣고 뜻을 골라요! (글자는 비밀)</div>'
    +'<div class="qz-word" id="qz-listen"><button class="spk" type="button" style="font-size:22px;padding:8px 14px" onclick="speak(quiz.qs[quiz.i].w.en)">🔊 다시 듣기</button> '
    +'<button class="spk" type="button" style="font-size:22px;padding:8px 14px" onclick="speak(quiz.qs[quiz.i].w.en,0.6)">🐢 천천히</button></div>'
    +'<div class="qz-choices">'+q.choices.map(function(c,i){
      return '<button type="button" class="qz-c" onclick="quizAnswer('+i+')">'+c.ko+'</button>';
    }).join('')+'</div>';
  speak(q.w.en);
};
const _quizAnswerL=quizAnswer;
quizAnswer=function(i){
  const q=quiz.qs[quiz.i], was=quiz.locked;
  _quizAnswerL(i);
  if(!was&&q.mode==='listen'){ // 답 고른 뒤엔 단어 공개
    const el=document.getElementById('qz-listen');
    if(el)el.insertAdjacentHTML('beforeend','<div style="margin-top:8px;font-size:19px"><b>'+q.w.en+'</b> · '+q.w.ko+'</div>');
  }
};
const _quizEndK=quizEnd;
quizEnd=function(){
  const listen=quiz.qs.length&&quiz.qs[0].mode==='listen';
  _quizEndK();
  if(listen){ const b=document.querySelector('#quizbody .qz-c'); if(b)b.onclick=startQuiz3; } // "한 번 더!"가 듣기 퀴즈로
};

/* --- 🃏 카드 짝맞추기: 영어 단어 ↔ 한국어 뜻 (6쌍 12장) --- */
let mm={cards:[],open:[],lock:false,moves:0,matched:0,total:0};
function startMatch(){
  const pool=quizWordPool();
  if(pool.length<6){showToast('게임에 쓸 단어가 아직 부족해요! 조금 더 배우고 와요 🌱'); return;}
  const picked=freshPool(pool).sort(qrnd).slice(0,6);
  pool.sort(qrnd).forEach(function(w){ if(picked.length<6&&picked.indexOf(w)<0)picked.push(w); });
  mm={cards:[],open:[],lock:false,moves:0,matched:0,total:picked.length};
  picked.forEach(function(w,i){ mm.cards.push({t:w.en,pair:i,en:1},{t:w.ko,pair:i}); });
  mm.cards.sort(qrnd);
  document.getElementById('matchov').style.display='flex';
  mmRender();
}
function mmRender(){
  let h='<div class="rtitle">🃏 카드 짝맞추기</div>'
    +'<div class="rsub">영어 단어와 뜻을 짝지어요! 짝 +2🪙 · 전부 맞히면 +10🪙</div>';
  h+='<div class="mm-grid">'+mm.cards.map(function(c,i){
    const st=c.done?' done':(mm.open.indexOf(i)>-1?' open':'');
    return '<button type="button" class="mm-c'+st+(c.en?' mmen':'')+'" onclick="mmTap('+i+')">'+(st?c.t:'❓')+'</button>';
  }).join('')+'</div>';
  h+='<div class="qz-label" style="margin-top:9px">뒤집기 '+mm.moves+'번 · 짝 '+mm.matched+'/'+mm.total+'</div>';
  h+='<div class="qz-choices" style="margin-top:8px">'
    +(mm.matched===mm.total?'<button type="button" class="qz-c" onclick="startMatch()">한 번 더!</button>':'')
    +'<button type="button" class="qz-c" onclick="closeMatch()">닫기</button></div>';
  document.getElementById('matchbody').innerHTML=h;
}
function mmTap(i){
  if(mm.lock||mm.cards[i].done||mm.open.indexOf(i)>-1)return;
  if(mm.cards[i].en)speak(mm.cards[i].t);
  mm.open.push(i);
  if(mm.open.length===2){
    mm.moves++;
    const a=mm.cards[mm.open[0]], b=mm.cards[mm.open[1]];
    if(a.pair===b.pair){
      a.done=b.done=1; mm.matched++; mm.open=[]; sfx('good'); setCoins(getCoins()+2);
      mmRender();
      if(mm.matched===mm.total){
        setCoins(getCoins()+10); sfx('gacha'); burst(['🃏','🎉','🪙']);
        document.getElementById('matchbody').insertAdjacentHTML('beforeend',
          '<div class="qz-word" style="margin-top:8px">💯 다 맞췄다! +'+(mm.total*2+10)+'🪙</div>');
        mmRender(); checkAch();
      }
    } else {
      mm.lock=true; sfx('bad'); mmRender();
      setTimeout(function(){ mm.open=[]; mm.lock=false; mmRender(); },800);
    }
  } else mmRender();
}
function closeMatch(){ document.getElementById('matchov').style.display='none'; if(window.speechSynthesis)speechSynthesis.cancel(); render(); }
document.body.insertAdjacentHTML('beforeend','<div id="matchov" onclick="if(event.target===this)closeMatch()"><div class="card" id="matchbody"></div></div>');

/* --- 🎯 버튼 = 퀴즈·게임 메뉴 (4종) --- */
openQuiz=function(){
  document.getElementById('quizov').style.display='flex';
  document.getElementById('quizbody').innerHTML=
    '<div class="qz-label" style="margin-top:12px">어떤 놀이로 할까?</div>'
    +'<div class="qz-choices" style="margin-top:10px">'
    +'<button type="button" class="qz-c qz-mode" onclick="startQuiz1()">🎯 단어 퀴즈<small>뜻 맞히기 · 정답 +2🪙</small></button>'
    +'<button type="button" class="qz-c qz-mode" onclick="startQuiz2()">🔤 스펠링 퀴즈<small>글자 조립 · 정답 +3🪙</small></button>'
    +'<button type="button" class="qz-c qz-mode" onclick="startQuiz3()">👂 듣기 퀴즈<small>듣고 뜻 고르기 · 정답 +2🪙</small></button>'
    +'<button type="button" class="qz-c qz-mode" onclick="closeQuiz();startMatch()">🃏 카드 짝맞추기<small>단어·뜻 짝짓기 · 짝 +2🪙</small></button></div>';
};
(function(){ // 🎯 플로팅 버튼을 메뉴로 연결
  const fb=document.querySelector('.fontbtn');
  if(!fb)return;
  const qz=Array.prototype.slice.call(fb.querySelectorAll('.toolbtn')).find(function(b){return b.textContent==='🎯';});
  if(qz){ qz.onclick=openQuiz; qz.title='퀴즈·게임 고르기'; }
})();
</script>

<style>
  #matchov{position:fixed;inset:0;background:rgba(51,48,58,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
  #matchov .card{background:#fff;border-radius:20px;padding:22px 18px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  #matchov .rtitle{font-size:14px;font-weight:800;color:var(--pink-d);}
  #matchov .rsub{font-size:12px;color:var(--soft);margin-top:2px;}
  .mm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;}
  .mm-c{min-height:52px;border-radius:10px;border:1.5px solid var(--line);background:#fdf3f8;
    font-size:13px;font-weight:700;padding:4px 2px;cursor:pointer;line-height:1.25;word-break:keep-all;}
  .mm-c.open{background:#ffe3ef;border-color:var(--pink);}
  .mm-c.mmen.open,.mm-c.mmen.done{font-size:13.5px;}
  .mm-c.done{background:#e6f7e9;border-color:#7fc98a;color:#2e7d3a;}
</style>
</body>
