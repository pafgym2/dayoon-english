eep?","하하! 몽실이는 어디서 잘까?"],["D","Next to my bed, on a sky-blue cushion. We would sleep at nine thirty together!","제 침대 옆 하늘색 쿠션 위에서요. 우리는 9시 30분에 같이 잘 거예요!"],["P","Sweet! Tell me all about your dream puppy in six sentences.","다정해라! 꿈의 강아지에 대해 여섯 문장으로 말해 봐."],["D","My dream puppy is fluffy and white. Its name is Mongsil. It has round black eyes. I would feed it and walk it every day. It would sleep next to my bed. I really hope my dream comes true!","제 꿈의 강아지는 복슬복슬하고 하얘요. 이름은 몽실이예요. 동그란 까만 눈을 가졌어요. 매일 밥을 주고 산책시킬 거예요. 제 침대 옆에서 잘 거예요. 이 꿈이 꼭 이루어지면 좋겠어요!"]],"role":[["P","Woof woof! I'm Mongsil, your new puppy! What do we do first?","멍멍! 나는 네 새 강아지 몽실이야! 우리 뭐부터 할까?"],["D","Mongsil! First, let's go for a walk in the park!","몽실아! 먼저 공원으로 산책 가자!"],["P","Woof! I see a squirrel! Can I chase it? Please please?","멍! 다람쥐다! 쫓아가도 돼? 제발 제발?"],["D","No, Mongsil! Stay! Good boy. Here's a treat.","안 돼, 몽실아! 기다려! 착하지. 간식 줄게."],["P","Yum! Woof! Now I'm sleepy. Where is my bed?","냠냠! 멍! 이제 졸려. 내 침대는 어디야?"],["D","Your cushion is next to my bed. I will read you a book!","네 쿠션은 내 침대 옆에 있어. 내가 책 읽어 줄게!"],["P","Woof... what book? I only understand dog stories.","멍... 무슨 책? 나는 강아지 이야기만 알아듣는데."],["D","Then I will make one up! Once upon a time, there was a brave puppy named Mongsil...","그럼 내가 지어낼게! 옛날 옛날에 몽실이라는 용감한 강아지가 살았어요..."]],"wrap":[["P","Describe your dream puppy one more time.","꿈의 강아지를 한 번 더 묘사해 줘."],["D","My dream puppy Mongsil is fluffy and white with round black eyes. I would feed it, walk it, and brush its fur every day!","제 꿈의 강아지 몽실이는 복슬복슬한 하얀 털에 동그란 까만 눈이에요. 매일 밥 주고, 산책시키고, 털을 빗겨 줄 거예요!"]],"tip":"아이가 정말 원하는 것(강아지)을 말할 때 발화가 가장 진심이 됩니다. would 표현은 자연스럽게 노출만 해 주세요."},{"emoji":"🦁","title":"Day 4 · Zookeeper for a Day","sub":"동물원 사육사 놀이","words":[["feed","먹이를 주다","피드"],["roar","으르렁거리다","로어"],["mane","갈기","메인"]],"sentence":["It's time to feed the lions!","사자들에게 먹이 줄 시간이에요!"],"main":[["P","Good morning, new zookeeper Dayoon! Here is your uniform and schedule.","좋은 아침, 신입 사육사 다윤! 여기 유니폼과 일정표야."],["D","Good morning, boss! Wow, my first day as a zookeeper! What's first?","좋은 아침입니다, 팀장님! 와, 사육사 첫날이에요! 뭐부터 하죠?"],["P","Check the schedule. What does it say for nine o'clock?","일정표를 확인해 봐. 9시에 뭐라고 쓰여 있지?"],["D","It says... it's time to feed the lions! Let's go!","쓰여 있길... 사자들에게 먹이 줄 시간이에요! 가요!"],["P","Careful! The big male lion looks hungry. Describe him to me.","조심해! 큰 수사자가 배고파 보여. 나에게 그를 묘사해 봐."],["D","He has a big golden mane and sharp teeth. His roar is louder than a truck!","크고 황금빛인 갈기와 날카로운 이빨이 있어요. 으르렁 소리는 트럭보다 커요!"],["P","What do lions eat?","사자는 뭘 먹지?"],["D","They eat meat. Here you go, Mr. Lion! Bon appetit!","고기를 먹어요. 여기요, 사자 씨! 맛있게 드세요!"],["P","Ha! Next job: the monkeys took a visitor's hat! What do we do?","하하! 다음 임무, 원숭이들이 손님 모자를 가져갔어! 어떻게 하지?"],["D","Monkey team, let's trade! One banana for one hat. Deal?","원숭이 팀, 교환하자! 바나나 하나랑 모자 하나. 어때?"],["P","The trade worked! Great job today. Report your day in five sentences.","교환 성공! 오늘 수고했어. 하루를 다섯 문장으로 보고해 봐."],["D","Today I was a zookeeper. I fed the lions at nine o'clock. The male lion has a golden mane. The monkeys took a hat, but I traded a banana for it. It was a busy but fun day!","오늘 저는 사육사였어요. 9시에 사자들에게 먹이를 줬어요. 수사자는 황금빛 갈기를 가졌어요. 원숭이들이 모자를 가져갔지만 바나나로 바꿨어요. 바빴지만 재미있는 하루였어요!"]],"role":[["P","Zookeeper! A little visitor is asking questions. That's me! Why do lions roar?","사육사님! 꼬마 관람객이 질문이 있대요. 그게 나야! 사자는 왜 으르렁거려요?"],["D","Good question! They roar to talk to their family, far far away.","좋은 질문이에요! 멀리멀리 있는 가족에게 말을 걸려고 으르렁거려요."],["P","Wow! Which animal is the hardest to take care of?","와! 어떤 동물이 제일 돌보기 힘들어요?"],["D","The monkeys! They are smart and they love to steal hats!","원숭이요! 똑똑한 데다 모자 훔치는 걸 좋아하거든요!"],["P","Ha! What time do the animals go to bed?","하하! 동물들은 몇 시에 자요?"],["D","Around sunset. Even lions need their sleep, like you!","해 질 무렵쯤이요. 사자도 너처럼 잠이 필요하답니다!"],["P","Can I be a zookeeper too, someday?","저도 언젠가 사육사가 될 수 있어요?"],["D","Of course! Love animals, study hard, and don't wear a hat near the monkeys!","물론이죠! 동물을 사랑하고, 열심히 공부하고, 원숭이 근처에선 모자를 쓰지 마세요!"]],"wrap":[["P","What did zookeeper Dayoon do today?","사육사 다윤은 오늘 뭘 했지?"],["D","I fed the lions in the morning. The lion has a golden mane and a loud roar. I also saved a hat from the monkeys with a banana!","아침에 사자들에게 먹이를 줬어요. 사자는 황금빛 갈기와 큰 울음소리를 가졌어요. 바나나로 원숭이들에게서 모자도 구했어요!"]],"tip":"인형들을 동물 삼아 실제 먹이 주기 동작을 하며 말하면 feed, roar 같은 동사가 몸에 새겨집니다."},{"emoji":"🎭","title":"Day 5 · Animal Charades","sub":"몸으로 말해요! 동물 흉내","words":[["act","연기하다","액트"],["hop","깡충 뛰다","합"],["waddle","뒤뚱뒤뚱 걷다","와들"]],"sentence":["Can you act like a penguin?","펭귄처럼 연기할 수 있나요?"],"main":[["P","Charades time! I act, you guess. Watch me! Flap, flap, waddle, waddle...","몸으로 말해요 시간! 내가 연기하면 네가 맞혀. 잘 봐! 파닥파닥, 뒤뚱뒤뚱..."],["D","You are waddling... Are you a penguin?","뒤뚱뒤뚱 걷고 계시네요... 펭귄인가요?"],["P","Yes! How did you know?","정답! 어떻게 알았어?"],["D","Penguins waddle and flap their small wings. But they can't fly!","펭귄은 뒤뚱뒤뚱 걷고 작은 날개를 파닥거려요. 하지만 날지는 못해요!"],["P","Correct! Your turn. Can you act like an animal?","맞아! 네 차례야. 동물 연기를 해 볼래?"],["D","Okay! Hop, hop, hop! And I keep my hands in front like this!","네! 깡충, 깡충, 깡충! 그리고 손을 이렇게 앞에 모으고 있어요!"],["P","Hopping with little hands... a kangaroo!","작은 손을 모으고 깡충깡충... 캥거루!"],["D","Correct! Kangaroos hop very fast. They can't walk backwards, you know!","정답! 캥거루는 아주 빨리 뛰어요. 뒤로는 못 걷는대요!"],["P","Really? Cool fact! One more. Sssss... slither, slither...","정말? 멋진 상식인걸! 하나 더. 스스스... 스르륵, 스르륵..."],["D","No legs, moving on the floor... a snake! Sneaky snake!","다리 없이 바닥에서 움직여요... 뱀! 살금살금 뱀!"],["P","You win today! Explain the game to Minseo in five sentences.","오늘은 네가 승자야! 민서에게 이 게임을 다섯 문장으로 설명해 줘."],["D","Minseo, this game is animal charades! One person acts like an animal. The other person guesses in English. Penguins waddle and kangaroos hop. Let's play it at school tomorrow!","민서야, 이 게임은 동물 몸으로 말해요야! 한 사람이 동물처럼 연기해. 다른 사람이 영어로 맞혀. 펭귄은 뒤뚱거리고 캥거루는 깡충 뛰어. 내일 학교에서 같이 하자!"]],"role":[["P","Final round! Acting battle! Act like a sleepy koala.","마지막 라운드! 연기 대결! 졸린 코알라를 연기해 봐."],["D","Hug the tree... eyes closing... zzz... Did I win?","나무를 꼭 안고... 눈이 감기고... 쿨쿨... 저 이겼나요?"],["P","Ten points! Now act like a hungry puppy.","10점! 이제 배고픈 강아지를 연기해 봐."],["D","Woof! Woof! Puppy eyes... looking at your pasta... please...","멍! 멍! 강아지 눈망울로... 파스타를 바라보며... 제발..."],["P","Ha! Twenty points! That was too real. Now the hardest one: a butterfly!","하하! 20점! 너무 진짜 같았어. 이제 최고 난도, 나비!"],["D","First I curl up small... then I open my arms and fly! Ta-da!","먼저 작게 웅크렸다가... 팔을 활짝 펴고 날아올라요! 짜잔!"],["P","The caterpillar to butterfly show! Thirty points! Who is the acting champion?","애벌레에서 나비로 변신 쇼! 30점! 연기 챔피언은 누구지?"],["D","Me! Dayoon, the animal acting champion of Gwacheon!","저요! 과천 동물 연기 챔피언, 다윤!"]],"wrap":[["P","How do these animals move? Tell me three.","동물들은 어떻게 움직이지? 세 가지 말해 줘."],["D","Penguins waddle on the ice. Kangaroos hop very fast. Snakes slither on the ground without legs!","펭귄은 얼음 위에서 뒤뚱뒤뚱 걸어요. 캥거루는 아주 빠르게 깡충 뛰어요. 뱀은 다리 없이 스르륵 기어가요!"]],"tip":"온몸을 쓰는 날입니다. 동작 단어(hop, waddle)는 실제로 그 동작을 하며 말할 때 평생 기억에 남습니다."},{"emoji":"🐢","title":"Day 6 · Fast or Slow?","sub":"동물 속도·크기 비교","words":[["cheetah","치타","치타"],["turtle","거북이","터틀"],["fastest","가장 빠른","패스티스트"]],"sentence":["The cheetah is the fastest animal on land.","치타는 육지에서 가장 빠른 동물이에요."],"main":[["P","Animal Sports Day! First race: cheetah versus turtle. Who wins?","동물 운동회 날! 첫 경주는 치타 대 거북이. 누가 이길까?"],["D","The cheetah, of course! The cheetah is the fastest animal on land.","당연히 치타죠! 치타는 육지에서 가장 빠른 동물이에요."],["P","How fast can a cheetah run?","치타는 얼마나 빨리 달릴 수 있지?"],["D","About one hundred kilometers per hour! Faster than cars in the city!","시속 100킬로미터쯤이요! 도시의 자동차보다 빨라요!"],["P","And the poor turtle? How slow is it?","그럼 불쌍한 거북이는? 얼마나 느리지?"],["D","Very slow on land. But wait! In the water, sea turtles swim really well!","육지에서는 아주 느려요. 하지만 잠깐만요! 물에서는 바다거북이 정말 잘 헤엄쳐요!"],["P","Good point! Swimming race: turtle versus cheetah. Who wins now?","좋은 지적이야! 수영 경주라면? 거북이 대 치타, 이제 누가 이겨?"],["D","The turtle wins! Cheetahs hate water, like cats!","거북이 승리! 치타는 고양이처럼 물을 싫어하거든요!"],["P","Next event: the biggest animal contest. Who is the champion?","다음 종목, 가장 큰 동물 대회. 챔피언은 누구지?"],["D","The blue whale! It is bigger than three buses! Even bigger than our classroom!","대왕고래요! 버스 세 대보다 커요! 우리 교실보다도 커요!"],["P","Amazing! Give me the Animal Sports Day news report in five sentences.","굉장해! 동물 운동회 뉴스 보도를 다섯 문장으로 해 줘."],["D","Welcome to Animal Sports Day! The cheetah won the running race. It is the fastest animal on land. But the turtle won the swimming race. And the blue whale is the biggest champion of all!","동물 운동회에 오신 것을 환영합니다! 달리기 경주는 치타가 이겼습니다. 치타는 육지에서 가장 빠른 동물입니다. 하지만 수영 경주는 거북이가 이겼습니다. 그리고 대왕고래는 최고로 큰 챔피언입니다!"]],"role":[["P","Quiz battle! Which is taller, a giraffe or an elephant?","퀴즈 대결! 기린과 코끼리 중 누가 더 키가 크지?"],["D","A giraffe is taller than an elephant. But the elephant is heavier!","기린이 코끼리보다 키가 커요. 하지만 코끼리가 더 무거워요!"],["P","Double answer, double points! Which is slower, a turtle or a snail?","답을 두 개나, 점수도 두 배! 거북이와 달팽이 중 누가 더 느리지?"],["D","A snail is slower! A turtle is like a race car next to a snail!","달팽이가 더 느려요! 달팽이 옆에서는 거북이가 경주차예요!"],["P","Ha! Which animal sleeps the most?","하하! 어떤 동물이 잠을 제일 많이 자지?"],["D","The koala! It sleeps about twenty hours. My brother is second place!","코알라요! 스무 시간쯤 자요. 제 동생이 2등이고요!"],["P","Final question! Who is the smartest animal in the sea?","마지막 문제! 바다에서 가장 똑똑한 동물은?"],["D","The dolphin! We will learn about it next week, right? I'm ready!","돌고래요! 다음 주에 배울 거죠? 저는 준비됐어요!"]],"wrap":[["P","Tell me three animal facts with fastest, biggest, or taller.","fastest, biggest, taller를 써서 동물 상식 세 가지를 말해 줘."],["D","The cheetah is the fastest animal on land. The blue whale is the biggest animal. And a giraffe is taller than an elephant!","치타는 육지에서 가장 빠른 동물이에요. 대왕고래는 가장 큰 동물이에요. 그리고 기린은 코끼리보다 키가 커요!"]],"tip":"최상급 the -est는 챔피언 세리머니 포즈와 함께 외치게 하세요. 1등 개념과 문법이 동시에 연결됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"1주차 총정리 · 동물 묘사 인터뷰","interview":true,"pool":["Describe a giraffe. What does it have?","Describe an elephant in three sentences.","What questions do you ask in Twenty Questions?","Tell me about your dream puppy. What does it look like?","How would you take care of a puppy?","What does a zookeeper do in the morning?","How does a penguin move? Show me and tell me!","Which is the fastest animal on land?","Which is bigger, a blue whale or a bus?","Describe your favorite animal in five sentences."],"tip":"이번 주 인터뷰는 몸짓 힌트를 허용하세요. 몸으로 표현하며 말하면 묘사 단어가 더 풍부하게 나옵니다."}]},{"sub":"신비한 바다 동물","days":[{"emoji":"🐬","title":"Day 1 · Dolphins Are So Clever!","sub":"돌고래 이야기","words":[["dolphin","돌고래","돌핀"],["clever","영리한","클레버"],["breathe","숨 쉬다","브리드"]],"sentence":["Dolphins are very clever animals.","돌고래는 아주 영리한 동물이에요."],"main":[["P","Week two, under the sea! First friend: the dolphin. What do you know?","2주차, 바닷속으로! 첫 친구는 돌고래야. 뭘 알고 있니?"],["D","Dolphins are very clever animals. They can learn tricks and play with balls!","돌고래는 아주 영리한 동물이에요. 재주도 배우고 공놀이도 해요!"],["P","Right! Here's a surprise: dolphins are not fish. Why not?","맞아! 놀라운 사실 하나, 돌고래는 물고기가 아니야. 왜일까?"],["D","Because they breathe air like us! They come up to the water top to breathe.","우리처럼 공기로 숨을 쉬니까요! 숨 쉬러 물 위로 올라와요."],["P","Exactly! How do dolphins talk to each other?","정확해! 돌고래는 서로 어떻게 대화할까?"],["D","They make clicking sounds! Click click! It's like dolphin language.","딸깍딸깍 소리를 내요! 클릭 클릭! 돌고래 언어 같은 거예요."],["P","If a dolphin talked to you, what would it say?","돌고래가 너에게 말을 건다면 뭐라고 할까?"],["D","Click click... translation: Dayoon, let's race! Loser buys fish snacks!","클릭 클릭... 번역하면, 다윤아 경주하자! 지는 사람이 생선 과자 사기!"],["P","Ha! Who would win, you or the dolphin?","하하! 너랑 돌고래 중 누가 이길까?"],["D","The dolphin! It swims twenty times faster than me. I would buy the snacks.","돌고래요! 저보다 스무 배는 빨리 헤엄쳐요. 제가 과자를 사야겠네요."],["P","Tell me everything about dolphins in five sentences.","돌고래에 대해 다섯 문장으로 다 말해 봐."],["D","Dolphins are very clever sea animals. They are not fish. They breathe air like people. They talk with clicking sounds. And they swim much faster than me!","돌고래는 아주 영리한 바다 동물이에요. 물고기가 아니에요. 사람처럼 공기로 숨을 쉬어요. 딸깍 소리로 대화해요. 그리고 저보다 훨씬 빨리 헤엄쳐요!"]],"role":[["P","I'm a dolphin trainer! Want to help me with the morning show?","나는 돌고래 조련사야! 아침 공연 준비를 도와줄래?"],["D","Yes! What should I do first?","네! 먼저 뭘 해야 하죠?"],["P","Blow the whistle, and Coco will jump. Ready?","호루라기를 불면 코코가 점프할 거야. 준비됐니?"],["D","Tweet! Wow, Coco jumped over the ring! Good girl, Coco!","삑! 와, 코코가 링을 뛰어넘었어요! 잘했어, 코코!"],["P","Now give her a fish. She did a great job.","이제 물고기를 줘. 아주 잘했으니까."],["D","Here you go, Coco! Oh! She splashed water on me!","여기 있어, 코코! 앗! 코코가 저한테 물을 튀겼어요!"],["P","That means she likes you! It's a dolphin high five.","그건 널 좋아한다는 뜻이야! 돌고래식 하이파이브지."],["D","Then I like you too, Coco! Splash! Take that!","그럼 나도 네가 좋아, 코코! 첨벙! 받아라!"]],"wrap":[["P","Why are dolphins special? Tell me.","돌고래는 왜 특별하지? 말해 줘."],["D","Dolphins are clever and friendly. They are not fish because they breathe air. They talk with clicking sounds!","돌고래는 영리하고 다정해요. 공기로 숨을 쉬어서 물고기가 아니에요. 딸깍 소리로 대화해요!"]],"tip":"'물고기가 아니라고?'처럼 놀라운 사실은 아이가 남에게 설명하고 싶어 합니다. 아빠나 동생에게 영어로 설명하게 해 보세요."},{"emoji":"🦈","title":"Day 2 · Shark vs. Whale","sub":"상어와 고래 비교","words":[["shark","상어","샤크"],["whale","고래","웨일"],["fin","지느러미","핀"]],"sentence":["A whale is much bigger than a shark.","고래는 상어보다 훨씬 커요."],"main":[["P","Today's big match: shark versus whale! Which one is bigger?","오늘의 빅 매치, 상어 대 고래! 누가 더 크지?"],["D","A whale is much bigger than a shark. The blue whale is like a swimming building!","고래가 상어보다 훨씬 커요. 대왕고래는 헤엄치는 건물 같아요!"],["P","Ha! Which one has sharper teeth?","하하! 이빨은 누가 더 날카로울까?"],["D","The shark! It has hundreds of sharp teeth. New teeth grow all the time!","상어요! 날카로운 이빨이 수백 개 있어요. 새 이빨이 계속 자라요!"],["P","Lucky shark, no dentist needed! How are they different in breathing?","부럽다 상어, 치과가 필요 없다니! 숨쉬기는 어떻게 다를까?"],["D","The shark breathes in the water like a fish. But the whale comes up for air, like a dolphin!","상어는 물고기처럼 물속에서 숨 쉬어요. 하지만 고래는 돌고래처럼 공기 마시러 올라와요!"],["P","Perfect! What is the water fountain on the whale's head?","완벽해! 고래 머리 위의 물 분수는 뭘까?"],["D","That's the blowhole! The whale breathes out, and whoosh! A water show!","그건 숨구멍이에요! 고래가 숨을 내쉬면, 푸쉬익! 물 쇼가 열려요!"],["P","Are you afraid of sharks?","상어가 무섭니?"],["D","A little. But sharks don't want to eat kids. We are not on the menu!","조금요. 하지만 상어는 아이들을 먹고 싶어 하지 않아요. 우리는 메뉴에 없거든요!"],["P","Ha! Right! Now compare them in six sentences like a sea expert.","하하! 맞아! 이제 바다 전문가처럼 여섯 문장으로 비교해 봐."],["D","Sharks and whales both live in the sea. A whale is much bigger than a shark. A shark has hundreds of sharp teeth. A shark breathes in the water. But a whale comes up for air. Both are amazing sea animals!","상어와 고래는 둘 다 바다에 살아요. 고래가 상어보다 훨씬 커요. 상어는 날카로운 이빨이 수백 개예요. 상어는 물속에서 숨 쉬어요. 하지만 고래는 공기 마시러 올라와요. 둘 다 놀라운 바다 동물이에요!"]],"role":[["P","Splash! I'm a friendly shark! Why is everyone scared of me?","첨벙! 나는 친절한 상어야! 왜 다들 나를 무서워하지?"],["D","Maybe because of your teeth? You have too many!","아마 이빨 때문 아닐까요? 너무 많잖아요!"],["P","But I brush them every day! Look how clean they are!","하지만 매일 닦는걸! 얼마나 깨끗한지 봐!"],["D","Ha! Okay, Mr. Shark, what do you really eat?","하하! 좋아요, 상어 씨, 진짜로 뭘 먹어요?"],["P","Fish and squid. Never kids. Kids taste like homework!","물고기랑 오징어. 아이들은 절대 안 먹어. 아이들은 숙제 맛이 나거든!"],["D","Hahaha! Then let's be friends. Can I touch your fin?","하하하! 그럼 우리 친구해요. 지느러미 만져 봐도 돼요?"],["P","Sure! What will you tell people about me?","그럼! 사람들에게 나에 대해 뭐라고 말해 줄래?"],["D","I will say: sharks are not monsters. They are important for the sea!","이렇게 말할게요. 상어는 괴물이 아니에요. 바다에 꼭 필요한 존재예요!"]],"wrap":[["P","How are a shark and a whale different?","상어와 고래는 어떻게 다르지?"],["D","A whale is much bigger than a shark. A shark breathes in the water, but a whale comes up for air. And sharks never eat kids!","고래가 상어보다 훨씬 커요. 상어는 물속에서 숨 쉬지만 고래는 공기 마시러 올라와요. 그리고 상어는 아이들을 절대 안 먹어요!"]],"tip":"두 동물의 공통점 한 개, 차이점 두 개를 말하는 '1-2 게임'으로 비교 표현을 구조화해 주세요."},{"emoji":"🐙","title":"Day 3 · The Amazing Octopus","sub":"문어의 놀라운 능력","words":[["octopus","문어","옥토퍼스"],["arms","팔","암즈"],["hide","숨다","하이드"]],"sentence":["An octopus has eight arms.","문어는 팔이 여덟 개예요."],"main":[["P","Today's sea friend has no bones and eight arms. Who is it?","오늘의 바다 친구는 뼈가 없고 팔이 여덟 개야. 누구일까?"],["D","An octopus! An octopus has eight arms. That's amazing!","문어요! 문어는 팔이 여덟 개예요. 정말 신기해요!"],["P","What could you do with eight arms, Dayoon?","다윤아, 팔이 여덟 개라면 뭘 할 수 있을까?"],["D","I could draw four pictures, eat pasta, hug my mom, and do homework at the same time!","동시에 그림 네 장을 그리고, 파스타를 먹고, 엄마를 안고, 숙제도 할 수 있어요!"],["P","The busiest octopus ever! How does an octopus hide from danger?","역사상 제일 바쁜 문어네! 문어는 위험할 때 어떻게 숨을까?"],["D","It changes color like the rocks! And it shoots black ink and runs away!","바위처럼 색을 바꿔요! 그리고 까만 먹물을 쏘고 도망가요!"],["P","Ninja moves! Here is the craziest fact: an octopus has three hearts!","닌자 기술이네! 제일 놀라운 사실은 문어가 심장이 세 개라는 거야!"],["D","Three hearts? Then it can love three things: the sea, rocks, and crabs!","심장이 세 개요? 그럼 세 가지를 사랑할 수 있겠네요. 바다, 바위, 그리고 게!"],["P","Ha! And its blood is blue!","하하! 게다가 피는 파란색이야!"],["D","Blue blood, three hearts, eight arms... The octopus is a superhero!","파란 피, 심장 세 개, 팔 여덟 개... 문어는 슈퍼히어로예요!"],["P","Now introduce this superhero in five sentences.","이제 이 슈퍼히어로를 다섯 문장으로 소개해 봐."],["D","The octopus is a sea superhero. It has eight arms and three hearts. Its blood is blue. It can change color to hide. And it shoots ink when danger comes!","문어는 바다의 슈퍼히어로예요. 팔이 여덟 개, 심장이 세 개예요. 피는 파란색이에요. 숨으려고 색을 바꿀 수 있어요. 그리고 위험이 오면 먹물을 쏴요!"]],"role":[["P","Hide and seek with Ollie the octopus! I'm Ollie. I changed my color. Find me!","문어 올리와 숨바꼭질! 내가 올리야. 색을 바꿨지. 나를 찾아봐!"],["D","Hmm, that rock looks strange... It has an eye! Found you, Ollie!","음, 저 바위가 이상해요... 눈이 달렸어요! 찾았다, 올리!"],["P","Wow, sharp eyes! Now you hide. I count to five!","와, 눈썰미 좋은데! 이제 네가 숨어. 다섯까지 셀게!"],["D","I will hide behind the sofa... I mean, the coral! Don't peek!","소파 뒤에... 아니, 산호 뒤에 숨을 거예요! 훔쳐보기 없기!"],["P","One, two, three, four, five! Hmm, where is Dayoon?","하나, 둘, 셋, 넷, 다섯! 음, 다윤이가 어디 있지?"],["D","Hehe... oops, I laughed! You found me!","헤헤... 앗, 웃어 버렸다! 들켰어요!"],["P","Octopuses never laugh when they hide! Rule number one!","문어는 숨을 때 절대 웃지 않아! 규칙 1번이야!"],["D","Okay, next time I will hide like a real octopus. Silent and colorful!","알았어요, 다음엔 진짜 문어처럼 숨을게요. 조용하고 알록달록하게요!"]],"wrap":[["P","What makes the octopus a superhero?","문어는 왜 슈퍼히어로일까?"],["D","An octopus has eight arms and three hearts. It changes color to hide. And it shoots black ink to escape!","문어는 팔이 여덟 개, 심장이 세 개예요. 숨으려고 색을 바꿔요. 그리고 도망갈 때 까만 먹물을 쏴요!"]],"tip":"'팔이 8개라면 뭘 할래?' 같은 상상 질문은 아이만의 대답이 나오는 황금 질문입니다. 답을 서두르지 말고 기다려 주세요."},{"emoji":"🌊","title":"Day 4 · Deep Sea Submarine","sub":"심해 잠수함 탐험 놀이","words":[["submarine","잠수함","서브머린"],["deep","깊은","딥"],["glow","빛나다","글로우"]],"sentence":["Let's dive deep into the dark sea!","깊고 어두운 바닷속으로 잠수하자!"],"main":[["P","Captain Dayoon, our yellow submarine is ready. Where are we going?","다윤 함장님, 우리의 노란 잠수함이 준비됐습니다. 어디로 갑니까?"],["D","Let's dive deep into the dark sea! Close the doors! Dive, dive, dive!","깊고 어두운 바닷속으로 잠수합시다! 문을 닫아라! 잠수, 잠수, 잠수!"],["P","We are 100 meters down. The water is getting darker.","100미터 내려왔습니다. 물이 점점 어두워집니다."],["D","Turn on the lights! Wow, a school of silver fish just passed by!","조명을 켜세요! 와, 은빛 물고기 떼가 방금 지나갔어요!"],["P","Now 1,000 meters! It's completely dark. But look, something is glowing!","이제 1,000미터! 완전히 캄캄합니다. 그런데 보세요, 뭔가 빛나고 있어요!"],["D","It's an anglerfish! It has a little glowing lamp on its head!","아귀예요! 머리에 빛나는 작은 램프가 달려 있어요!"],["P","Why does it have a lamp?","왜 램프를 달고 있을까?"],["D","To catch fish! Small fish come to the light, and chomp! Sneaky fishing!","물고기를 잡으려고요! 작은 물고기가 빛으로 오면, 덥석! 교활한 낚시예요!"],["P","Captain, a giant squid is looking at our submarine!","함장님, 거대 오징어가 우리 잠수함을 보고 있습니다!"],["D","Stay calm, crew! Wave hello slowly... and go up quietly. Very quietly!","침착해요, 대원들! 천천히 인사하고... 조용히 올라갑시다. 아주 조용히요!"],["P","Safe at the top! Captain's report in five sentences, please!","무사히 수면 도착! 함장님, 다섯 문장으로 보고해 주세요!"],["D","Today we dove deep into the dark sea. At 1,000 meters, it was completely dark. We saw an anglerfish with a glowing lamp. A giant squid looked at our submarine. But Captain Dayoon brought everyone home safely!","오늘 우리는 깊고 어두운 바다로 잠수했습니다. 1,000미터에서는 완전히 캄캄했습니다. 빛나는 램프를 단 아귀를 봤습니다. 거대 오징어가 우리 잠수함을 쳐다봤습니다. 하지만 다윤 함장이 모두를 무사히 데려왔습니다!"]],"role":[["P","Beep beep! Submarine problem! We only have three snacks left!","삐빅! 잠수함 비상! 간식이 세 개밖에 안 남았습니다!"],["D","This is serious! Captain's order: share everything! Half for you, half for me.","심각하네요! 함장 명령, 모두 나눠 먹기! 반은 당신, 반은 저요."],["P","Fair captain! What should we name this deep sea we found?","공정한 함장님! 우리가 발견한 이 깊은 바다의 이름을 뭐라고 지을까요?"],["D","The Dayoon Deep! No wait... the Sky-Blue Deep. It sounds prettier.","다윤 해구요! 아니 잠깐... 하늘색 해구요. 더 예쁘게 들려요."],["P","Recorded! One more thing. The crew is scared of the dark.","기록했습니다! 하나 더요. 대원들이 어둠을 무서워합니다."],["D","Don't be scared! The glowing fish are like night lights of the sea.","무서워하지 마세요! 빛나는 물고기들이 바다의 수면등 같은 거예요."],["P","Beautiful words, Captain. Time to go home?","멋진 말이네요, 함장님. 이제 집으로 갈까요?"],["D","Yes! Up, up, up! Dinner is waiting. I hope it's pasta!","네! 위로, 위로, 위로! 저녁이 기다려요. 파스타면 좋겠다!"]],"wrap":[["P","What did you see in the deep sea?","깊은 바다에서 뭘 봤니?"],["D","The deep sea was completely dark. I saw an anglerfish with a glowing lamp on its head. Glowing fish are the night lights of the sea!","깊은 바다는 완전히 캄캄했어요. 머리에 빛나는 램프를 단 아귀를 봤어요. 빛나는 물고기는 바다의 수면등이에요!"]],"tip":"불을 잠깐 끄고 손전등 하나로 심해 분위기를 만들어 보세요. 어둠 속 대화는 아이 기억에 강렬하게 남습니다."},{"emoji":"🐠","title":"Day 5 · Aquarium Guide Dayoon","sub":"아쿠아리움 안내 놀이 (다윤이가 가이드!)","words":[["aquarium","수족관","아쿠아리움"],["tank","수조","탱크"],["visitor","관람객","비지터"]],"sentence":["Welcome to the aquarium!","아쿠아리움에 오신 것을 환영합니다!"],"main":[["P","Today you work at the aquarium! Here comes your first visitor. That's me!","오늘 너는 아쿠아리움에서 일해! 첫 관람객이 왔어. 바로 나야!"],["D","Welcome to the aquarium! I'm your guide, Dayoon. Follow me to tank number one!","아쿠아리움에 오신 것을 환영합니다! 저는 가이드 다윤입니다. 1번 수조로 따라오세요!"],["P","Ooh, what is in tank number one?","오, 1번 수조에는 뭐가 있나요?"],["D","Our dolphin friends! They are clever and they love to play. Please don't knock on the glass!","우리의 돌고래 친구들이요! 영리하고 놀기를 좋아해요. 유리를 두드리지 마세요!"],["P","Why can't I knock on the glass?","왜 유리를 두드리면 안 되죠?"],["D","Because it sounds like thunder to the fish! It scares them.","물고기들에게는 천둥소리처럼 들리거든요! 무서워해요."],["P","Oh, I didn't know! What is the most popular tank here?","아, 몰랐어요! 여기서 제일 인기 있는 수조는 뭐예요?"],["D","The big shark tunnel! Sharks swim over your head. It's scary but exciting!","커다란 상어 터널이요! 상어가 머리 위로 헤엄쳐요. 무섭지만 신나요!"],["P","Wow! And what time is the feeding show?","와! 먹이 주기 쇼는 몇 시예요?"],["D","At three o'clock, at the penguin tank. The penguins waddle super fast when food comes!","3시에 펭귄 수조에서 해요. 먹이가 오면 펭귄들이 엄청 빠르게 뒤뚱거려요!"],["P","Ha! Give me the full tour summary, guide!","하하! 가이드님, 전체 투어 요약을 해 주세요!"],["D","Welcome to our aquarium! Tank one has clever dolphins. The shark tunnel is the most popular spot. The penguin feeding show is at three. Please don't knock on the glass. Enjoy your visit!","저희 아쿠아리움에 오신 것을 환영합니다! 1번 수조에는 영리한 돌고래가 있어요. 상어 터널이 제일 인기예요. 펭귄 먹이 쇼는 3시입니다. 유리를 두드리지 마세요. 즐거운 관람 되세요!"]],"role":[["P","Guide! Emergency! A visitor dropped his ice cream near the penguin tank!","가이드님! 비상이에요! 관람객이 펭귄 수조 근처에 아이스크림을 떨어뜨렸어요!"],["D","Don't worry! I will clean it up. Penguins can't eat ice cream... even if they really want to!","걱정 마세요! 제가 치울게요. 펭귄은 아이스크림을 먹으면 안 돼요... 아무리 먹고 싶어도요!"],["P","Ha! Another question. My daughter wants to touch a starfish. Is it okay?","하하! 질문 하나 더요. 딸이 불가사리를 만지고 싶어 해요. 괜찮나요?"],["D","Yes, at the touch pool! But touch gently, with one finger, like this.","네, 체험 풀에서요! 하지만 이렇게 손가락 하나로 부드럽게 만져야 해요."],["P","One finger, gently. Got it. Which animal is your favorite here?","손가락 하나로 부드럽게요. 알겠어요. 여기서 가장 좋아하는 동물은 뭐예요?"],["D","The sky-blue tang fish! It matches my favorite color perfectly.","하늘색 블루탱이요! 제가 제일 좋아하는 색이랑 딱 맞거든요."],["P","Thank you for the wonderful tour! Here is a thank-you sticker.","멋진 투어 고마워요! 여기 감사 스티커요."],["D","Thank you for visiting! Please come again with your whole family!","방문해 주셔서 감사합니다! 다음엔 온 가족과 함께 또 오세요!"]],"wrap":[["P","What are the rules at the aquarium?","아쿠아리움의 규칙은 뭐지?"],["D","Don't knock on the glass because it scares the fish. Touch the starfish gently with one finger. And enjoy the penguin show at three!","물고기가 놀라니까 유리를 두드리면 안 돼요. 불가사리는 손가락 하나로 부드럽게 만져요. 그리고 3시 펭귄 쇼를 즐기세요!"]],"tip":"실제 아쿠아리움에 가게 되면 오늘 배운 대사로 아이가 가족을 안내하게 해 보세요. 최고의 복습이 됩니다."},{"emoji":"🦀","title":"Day 6 · Tide Pool Explorers","sub":"갯벌·바위 웅덩이 탐험","words":[["crab","게","크랩"],["shell","조개껍데기","셸"],["sideways","옆으로","사이드웨이즈"]],"sentence":["A crab walks sideways.","게는 옆으로 걸어요."],"main":[["P","Look, the sea went far away! What are these little water pools on the rocks?","봐, 바다가 멀리 물러갔어! 바위 위의 이 작은 물웅덩이들은 뭘까?"],["D","Tide pools! They are like tiny hotels for small sea animals!","조수 웅덩이요! 작은 바다 동물들의 미니 호텔 같은 거예요!"],["P","Tiny hotels, I love that! Look, something is moving. What is it?","미니 호텔이라니, 마음에 든다! 봐, 뭔가 움직여. 뭐지?"],["D","A crab! Look, a crab walks sideways! Left, left, left!","게예요! 보세요, 게는 옆으로 걸어요! 왼쪽, 왼쪽, 왼쪽!"],["P","Why do crabs walk sideways?","게는 왜 옆으로 걸을까?"],["D","Because their legs bend that way! It's not weird, it's just crab style!","다리가 그쪽으로 접히거든요! 이상한 게 아니라 게만의 스타일이에요!"],["P","Crab style! What else do you see in the pool?","게 스타일이라! 웅덩이에 또 뭐가 보여?"],["D","I see a starfish on the rock and little shells. Oh, one shell is walking!","바위 위에 불가사리랑 작은 조개껍데기들이 보여요. 어, 껍데기 하나가 걸어가요!"],["P","A walking shell? What could that be?","걸어 다니는 조개껍데기? 그게 뭘까?"],["D","A hermit crab! It borrowed the shell for its house. Free house moving!","소라게예요! 조개껍데기를 집으로 빌렸어요. 공짜 이사예요!"],["P","Ha! Time to go. Tell me about our tide pool adventure in five sentences.","하하! 갈 시간이야. 조수 웅덩이 모험을 다섯 문장으로 말해 봐."],["D","Today we explored the tide pools. They are tiny hotels for sea animals. We saw a crab walking sideways. A starfish was resting on a rock. And a hermit crab carried its shell house!","오늘 우리는 조수 웅덩이를 탐험했어요. 그곳은 바다 동물들의 미니 호텔이에요. 옆으로 걷는 게를 봤어요. 불가사리가 바위에서 쉬고 있었어요. 그리고 소라게가 조개껍데기 집을 지고 다녔어요!"]],"role":[["P","Snip snip! I'm Mr. Crab! Why are you looking at my hotel?","싹둑싹둑! 나는 게 아저씨다! 왜 내 호텔을 들여다보는 거냐?"],["D","Hello, Mr. Crab! We are just exploring. We won't hurt anyone!","안녕하세요, 게 아저씨! 저희는 그냥 탐험 중이에요. 아무도 해치지 않아요!"],["P","Hmm. Can you walk like me? Then I will trust you.","흠. 나처럼 걸을 수 있느냐? 그러면 믿어 주지."],["D","Sideways walk! Left, left, right, right! How is this, Mr. Crab?","옆으로 걷기! 왼쪽, 왼쪽, 오른쪽, 오른쪽! 어때요, 게 아저씨?"],["P","Not bad, for a human! What is the rule of the tide pool?","인간치고는 나쁘지 않군! 조수 웅덩이의 규칙이 뭔지 아느냐?"],["D","Look with eyes, touch gently, and put everything back!","눈으로 보고, 부드럽게 만지고, 모든 걸 제자리에 두기예요!"],["P","Correct! You may explore my kingdom. But don't take my shells!","정답! 내 왕국을 탐험해도 좋다. 하지만 내 조개껍데기는 가져가지 마라!"],["D","I promise! Shells are the crabs' treasure, not mine!","약속해요! 조개껍데기는 게들의 보물이지 제 게 아니니까요!"]],"wrap":[["P","What lives in a tide pool, and what is the rule?","조수 웅덩이에는 뭐가 살고, 규칙은 뭐지?"],["D","Crabs, starfish, and hermit crabs live there. A crab walks sideways! The rule is: touch gently and put everything back.","게, 불가사리, 소라게가 살아요. 게는 옆으로 걸어요! 규칙은 부드럽게 만지고 모두 제자리에 두는 거예요."]],"tip":"게처럼 옆으로 걷기 시합을 해 보세요. sideways라는 어려운 단어가 놀이 한 번에 완전히 아이 것이 됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"2주차 총정리 · 바다 동물 인터뷰","interview":true,"pool":["Why are dolphins not fish?","How do dolphins talk to each other?","Which is bigger, a shark or a whale?","How does a shark breathe? How about a whale?","How many arms and hearts does an octopus have?","How does an octopus hide from danger?","What did you see in the deep, dark sea?","What are the rules at the aquarium?","How does a crab walk? Show me!","Describe your favorite sea animal in five sentences."],"tip":"바다 동물 그림 카드를 뒤집어 놓고 뽑은 동물에 대한 질문에 답하게 하면 인터뷰가 게임처럼 즐거워집니다."}]},{"sub":"산과 숲의 자연","days":[{"emoji":"⛰️","title":"Day 1 · Let's Climb the Mountain!","sub":"등산 표현 배우기","words":[["mountain","산","마운틴"],["climb","오르다","클라임"],["top","꼭대기","탑"]],"sentence":["Let's climb to the top of the mountain!","산꼭대기까지 올라가자!"],"main":[["P","Good morning, hiker Dayoon! Today we climb Gwanaksan. Are you ready?","좋은 아침, 등산가 다윤! 오늘은 관악산에 오른다. 준비됐니?"],["D","Ready! I have water, snacks, and my strong skater legs!","준비 완료! 물, 간식, 그리고 튼튼한 스케이터 다리가 있어요!"],["P","Let's climb to the top of the mountain! How do you feel?","산꼭대기까지 올라가자! 기분이 어때?"],["D","Excited! But this road goes up, up, up... My legs are getting tired.","신나요! 그런데 길이 계속 올라가고, 올라가고... 다리가 점점 피곤해져요."],["P","Let's rest here. Listen. What can you hear?","여기서 쉬자. 들어 봐. 뭐가 들리니?"],["D","I can hear birds singing and the wind in the trees. It's nature music!","새들이 노래하고 나무 사이로 바람 소리가 들려요. 자연의 음악이에요!"],["P","Beautiful! Come on, the top is near. One more step... we made it!","아름답다! 자, 꼭대기가 가까워. 한 걸음만 더... 해냈다!"],["D","Wow! I can see the whole city from here! Our town looks so small!","와! 여기서 도시 전체가 보여요! 우리 동네가 정말 작아 보여요!"],["P","What do people shout on the top of a mountain?","산꼭대기에서 사람들은 뭐라고 외치지?"],["D","Yahoo! Ya-hoo! The mountain says it back to me! Hello, echo!","야호! 야-호! 산이 저한테 되돌려 말해요! 안녕, 메아리야!"],["P","Ha! Now tell me our hiking story in five sentences.","하하! 이제 우리 등산 이야기를 다섯 문장으로 말해 봐."],["D","Today we climbed Gwanaksan. The road was hard and my legs got tired. We rested and listened to nature music. Finally, we reached the top. I shouted yahoo and the echo answered!","오늘 우리는 관악산에 올랐어요. 길이 힘들어서 다리가 피곤해졌어요. 쉬면서 자연의 음악을 들었어요. 마침내 꼭대기에 도착했어요. 야호를 외쳤더니 메아리가 대답했어요!"]],"role":[["P","I'm a tired hiker on the trail. Young hiker, is the top far?","나는 등산로의 지친 등산객이야. 젊은 등산가님, 꼭대기가 멀었나요?"],["D","Almost there! Just ten more minutes. You can do it!","거의 다 왔어요! 딱 10분만 더요. 하실 수 있어요!"],["P","Phew... I need energy. Do you have anything?","휴... 힘이 필요해요. 뭐 가진 것 있나요?"],["D","Here, have a chocolate. Mountain rule: hikers share snacks!","여기 초콜릿 드세요. 산의 규칙, 등산객은 간식을 나눠요!"],["P","Thank you! Why do you climb mountains?","고마워요! 당신은 왜 산에 오르나요?"],["D","Because the top view is the best painting in the world. And it's free!","꼭대기 경치가 세상에서 제일 멋진 그림이니까요. 게다가 공짜예요!"],["P","Wise words! See you at the top?","명언이네요! 꼭대기에서 만날까요?"],["D","Yes! Slow and steady. The mountain isn't running away!","네! 천천히 꾸준히요. 산은 도망가지 않으니까요!"]],"wrap":[["P","Tell me about climbing the mountain today.","오늘 산에 오른 이야기를 해 줘."],["D","We climbed to the top of the mountain. It was hard, but the view was amazing. I shouted yahoo and heard the echo!","우리는 산꼭대기까지 올라갔어요. 힘들었지만 경치가 굉장했어요. 야호를 외치고 메아리를 들었어요!"]],"tip":"주말에 가까운 산이나 언덕에 올라 'We made it!'을 외쳐 보세요. 성취의 순간과 영어가 함께 기억됩니다."},{"emoji":"🌲","title":"Day 2 · Secrets of the Forest","sub":"숲속 관찰하기","words":[["forest","숲","포레스트"],["squirrel","다람쥐","스쿼럴"],["acorn","도토리","에이콘"]],"sentence":["A squirrel is hiding acorns under the tree.","다람쥐가 나무 아래에 도토리를 숨기고 있어요."],"main":[["P","Shh! We are forest detectives today. Walk quietly and find clues!","쉿! 오늘 우리는 숲속 탐정이야. 조용히 걸으며 단서를 찾아봐!"],["D","Yes, detective! I see something moving... A squirrel is hiding acorns under the tree!","네, 탐정님! 뭔가 움직여요... 다람쥐가 나무 아래에 도토리를 숨기고 있어요!"],["P","Good eyes! Why does the squirrel hide acorns?","눈썰미 좋다! 다람쥐는 왜 도토리를 숨길까?"],["D","It's saving food for winter! It's like a piggy bank, but with acorns.","겨울을 위해 음식을 모으는 거예요! 돼지 저금통 같은 건데, 도토리로요."],["P","An acorn bank! Next clue: look at this tree. How old do you think it is?","도토리 저금통이라! 다음 단서, 이 나무를 봐. 몇 살일 것 같아?"],["D","It's so thick! Maybe one hundred years old? Older than grandma!","엄청 두꺼워요! 백 살쯤 됐을까요? 할머니보다 나이가 많아요!"],["P","Could be! Touch the bark. How does it feel?","그럴 수도! 나무껍질을 만져 봐. 느낌이 어때?"],["D","It feels rough, like a dinosaur's skin! And the moss is soft like a carpet.","공룡 피부처럼 거칠거칠해요! 그리고 이끼는 카펫처럼 부드러워요."],["P","Look up! What do you see between the leaves?","위를 봐! 나뭇잎 사이로 뭐가 보여?"],["D","The sunlight is coming through like golden strings! I want to draw this!","햇빛이 황금 실처럼 새어 들어와요! 이거 그리고 싶어요!"],["P","Detective's report! What did we find in the forest? Five sentences!","탐정 보고! 숲에서 뭘 발견했지? 다섯 문장으로!"],["D","We explored the forest quietly. A squirrel was hiding acorns for winter. We found a tree older than grandma. The bark felt like dinosaur skin. And sunlight came through the leaves like golden strings!","우리는 조용히 숲을 탐험했어요. 다람쥐가 겨울용 도토리를 숨기고 있었어요. 할머니보다 나이 많은 나무를 발견했어요. 나무껍질은 공룡 피부 같았어요. 그리고 햇빛이 황금 실처럼 잎사귀 사이로 들어왔어요!"]],"role":[["P","Chirp chirp! I'm a little bird. Human child, why are you so quiet?","짹짹! 나는 작은 새야. 인간 아이야, 왜 그렇게 조용하니?"],["D","I don't want to scare the forest friends. This is your home!","숲속 친구들을 놀라게 하고 싶지 않아서요. 여기는 여러분의 집이잖아요!"],["P","What a kind human! Do you want to know a forest secret?","친절한 인간이구나! 숲의 비밀을 알고 싶니?"],["D","Yes, please! I love secrets!","네, 알려 주세요! 저는 비밀을 정말 좋아해요!"],["P","Trees talk to each other through their roots. Underground internet!","나무들은 뿌리로 서로 대화해. 땅속 인터넷이지!"],["D","Whoa! Then what are they saying right now?","우와! 그럼 지금 나무들이 뭐라고 말하고 있어요?"],["P","They say: a girl with a sketchbook is here. She looks friendly!","이렇게 말해. 스케치북을 든 여자아이가 왔어. 다정해 보여!"],["D","Tell them thank you! I will draw the forest and show everyone how beautiful it is!","고맙다고 전해 주세요! 제가 숲을 그려서 얼마나 아름다운지 모두에게 보여 줄게요!"]],"wrap":[["P","What secrets did you find in the forest?","숲에서 어떤 비밀을 찾았니?"],["D","A squirrel hides acorns under the tree for winter. Old trees feel like dinosaur skin. And trees talk to each other through their roots!","다람쥐는 겨울을 위해 나무 아래 도토리를 숨겨요. 오래된 나무는 공룡 피부 같아요. 그리고 나무들은 뿌리로 대화해요!"]],"tip":"산책길에 나무 한 그루를 만지며 오늘 배운 rough, soft를 말해 보게 하세요. 촉감과 연결된 단어는 잊히지 않습니다."},{"emoji":"🏕️","title":"Day 3 · Camping Under the Stars","sub":"캠핑 놀이","words":[["tent","텐트","텐트"],["campfire","모닥불","캠프파이어"],["marshmallow","마시멜로","마시멜로"]],"sentence":["Let's set up the tent together.","같이 텐트를 치자."],"main":[["P","Welcome to Camp Dayoon! First job: let's set up the tent together.","다윤 캠프장에 온 걸 환영해! 첫 임무, 같이 텐트를 치자."],["D","Okay! I will hold this pole. You pull the strings. Teamwork!","네! 제가 이 기둥을 잡을게요. 줄을 당겨 주세요. 팀워크!"],["P","And... done! Our tent is standing. What's next on the camping list?","자... 완성! 텐트가 섰다. 캠핑 목록에서 다음은 뭐지?"],["D","The campfire! Can we make it now? I want to roast marshmallows!","모닥불이요! 지금 피워도 돼요? 마시멜로 구워 먹고 싶어요!"],["P","Fire safety first! What are the rules near a campfire?","불조심 먼저! 모닥불 근처 규칙은 뭘까?"],["D","Don't run near the fire, and always stay with an adult!","불 근처에서 뛰지 않기, 그리고 항상 어른이랑 같이 있기요!"],["P","Perfect! Here is your marshmallow stick. Turn it slowly...","완벽해! 여기 마시멜로 꼬치야. 천천히 돌려 봐..."],["D","It's getting golden and puffy... Yum! It's like a sweet little cloud!","점점 노릇노릇 부풀어 올라요... 냠! 달콤한 꼬마 구름 같아요!"],["P","Look up at the sky now. What do you see?","이제 하늘을 올려다봐. 뭐가 보여?"],["D","So many stars! The sky looks like someone spilled sugar on black paper!","별이 엄청 많아요! 하늘이 까만 종이에 설탕을 쏟은 것 같아요!"],["P","Poet Dayoon! Tell me about our camping night in six sentences.","시인 다윤! 우리의 캠핑 밤을 여섯 문장으로 말해 봐."],["D","Tonight we camped in the mountains. We set up the tent together. We made a warm campfire. I roasted a marshmallow like a sweet cloud. The night sky was full of stars. I never want to go home!","오늘 밤 우리는 산에서 캠핑을 했어요. 같이 텐트를 쳤어요. 따뜻한 모닥불을 피웠어요. 달콤한 구름 같은 마시멜로를 구웠어요. 밤하늘엔 별이 가득했어요. 집에 가기 싫을 정도예요!"]],"role":[["P","Rustle rustle... What was that sound outside the tent?","부스럭부스럭... 텐트 밖에서 저 소리는 뭐지?"],["D","Don't worry! Let me check with the flashlight... It's just a rabbit!","걱정 마세요! 손전등으로 확인해 볼게요... 그냥 토끼예요!"],["P","Phew! Camping makes every sound spooky. Tell me a story to sleep.","휴! 캠핑에서는 모든 소리가 으스스해. 잠들게 이야기 하나 해 줘."],["D","Once upon a time, a marshmallow cloud floated over a mountain...","옛날 옛적에, 마시멜로 구름이 산 위를 떠다녔는데요..."],["P","And then? What happened?","그래서? 어떻게 됐어?"],["D","It rained candy on all the campers! The end. Sweet dreams!","캠핑하는 사람들에게 사탕 비를 내려 줬대요! 끝. 좋은 꿈 꾸세요!"],["P","Best camp story ever. What time do campers wake up?","최고의 캠프 이야기다. 캠핑하는 사람들은 몇 시에 일어나지?"],["D","With the sun! Birds are the alarm clock of the forest.","해와 함께요! 새들이 숲의 자명종이거든요."]],"wrap":[["P","What did you do at the campsite?","캠핑장에서 뭘 했니?"],["D","We set up the tent and made a campfire. I roasted marshmallows safely. The night sky was full of stars like spilled sugar!","텐트를 치고 모닥불을 피웠어요. 안전하게 마시멜로를 구웠어요. 밤하늘엔 쏟아진 설탕처럼 별이 가득했어요!"]],"tip":"이불로 거실에 미니 텐트를 만들어 그 안에서 오늘 대화를 복습해 보세요. 공간이 바뀌면 몰입이 살아납니다."},{"emoji":"🌦️","title":"Day 4 · Mountain Weather Reporter","sub":"산속 날씨 리포터 놀이","words":[["foggy","안개 낀","포기"],["thunder","천둥","썬더"],["rainbow","무지개","레인보우"]],"sentence":["It's foggy on the mountain this morning.","오늘 아침 산에는 안개가 꼈어요."],"main":[["P","Good morning! You are our mountain weather reporter today. Camera... action!","좋은 아침! 오늘 너는 산 날씨 리포터야. 카메라... 액션!"],["D","Good morning, everyone! This is reporter Dayoon from the mountain! It's foggy on the mountain this morning.","여러분, 좋은 아침입니다! 산에서 전해 드리는 다윤 리포터입니다! 오늘 아침 산에는 안개가 꼈습니다."],["P","How foggy is it, reporter?","리포터님, 안개가 얼마나 짙은가요?"],["D","Very foggy! I can't see my own shoes! The mountain is wearing a white blanket!","아주 짙어요! 제 신발도 안 보여요! 산이 하얀 담요를 덮고 있어요!"],["P","Ha! And what will the weather be in the afternoon?","하하! 오후 날씨는 어떨까요?"],["D","Rain is coming! I can hear thunder far away. Boom, boom!","비가 올 거예요! 멀리서 천둥소리가 들려요. 우르릉, 쾅!"],["P","What should hikers do when they hear thunder?","등산객들은 천둥소리가 들리면 어떻게 해야 하죠?"],["D","Go down quickly and stay away from tall trees! Safety first!","빨리 내려가고 큰 나무에서 떨어져 있어야 해요! 안전이 최우선!"],["P","Great advice! Oh look, the rain stopped. What is that in the sky?","훌륭한 조언이에요! 오, 봐요, 비가 그쳤어요. 하늘에 저건 뭐죠?"],["D","A rainbow! A huge rainbow over the mountain! Seven colors, all there!","무지개예요! 산 위에 거대한 무지개가 떴어요! 일곱 색깔이 다 있어요!"],["P","Finish your weather report in five sentences, reporter Dayoon!","다윤 리포터, 날씨 보도를 다섯 문장으로 마무리해 주세요!"],["D","This morning, the mountain was very foggy. In the afternoon, we heard thunder and rain came. Hikers went down quickly and stayed safe. Now the rain has stopped. A beautiful rainbow is over the mountain. This was reporter Dayoon!","오늘 아침 산에는 안개가 짙었습니다. 오후에는 천둥이 치고 비가 왔습니다. 등산객들은 빨리 내려가 안전했습니다. 지금은 비가 그쳤습니다. 산 위에 아름다운 무지개가 떠 있습니다. 지금까지 다윤 리포터였습니다!"]],"role":[["P","Reporter! Viewers are asking: why is the mountain weather so moody?","리포터님! 시청자 질문입니다. 산 날씨는 왜 이렇게 변덕스럽죠?"],["D","Great question! Mountains are tall, so clouds bump into them a lot!","좋은 질문이에요! 산은 키가 커서 구름이랑 자주 부딪히거든요!"],["P","Clouds bumping! What should hikers always bring?","구름이랑 부딪힌다니! 등산객은 뭘 꼭 챙겨야 하나요?"],["D","A raincoat and warm clothes. Mountain weather changes fast, like my brother's mood!","우비랑 따뜻한 옷이요. 산 날씨는 제 동생 기분처럼 빨리 변해요!"],["P","Ha! And which weather do you like best on a mountain?","하하! 산에서 어떤 날씨가 제일 좋아요?"],["D","After-rain weather! The air is clean and everything sparkles.","비 온 뒤 날씨요! 공기가 깨끗하고 모든 게 반짝거려요."],["P","Last question: will there be a rainbow tomorrow?","마지막 질문, 내일도 무지개가 뜰까요?"],["D","I hope so! Rainbows are the sky's way of smiling!","그러면 좋겠어요! 무지개는 하늘이 웃는 방법이니까요!"]],"wrap":[["P","Report today's mountain weather one more time.","오늘 산 날씨를 한 번 더 보도해 줘."],["D","It was foggy in the morning. Then thunder came and it rained. Finally, a beautiful rainbow appeared over the mountain!","아침에는 안개가 꼈어요. 그다음 천둥이 치고 비가 왔어요. 마지막엔 산 위에 아름다운 무지개가 나타났어요!"]],"tip":"리모컨을 마이크처럼 쥐여 주세요. 리포터 말투 놀이는 아이가 긴 문장을 또박또박 말하게 만드는 마법입니다."},{"emoji":"🎙️","title":"Day 5 · Nature Documentary Narrator","sub":"자연 다큐 내레이터 놀이","words":[["documentary","다큐멘터리","다큐멘터리"],["eagle","독수리","이글"],["quietly","조용히","콰이어틀리"]],"sentence":["The eagle flies high over the mountain.","독수리가 산 위를 높이 날아요."],"main":[["P","Tonight on Nature TV... a new documentary! And the narrator is... Dayoon! Speak in a deep, calm voice.","오늘 밤 네이처 TV에서... 새 다큐멘터리가 방영됩니다! 내레이터는... 다윤! 낮고 차분한 목소리로 말해 봐."],["D","Ahem... Welcome to the wild mountains of Korea. Today, we follow the king of the sky.","에헴... 한국의 야생 산맥에 오신 것을 환영합니다. 오늘 우리는 하늘의 왕을 따라갑니다."],["P","Ooh, goosebumps! Who is the king of the sky?","오, 소름! 하늘의 왕이 누구지?"],["D","The eagle flies high over the mountain. Its eyes can see a mouse from very far away.","독수리가 산 위를 높이 납니다. 그 눈은 아주 멀리서도 쥐를 볼 수 있습니다."],["P","And what is happening down in the valley?","그리고 아래 계곡에서는 무슨 일이 벌어지고 있나요?"],["D","Down below, a deer family walks quietly to the river. Shh... they are drinking water.","저 아래에서는 사슴 가족이 조용히 강가로 걸어갑니다. 쉿... 물을 마시고 있네요."],["P","Beautiful narration! Suddenly, clouds gather. What happens?","멋진 내레이션이야! 갑자기 구름이 모여든다. 무슨 일이 벌어지지?"],["D","The wind grows stronger. The animals hide in the forest. Nature waits for the storm to pass.","바람이 거세집니다. 동물들은 숲에 몸을 숨깁니다. 자연은 폭풍이 지나가길 기다립니다."],["P","And after the storm?","폭풍이 지나간 뒤에는?"],["D","The sun returns. The birds sing again. The mountain is alive and peaceful once more.","해가 돌아옵니다. 새들이 다시 노래합니다. 산은 다시 한번 생기 있고 평화로워집니다."],["P","Cut! Perfect! Now the ending narration, five sentences, deep voice!","컷! 완벽해! 이제 마지막 내레이션, 다섯 문장, 낮은 목소리로!"],["D","The mountain is home to many animals. The eagle rules the sky. The deer drink from the clean river. Every tree and every bird is important. Nature is the greatest show on Earth. Thank you for watching.","산은 많은 동물들의 집입니다. 독수리는 하늘을 다스립니다. 사슴은 깨끗한 강물을 마십니다. 모든 나무와 모든 새가 소중합니다. 자연은 지구 최고의 쇼입니다. 시청해 주셔서 감사합니다."]],"role":[["P","Now I'm the interviewer. Narrator Dayoon, your voice was amazing! How did you do it?","이제 나는 인터뷰어야. 다윤 내레이터님, 목소리가 굉장했어요! 비결이 뭔가요?"],["D","Thank you! I practiced with my art teacher's calm voice. Low and slow!","감사합니다! 미술 선생님의 차분한 목소리로 연습했어요. 낮고 천천히!"],["P","Which animal was your favorite to narrate?","어떤 동물 내레이션이 제일 좋았나요?"],["D","The eagle! It flies alone but it looks so free and brave.","독수리요! 혼자 날지만 정말 자유롭고 용감해 보여요."],["P","If you make the next documentary, what will it be about?","다음 다큐멘터리를 만든다면 무엇에 대한 걸까요?"],["D","Puppies of the world! Part one: fluffy puppies. Part two: even fluffier puppies!","세계의 강아지들이요! 1부, 복슬복슬한 강아지들. 2부, 더 복슬복슬한 강아지들!"],["P","Ha! I would watch that! Any last words for young narrators?","하하! 그건 꼭 볼게요! 어린 내레이터들에게 한마디 해 주세요."],["D","Speak slowly, love nature, and never narrate with a full mouth!","천천히 말하고, 자연을 사랑하고, 입에 음식을 가득 넣고 내레이션하지 마세요!"]],"wrap":[["P","Narrate the mountain scene one more time, shortly.","산의 장면을 짧게 한 번 더 내레이션해 줘."],["D","The eagle flies high over the mountain. The deer walk quietly to the river. Nature is the greatest show on Earth!","독수리가 산 위를 높이 납니다. 사슴은 조용히 강가로 걸어갑니다. 자연은 지구 최고의 쇼입니다!"]],"tip":"목소리 톤을 바꾸는 놀이는 발음과 억양 연습에 최고입니다. 스마트폰으로 녹음해서 같이 들어 보세요."},{"emoji":"🌸","title":"Day 6 · Four Seasons of Nature","sub":"자연의 사계절","words":[["season","계절","시즌"],["bloom","꽃이 피다","블룸"],["leaves","나뭇잎들","리브즈"]],"sentence":["Flowers bloom in spring.","봄에는 꽃이 피어요."],"main":[["P","Nature has four faces! Let's travel through the seasons. Spring first! What happens?","자연에는 네 개의 얼굴이 있어! 계절 여행을 떠나자. 봄부터! 무슨 일이 일어나지?"],["D","Flowers bloom in spring! Pink, yellow, white... the world becomes a garden!","봄에는 꽃이 피어요! 분홍, 노랑, 하양... 세상이 정원이 돼요!"],["P","Lovely! Now summer, your favorite! Why do you love it?","예쁘다! 이제 네가 제일 좋아하는 여름! 왜 좋아해?"],["D","Summer is the best! The trees are super green, and I can swim and eat watermelon!","여름이 최고예요! 나무가 아주아주 초록색이고, 수영도 하고 수박도 먹을 수 있어요!"],["P","What do the mountains look like in autumn?","가을 산은 어떤 모습이지?"],["D","The leaves turn red and yellow! The mountain looks like it's on beautiful fire!","나뭇잎이 빨갛고 노랗게 변해요! 산이 아름다운 불꽃 같아요!"],["P","Wow! And then winter comes. What happens to nature?","와! 그리고 겨울이 와. 자연은 어떻게 되지?"],["D","Snow covers everything in white. The trees sleep, and the bears sleep too!","눈이 모든 걸 하얗게 덮어요. 나무도 자고, 곰도 자요!"],["P","If seasons were your friends, who would each one be?","계절이 친구라면 각각 누구일까?"],["D","Spring is a kind florist, summer is me, autumn is an artist, and winter is a sleepy koala!","봄은 친절한 꽃집 주인, 여름은 저, 가을은 화가, 겨울은 졸린 코알라예요!"],["P","Summer is you! Ha! Describe the four seasons in six sentences.","여름이 너라니! 하하! 사계절을 여섯 문장으로 묘사해 봐."],["D","Korea has four beautiful seasons. In spring, flowers bloom everywhere. In summer, the trees are green and I swim a lot. In autumn, the leaves turn red and yellow. In winter, snow covers the mountains. My favorite season is summer, of course!","한국에는 아름다운 사계절이 있어요. 봄에는 꽃이 사방에 피어요. 여름에는 나무가 초록색이고 저는 수영을 많이 해요. 가을에는 잎이 빨갛고 노랗게 물들어요. 겨울에는 눈이 산을 덮어요. 제가 제일 좋아하는 계절은 당연히 여름이에요!"]],"role":[["P","Season quiz show! I describe, you guess. I am cold, white, and quiet. Who am I?","계절 퀴즈 쇼! 내가 설명하면 네가 맞혀. 나는 춥고, 하얗고, 조용해. 나는 누구게?"],["D","You are winter! The season of snow and hot chocolate!","겨울이요! 눈과 핫초코의 계절!"],["P","Correct! I am warm, and flowers wake up when I come.","정답! 나는 따뜻하고, 내가 오면 꽃들이 잠에서 깨."],["D","Spring! The flower alarm clock!","봄이요! 꽃들의 자명종!"],["P","Right again! Now you describe a season for me.","또 정답! 이제 네가 계절을 설명해 봐."],["D","I am hot and sunny. Kids love me. Watermelon and swimming pools are my best friends!","나는 덥고 화창해요. 아이들이 나를 좋아해요. 수박과 수영장이 내 단짝이에요!"],["P","Summer! Your favorite! Last one: I paint the leaves red.","여름! 네가 제일 좋아하는 계절! 마지막, 나는 나뭇잎을 빨갛게 칠해."],["D","Autumn, the artist season! This quiz is too easy for me!","가을, 화가의 계절이요! 이 퀴즈는 저한테 너무 쉬워요!"]],"wrap":[["P","Which season do you love, and what happens in nature?","넌 어떤 계절을 사랑하고, 자연에선 무슨 일이 일어나지?"],["D","I love summer because the trees are green and I can swim. In spring flowers bloom, and in autumn the leaves turn red. Every season is a different painting!","나무가 초록이고 수영할 수 있어서 여름이 좋아요. 봄엔 꽃이 피고 가을엔 잎이 빨개져요. 계절마다 다른 그림이에요!"]],"tip":"창밖 풍경을 보며 'What season is it now? How do you know?'라고 물어보세요. 계절 표현이 실생활 관찰과 연결됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"3주차 총정리 · 산과 자연 인터뷰","interview":true,"pool":["Tell me about climbing the mountain. What did you see at the top?","What do you shout on the top of a mountain?","What does a squirrel hide under the tree, and why?","What secret do the trees have in the forest?","What did you do at the campsite? Tell me three things.","What are the safety rules near a campfire?","Report the mountain weather: foggy, thunder, and rainbow.","Narrate a nature scene like a documentary narrator.","What happens in nature in each season?","Why do you love summer? Tell me in three sentences."],"tip":"이번 주 인터뷰는 내레이터 목소리, 리포터 목소리 등 '목소리 바꿔 답하기'를 허용하면 두 배로 즐거워집니다."}]},{"sub":"지구 지킴이 다윤","days":[{"emoji":"♻️","title":"Day 1 · Reduce, Reuse, Recycle!","sub":"재활용 배우기","words":[["recycle","재활용하다","리사이클"],["plastic","플라스틱","플라스틱"],["bin","쓰레기통","빈"]],"sentence":["We can recycle plastic bottles.","우리는 플라스틱 병을 재활용할 수 있어요."],"main":[["P","Dayoon, look at this plastic bottle. Trash or treasure?","다윤아, 이 플라스틱 병을 봐. 쓰레기일까, 보물일까?"],["D","Treasure! We can recycle plastic bottles. They can become new things!","보물이요! 플라스틱 병은 재활용할 수 있어요. 새로운 물건이 될 수 있거든요!"],["P","Right! What can old bottles become?","맞아! 헌 병은 뭐가 될 수 있을까?"],["D","T-shirts, bags, even pencil cases! Recycling is like magic!","티셔츠, 가방, 심지어 필통도요! 재활용은 마법 같아요!"],["P","Magic indeed! Do you know the three R words?","정말 마법이지! 세 가지 R 단어를 아니?"],["D","Reduce, reuse, recycle! Use less, use again, and make new!","리듀스, 리유즈, 리사이클! 덜 쓰고, 다시 쓰고, 새로 만들기!"],["P","Perfect! Which bin does this milk carton go in?","완벽해! 이 우유갑은 어느 통에 들어갈까?"],["D","The paper bin! But wash it first, or it gets stinky!","종이류 통이요! 그런데 먼저 씻어야 해요. 안 그러면 냄새나요!"],["P","Ha! And this banana peel?","하하! 그럼 이 바나나 껍질은?"],["D","Food waste bin! Or... we could feed it to a monkey. Do we know any monkeys?","음식물 쓰레기통이요! 아니면... 원숭이한테 줄 수도 있죠. 우리 아는 원숭이 있나요?"],["P","Just Siheon! Ha! Now teach me the recycling rules in five sentences.","시헌이밖에 없지! 하하! 이제 재활용 규칙을 다섯 문장으로 가르쳐 줘."],["D","Recycling makes trash into treasure. Plastic bottles go in the plastic bin. Paper goes in the paper bin. Wash the containers before recycling. Remember the three Rs: reduce, reuse, recycle!","재활용은 쓰레기를 보물로 만들어요. 플라스틱 병은 플라스틱 통에 넣어요. 종이는 종이류 통에 넣어요. 재활용 전에 용기를 씻어요. 세 가지 R을 기억해요, 리듀스, 리유즈, 리사이클!"]],"role":[["P","Recycling game show! I hold up an item, you shout the right bin! A glass jar!","재활용 게임 쇼! 내가 물건을 들면 넌 맞는 통을 외쳐! 유리병!"],["D","Glass bin! Ding ding ding!","유리류 통! 딩동댕!"],["P","A newspaper!","신문지!"],["D","Paper bin! Too easy!","종이류 통! 너무 쉬워요!"],["P","Tricky one: a plastic bottle with juice still inside!","함정 문제, 주스가 아직 든 플라스틱 병!"],["D","Wait! First drink or pour out the juice, wash it, then the plastic bin!","잠깐만요! 먼저 주스를 마시거나 버리고, 씻고, 그다음 플라스틱 통이요!"],["P","Champion! Final question: a broken toy robot?","챔피언! 마지막 문제, 고장 난 장난감 로봇!"],["D","Hmm, don't throw it away yet! Maybe Dad can fix it. Reuse first!","음, 아직 버리지 마세요! 아빠가 고칠 수 있을지도 몰라요. 다시 쓰기 먼저!"]],"wrap":[["P","What are the three Rs? Explain them.","세 가지 R이 뭐지? 설명해 줘."],["D","Reduce means use less. Reuse means use things again. Recycle means old things become new things, like bottles becoming T-shirts!","리듀스는 덜 쓰는 거예요. 리유즈는 다시 쓰는 거예요. 리사이클은 병이 티셔츠가 되는 것처럼 헌 물건이 새 물건이 되는 거예요!"]],"tip":"오늘부터 분리수거할 때 아이가 영어로 통 이름을 외치게 해 보세요. 집안일이 곧 영어 수업이 됩니다."},{"emoji":"🏖️","title":"Day 2 · Beach Cleanup Day","sub":"해변 청소 놀이","words":[["trash","쓰레기","트래시"],["pick up","줍다","픽 업"],["gloves","장갑","글러브즈"]],"sentence":["Let's pick up the trash on the beach.","해변의 쓰레기를 줍자."],"main":[["P","Oh no, look at this beach. There is trash everywhere! How do you feel?","이런, 이 해변을 봐. 쓰레기가 사방에 있어! 기분이 어때?"],["D","I feel sad and a little angry. The sea animals live here!","슬프고 조금 화가 나요. 바다 동물들이 여기 사는데!"],["P","Then what should we do?","그럼 우리가 뭘 해야 할까?"],["D","Let's pick up the trash on the beach! Give me the gloves, please!","해변의 쓰레기를 주워요! 장갑 주세요!"],["P","Gloves on! Why is trash dangerous for sea animals?","장갑 착용 완료! 쓰레기는 왜 바다 동물에게 위험할까?"],["D","Turtles think plastic bags are jellyfish and eat them. That makes them very sick.","거북이는 비닐봉지를 해파리인 줄 알고 먹어요. 그러면 몹시 아파요."],["P","So sad. Look, you found so much! What did you pick up?","정말 슬픈 일이야. 봐, 많이 찾았네! 뭘 주웠어?"],["D","Three bottles, two bags, and one old shoe. Who swims with one shoe?","병 세 개, 봉지 두 개, 그리고 헌 신발 한 짝이요. 누가 신발 한 짝만 신고 수영하죠?"],["P","Ha! A mystery! The beach looks much better now. How do you feel?","하하! 미스터리네! 해변이 훨씬 좋아졌어. 이제 기분이 어때?"],["D","Proud! My arms are tired, but my heart is happy!","뿌듯해요! 팔은 피곤하지만 마음은 행복해요!"],["P","Beautiful! Report our cleanup day in five sentences.","멋지다! 우리의 청소 날을 다섯 문장으로 보고해 줘."],["D","Today we cleaned the beach. There was trash everywhere. We put on gloves and picked it all up. I found bottles, bags, and one mystery shoe. Now the beach is clean and the turtles are safe!","오늘 우리는 해변을 청소했어요. 쓰레기가 사방에 있었어요. 장갑을 끼고 전부 주웠어요. 병, 봉지, 그리고 미스터리 신발 한 짝을 찾았어요. 이제 해변은 깨끗하고 거북이들은 안전해요!"]],"role":[["P","I'm a sea turtle! Cough, cough... I almost ate a plastic bag!","나는 바다거북이야! 콜록콜록... 하마터면 비닐봉지를 먹을 뻔했어!"],["D","Oh no! Are you okay, Mr. Turtle? That's not a jellyfish!","이런! 괜찮으세요, 거북 아저씨? 그건 해파리가 아니에요!"],["P","Thank you for taking it away. Why do humans drop trash here?","치워 줘서 고마워. 인간들은 왜 여기에 쓰레기를 버리는 거니?"],["D","Some people are lazy. But not all humans! We are cleaning today!","어떤 사람들은 게을러서요. 하지만 모든 인간이 그런 건 아니에요! 우리는 오늘 청소하고 있어요!"],["P","You give me hope, little human. What is your promise to the sea?","꼬마 인간, 네 덕분에 희망이 생긴다. 바다에게 어떤 약속을 해 줄래?"],["D","I promise to never drop trash, and to tell my friends too!","절대 쓰레기를 버리지 않고, 친구들에게도 알려 주기로 약속해요!"],["P","Then the sea will always welcome you. Splash!","그렇다면 바다는 언제나 너를 환영할 거야. 첨벙!"],["D","Goodbye, Mr. Turtle! Swim safely! Watch out for bags!","안녕히 가세요, 거북 아저씨! 안전하게 헤엄치세요! 봉지 조심하시고요!"]],"wrap":[["P","Why did you clean the beach, and how did it feel?","왜 해변을 청소했고, 기분이 어땠니?"],["D","Trash makes sea animals sick, so we picked it all up. Turtles think plastic bags are jellyfish. After cleaning, my heart felt happy and proud!","쓰레기는 바다 동물을 아프게 해서 우리가 다 주웠어요. 거북이는 비닐봉지를 해파리로 착각해요. 청소 후에 마음이 행복하고 뿌듯했어요!"]],"tip":"실제 산책 중에 쓰레기 하나를 함께 주우며 'One trash, one happy turtle!'이라고 외쳐 보세요. 행동과 영어가 연결됩니다."},{"emoji":"💡","title":"Day 3 · Energy Savers","sub":"물과 전기 아끼기","words":[["save","아끼다","세이브"],["turn off","끄다","턴 오프"],["energy","에너지","에너지"]],"sentence":["Turn off the light when you leave the room.","방에서 나갈 때 불을 꺼요."],"main":[["P","Mission: Energy Savers! Our house wastes too much energy. Detective Dayoon, find the problems!","임무명, 에너지 절약단! 우리 집이 에너지를 너무 낭비하고 있어. 다윤 탐정, 문제를 찾아라!"],["D","On it! Problem one: the light is on, but nobody is in the room!","출동! 문제 하나, 불이 켜져 있는데 방에 아무도 없어요!"],["P","Good catch! What's the rule?","잘 찾았어! 규칙이 뭐지?"],["D","Turn off the light when you leave the room! Click! Energy saved!","방에서 나갈 때 불을 꺼요! 딸깍! 에너지 절약!"],["P","Next room: the bathroom. What do you see?","다음 방은 욕실이야. 뭐가 보여?"],["D","The water is running while brushing teeth! Turn off the water, please!","이를 닦는 동안 물이 계속 흐르고 있어요! 물을 잠가 주세요!"],["P","How much water can we save that way?","그렇게 하면 물을 얼마나 아낄 수 있을까?"],["D","A lot! Maybe enough for a whole fish family to swim in!","엄청 많이요! 물고기 가족이 헤엄칠 수 있을 만큼요!"],["P","Ha! Last problem: the TV is on, but Siheon is sleeping in front of it.","하하! 마지막 문제, TV는 켜져 있는데 시헌이는 그 앞에서 자고 있어."],["D","Classic Siheon! Turn off the TV, and carry the sleepy koala to bed!","역시 시헌이답네요! TV를 끄고, 졸린 코알라를 침대로 옮겨요!"],["P","Mission complete! Report your energy-saving rules in five sentences.","임무 완료! 에너지 절약 규칙을 다섯 문장으로 보고하라."],["D","I am an energy saver! I turn off the light when I leave the room. I turn off the water while brushing my teeth. I turn off the TV when nobody watches it. Saving energy helps our Earth!","저는 에너지 절약단이에요! 방에서 나갈 때 불을 꺼요. 이 닦는 동안 물을 잠가요. 아무도 안 볼 때 TV를 꺼요. 에너지 절약은 지구를 도와요!"]],"role":[["P","Bzzz! I'm the electricity fairy! You saved me today. Make a wish!","찌릿! 나는 전기 요정이야! 오늘 네가 나를 아껴 줬어. 소원을 빌어!"],["D","Really? Then I wish for... a world where no energy is wasted!","정말요? 그럼 제 소원은... 에너지가 낭비되지 않는 세상이요!"],["P","A noble wish! But how will kids remember to turn things off?","훌륭한 소원이야! 그런데 아이들이 끄는 걸 어떻게 기억하지?"],["D","Stickers! I will draw little reminder stickers for every switch!","스티커요! 제가 모든 스위치에 붙일 알림 스티커를 그릴 거예요!"],["P","Artist and Earth saver! What will the sticker say?","화가에 지구 지킴이라니! 스티커에 뭐라고 쓸 건데?"],["D","It will say: Click me off! With a winking light bulb face!","이렇게 쓸 거예요. 나를 꺼 줘! 윙크하는 전구 얼굴이랑 같이요!"],["P","I would obey that sticker! Anything for the water tap?","그 스티커라면 나도 따르겠어! 수도꼭지용도 있니?"],["D","Yes! A fish saying: Save some for me! Glub glub!","네! 물고기가 말해요. 나를 위해 좀 남겨 줘! 뻐끔뻐끔!"]],"wrap":[["P","How do you save energy at home? Tell me your rules.","집에서 어떻게 에너지를 아끼지? 네 규칙을 말해 줘."],["D","I turn off the light when I leave the room. I turn off the water while brushing my teeth. Saving energy helps the Earth!","방에서 나갈 때 불을 꺼요. 이 닦을 때 물을 잠가요. 에너지 절약은 지구를 도와요!"]],"tip":"아이가 오늘 직접 스위치 알림 그림을 그려 붙이게 해 주세요. 자기가 만든 규칙은 영어 문장까지 함께 기억됩니다."},{"emoji":"🐻‍❄️","title":"Day 4 · Help the Polar Bears","sub":"지구가 더워지고 있어요","words":[["polar bear","북극곰","폴라 베어"],["ice","얼음","아이스"],["melt","녹다","멜트"]],"sentence":["The ice is melting because the Earth is getting hot.","지구가 더워져서 얼음이 녹고 있어요."],"main":[["P","Today's news from the North Pole: a polar bear needs our help. Why?","오늘 북극에서 온 뉴스야. 북극곰이 우리 도움이 필요해. 왜일까?"],["D","The ice is melting because the Earth is getting hot. The bear's home is disappearing!","지구가 더워져서 얼음이 녹고 있어요. 곰의 집이 사라지고 있어요!"],["P","Right. Why do polar bears need the ice?","맞아. 북극곰에게 얼음이 왜 필요하지?"],["D","They rest on the ice and hunt from it. No ice means no dinner!","얼음 위에서 쉬고 사냥도 해요. 얼음이 없으면 저녁밥도 없어요!"],["P","Why is the Earth getting hotter?","지구는 왜 점점 더워질까?"],["D","Too much smoke from cars and factories. It makes a big blanket around the Earth!","자동차와 공장에서 나오는 연기가 너무 많아서요. 지구에 두꺼운 담요를 덮은 것 같아요!"],["P","A hot blanket for the Earth. So what can a ten-year-old in Gwacheon do?","지구의 뜨거운 담요라니. 그럼 과천의 열 살 아이는 뭘 할 수 있을까?"],["D","I can walk or ride my bike instead of taking the car for short trips!","가까운 거리는 차 대신 걷거나 자전거를 탈 수 있어요!"],["P","Great! What else?","좋아! 또 뭐가 있을까?"],["D","Save energy, recycle, and use less plastic. Small things, but many kids together are big!","에너지 아끼기, 재활용하기, 플라스틱 덜 쓰기요. 작은 일이지만 많은 아이들이 함께하면 커져요!"],["P","Powerful! Send a video message to the polar bear, five sentences!","힘 있는 말이야! 북극곰에게 영상 메시지를 보내 봐, 다섯 문장으로!"],["D","Dear polar bear, I heard your ice is melting. I'm so sorry the Earth is getting hot. I will ride my bike and save energy. My friends will help too. Please stay strong, we are on your team!","북극곰에게, 너의 얼음이 녹고 있다고 들었어. 지구가 더워져서 정말 미안해. 나는 자전거를 타고 에너지를 아낄게. 내 친구들도 도울 거야. 힘내, 우리는 네 편이야!"]],"role":[["P","Grrr... I'm the polar bear. I got your video message. Is it really from a kid?","어흥... 나는 북극곰이야. 네 영상 메시지를 받았어. 정말 어린이가 보낸 거니?"],["D","Yes! I'm Dayoon, ten years old, from Korea. We want to help you!","네! 저는 한국에 사는 열 살 다윤이에요. 우리가 돕고 싶어요!"],["P","How can kids so far away help my ice?","그렇게 먼 곳의 아이들이 어떻게 내 얼음을 도울 수 있지?"],["D","The Earth is all connected! Less smoke in Korea means cooler air everywhere!","지구는 모두 연결되어 있어요! 한국에서 연기가 줄면 모든 곳의 공기가 시원해져요!"],["P","Smart cub! What will you tell your class?","똑똑한 아기 곰이군! 반 친구들에게는 뭐라고 말할 거니?"],["D","I will draw a poster of you and write: Save the ice, save the bears!","곰님을 포스터로 그리고 이렇게 쓸 거예요. 얼음을 지키자, 곰을 지키자!"],["P","An artist fights for me! Thank you. Stay warm... I mean, stay cool!","화가가 나를 위해 싸워 주다니! 고마워. 따뜻하게... 아니, 시원하게 지내렴!"],["D","Ha! You too, polar bear! Hold on, help is coming!","하하! 곰님도요! 조금만 기다려요, 도움이 가고 있어요!"]],"wrap":[["P","Why do polar bears need help, and what can you do?","북극곰은 왜 도움이 필요하고, 넌 뭘 할 수 있지?"],["D","The ice is melting because the Earth is getting hot. Polar bears are losing their home. I can ride my bike, save energy, and use less plastic!","지구가 더워져서 얼음이 녹고 있어요. 북극곰이 집을 잃고 있어요. 저는 자전거 타고, 에너지 아끼고, 플라스틱을 덜 쓸 수 있어요!"]],"tip":"무거운 주제일수록 '내가 할 수 있는 일'로 끝맺어 주세요. I can ~ 문장이 아이에게 힘을 줍니다."},{"emoji":"📰","title":"Day 5 · Earth Reporter Dayoon","sub":"반대로 인터뷰! (다윤이가 기자)","words":[["reporter","기자","리포터"],["protect","보호하다","프로텍트"],["interview","인터뷰하다","인터뷰"]],"sentence":["How can we protect the Earth?","우리는 어떻게 지구를 보호할 수 있나요?"],"main":[["P","Special day! You are the reporter and I answer. Interview me about the Earth!","특별한 날이야! 네가 기자, 내가 답변자야. 지구에 대해 나를 인터뷰해 봐!"],["D","Hello, viewers! This is Earth reporter Dayoon! First question: how can we protect the Earth?","시청자 여러분, 안녕하세요! 지구 전문 기자 다윤입니다! 첫 질문입니다. 우리는 어떻게 지구를 보호할 수 있나요?"],["P","Great question! We can recycle, save energy, and plant trees.","좋은 질문이에요! 재활용하고, 에너지를 아끼고, 나무를 심을 수 있죠."],["D","I see! Second question: why are trees important for the Earth?","그렇군요! 두 번째 질문입니다. 나무는 왜 지구에 중요한가요?"],["P","Trees clean the air and give homes to animals. They are Earth's best friends.","나무는 공기를 깨끗하게 하고 동물들에게 집을 줘요. 지구의 가장 친한 친구죠."],["D","Wonderful answer! Third question: what is the biggest problem for the sea?","훌륭한 답변입니다! 세 번째 질문, 바다의 가장 큰 문제는 무엇인가요?"],["P","Plastic trash. Millions of bottles and bags go into the sea every year.","플라스틱 쓰레기예요. 매년 수백만 개의 병과 봉지가 바다로 들어가죠."],["D","That's terrible! Follow-up question: what do YOU do for the Earth every day?","끔찍하네요! 추가 질문입니다. 당신은 매일 지구를 위해 무엇을 하시나요?"],["P","Ha! Sharp reporter! I bring my own bag to the market and I recycle.","하하! 날카로운 기자님! 나는 장바구니를 들고 다니고 재활용을 해요."],["D","Excellent! Last question: do you have a message for the kids watching?","훌륭합니다! 마지막 질문, 시청 중인 어린이들에게 한 말씀 해 주시겠어요?"],["P","Yes: kids, your small hands can do big things for the Earth!","네, 어린이 여러분, 여러분의 작은 손이 지구를 위해 큰일을 할 수 있어요!"],["D","Beautiful message! This was Earth reporter Dayoon. Protect the Earth, everyone! Good night!","아름다운 메시지네요! 지금까지 지구 기자 다윤이었습니다. 여러분, 지구를 지켜 주세요! 안녕히 계세요!"]],"role":[["P","Now the roles flip back for one minute! Reporter, how was interviewing?","이제 1분만 역할을 다시 바꾸자! 기자님, 인터뷰해 보니 어땠나요?"],["D","Asking questions is fun but hard! I had to listen very carefully.","질문하는 건 재미있지만 어려워요! 아주 집중해서 들어야 했어요."],["P","What was the most surprising answer today?","오늘 가장 놀라운 답변은 뭐였나요?"],["D","Millions of plastic bottles go into the sea. Millions! I can't even count that!","수백만 개의 플라스틱 병이 바다로 들어간대요. 수백만 개요! 셀 수도 없어요!"],["P","If you interview anyone in the world about nature, who?","자연에 대해 세상 누구든 인터뷰할 수 있다면, 누구를 할래?"],["D","A real polar bear! And then a whale. Animals know the true news!","진짜 북극곰이요! 그다음엔 고래요. 동물들이 진짜 뉴스를 알고 있잖아요!"],["P","Ha! Animal news! What is your reporter sign-off line?","하하! 동물 뉴스라니! 너의 기자 마무리 멘트는 뭐야?"],["D","Protect the Earth, everyone! This was Dayoon, from Gwacheon to the world!","여러분, 지구를 지켜 주세요! 과천에서 세계로, 다윤이었습니다!"]],"wrap":[["P","What did you learn from your interview today?","오늘 인터뷰에서 뭘 배웠니?"],["D","We can protect the Earth by recycling and planting trees. Plastic trash is the sea's biggest problem. Small hands can do big things!","재활용하고 나무를 심어서 지구를 지킬 수 있어요. 플라스틱 쓰레기가 바다의 가장 큰 문제예요. 작은 손이 큰일을 할 수 있어요!"]],"tip":"질문하는 쪽이 훨씬 어렵습니다. 아이가 의문문을 만들 때 어순이 틀려도 끊지 말고 끝까지 듣고 답해 주세요."},{"emoji":"🌱","title":"Day 6 · Planting My Little Tree","sub":"나무 심기와 지구 약속","words":[["plant","심다","플랜트"],["seed","씨앗","시드"],["grow","자라다","그로우"]],"sentence":["I will plant a seed and watch it grow.","씨앗을 심고 자라는 걸 지켜볼 거예요."],"main":[["P","Last mission of the month: let's plant a seed! What do we need?","이번 달 마지막 임무, 씨앗을 심자! 뭐가 필요할까?"],["D","A pot, soil, a seed, water, and sunshine! And love, of course!","화분, 흙, 씨앗, 물, 그리고 햇빛이요! 물론 사랑도요!"],["P","Love included! Put the soil in the pot. Now what?","사랑 포함이요! 화분에 흙을 담고. 이제 뭘 하지?"],["D","Make a little hole, put the seed in, and cover it like a blanket. Good night, seed!","작은 구멍을 파고, 씨앗을 넣고, 담요처럼 덮어 줘요. 잘 자, 씨앗아!"],["P","Ha! How often should we water it?","하하! 물은 얼마나 자주 줘야 할까?"],["D","A little bit when the soil is dry. Too much water makes the seed sad!","흙이 마르면 조금씩요. 물이 너무 많으면 씨앗이 슬퍼해요!"],["P","What will your seed become?","네 씨앗은 뭐가 될까?"],["D","A sunflower! It will grow taller than Siheon. Maybe taller than Dad!","해바라기요! 시헌이보다 크게 자랄 거예요. 어쩌면 아빠보다도요!"],["P","Why is planting one seed good for the Earth?","씨앗 하나를 심는 게 왜 지구에 좋을까?"],["D","Every plant cleans the air a little. One seed from every kid means a giant forest!","모든 식물은 공기를 조금씩 깨끗하게 해요. 모든 아이가 씨앗 하나씩 심으면 거대한 숲이 돼요!"],["P","A kid-made forest! Now make your Earth promise in six sentences.","아이들이 만든 숲이라니! 이제 지구 약속을 여섯 문장으로 말해 봐."],["D","I am Dayoon, and this is my Earth promise. I will recycle and save energy. I will pick up trash when I see it. I will use less plastic. I planted a seed today and I will watch it grow. Little Dayoon, big promise!","저는 다윤이고, 이것은 저의 지구 약속이에요. 재활용하고 에너지를 아낄게요. 쓰레기를 보면 주울게요. 플라스틱을 덜 쓸게요. 오늘 씨앗을 심었고 자라는 걸 지켜볼 거예요. 작은 다윤이의 큰 약속!"]],"role":[["P","Fast forward! I'm your sunflower, three months later. Hello, Dayoon!","시간을 빨리 감기! 나는 3개월 뒤 네 해바라기야. 안녕, 다윤!"],["D","Whoa, you grew so tall! You are taller than me now!","우와, 엄청 컸네! 이제 나보다 키가 커요!"],["P","Thanks to your water and love! What was the hardest part?","네 물과 사랑 덕분이지! 뭐가 제일 힘들었니?"],["D","Waiting! For two weeks, you were just... dirt. I almost gave up!","기다리기요! 2주 동안 그냥... 흙이었잖아요. 거의 포기할 뻔했어요!"],["P","But you didn't! What did you learn from me?","하지만 포기하지 않았지! 나에게서 뭘 배웠니?"],["D","Good things grow slowly. Like my English! Little by little, every day.","좋은 것은 천천히 자라요. 제 영어처럼요! 매일 조금씩 조금씩."],["P","The wisest gardener! Will you plant more seeds?","가장 지혜로운 정원사구나! 씨앗을 더 심을 거니?"],["D","Yes! One every spring. When I'm twenty, I will have my own little forest!","네! 봄마다 하나씩요. 스무 살이 되면 저만의 작은 숲이 생길 거예요!"]],"wrap":[["P","Tell me your Earth promise one last time.","마지막으로 네 지구 약속을 말해 줘."],["D","I will recycle, save energy, and use less plastic. I planted a seed and I will watch it grow. Good things grow slowly, like my English!","재활용하고, 에너지를 아끼고, 플라스틱을 덜 쓸게요. 씨앗을 심었고 자라는 걸 지켜볼 거예요. 좋은 것은 제 영어처럼 천천히 자라요!"]],"tip":"실제로 씨앗 하나를 심어 보세요. 매일 물 주며 'Grow, grow!'라고 말하는 순간이 이번 달 최고의 복습이 됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"4주차 총정리 · 자연 지키기 인터뷰","interview":true,"pool":["What are the three Rs? Explain each one.","Which bin does a plastic bottle go in? What should you do first?","Why is trash on the beach dangerous for sea turtles?","How did you feel after cleaning the beach?","How do you save energy at home? Tell me two rules.","Why is the ice melting at the North Pole?","What can you do to help the polar bears?","How can we protect the Earth? Tell me three ways.","How do you plant a seed? Tell me the steps.","Tell me your Earth promise in five sentences."],"tip":"한 달의 마지막 인터뷰입니다. 답을 마칠 때마다 'You are a real Earth hero!'라고 크게 축하해 주세요."}]}]});

","아트 상점에 오신 걸 환영합니다! 오늘은 뭐가 필요하세요?"],["D","Hello! I need a new sketchbook, please.","안녕하세요! 새 스케치북이 필요해요."],["P","Good choice! What color pencils do you use?","좋은 선택이에요! 어떤 색연필을 쓰나요?"],["D","I use sky blue a lot. It's my favorite color.","하늘색을 많이 써요. 제가 가장 좋아하는 색이거든요."],["P","Do you need a brush, too?","붓도 필요하세요?"],["D","Yes, a small brush for my paints, please.","네, 물감에 쓸 작은 붓 주세요."],["P","Anything else? We have magic crayons that never break!","더 필요한 건요? 절대 안 부러지는 마법 크레용도 있어요!"],["D","Really? Then I want ten of them!","정말요? 그럼 열 개 주세요!"],["P","Ha! That will be one hundred smiles, please.","하하! 그럼 값은 미소 백 개입니다."],["D","Here you go — smile, smile, smile!","여기요 — 미소, 미소, 미소!"]],"role":[["P","What do you draw with?","뭘로 그림을 그려?"],["D","I draw with colored pencils and crayons.","색연필이랑 크레용으로 그려요."],["P","What do you need for painting?","물감 칠할 때 뭐가 필요해?"],["D","I need a brush and paints.","붓이랑 물감이 필요해요."],["P","What is in your art bag?","네 미술 가방에는 뭐가 들어 있어?"],["D","A sketchbook, crayons, and an eraser are in my bag.","스케치북, 크레용, 지우개가 들어 있어요."],["P","Which color do you use the most?","어떤 색을 제일 많이 써?"],["D","I use sky blue the most.","하늘색을 제일 많이 써요."]],"wrap":[["P","What did you buy at the art shop today?","오늘 아트 상점에서 뭘 샀어?"],["D","I bought a sketchbook and a small brush. I use sky blue a lot because it is my favorite color.","스케치북이랑 작은 붓을 샀어요. 하늘색이 제일 좋아하는 색이라서 많이 써요."]],"tip":"가게 주인 목소리를 우스꽝스럽게 바꿔 주면 아이가 'I need ~' 표현을 훨씬 재미있게 반복합니다."},{"emoji":"🖼️","title":"Day 3 · What I Drew Yesterday","sub":"어제 그린 그림 발표","words":[["yesterday","어제","예스터데이"],["proud","자랑스러운","프라우드"],["fluffy","복슬복슬한","플러피"]],"sentence":["I drew a puppy yesterday.","어제 강아지를 그렸어요."],"main":[["P","Dayoon, welcome to Show and Tell time! What did you draw yesterday?","다윤아, 발표 시간에 온 걸 환영해! 어제 뭘 그렸어?"],["D","I drew a puppy yesterday!","어제 강아지를 그렸어요!"],["P","A puppy! Tell me more about it.","강아지! 더 자세히 말해줘."],["D","It has big eyes and a fluffy tail.","큰 눈이랑 복슬복슬한 꼬리가 있어요."],["P","Why did you draw a puppy?","왜 "],["D","I got up again and tried one more time.","다시 일어나서 한 번 더 해 봤어요."],["P","Were you scared?","무서웠어?"],["D","At first yes, but not anymore.","처음엔요, 그런데 이제는 아니에요."],["P","What did you learn from falling?","넘어지면서 뭘 배웠어?"],["D","Falling is just part of learning.","넘어지는 것도 배우는 과정이에요."]],"wrap":[["P","Tell me your falling-down story!","네가 넘어졌던 이야기를 해줘!"],["D","The ice is slippery, so I fell down many times. But I got up again every time. Falling is part of learning!","얼음이 미끄러워서 여러 번 넘어졌어요. 하지만 매번 다시 일어났어요. 넘어지는 것도 배우는 과정이에요!"]],"tip":"'I fell down, but I got up again'은 인생 문장이에요. 억양을 살려 응원 구호처럼 함께 외쳐 보세요."},{"emoji":"🏅","title":"Day 4 · Coach Time!","sub":"스케이트 코치 놀이","words":[["bend","구부리다","벤드"],["knee","무릎","니"],["balance","균형","밸런스"]],"sentence":["Bend your knees and keep your balance.","무릎을 굽히고 균형을 잡으세요."],"main":[["P","Welcome to training, skater Dayoon! Are you ready?","훈련에 온 걸 환영한다, 스케이터 다윤! 준비됐나?"],["D","Yes, Coach! I'm ready!","네, 코치님! 준비됐어요!"],["P","First, bend your knees. Show me!","먼저, 무릎을 굽혀. 보여줘 봐!"],["D","Like this? I'm bending my knees!","이렇게요? 무릎을 굽히고 있어요!"],["P","Perfect. Now keep your balance and glide slowly.","완벽해. 이제 균형을 잡고 천천히 미끄러져 봐."],["D","Whoa... I'm keeping my balance!","우와... 균형을 잡고 있어요!"],["P","Excellent! Now try one small jump.","훌륭해! 이제 작은 점프 한 번 해 보자."],["D","Okay... jump! Did you see that, Coach?","좋아요... 점프! 코치님, 보셨어요?"],["P","Amazing! One more time, but smile like a star!","놀라운데! 한 번 더, 이번엔 스타처럼 웃으면서!"],["D","Ta-da! How is this smile, Coach?","짜잔! 이 미소는 어때요, 코치님?"],["P","Beautiful! Training is over. What do we say?","아름다워! 훈련 끝. 뭐라고 인사하지?"],["D","Thank you, Coach! See you next time!","감사합니다, 코치님! 다음에 봬요!"]],"role":[["P","How do you skate safely?","어떻게 안전하게 스케이트를 타?"],["D","I bend my knees and keep my balance.","무릎을 굽히고 균형을 잡아요."],["P","What does your coach say first?","코치님이 제일 먼저 뭐라고 하셔?"],["D","My coach says, \"Bend your knees!\"","코치님은 \"무릎을 굽혀!\"라고 하세요."],["P","What did you try today?","오늘은 뭘 시도했어?"],["D","I tried one small jump ve because they save people. Doctors are great too, because they help sick people!","소방관은 사람들을 구해서 용감하다고 생각해요. 의사도 아픈 사람들을 도와줘서 훌륭해요!"]],"tip":"이번 달 핵심은 'I think ~ because ~'예요. because 뒤 이유가 나올 때까지 기다리는 게 부모의 역할입니다."},{"emoji":"🕵️","title":"Day 2 · Guess the Job!","sub":"직업 스무고개","words":[["uniform","유니폼","유니폼"],["hint","힌트","힌트"],["detective","탐정","디텍티브"]],"sentence":["Does this person wear a uniform?","이 사람은 유니폼을 입나요?"],"main":[["P","Let's play Guess the Job! I'm thinking of a job. Be a detective!","직업 맞히기 게임을 하자! 내가 직업 하나를 생각하고 있어. 탐정이 되어 봐!"],["D","Okay, Detective Dayoon is ready! Does this person wear a uniform?","좋아요, 탐정 다윤 준비 완료! 이 사람은 유니폼을 입나요?"],["P","Yes, they wear a white uniform.","응, 하얀 유니폼을 입어."],["D","Hmm. Does this person work in a hospital?","음. 이 사람은 병원에서 일하나요?"],["P","No, they don't. Here is a hint: yummy smells!","아니야. 힌트 줄게: 맛있는 냄새!"],["D","Yummy smells... Does this person cook food?","맛있는 냄새라... 이 사람은 요리를 하나요?"],["P","Yes! So what is the job?","맞아! 그럼 직업이 뭘까?"],["D","A chef! The answer is a chef!","요리사요! 정답은 요리사예요!"],["P","Correct! Now it's your turn to pick a job.","정답! 이제 네가 직업을 고를 차례야."],["D","Okay! My person draws lines and builds nothing... yet!","좋아요! 제 사람은 선을 그리는데, 아직 아무것도 안 지어요!"],["P","Draws lines but builds nothing yet? An architect!","선을 그리는데 아직 안 짓는다고? 건축가!"],["D","Wow, you got it too fast! No fair!","우와, 너무 빨리 맞혔어요! 반칙이에요!"]],"role":[["P","Does this person wear a uniform?","이 사람은 유니폼을 입어?"],["D","Yes, this person wears a white uniform.","네, 이 사람은 하얀 유니폼을 입어요."],["P","Does this person work in a hospital?","이 사람은 병원에서 일해?"],["D","No, this person works in a kitchen.","아니요, 이 사람은 주방에서 일해요."],["P","What does this person do?","이 사람은 무슨 일을 해?"],["D","This person cooks delicious food.","이 사람은 맛있는 음식을 만들어요."],["P","So what is the job?","그럼 직업이 뭐야?"],["D","The answer is a chef!","정답은 요리사예요!"]],"wrap":[["P","How do we play Guess the Job?","직업 맞히기는 어떻게 하는 거야?"],["D","I ask questions like \"Does this person wear a uniform?\" Then I guess the job with the hints!","\"이 사람은 유니폼을 입나요?\" 같은 질문을 해요. 그리고 힌트로 직업을 맞혀요!"]],"tip":"'Does this person ~?' 3인칭 질문이 오늘의 핵심이에요. 아이가 출제자일 때 힌트도 영어로 말하게 하세요."},{"emoji":"💼","title":"Day 3 · The Job Interview","sub":"직업 면접 놀이","words":[["interview","면접","인터뷰"],["strength","강점","스트렝스"],["hire","고용하다","하이어"]],"sentence":["I'm good at drawing, so I can design well.","저는 그림을 잘 그려서 디자인을 잘할 수 있어요."],"main":[["P","Welcome to the Dream Company interview! Please introduce yourself.","드림 컴퍼니 면접에 오신 걸 환영합니다! 자기소개를 해 주세요."],["D","Hello! My name is Dayoon, and I'm ten years old.","안녕하세요! 제 이름은 다윤이고, 열 살입니다."],["P","Why do you want this designer job?","왜 이 디자이너 일을 하고 싶나요?"],["D","Because I love drawing and making new things.","그림 그리기와 새로운 것 만들기를 사랑하기 때문입니다."],["P","What is your strength?","당신의 강점은 무엇인가요?"],["D","I'm good at drawing, so I can design well.","저는 그림을 잘 그려서 디자인을 잘할 수 있어요."],["P","What is your weakness?","약점은 무엇인가요?"],["D","Hmm... I can't stop drawing. Even on my homework!","음... 그림 그리기를 멈출 수가 없어요. 숙제 위에도 그려요!"],["P","Ha! If we hire you, what will you make first?","하하! 우리가 당신을 고용하면 뭘 제일 먼저 만들 건가요?"],["D","I will design a sky blue car for kids.","어린이를 위한 하늘색 자동차를 디자인할 거예요."],["P","You're hired! Welcome to the team!","합격입니다! 우리 팀에 온 걸 환영해요!"],["D","Yes! Thank you! So... when is lunch?","앗싸! 감사합니다! 그런데... 점심은 언제예요?"]],"role":[["P","Please introduce yourself.","자기소개를 해 주세요."],["D","My name is Dayoon, and I'm ten years old.","제 이름은 다윤이고, 열 살입니다."],["P","Why do you want this job?","왜 이 일을 하고 싶나요?"],["D","Because I love drawing and making new things.","그림 그리기와 새로운 것 만들기를 사랑하기 때문이에요."],["P","What is your strength?","강점이 무엇인가요?"],["D","I'm good at drawing, so I can design well.","그림을 잘 그려서 디자인을 잘할 수 있어요."],["P","What will you make first?","무엇을 제일 먼저 만들 건가요?"],["D","I will design a sky blue car for kids.","어린이를 위한 하늘색 자동차를 디자인할 거예요."]],"wrap":[["P","How was your job interview today?","오늘 면접 어땠어?"],["D","I said I'm good at drawing, so I can design well. I got the job — I'm hired!","저는 그림을 잘 그려서 디자인을 잘할 수 있다고 말했어요. 합격했어요 — 고용됐다고요!"]],"tip":"면접관처럼 진지한 표정으로 연기하다가 마지막에 '합격!'을 외쳐 주면 아이의 성취감이 큽니다."},{"emoji":"🍝","title":"Day 4 · Chef for a Day","sub":"하루 요리사 체험","words":[["recipe","조리법","레시피"],["boil","끓이다","보일"],["delicious","맛있는","딜리셔스"]],"sentence":["I think cooking is fun because I can eat my work.","요리는 내가 만든 걸 먹을 수 있어서 재미있다고 생각해요."],"main":[["P","Welcome to Chef Dayoon's kitchen! What are we cooking today?","다윤 셰프의 주방에 오신 걸 환영합니다! 오늘은 뭘 요리하나요?"],["D","Today, we are making strawberry pasta!","오늘은 딸기 파스타를 만들 거예요!"],["P","Strawberry pasta?! Is that real food?","딸기 파스타요?! 그거 진짜 음식이에요?"],["D","It's my special recipe! Sweet and yummy!","제 특별 조리법이에요! 달콤하고 맛있어요!"],["P","Okay, Chef. What do we do first?","알겠어요, 셰프. 먼저 뭘 하죠?"],["D","First, boil the noodles. Careful, it's hot!","먼저, 면을 끓이세요. 조심하세요, 뜨거워요!"],["P","Noodles are in! Chef, what do you think about being a chef?","면 넣었습니다! 셰프, 요리사라는 직업에 대해 어떻게 생각해요?"],["D","I think cooking is fun because I can eat my work!","요리는 제가 만든 걸 먹을 수 있어서 재미있다고 생각해요!"],["P","The best reason ever. How does it taste?","역대 최고의 이유네요. 맛이 어때요?"],["D","Mamma mia! It's delicious!","맘마미아! 정말 맛있어요!"],["P","What do we say to the customers?","손님들에게는 뭐라고 말하죠?"],["D","Enjoy your meal — and save room for strawberries!","맛있게 드세요 — 딸기 먹을 배는 남겨 두시고요!"]],"role":[["P","What are you cooking today, Chef?","셰프, 오늘은 뭘 요리하나요?"],["D","I'm making strawberry pasta, my special recipe.","제 특별 조리법인 딸기 파스타를 만들어요."],["P","What do we do first?","먼저 뭘 하나요?"],["D","First, boil the noodles.","먼저, 면을 끓여요."],["P","What do you think about cooking?","요리에 대해 어떻게 생각해요?"],["D","I think cooking is fun because I can eat my work.","제가 만든 걸 먹을 수 있어서 요리는 재미있다고 생각해요."],["P","How does it taste?","맛이 어때요?"],["D","It's delicious!","정말 맛있어요!"]],"wrap":[["P","Chef Dayoon, how was your kitchen day?","다윤 셰프, 오늘 주방은 어땠나요?"],["D","I made strawberry pasta with my special recipe. I think cooking is fun because I can eat my work!","제 특별 조리법으로 딸기 파스타를 만들었어요. 만든 걸 먹을 수 있어서 요리는 재미있다고 생각해요!"]],
