<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다윤이 화상영어 — 1년 스크립트</title>
<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --ink:#33303a; --soft:#7a7686;
    --pink:#ff7eb3; --pink-d:#e85a98; --blue:#5aa9ff; --mint:#4fd1b5;
    --yellow:#ffd166; --line:#f0e6ee; --shadow:0 6px 18px rgba(232,90,152,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:40px; font-size:17px;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(135deg,var(--pink),var(--pink-d));
    color:#fff; padding:12px 16px 10px; box-shadow:0 4px 14px rgba(232,90,152,.25);
  }
  header h1{margin:0; font-size:17px; font-weight:800; letter-spacing:-.3px;}
  header p{margin:2px 0 0; font-size:12px; opacity:.92;}
  .months{
    display:flex; gap:6px; overflow-x:auto; padding:9px 12px 4px;
    background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .months::-webkit-scrollbar{display:none;}
  .mchip{
    flex:0 0 auto; border:none; cursor:pointer; font-weight:700;
    padding:7px 12px; border-radius:12px; font-size:13.5px;
    background:#f4f0f6; color:#6b6477; white-space:nowrap; transition:.15s;
    line-height:1.25; text-align:center;
  }
  .mchip small{display:block; font-size:10.5px; font-weight:600; opacity:.75;}
  .mchip.active{background:var(--pink-d); color:#fff; box-shadow:var(--shadow);}
  .qlabel{font-size:11px; color:var(--soft); padding:4px 14px 6px; background:#fff; border-bottom:1px solid var(--line);}
  .qlabel b{color:var(--pink-d);}
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:9px 12px;
    background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; border:none; cursor:pointer; font-weight:700;
    padding:8px 13px; border-radius:999px; font-size:14px;
    background:#fbeef5; color:var(--pink-d); white-space:nowrap; transition:.15s;
  }
  .tab.active{background:var(--pink); color:#fff; box-shadow:var(--shadow);}
  main{padding:16px 14px 0; max-width:680px; margin:0 auto;}
  .panel{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .daytitle{font-size:20px; font-weight:800; margin:4px 0 14px; letter-spacing:-.4px;}
  .daytitle .emoji{margin-right:6px;}
  .daytitle .sub{font-size:14px;color:var(--soft);font-weight:600;}

  .seg{
    background:var(--card); border-radius:16px; padding:14px 15px;
    margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .seg h3{margin:0 0 10px; font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .time{margin-left:auto; font-size:12px; font-weight:700; color:#fff; background:var(--blue); padding:2px 9px; border-radius:999px;}
  .seg.warm h3 .time{background:var(--mint);}
  .seg.words h3 .time{background:var(--yellow); color:#7a5a00;}
  .seg.main h3 .time{background:var(--pink);}
  .seg.role h3 .time{background:#a78bfa;}
  .seg.wrap h3 .time{background:#34c77b;}
  .seg.friend{background:#fffdf5; border-color:#ffe9c2;}
  .seg.friend h3 .time{background:#ff9f43;}
  .fx{margin:9px 0;}
  .fx .en{font-weight:800; font-size:15.5px;}
  .fx .ko{color:var(--soft); font-size:13.5px; display:block;}
  .fx .use{color:#c07b1f; font-size:12.5px; font-weight:700;}

  .line{margin:5px 0; padding-left:30px; position:relative;}
  .line .who{
    position:absolute; left:0; top:0; font-weight:800; font-size:13px;
    width:24px; text-align:center; border-radius:6px; padding:1px 0;
  }
  .line.p .who{background:#e7f0ff; color:#2b6fd1;}
  .line.d .who{background:#ffe6f0; color:var(--pink-d);}
  .line .ko{color:var(--soft); font-size:13.5px; display:block; margin-top:1px;}

  .repeat{
    background:#fff4f9; border:1px dashed var(--pink); color:var(--pink-d);
    border-radius:10px; padding:7px 11px; font-size:13.5px; font-weight:700;
    margin:8px 0; text-align:center;
  }
  .sentence{
    background:linear-gradient(135deg,#fff6da,#ffe9c2); border-radius:12px;
    padding:11px 13px; font-weight:800; margin-top:8px; font-size:16px;
  }
  .sentence small{display:block; font-weight:600; color:#8a6d2f; font-size:13px; margin-top:2px;}

  table.words{width:100%; border-collapse:collapse; margin-top:4px;}
  table.words td{padding:7px 8px; border-bottom:1px solid var(--line); font-size:15px;}
  table.words tr:last-child td{border-bottom:none;}
  table.words .en{font-weight:800;}
  table.words .ko{color:var(--soft); font-size:13.5px;}
  table.words .say{color:var(--blue); font-weight:700; font-size:13.5px; text-align:right;}

  .tip{
    background:#f3fff9; border-left:4px solid var(--mint); border-radius:0 12px 12px 0;
    padding:10px 13px; font-size:13.5px; color:#2c5e4e; margin-top:6px;
  }
  .tip b{color:#1f8a6b;}

  .pill{display:inline-block; background:#fbeef5; color:var(--pink-d); font-weight:700;
    border-radius:999px; padding:3px 10px; font-size:12.5px; margin:3px 4px 3px 0;}

  .howto{background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:14px;}
  .howto table{width:100%; border-collapse:collapse;}
  .howto td{padding:9px 6px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top;}
  .howto tr:last-child td{border-bottom:none;}
  .howto .wk{font-weight:800; color:var(--pink-d); white-space:nowrap;}
  .stamp{text-align:center; font-size:15px; font-weight:800; color:#34c77b; margin-top:10px;}

  .fontbtn{position:fixed; right:14px; bottom:16px; z-index:40; display:flex; gap:8px;}
  .fontbtn button{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); font-size:18px; font-weight:800; color:var(--pink-d);
  }
  .note{font-size:12.5px; color:var(--soft); text-align:center; margin:18px 0 0;}
</style>
</head>
<body>

<header>

      +'</div>';

  return h;
}
function renderMonths(){

<script>
/* ============ 추가 기능: 🔊발음듣기 · 🎲랜덤질문 · 📝레벨테스트 · 🎙️녹음 ============ */

/* --- 🔊 발음 듣기 (브라우저 내장 음성, 인터넷 불필요) --- */
function speak(t){
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않아요."); return;}
  t=String(t).replace(/[()]/g," ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
  if(!t)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=0.85; u.pitch=1.05;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.indexOf("en")===0);
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window){speechSynthesis.getVoices();} // 목소리 미리 로드

function spkBtn(t){
  const b=document.createElement("button");
  b.className="spk"; b.textContent="🔊"; b.title="발음 듣기"; b.type="button";
  b.onclick=function(e){e.stopPropagation(); speak(t);};
  return b;
}
function addSpeakers(){
  document.querySelectorAll("#main .line").forEach(function(el){
    if(el.querySelector(".spk"))return;
    let t="";
    el.childNodes.forEach(function(n){if(n.nodeType===3)t+=n.textContent;});
    t=t.trim();
    if(!t||!/[a-zA-Z]/.test(t))return;
    const ko=el.querySelector(".ko"), b=spkBtn(t);
    if(ko)el.insertBefore(b,ko); else el.appendChild(b);
  });
  document.querySelectorAll("#main table.words tr").forEach(function(tr){
    const en=tr.querySelector(".en"), say=tr.querySelector(".say");
    if(!en||!say||say.querySelector(".spk"))return;
    if(!/[a-zA-Z]/.test(en.textContent))return;
    say.appendChild(spkBtn(en.textContent));
  });
  document.querySelectorAll("#main .sentence").forEach(function(el){
    if(el.querySelector(".spk"))return;
    let t="";
    el.childNodes.forEach(function(n){if(n.nodeType===3)t+=n.textContent;});
    t=t.replace(/[“”"]/g,"").trim();
    if(!t||!/[a-zA-Z]/.test(t))return;
    el.appendChild(spkBtn(t));
  });
  // 🌏 외국 친구 표현에도 발음 버튼
  document.querySelectorAll("#main .fx").forEach(function(el){
    if(el.querySelector(".spk"))return;
    const en=el.querySelector(".en");
    if(!en||!/[a-zA-Z]/.test(en.textContent))return;
    en.appendChild(spkBtn(en.textContent));
  });
}

/* --- 📝 레벨테스트 예상 질문 & 다윤이 답 --- */
const LEVELTEST=[
 {t:"① 인사 · 워밍업", lines:[

   ["P","Can you spell your name?","이름 철자를 말해줄래요?"],["D","D-A-Y-O-O-N, Dayoon.","디-에이-와이-오-오-엔, 다윤."]]},
 {t:"② 가족 · 학교", lines:[
   ["P","Tell me about your family.","가족 소개해 줄래요?"],["D","There are four people in my family. My mom, my dad, my little brother Siheon, and me.","엄마, 아빠, 동생 시헌이, 저 — 네 명이에요."],
   ["P","What grade are you in?","몇 학년이에요?"],["D","I'm in fourth grade.","4학년이에요."],

   ["P","Who is your best friend?","단짝은 누구예요?"],["D","My best friend is Minseo. We play together at school.","민서요. 학교에서 같이 놀아요."]]},
 {t:"③ 일상 · 취미 (가장 많이 나와요!)", lines:[
   ["P","What do you do after school?","방과 후엔 뭐 해요?"],["D","After school, I do my homework and play with my friends.","숙제하고 친구들이랑 놀아요."],

 {t:"④ 그림 보고 말하기", lines:[

   ["P","What is the boy doing?","남자아이가 뭐 하고 있어요?"],["D","He is playing soccer.","축구하고 있어요."],
   ["P","What color is it?","무슨 색이에요?"],["D","It's blue and white.","파란색과 흰색이에요."]]},
 {t:"⑤ 의견 · 자유 말하기 (레벨 높을 때)", lines:[
   ["P","What do you want to be in the future?","커서 뭐가 되고 싶어요?"],["D","I want to be an architect because I like drawing buildings.","건축가요, 건물 그리는 걸 좋아해서요."],
   ["P","Do you like summer or winter? Why?","여름과 겨울 중 뭐가 좋아요?"],["D","I like summer because I can swim.","여름이요, 수영할 수 있으니까요."],
   ["P","What's your dream?","꿈이 뭐예요?"],["D","My dream is to go to New Zealand and Australia.","뉴질랜드와 호주에 가보는 거예요."]]}
];
function testHTML(){
  let h="";

  h+='<div class="tip">💡 <b>팁 3:</b> 그림 문제는 <b>"I can see…"</b> + <b>"He/She is …ing"</b> 두 틀이면 대부분 해결!</div>';
  h+='<div class="seg role"><h3>🆘 막혔을 때 비상 표현</h3>'
    +SOS.map(function(s){return '<div style="margin:8px 0"><b style="color:var(--pink-d)">'+s[0]+'</b><br><span style="font-weight:800">'+s[1]+'</span><br><span style="color:var(--soft);font-size:13.5px">'+s[2]+'</span></div>';}).join("")+'</div>';

function addTestChip(active){
  const b=document.createElement("button");
  b.className="mchip"+(active?" active":"");

  b.onclick=function(){cur={m:-2,d:0}; render();};

/* --- render 확장: 레벨테스트 탭 + 발음 버튼 자동 부착 --- */
const _renderBase=render;
render=function(){
  if(cur.m===-2){
    renderMonths();
    addTestChip(true);
    tabsEl.style.display="none";
    qEl.innerHTML="<b>📝 레벨테스트</b> · 예상 질문 & 다윤이 답 — 테스트 직전엔 이 탭만 봐도 OK";
    mainEl.innerHTML='<div class="panel">'+testHTML()+'</div>';
    addSpeakers();
    window.scrollTo({top:0});
    return;

  _renderBase();
  addTestChip(false);
  addSpeakers();
};

/* --- 🎲 랜덤 질문 모드 (지금까지 배운 달의 인터뷰 질문에서 출제) --- */
function rndPool(){
  let list=[];
  const collect=function(mo){const iv=mo.days.find(function(d){return d.interview;}); if(iv&&iv.pool)list=list.concat(iv.pool);};
  if(cur.m===-2){MONTHS.forEach(collect);}
  else{const upto=Math.max(0,cur.m); for(let i=0;i<=upto&&i<MONTHS.length;i++)collect(MONTHS[i]);}
  return list.length?list:["How are you today?"];
}
let lastQ="";
function nextRandomQ(spk){
  const qs=rndPool();
  let q=qs[Math.floor(Math.random()*qs.length)], n=0;
  while(qs.length>1&&q===lastQ&&n++<5){q=qs[Math.floor(Math.random()*qs.length)];}
  lastQ=q;
  document.getElementById("rndq").textContent=q;
  if(spk!==false)speak(q);
}
function openRandom(){document.getElementById("rndov").style.display="flex"; nextRandomQ();}
function closeRandom(){document.getElementById("rndov").style.display="none"; if("speechSynthesis" in window)speechSynthesis.cancel();}

/* --- 🎙️ 녹음해서 들어보기 --- */
let mediaRec=null, recChunks=[], recURL=null;
function toggleRec(){
  const btn=document.getElementById("recbtn");
  if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop(); return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert("이 환경에선 마이크를 쓸 수 없어요 😢\n(카톡으로 받은 파일로 열면 녹음이 안 될 수 있어요 — 웹 주소로 올리면 돼요!)");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRec=new MediaRecorder(stream);
    recChunks=[];
    mediaRec.ondataavailable=function(e){recChunks.push(e.data);};
    mediaRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      if(recURL)URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(recChunks,{type:mediaRec.mimeType||"audio/mp4"}));
      const bar=document.getElementById("recbar");
      bar.style.display="flex";
      bar.querySelector("audio").src=recURL;
      btn.classList.remove("rec-on"); btn.textContent="🎙️";
    };
    mediaRec.start();
    btn.classList.add("rec-on"); btn.textContent="⏹";
  }).catch(function(){
    alert("마이크를 사용할 수 없어요 😢\n(카톡으로 받은 파일로 열면 녹음이 안 될 수 있어요 — 웹 주소로 올리면 돼요!)");
  });
}
function closeRecbar(){
  document.getElementById("recbar").style.display="none";
  if(recURL){URL.revokeObjectURL(recURL); recURL=null;}
}

/* --- UI 주입: 플로팅 버튼 + 오버레이 + 녹음 바 --- */
document.body.insertAdjacentHTML("beforeend",
  '<div id="rndov" onclick="if(event.target===this)closeRandom()">'
  +'<div class="card"><div class="rtitle">🎲 랜덤 질문</div>'
  +'<div class="rsub">지금까지 배운 달의 인터뷰 질문에서 나와요 — 대본 없이 대답해보기!</div>'
  +'<div class="q" id="rndq"></div>'
  +'<div class="btns">'
  +'<button class="b1" onclick="speak(document.getElementById(\'rndq\').textContent)">🔊 다시 듣기</button>'
  +'<button class="b2" onclick="nextRandomQ()">다음 질문 →</button>'
  +'<button class="b3" onclick="closeRandom()">닫기</button>'
  +'</div></div></div>'
  +'<div id="recbar"><span class="rlabel">🎧 내 발음</span><audio controls></audio>'
  +'<button class="rclose" onclick="closeRecbar()">✕</button></div>');

(function(){
  const fb=document.querySelector(".fontbtn");
  const rnd=document.createElement("button");
  rnd.className="toolbtn"; rnd.textContent="🎲"; rnd.title="랜덤 질문"; rnd.type="button"; rnd.onclick=openRandom;
  const rec=document.createElement("button");
  rec.className="toolbtn"; rec.id="recbtn"; rec.textContent="🎙️"; rec.title="녹음해서 들어보기"; rec.type="button"; rec.onclick=toggleRec;
  fb.insertBefore(rec,fb.firstChild);
  fb.insertBefore(rnd,fb.firstChild);
})();

/* 새 기능 반영해서 다시 그리기 */
render();
</script>

  @media(prefers-reduced-motion:no-preference){

<script>
/* ============ 🏠 홈: 도장 캘린더 (연습한 날 탭 → 도장, 연속일수·이번달·전체 집계) ============ */

/* --- 저장: 도장 찍은 날짜들 (localStorage) --- */
function stampSet(){ try{return new Set(JSON.parse(localStorage.getItem('dayoon_stamps')||'[]'));}catch(e){return new Set();} }
function saveStamps(s){ try{localStorage.setItem('dayoon_stamps',JSON.stringify(Array.from(s)));}catch(e){} }
function dkey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

let calView=(function(){var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1};})();
let justStamped=null;

/* --- 공통 저장 유틸 --- */
function lsGet(k,fb){ try{const v=JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?fb:v;}catch(e){return fb;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

/* --- 🍞 토스트 알림 --- */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); if(!t)return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2200);
}

/* --- 🪙 코인: 도장 1개 = 10 · 도장 7개마다 +50 🎁 · 28개마다 +200 🏆 --- */
function getCoins(){ return lsGet('dayoon_coins',0); }
function setCoins(n){ lsSet('dayoon_coins',Math.max(0,n)); }
function coinOnAdd(){
  let gain=10; const tot=stampSet().size;
  const paid=lsGet('dayoon_bonuspaid',{w:0,mo:0});
  let msg='도장 쾅! +10 🪙';
  if(tot>0&&tot%7===0&&tot>paid.w){gain+=50; paid.w=tot; msg='도장 '+tot+'개 — 한 주 완성 보너스 +50 🎁';}
  if(tot>0&&tot%28===0&&tot>paid.mo){gain+=200; paid.mo=tot; msg='도장 '+tot+'개 — 한 달 완성 보너스 +200 🏆';}
  lsSet('dayoon_bonuspaid',paid);
  setCoins(getCoins()+gain);
  showToast(msg);
}
function coinOnRemove(){ setCoins(getCoins()-10); }

/* --- 📌 진도: m=개월차(0~11) · w=주차(0~3, 같은 7일 반복) · d=Day(0~6) --- */
function getProg(){ const p=lsGet('dayoon_prog',null); return (p&&typeof p.m==='number')?p:{m:0,w:0,d:0}; }
function saveProg(p){ lsSet('dayoon_prog',p); }
function shiftProg(dir){
  const p=getProg(); p.d+=dir;
  if(p.d>6){p.d=0;p.w++;} if(p.w>3){p.w=0;p.m++;}
  if(p.d<0){p.d=6;p.w--;} if(p.w<0){p.w=3;p.m--;}
  if(p.m>11){p.m=11;p.w=3;p.d=6;} if(p.m<0){p.m=0;p.w=0;p.d=0;}
  saveProg(p);
}
function progPct(){ const p=getProg(); return Math.min(100,Math.round((p.m*28+p.w*7+p.d)/336*100)); }
function goToday(){ const p=getProg(); cur={m:p.m,d:p.d}; render(); }
function progShift(dir){ shiftProg(dir); render(); }

/* --- 🎨 아바타 & 꾸미기 상점 --- */
const ITEMS=[
  {id:'pet_dog',    slot:'pet', e:'🐶', n:'강아지',  p:0},
  {id:'pet_cat',    slot:'pet', e:'🐱', n:'고양이',  p:120},
  {id:'pet_rabbit', slot:'pet', e:'🐰', n:'토끼',    p:150},
  {id:'pet_fox',    slot:'pet', e:'🦊', n:'여우',    p:180},
  {id:'pet_panda',  slot:'pet', e:'🐼', n:'판다',    p:250},
  {id:'pet_unicorn',slot:'pet', e:'🦄', n:'유니콘',  p:500},
  {id:'hat_ribbon', slot:'hat', e:'🎀', n:'리본',    p:60},
  {id:'hat_flower', slot:'hat', e:'🌸', n:'꽃',      p:70},
  {id:'hat_cap',    slot:'hat', e:'🧢', n:'모자',    p:80},
  {id:'hat_star',   slot:'hat', e:'⭐', n:'별',      p:90},
  {id:'hat_crown',  slot:'hat', e:'👑', n:'왕관',    p:200},
  {id:'hand_balloon',slot:'hand',e:'🎈', n:'풍선',   p:50},
  {id:'hand_candy', slot:'hand', e:'🍭', n:'사탕',   p:60},
  {id:'hand_pencil',slot:'hand', e:'✏️', n:'연필',   p:80},
  {id:'hand_art',   slot:'hand', e:'🎨', n:'물감',   p:100},
  {id:'hand_skate', slot:'hand', e:'⛸️', n:'스케이트',p:150}
];
function getAva(){ const a=lsGet('dayoon_avatar',null); return (a&&a.eq)?a:{owned:['pet_dog'],eq:{pet:'pet_dog',hat:null,hand:null}}; }
function saveAva(a){ lsSet('dayoon_avatar',a); }
function itemById(id){ return ITEMS.find(function(i){return i.id===id;}); }
function avatarHTML(){
  const a=getAva(), pet=itemById(a.eq.pet)||ITEMS[0];
  let h='<span class="pet">'+pet.e+'</span>';
  if(a.eq.hat&&itemById(a.eq.hat))h+='<span class="acc hat">'+itemById(a.eq.hat).e+'</span>';
  if(a.eq.hand&&itemById(a.eq.hand))h+='<span class="acc hand">'+itemById(a.eq.hand).e+'</span>';
  return h;
}
function tapItem(id){
  const a=getAva(), it=itemById(id); if(!it)return;
  if(a.owned.indexOf(id)>-1){
    if(it.slot==='pet'){ a.eq.pet=id; showToast(it.e+' '+it.n+' 착용!'); }
    else if(a.eq[it.slot]===id){ a.eq[it.slot]=null; showToast(it.n+' 벗었어요'); }
    else { a.eq[it.slot]=id; showToast(it.e+' '+it.n+' 착용!'); }
    saveAva(a); render(); return;
  }
  const c=getCoins();
  if(c<it.p){ showToast('코인이 부족해요! 도장 '+Math.ceil((it.p-c)/10)+'개 더 모으면 살 수 있어요 💪'); return; }
  setCoins(c-it.p); a.owned.push(id); a.eq[it.slot]=id; saveAva(a);
  showToast(it.e+' '+it.n+' 샀어요! −'+it.p+' 🪙'); render();
}
function shopHTML(){
  const a=getAva(), c=getCoins();
  const slotName={pet:'동물 친구',hat:'머리 꾸미기',hand:'손에 드는 것'};
  let h='<div class="shop"><div class="shop-head"><h3>🎨 꾸미기 상점</h3><span class="coinchip">🪙 '+c+'</span></div>';
  ['pet','hat','hand'].forEach(function(sl){
    h+='<div class="shop-slot">'+slotName[sl]+'</div><div class="shop-grid">';
    ITEMS.filter(function(i){return i.slot===sl;}).forEach(function(it){
      const owned=a.owned.indexOf(it.id)>-1, eq=a.eq[sl]===it.id;
      h+='<button type="button" class="item'+(eq?' eq':'')+(owned?' own':'')+'" onclick="tapItem(\''+it.id+'\')">'
        +'<span class="ie">'+it.e+'</span><span class="in">'+it.n+'</span>'
        +'<span class="ip">'+(eq?'착용중':(owned?'착용하기':'🪙'+it.p))+'</span></button>';
    });
    h+='</div>';
  });
  h+='<p class="home-note" style="margin:10px 0 0">도장 1개 = 🪙10 · 도장 7개마다 +50 🎁 · 28개마다 +200 🏆</p></div>';
  return h;
}

function currentStreak(){
  const s=stampSet(); if(!s.size)return 0;
  const d=new Date(); d.setHours(0,0,0,0);
  if(!s.has(dkey(d))) d.setDate(d.getDate()-1); // 오늘 아직 안 찍었으면 어제부터 세기
  let n=0;
  while(s.has(dkey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function monthCount(y,m){ let c=0; stampSet().forEach(function(k){var p=k.split('-'); if(+p[0]===y&&+p[1]===m)c++;}); return c; }

function homeHTML(y,m){
  const today=new Date(); today.setHours(0,0,0,0);
  const s=stampSet(), todayKey=dkey(today), todayStamped=s.has(todayKey);
  const startDow=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  const canGoNext=(y*12+m) < (today.getFullYear()*12+(today.getMonth()+1));
  const p=getProg(), pd=MONTHS[p.m].days[p.d];
  let h='';
  h+='<div class="home-hero"><div class="ava">'+avatarHTML()+'</div><div class="stats">'
    +'<div class="stat"><b>🔥'+currentStreak()+'</b><span>연속</span></div>'
    +'<div class="stat"><b>'+monthCount(y,m)+'</b><span>이번 달</span></div>'
    +'<div class="stat"><b>'+s.size+'</b><span>전체 도장</span></div>'
    +'<div class="stat"><b>🪙'+getCoins()+'</b><span>코인</span></div></div></div>';
  h+='<div class="today-card"><div class="tc-top"><span class="tc-label">📌 오늘의 연습</span>'
    +'<span class="tc-adj"><button type="button" class="navb sm" aria-label="진도 하나 뒤로" onclick="progShift(-1)">‹</button>'
    +'<button type="button" class="navb sm" aria-label="진도 하나 앞으로" onclick="progShift(1)">›</button></span></div>'
    +'<div class="tc-main">'+(p.m+1)+'개월차 · '+(p.w+1)+'주차 · '+pd.emoji+' '+pd.title+'</div>'
    +'<div class="tc-sub">'+pd.sub+' · 이번 주 방법: '+ROTATION[p.w][1]+'</div>'
    +'<div class="tc-gauge"><div style="width:'+progPct()+'%"></div></div>'
    +'<div class="tc-pct">1년 전체 진도 '+progPct()+'% <span>(한 달 = 같은 7일 × 4주)</span></div>'
    +'<button type="button" class="tc-go" onclick="goToday()">오늘 스크립트 열기 →</button></div>';
  h+='<button class="bigstamp'+(todayStamped?' done':'')+'" type="button" onclick="stampToday()">'
    +(todayStamped?'오늘 도장 완료! 🎉<small>잘했어요 · 다시 누르면 취소</small>':'오늘 연습 끝! 도장 쾅 🟢<small>도장 1개 = 🪙10 + 진도 한 칸</small>')+'</button>';
  h+='<div class="cal"><div class="cal-head">'
    +'<button class="navb" type="button" aria-label="이전 달" onclick="calShift(-1)">‹</button>'
    +'<div class="cal-title">'+y+'년 '+m+'월</div>'
    +'<button class="navb" type="button" aria-label="다음 달" onclick="calShift(1)"'+(canGoNext?'':' disabled')+'>›</button></div>';
  h+='<div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(w,i){h+='<div class="dow'+(i===0?' sun':'')+'">'+w+'</div>';});
  for(let i=0;i<startDow;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const cd=new Date(y,m-1,d); cd.setHours(0,0,0,0);
    const key=dkey(cd), stamped=s.has(key), isToday=key===todayKey, future=cd>today;
    const cls='cell'+(stamped?' stamped':'')+(isToday?' today':'')+(future?' future':'')+(justStamped===key?' pop':'');
    const attr=future?'':' tabindex="0" role="button" onclick="toggleStamp(\''+key+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleStamp(\''+key+'\');}"';
    h+='<div class="'+cls+'"'+attr+'><span class="dn">'+d+'</span></div>';
  }
  h+='</div></div>';
  h+='<p class="home-note">날짜를 톡 누르면 도장을 찍거나 지울 수 있어요.<br>미래 날짜는 아직 찍을 수 없어요. 매일 연습하고 🔥 연속 일수를 늘려봐요!</p>';
  h+=shopHTML();
  justStamped=null;
  return h;
}
function stampToday(){
  const d=new Date(); const k=dkey(d); const s=stampSet();
  if(s.has(k)){ s.delete(k); saveStamps(s); coinOnRemove(); shiftProg(-1); }
  else { s.add(k); justStamped=k; saveStamps(s); coinOnAdd(); shiftProg(1); }
  calView={y:d.getFullYear(), m:d.getMonth()+1}; // 오늘이 보이는 달로
  render();
}
function toggleStamp(key){
  const s=stampSet();
  const isToday = key===dkey(new Date());
  if(s.has(key)){ s.delete(key); saveStamps(s); coinOnRemove(); if(isToday)shiftProg(-1); }
  else { s.add(key); justStamped=key; saveStamps(s); coinOnAdd(); if(isToday)shiftProg(1); }
  render();
}
function calShift(dir){
  let mm=calView.m+dir, yy=calView.y;
  if(mm<1){mm=12;yy--;} if(mm>12){mm=1;yy++;}
  const now=new Date();
  if(yy*12+mm > now.getFullYear()*12+(now.getMonth()+1))return; // 미래 달 금지
  calView={y:yy,m:mm}; render();
}
function addHomeChip(active){
  const b=document.createElement('button');
  b.className='mchip'+(active?' active':'');
  b.innerHTML='🏠<small>홈</small>';
  b.onclick=function(){var d=new Date(); calView={y:d.getFullYear(),m:d.getMonth()+1}; cur={m:-3,d:0}; render();};
  monthsEl.insertBefore(b, monthsEl.firstChild);
}

/* --- render 확장: 홈(m===-3) 처리 + 모든 화면에 홈 칩 --- */
/* 시작 위치는 전용 키(v3)에 저장 — 기존 v2는 앞선 render가 먼저 덮어써서 "처음이면 홈"이 안 먹음 */
function persistPos(){ try{localStorage.setItem('dayoon_pos_v3',JSON.stringify(cur));}catch(e){} }
const _renderWithTest=render;
render=function(){
  if(cur.m===-3){
    renderMonths(); addTestChip(false); addHomeChip(true);
    tabsEl.style.display='none';
    qEl.innerHTML='<b>🏠 홈</b> · 연습한 날은 달력에 도장을 찍어요';
    mainEl.innerHTML='<div class="panel">'+homeHTML(calView.y, calView.m)+'</div>';
    persistPos();
    window.scrollTo({top:0});
    return;
  }
  _renderWithTest();
  addHomeChip(false);
  persistPos();
};

/* --- 시작 위치: v3 복원(홈/레벨테스트 포함), 저장된 게 없으면(첫 방문) 홈 --- */
(function(){
  let c={m:-3,d:0};
