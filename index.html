ip":"인형을 진짜 환자처럼 안고 진찰하게 해 주세요. 소품이 있으면 영어가 두 배로 나옵니다."},{"emoji":"🎤","title":"Day 6 · Dayoon the Interviewer","sub":"거꾸로 인터뷰 (다윤이가 질문!)","words":[["ask","묻다","애스크"],["guest","손님, 게스트","게스트"],["curious","궁금한","큐리어스"]],"sentence":["May I ask you some questions about your job?","당신의 직업에 대해 몇 가지 질문해도 될까요?"],"main":[["P","Dayoon, today YOU are the interviewer. I'm your guest!","다윤아, 오늘은 네가 인터뷰어야. 나는 게스트고!"],["D","Great! May I ask you some questions about your job?","좋아요! 당신의 직업에 대해 몇 가지 질문해도 될까요?"],["P","Of course! Go ahead.","물론이죠! 어서 하세요."],["D","What do you do every day at work?","일할 때 매일 무엇을 하나요?"],["P","I talk with people and solve problems all day.","하루 종일 사람들과 이야기하고 문제를 해결해요."],["D","Interesting! What is the best part of your job?","흥미롭네요! 당신 일의 가장 좋은 점은 뭔가요?"],["P","The best part is helping people. It makes me happy.","가장 좋은 점은 사람들을 돕는 거예요. 그게 절 행복하게 해요."],["D","What was your dream job when you were ten?","열 살 때 꿈꾸던 직업은 뭐였나요?"],["P","I wanted to be an astronaut and fly to space!","우주비행사가 되어서 우주로 날아가고 싶었어요!"],["D","Wow! Last question: is your job better than eating pasta?","우와! 마지막 질문: 당신의 일이 파스타 먹기보다 좋나요?"],["P","Ha! That's a hard one. Nothing beats pasta!","하하! 어려운 질문이네요. 파스타를 이기는 건 없죠!"],["D","Correct answer! This interview is over. Great job, guest!","정답입니다! 인터뷰 끝. 게스트님, 수고하셨어요!"]],"role":[["P","Ask me about my day at work!","내 직장 하루에 대해 질문해 봐!"],["D","What do you do every day at work?","일할 때 매일 무엇을 하나요?"],["P","Ask me what I like about it!","내가 뭘 좋아하는지 물어봐!"],["D","What is the best part of your job?","당신 일의 가장 좋은 점은 뭔가요?"],["P","Ask me about my old dream!","내 어릴 적 꿈을 물어봐!"],["D","What was your dream job when you were ten?","열 살 때 꿈꾸던 직업은 뭐였나요?"],["P","How do you start an interview politely?","인터뷰는 어떻게 예의 있게 시작하지?"],["D","May I ask you some questions?","몇 가지 질문해도 될까요?"]],"wrap":[["P","You were the interviewer today! What did you learn about me?","오늘 네가 인터뷰어였잖아! 나에 대해 뭘 알게 됐어?"],["D","I asked about your job. You solve problems all day, and your old dream was an astronaut!","당신의 직업에 대해 질문했어요. 하루 종일 문제를 해결하고, 어릴 적 꿈은 우주비행사였어요!"]],"tip":"아이가 질문을 만드는 날이 진짜 실력이 크는 날이에요. 대답은 짧게, 아이의 질문 기회는 많이 주세요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"1주차 총정리","interview":true,"pool":["What does a firefighter do?","Which job do you think is brave, and why?","Does an architect wear a uniform?","What is your strength?","Why do you want to be a designer?","What do you think about cooking, and why?","Why do you want to help animals?","What question can you ask about my job?","Which job looks the hardest, and why?","If you could try one job for a day, what would it be?"],"tip":"대답마다 'I think ~ because ~'가 나오는지 체크하고, 나올 때마다 크게 감탄해 주세요."}]},{"sub":"건축가와 디자이너","days":[{"emoji":"👷","title":"Day 1 · What Architects Do","sub":"건축가는 무슨 일을 할까","words":[["architect","건축가","아키텍트"],["design","설계하다","디자인"],["building","건물","빌딩"]],"sentence":["An architect designs buildings for people.","건축가는 사람들을 위해 건물을 설계해요."],"main":[["P","Dayoon, one of your dream jobs is an architect, right?","다윤아, 네 꿈 중 하나가 건축가지?"],["D","Yes! An architect designs buildings for people.","네! 건축가는 사람들을 위해 건물을 설계해요."],["P","What do architects use for their work?","건축가는 일할 때 뭘 사용해?"],["D","They use pencils, rulers, and computers to draw plans.","연필, 자, 컴퓨터로 도면을 그려요."],["P","Why do you want to be an architect?","왜 건축가가 되고 싶어?"],["D","Because I love drawing, and buildings are like big art!","그림 그리기를 사랑하고, 건물은 커다란 예술 같으니까요!"],["P","What building do you want to design someday?","언젠가 어떤 건물을 설계하고 싶어?"],["D","I want to design a museum for kids.","어린이를 위한 미술관을 설계하고 싶어요."],["P","What would be special about it?","어떤 점이 특별할까?"],["D","Kids could draw on the walls — and no one gets in trouble!","아이들이 벽에 그림을 그려도 돼요 — 아무도 혼나지 않아요!"],["P","I want to go there! Can grown-ups draw on the walls, too?","나도 가고 싶다! 어른들도 벽에 그려도 돼?"],["D","Only if they follow the kids' rules!","아이들의 규칙을 지킬 때만요!"]],"role":[["P","What does an architect do?","건축가는 무슨 일을 해?"],["D","An architect designs buildings for people.","건축가는 사람들을 위해 건물을 설계해요."],["P","What do architects use?","건축가는 뭘 사용해?"],["D","They use pencils, rulers, and computers.","연필, 자, 컴퓨터를 사용해요."],["P","Why do you want to be an architect?","왜 건축가가 되고 싶어?"],["D","Because I love drawing, and buildings are like big art.","그림을 사랑하고, 건물은 커다란 예술 같아서요."],["P","What do you want to design someday?","언젠가 뭘 설계하고 싶어?"],["D","I want to design a museum for kids.","어린이를 위한 미술관을 설계하고 싶어요."]],"wrap":[["P","Tell me about your architect dream!","네 건축가 꿈에 대해 말해줘!"],["D","An architect designs buildings. I want to be one because buildings are like big art. Someday I will design a kids' museum!","건축가는 건물을 설계해요. 건물은 커다란 예술 같아서 저도 되고 싶어요. 언젠가 어린이 미술관을 설계할 거예요!"]],"tip":"아이의 진짜 꿈을 다루는 주간이에요. 대사 밖 질문이 튀어나오면 대본을 멈추고 자유 대화로 이어 주세요."},{"emoji":"🏠","title":"Day 2 · The Architect's Office","sub":"건축가 사무실 놀이","words":[["plan","도면","플랜"],["client","고객","클라이언트"],["floor","층","플로어"]],"sentence":["Let me show you my house plan.","제 집 도면을 보여 드릴게요."],"main":[["P","Knock knock! Hello, I need a new house. Are you the architect?","똑똑! 안녕하세요, 새 집이 필요해요. 당신이 건축가인가요?"],["D","Yes! Welcome to Dayoon's Architect Office. Please sit down.","네! 다윤 건축 사무소에 오신 걸 환영합니다. 앉으세요."],["P","I want a special house. What can you show me?","특별한 집을 원해요. 뭘 보여줄 수 있나요?"],["D","Let me show you my house plan. Look here!","제 집 도면을 보여 드릴게요. 여기 보세요!"],["P","Ooh! How many floors does it have?","오! 몇 층짜리인가요?"],["D","It has two floors and a rooftop garden.","2층이고 옥상 정원이 있어요."],["P","What is on the first floor?","1층에는 뭐가 있나요?"],["D","A big kitchen for pasta parties!","파스타 파티를 위한 큰 주방이요!"],["P","Perfect! Is there a place for my dog?","완벽해요! 우리 개를 위한 곳도 있나요?"],["D","Yes! A small dog house with a sky blue roof.","네! 하늘색 지붕의 작은 개집이 있어요."],["P","I love it! How much does it cost?","마음에 들어요! 얼마인가요?"],["D","For you... three hugs and one strawberry cake!","고객님께는... 포옹 세 번과 딸기 케이크 한 개입니다!"]],"role":[["P","Architect, what can you show me?","건축가님, 뭘 보여줄 수 있나요?"],["D","Let me show you my house plan.","제 집 도면을 보여 드릴게요."],["P","How many floors does the house have?","그 집은 몇 층인가요?"],["D","It has two floors and a rooftop garden.","2층이고 옥상 정원이 있어요."],["P","What is on the first floor?","1층에는 뭐가 있나요?"],["D","There is a big kitchen for pasta parties.","파스타 파티를 위한 큰 주방이 있어요."],["P","Is there a place for pets?","반려동물을 위한 곳도 있나요?"],["D","Yes, a small dog house with a sky blue roof.","네, 하늘색 지붕의 작은 개집이 있어요."]],"wrap":[["P","Architect Dayoon, describe the house you designed today!","다윤 건축가님, 오늘 설계한 집을 설명해 주세요!"],["D","My house plan has two floors and a rooftop garden. The first floor has a big kitchen, and there is a dog house too!","제 도면의 집은 2층이고 옥상 정원이 있어요. 1층에는 큰 주방이 있고, 개집도 있어요!"]],"tip":"종이에 실제로 도면을 그리며 설명하게 하세요. 'Let me show you ~'는 발표의 마법 문장입니다."},{"emoji":"🚗","title":"Day 3 · Car Designer Dreams","sub":"자동차 디자이너의 꿈","words":[["wheel","바퀴","휠"],["shape","모양","셰이프"],["dolphin","돌고래","돌핀"]],"sentence":["I want to design a sky blue car for families.","가족을 위한 하늘색 자동차를 디자인하고 싶어요."],"main":[["P","Dayoon, your other dream job is a car designer! What does a car designer do?","다윤아, 네 또 다른 꿈은 자동차 디자이너잖아! 자동차 디자이너는 무슨 일을 해?"],["D","A car designer draws and plans new cars.","자동차 디자이너는 새 자동차를 그리고 계획해요."],["P","What kind of car do you want to design?","어떤 자동차를 디자인하고 싶어?"],["D","I want to design a sky blue car for families.","가족을 위한 하늘색 자동차를 디자인하고 싶어요."],["P","What shape will it be?","어떤 모양일까?"],["D","A round, smooth shape — like a dolphin!","둥글고 매끈한 모양이요 — 돌고래처럼요!"],["P","A dolphin car! What is special inside?","돌고래 자동차라니! 안에는 뭐가 특별해?"],["D","There is a small fridge for strawberries and snacks.","딸기랑 간식을 넣을 작은 냉장고가 있어요."],["P","What about the future? Will your car fly?","미래에는 어떨까? 네 차는 날 수 있을까?"],["D","Maybe! Future cars can drive on roads and fly over rivers!","아마도요! 미래 자동차는 도로를 달리고 강 위를 날 수 있어요!"],["P","Can my old car do that?","내 낡은 차도 그게 될까?"],["D","Ha! Your car needs a nap, not wings!","하하! 아빠(엄마) 차는 날개가 아니라 낮잠이 필요해요!"]],"role":[["P","What does a car designer do?","자동차 디자이너는 무슨 일 ing.","스케이트가 더 힘들지만 계속 연습해요."]],"wrap":[["P","Tell me about your practice habits!","네 연습 습관에 대해 말해줘!"],["D","I practice drawing every day, so I get better. I also keep practicing my spins. Practice makes perfect!","매일 그림을 연습해서 점점 잘하게 돼요. 회전도 계속 연습해요. 연습이 완벽을 만들어요!"]],"tip":"'Practice makes perfect'를 가족 구호로 정하고, 연습 전에 함께 외치는 의식을 만들어 보세요."},{"emoji":"🦸","title":"Day 3 · My Role Model","sub":"존경하는 사람 이야기","words":[["role model","롤 모델","롤 모델"],["respect","존경하다","리스펙트"],["work hard","열심히 일하다","워크 하드"]],"sentence":["I respect people who never give up.","절대 포기하지 않는 사람들을 존경해요."],"main":[["P","Dayoon, do you have a role model? Someone you look up to?","다윤아, 롤 모델이 있어? 우러러보는 사람?"],["D","Yes! I respect people who never give up.","네! 저는 절대 포기하지 않는 사람들을 존경해요."],["P","Who is a person like that for you?","너에게 그런 사람은 누구야?"],["D","My skating teacher. She practiced for many, many years.","제 스케이트 선생님이요. 아주 오랫동안 연습하셨대요."],["P","What did you learn from her?","선생님에게서 뭘 배웠어?"],["D","Falling is okay. Getting up is the important part.","넘어져도 괜찮아요. 다시 일어나는 게 중요한 거예요."],["P","Anyone else you respect?","또 존경하는 사람 있어?"],["D","My mom and dad. They work hard every day for us.","엄마 아빠요. 우리를 위해 매일 열심히 일하시잖아요."],["P","Aww. What kind of grown-up do you want to be?","고마워라. 너는 어떤 어른이 되고 싶어?"],["D","A kind grown-up who helps kids draw their dreams.","아이들이 꿈을 그리도록 도와주는 친절한 어른이요."],["P","Can I be your role model, too?","나도 네 롤 모델이 될 수 있을까?"],["D","Hmm... first, show me your drawing skills!","음... 먼저 그림 실력을 보여 주세요!"]],"role":[["P","What kind of people do you respect?","어떤 사람들을 존경해?"],["D","I respect people who never give up.","절대 포기하지 않는 사람들을 존경해요."],["P","Who is your role model?","네 롤 모델은 누구야?"],["D","My skating teacher is my role model.","제 스케이트 선생님이 롤 모델이에요."],["P","What did you learn from her?","선생님에게서 뭘 배웠어?"],["D","Falling is okay, and getting up is the important part.","넘어져도 괜찮고, 다시 일어나는 게 중요해요."],["P","What kind of grown-up do you want to be?","어떤 어른이 되고 싶어?"],["D","A kind grown-up who helps kids draw their dreams.","아이들이 꿈을 그리게 도와주는 친절한 어른이요."]],"wrap":[["P","Tell me about your role models!","네 롤 모델에 대해 말해줘!"],["D","I respect people who never give up, like my skating teacher. My parents work hard too. I want to be a kind grown-up!","스케이트 선생님처럼 포기하지 않는 사람들을 존경해요. 부모님도 열심히 일하세요. 저는 친절한 어른이 되고 싶어요!"]],"tip":"'people who ~' 관계대명사가 처음 나와요. 어렵다면 통문장으로 노래하듯 외우게 해 주세요."},{"emoji":"🧗","title":"Day 4 · Don't Give Up!","sub":"힘들어도 포기하지 않기","words":[["give up","포기하다","기브 업"],["difficult","어려운","디피컬트"],["try again","다시 시도하다","트라이 어게인"]],"sentence":["Even when it's difficult, I don't give up.","어려울 때도 나는 포기하지 않아요."],"main":[["P","Dayoon, is chasing a dream always fun?","다윤아, 꿈을 좇는 건 항상 재미있을까?"],["D","No... sometimes it's difficult.","아니요... 가끔은 어려워요."],["P","What was difficult for you recently?","최근에 뭐가 어려웠어?"],["D","Drawing hands! Hands are so hard to draw!","손 그리기요! 손은 정말 그리기 어려워요!"],["P","Ha! I understand. What did you do?","하하! 이해해. 그래서 어떻게 했어?"],["D","I tried again and again. Now my hands look like hands, not gloves!","계속 다시 시도했어요. 이제 제 손 그림은 장갑이 아니라 손처럼 보여요!"],["P","That's the spirit! What do you say to yourself when it's hard?","바로 그 정신이야! 힘들 때 스스로에게 뭐라고 말해?"],["D","I say, \"Even when it's difficult, I don't give up.\"","\"어려울 때도 나는 포기하지 않아.\"라고 말해요."],["P","Who helps you when you want to quit?","그만두고 싶을 때 누가 도와줘?"],["D","My family cheers for me, and Minseo says, \"You can do it!\"","가족이 응원해 주고, 민서가 \"넌 할 수 있어!\"라고 말해줘요."],["P","If your dream was easy, would it be fun?","꿈이 쉬웠다면 재미있었을까?"],["D","No! Hard dreams are the best dreams!","아니요! 어려운 꿈이 최고의 꿈이에요!"]],"role":[["P","Is chasing a dream always easy?","꿈을 좇는 건 항상 쉬워?"],["D","No, sometimes it's difficult.","아니요, 가끔은 어려워요."],["P","What do you do when it's hard?","힘들 때는 어떻게 해?"],["D","I try again and again, and I don't give up.","계속 다시 시도하고, 포기하지 않아요."],["P","What do you say to yourself?","스스로에게 뭐라고 말해?"],["D","Even when it's difficult, I don't give up.","어려울 때도 나는 포기하지 않아."],["P","Who cheers for you?","누가 널 응원해줘?"],["D","My family and Minseo cheer for me.","가족이랑 민서가 응원해줘요."]],"wrap":[["P","What is today's most important sentence?","오늘 가장 중요한 문장은 뭐야?"],["D","Even when it's difficult, I don't give up. I try again and again, because hard dreams are the best dreams!","어려울 때도 저는 포기하지 않아요. 계속 다시 시도해요, 어려운 꿈이 최고의 꿈이니까요!"]],"tip":"오늘 핵심 문장은 아이 인생의 문장이 될 수 있어요. 종이에 크게 써서 책상 앞에 붙여 주세요."},{"emoji":"🗺️","title":"Day 5 · My Dream Plan","sub":"꿈 계획 발표 놀이","words":[["step","단계","스텝"],["goal","목표","골"],["college","대학","칼리지"]],"sentence":["Step one: study hard. Step two: practice more!","1단계: 열심히 공부하기. 2단계: 더 연습하기!"],"main":[["P","Welcome to the Dream Plan Presentation! Designer Dayoon, show us your plan!","드림 플랜 발표회에 오신 걸 환영합니다! 다윤 디자이너, 계획을 보여 주세요!"],["D","Thank you! Here is my dream plan, step by step!","감사합니다! 제 꿈의 계획을 단계별로 보여 드릴게요!"],["P","What is step one?","1단계는 뭔가요?"],["D","Step one: study hard in school, especially art and math.","1단계: 학교에서 열심히 공부하기, 특히 미술이랑 수학이요."],["P","And step two?","2단계는요?"],["D","Step two: practice drawing and learn design programs.","2단계: 그림 연습하고 디자인 프로그램 배우기요."],["P","What comes after that?","그다음은 뭔가요?"],["D","Step three: go to a design college and learn more.","3단계: 디자인 대학에 가서 더 배우기요."],["P","And the final step?","마지막 단계는요?"],["D","Final step: open Dayoon's Design Studio!","마지막 단계: 다윤 디자인 스튜디오 열기!"],["P","The plan is perfect! What do we do right now?","계획이 완벽하네요! 지금 당장은 뭘 하죠?"],["D","Right now? Back to step one — homework time!","지금요? 1단계로 돌아가서 — 숙제 시간이요!"]],"role":[["P","What is step one of your dream plan?","네 꿈 계획의 1단계는 뭐야?"],["D","Step one: study hard, especially art and math.","1단계: 열심히 공부하기, 특히 미술과 수학이요."],["P","What is step two?","2단계는?"],["D","Step two: practice drawing and learn design programs.","2단계: 그림 연습하고 디자인 프로그램 배우기요."],["P","What is your final step?","마지막 단계는 뭐야?"],["D","Final step: open Dayoon's Design Studio!","마지막 단계: 다윤 디자인 스튜디오 열기요!"],["P","What is your big goal?","네 큰 목표는 뭐야?"],["D","My goal is to design a dream house for my family.","제 목표는 가족을 위한 꿈의 집을 디자인하는 거예요."]],"wrap":[["P","Present your dream plan one more time!","네 꿈의 계획을 한 번 더 발표해줘!"],["D","Step one: study hard. Step two: practice drawing. Step three: design college. Final step: open my own studio!","1단계: 열심히 공부하기. 2단계: 그림 연습하기. 3단계: 디자인 대학. 마지막 단계: 내 스튜디오 열기!"]],"tip":"계단 그림을 그려 단계마다 손가락으로 짚으며 발표하게 하면 순서 표현이 확실하게 잡힙니다."},{"emoji":"✨","title":"Day 6 · Why Dreams Matter","sub":"꿈이 중요한 이유","words":[["important","중요한","임포턴트"],["heart","마음","하트"],["shine","빛나다","샤인"]],"sentence":["Dreams are important because they make us shine.","꿈은 우리를 빛나게 하니까 중요해요."],"main":[["P","Dayoon, our last big question this month: why do we need dreams?","다윤아, 이번 달 마지막 큰 질문이야: 우리에게 왜 꿈이 필요할까?"],["D","I think dreams are important because they make us shine!","꿈은 우리를 빛나게 하니까 중요하다고 생각해요!"],["P","What does your dream give you?","네 꿈은 너에게 뭘 줘?"],["D","It gives me power to practice, even on tired days.","피곤한 날에도 연습할 힘을 줘요."],["P","What about a person with no dream yet?","아직 꿈이 없는 사람은 어떡하지?"],["D","They can find one! It's never too late.","찾으면 돼요! 절대 늦지 않았어요."],["P","Wise! Can dreams change?","현명한데! 꿈은 바뀔 수도 있을까?"],["D","Yes! Dreams can grow and change, just like us.","네! 꿈도 우리처럼 자라고 변할 수 있어요."],["P","By the way, what was my old dream again?","그런데 내 옛날 꿈이 뭐였더라?"],["D","Astronaut! Maybe design a space house with me?","우주비행사요! 저랑 같이 우주 집을 디자인할래요?"],["P","Deal! Any last words, dreamer Dayoon?","좋아, 약속! 마지막 한마디, 꿈꾸는 다윤?"],["D","Follow your heart, work hard, and shine bright!","마음을 따라가고, 열심히 노력하고, 밝게 빛나세요!"]],"role":[["P","Why are dreams important?","꿈은 왜 중요해?"],["D","Dreams are important because they make us shine.","꿈은 우리를 빛나게 하니까 중요해요."],["P","What does your dream give you?","네 꿈은 너에게 뭘 줘?"],["D","It gives me power to practice, even on tired days.","피곤한 날에도 연습할 힘을 줘요."],["P","Can dreams change?","꿈은 바뀔 수 있어?"],["D","Yes, dreams can grow and change, just like us.","네, 꿈도 우리처럼 자라고 변할 수 있어요."],["P","What is your message for dreamers?","꿈꾸는 사람들에게 전할 메시지는?"],["D","Follow your heart, work hard, and shine bright!","마음을 따라가고, 열심히 하고, 밝게 빛나세요!"]],"wrap":[["P","This is the end of our dream month! Give me your final speech!","꿈의 달이 끝났어! 마지막 연설을 해줘!"],["D","Dreams are important because they make us shine. My dream is to be a designer, and I will never give up. Shine bright!","꿈은 우리를 빛나게 해서 중요해요. 제 꿈은 디자이너가 되는 거고, 절대 포기하지 않을 거예요. 밝게 빛나세요!"]],"tip":"두 달의 마무리 연설이에요. 일어서서 발표하게 하고, 끝나면 기립 박수로 성취감을 안겨 주세요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"4주차 총정리","interview":true,"pool":["What should you learn for your dream?","Why do you need math?","What do you practice every day?","Who is your role model, and why?","What do you do when something is difficult?","What do you say to yourself when it's hard?","What is step one of your dream plan?","What is your final step?","Why are dreams important?","What is your message for dreamers?"],"tip":"마지막 인터뷰는 시상식처럼! 끝나면 '이달의 꿈나무상'을 수여하며 두 달의 여정을 축하해 주세요."}]}]});
MONTHS.push({"m":11,"theme":"감정·의견","q":3,"weeks":[{"sub":"내 기분 말하기","days":[{"emoji":"😊","title":"Day 1 · How Do You Feel?","sub":"기분을 말해요","words":[["excited","신나는","익사이티드"],["nervous","긴장되는","너버스"],["proud","자랑스러운","프라우드"]],"sentence":["I feel excited because tomorrow is Friday.","내일이 금요일이라서 나는 신나요."],"main":[["P","Dayoon! Welcome to Feelings Month. How do you feel today?","다윤아! 감정의 달에 온 걸 환영해. 오늘 기분이 어때?"],["D","I feel excited today!","오늘 저는 신나요!"],["P","Ooh, why do you feel excited?","오, 왜 신나는데?"],["D","Because I have a skating class today. I love skating.","오늘 스케이트 수업이 있거든요. 저는 스케이트를 좋아해요."],["P","Nice! Do you ever feel nervous before skating?","멋지다! 스케이트 타기 전에 긴장될 때도 있어?"],["D","Yes, sometimes I feel nervous before a new jump.","네, 새로운 점프를 하기 전에는 가끔 긴장돼요."],["P","And when do you feel proud?","그럼 언제 자랑스러운 기분이 들어?"],["D","I feel proud when I finish a big drawing.","큰 그림을 다 완성했을 때 자랑스러워요."],["P","By the way, how does Siheon feel when you eat his strawberries?","그런데 네가 시헌이 딸기를 먹으면 시헌이는 기분이 어떨까?"],["D","Haha, he feels angry! But I feel happy!","하하, 시헌이는 화가 나요! 근데 저는 행복해요!"]],"role":[["P","How do you feel right now?","지금 기분이 어때?"],["D","I feel happy and a little excited.","행복하고 조금 신나요."],["P","When do you feel nervous?","언제 긴장돼?"],["D","I feel nervous before a test at school.","학교에서 시험 보기 전에 긴장돼요."],["P","What makes you feel proud?","무엇이 너를 자랑스럽게 해?"],["D","My drawings make me feel proud.","제 그림이 저를 자랑스럽게 해요."],["P","How does your mom feel when you help her?","네가 도와드리면 엄마 기분이 어떨까?"],["D","She feels happy and proud of me.","엄마는 행복하고 저를 자랑스러워하세요."]],"wrap":[["P","Great start! Tell me about your feelings today in two sentences.","좋은 시작이야! 오늘 네 기분을 두 문장으로 말해 줘."],["D","I feel excited because I have skating today. Sometimes I feel nervous, but I feel proud when I do my best.","오늘 스케이트가 있어서 신나요. 가끔 긴장되지만, 최선을 다하면 자랑스러워요."]],"tip":"오늘부터 매일 저녁 'How do you feel?'로 하루 기분을 영어로 묻고 이유까지 말하게 해 주세요."},{"emoji":"🃏","title":"Day 2 · Emotion Card Game","sub":"감정 카드 놀이","words":[["bored","지루한","보어드"],["surprised","놀란","서프라이즈드"],["scared","무서운","스케어드"]],"sentence":["You look surprised! Did something happen?","너 놀란 것 같아! 무슨 일 있었어?"],"main":[["P","Let's play the emotion card game! I pick a card and act it out. Ready?","감정 카드 놀이를 하자! 내가 카드를 뽑아서 연기할게. 준비됐어?"],["D","Ready! Show me your face!","준비됐어요! 표정을 보여 주세요!"],["P","Yaaawn... I have nothing to do...","하아암... 할 게 하나도 없네..."],["D","You look bored! My card says... bored!","지루해 보여요! 제 카드에도... 지루한!이라고 쓰여 있어요!"],["P","Correct! Now your turn. Act out your card!","정답! 이제 네 차례야. 카드를 연기해 봐!"],["D","Wow!! There is a puppy in my room!!","우와!! 제 방에 강아지가 있어요!!"],["P","Hmm, you look surprised! Am I right?","음, 놀란 것 같은데! 맞아?"],["D","Yes! I am surprised. I really want a puppy, you know.","네! 놀란 거예요. 저 진짜 강아지 갖고 싶은 거 아시죠."],["P","One more! Eeek! A big spider is on my head!","하나 더! 으악! 내 머리 위에 큰 거미가 있어!"],["D","You look scared! Don't worry, it's just your hair pin! Haha!","무서워 보여요! 걱정 마세요, 그거 그냥 머리핀이에요! 하하!"]],"role":[["P","When do you feel bored?","언제 지루해?"],["D","I feel bored when I wait for a long time.","오래 기다릴 때 지루해요."],["P","What are you scared of?","너는 뭐가 무서워?"],["D","I am scared of big bugs.","저는 큰 벌레가 무서워요."],["P","When were you surprised this week?","이번 주에 언제 놀랐어?"],["D","I was surprised when Siheon jumped out from the door.","시헌이가 문에서 튀어나왔을 때 놀랐어요."],["P","What do you do when you feel bored?","지루할 때 뭘 해?"],["D","I draw pictures or call Minseo.","그림을 그리거나 민서에게 전화해요."]],"wrap":[["P","Fun game! Tell me two feelings you acted today and when you feel them.","재밌었어! 오늘 연기한 감정 두 개랑 언제 그런 기분이 드는지 말해 줘."],["D","Today I acted surprised and scared. I feel surprised when Siheon jumps out, and I feel scared of big bugs.","오늘 놀란 표정과 무서운 표정을 연기했어요. 시헌이가 튀어나오면 놀라고, 큰 벌레는 무서워요."]],"tip":"종이에 감정 단어를 적어 진짜 카드를 만들면 몰입도가 훨씬 올라갑니다. 과장된 표정 연기를 함께해 주세요."},{"emoji":"🕵️","title":"Day 3 · Face Detective","sub":"표정 스무고개","words":[["guess","추측하다","게스"],["angry","화난","앵그리"],["confused","헷갈리는","컨퓨즈드"]],"sentence":["Let me guess... are you angry?","맞혀 볼게요... 화났어요?"],"main":[["P","Today you are Detective Dayoon! I make a face, you guess my feeling. Ask me questions!","오늘 너는 다윤 탐정이야! 내가 표정을 지으면 네가 감정을 맞히는 거야. 질문해 봐!"],["D","Okay! Detective Dayoon is on the case! Is it a good feeling?","좋아요! 다윤 탐정 출동! 좋은 감정인가요?"],["P","No, it is not a good feeling. Grrrr...","아니, 좋은 감정이 아니야. 으르렁..."],["D","Hmm... let me guess. Are you angry?","음... 맞혀 볼게요. 화났어요?"],["P","Yes! I am angry because someone ate my pasta!","맞아! 누가 내 파스타를 먹어서 화가 났어!"],["D","Oh no... sorry, that was me! Pasta is my favorite!","이런... 죄송해요, 그거 저였어요! 파스타는 제가 제일 좋아하거든요!"],["P","Haha! Next face. My head is spinning... which way is left?","하하! 다음 표정. 머리가 빙글빙글... 어느 쪽이 왼쪽이지?"],["D","You look confused! Is that right?","헷갈려 보여요! 맞나요?"],["P","Correct, detective! How did you guess so fast?","정답이야, 탐정님! 어떻게 그렇게 빨리 맞혔어?"],["D","Easy! Your eyes were big and your mouth said 'Ummm...'","쉬워요! 눈이 커지고 입이 '으음...' 이라고 했잖아요."]],"role":[["P","When do you feel angry?","언제 화가 나?"],["D","I feel angry when Siheon breaks my colored pencils.","시헌이가 제 색연필을 부러뜨릴 때 화가 나요."],["P","What do you do when you are angry?","화가 나면 어떻게 해?"],["D","I take a deep breath and count to ten.","심호흡을 하고 열까지 세요."],["P","When do you feel confused?","언제 헷갈려?"],["D","I feel confused when math problems are too long.","수학 문제가 너무 길면 헷갈려요."],["P","Can you guess my feeling now? I am smiling.","지금 내 감정을 맞혀 볼래? 나 웃고 있어."],["D","I guess you are happy because class is fun!","수업이 재미있어서 행복한 것 같아요!"]],"wrap":[["P","Case closed, detective! Sum up today's mission in two sentences.","사건 종결, 탐정님! 오늘 임무를 두 문장으로 정리해 줘."],["D","Today I guessed feelings from faces. I can say angry and confused, and I guess feelings with eyes and mouth clues.","오늘 표정을 보고 감정을 맞혔어요. angry와 confused를 말할 수 있고, 눈과 입 단서로 감정을 추측해요."]],"tip":"부모님이 표정 연기를 크게 할수록 아이가 'Are you...?' 질문 패턴을 더 많이 연습하게 됩니다."},{"emoji":"🌧️","title":"Day 4 · When I Feel Blue","sub":"이럴 때 이런 기분","words":[["lonely","외로운","론리"],["cheerful","명랑한","치어풀"],["down","우울한","다운"]],"sentence":["When I feel down, I draw pictures.","기분이 우울할 때 나는 그림을 그려요."],"main":[["P","Dayoon, everybody feels down sometimes. When do you feel down?","다윤아, 누구나 가끔 기분이 가라앉아. 너는 언제 기분이 다운돼?"],["D","I feel down when it rains and I can't go outside.","비가 와서 밖에 못 나갈 때 기분이 다운돼요."],["P","I see. And when do you feel lonely?","그렇구나. 그럼 언제 외로워?"],["D","I feel lonely when Minseo is absent from school.","민서가 학교에 안 오면 외로워요."],["P","What do you do when you feel down?","기분이 다운될 때는 뭘 해?"],["D","When I feel down, I draw pictures with sky blue.","기분이 다운되면 하늘색으로 그림을 그려요."],["P","Sky blue! That is so you. What else makes you cheerful?","하늘색! 정말 너답다. 또 뭐가 널 명랑하게 해?"],["D","Strawberries make me cheerful. One hundred strawberries make me SUPER cheerful!","딸기가 저를 명랑하게 해요. 딸기 백 개면 완전 명랑해져요!"],["P","Haha! So food is your medicine?","하하! 그러니까 음식이 네 약이구나?"],["D","Yes! Pasta for lunch, strawberries for dessert, happy Dayoon!","네! 점심엔 파스타, 디저트엔 딸기, 그러면 행복한 다윤!"]],"role":[["P","What makes you feel cheerful?","무엇이 너를 명랑하게 해?"],["D","Drawing and strawberries make me cheerful.","그림 그리기와 딸기가 저를 명랑하게 해요."],["P","When do you feel lonely?","언제 외로워?"],["D","I feel lonely when nobody plays with me.","아무도 저랑 놀아 주지 않을 때 외로워요."],["P","What do you do when you feel down?","기분이 다운되면 뭘 해?"],["D","I listen to music and draw pictures.","음악을 듣고 그림을 그려요."],["P","Who makes you feel better?","누가 네 기분을 좋게 해 줘?"],["D","My mom and Minseo make me feel better.","엄마랑 민서가 제 기분을 좋게 해 줘요."]],"wrap":[["P","Good talk. Tell me your feeling recipe in two or three sentences.","좋은 대화였어. 너의 기분 레시피를 두세 문장으로 말해 줘."],["D","When I feel down, I draw with sky blue. When I feel lonely, I call Minseo. Strawberries always make me cheerful!","기분이 다운되면 하늘색으로 그림을 그려요. 외로우면 민서에게 전화해요. 딸기는 언제나 저를 명랑하게 해요!"]],"tip":"'When I feel ___, I ___' 패턴을 냉장고에 붙여 두고 실제 기분이 안 좋은 날 영어로 써먹어 보세요."},{"emoji":"🎤","title":"Day 5 · Feelings Reporter","sub":"기자 인터뷰 놀이","words":[["reporter","기자","리포터"],["moment","순간","모먼트"],["embarrassed","쑥스러운","임배러스트"]],"sentence":["What was the happiest moment of your week?","이번 주 가장 행복했던 순간은 무엇이었나요?"],"main":[["P","Breaking news! I am a reporter from Gwacheon Kids News. Miss Dayoon, may I interview you?","속보입니다! 저는 과천 어린이 뉴스 기자입니다. 다윤 양, 인터뷰 가능할까요?"],["D","Of course! I am famous in my house, you know.","물론이죠! 저 우리 집에서는 유명인이거든요."],["P","Haha! First question: what was the happiest moment of your week?","하하! 첫 질문입니다. 이번 주 가장 행복했던 순간은요?"],["D","The happiest moment was eating pasta with my family on Saturday.","가장 행복했던 순간은 토요일에 가족과 파스타를 먹은 거예요."],["P","Lovely. And was there an embarrassed moment?","좋네요. 그럼 쑥스러웠던 순간도 있었나요?"],["D","Yes! I waved at someone, but it was not Minseo. It was a stranger!","네! 제가 누구한테 손을 흔들었는데, 민서가 아니었어요. 모르는 사람이었어요!"],["P","Oh no! How did you feel at that moment?","저런! 그 순간 기분이 어땠나요?"],["D","I felt so embarrassed. My face turned red like a strawberry!","너무 쑥스러웠어요. 얼굴이 딸기처럼 빨개졌어요!"],["P","Last question: what moment are you waiting for?","마지막 질문입니다. 어떤 순간을 기다리고 있나요?"],["D","I am waiting for summer! Summer is my favorite season.","여름을 기다리고 있어요! 여름은 제가 제일 좋아하는 계절이에요."]],"role":[["P","Miss Dayoon, how do you feel about this interview?","다윤 양, 이 인터뷰에 대한 기분이 어떤가요?"],["D","I feel excited. I like being famous!","신나요. 유명해지는 거 좋아요!"],["P","What was a proud moment this month?","이번 달 자랑스러웠던 순간은요?"],["D","I landed a new jump at skating class.","스케이트 수업에서 새 점프를 성공했어요."],["P","What moment made you laugh this week?","이번 주 웃겼던 순간은요?"],["D","Siheon wore Dad's big shoes and fell down.","시헌이가 아빠의 큰 신발을 신고 넘어졌어요."],["P","Any last words for our viewers?","시청자들에게 마지막 한마디 해 주시죠."],["D","Eat strawberries and be happy, everyone!","여러분, 딸기 먹고 행복하세요!"]],"wrap":[["P","That's a wrap! Please summarize your interview in two sentences.","촬영 끝! 인터뷰를 두 문장으로 요약해 주세요."],["D","Today I talked about my happiest and most embarrassed moments. My face turned red, but now I can laugh about it!","오늘 가장 행복했던 순간과 쑥스러웠던 순간을 이야기했어요. 얼굴이 빨개졌었지만 이제는 웃으면서 말할 수 있어요!"]],"tip":"리모컨이나 빗을 마이크처럼 쥐여 주세요. 소품 하나로 인터뷰 몰입도가 크게 달라집니다."},{"emoji":"🌤️","title":"Day 6 · My Mood Weather","sub":"기분 날씨 예보","words":[["mood","기분","무드"],["calm","차분한","캄"],["grumpy","심술 난","그럼피"]],"sentence":["My mood today is sunny with a little cloud.","오늘 내 기분은 약간 구름 낀 맑음이에요."],"main":[["P","Welcome to the Mood Weather Show! Dayoon, what is your mood weather today?","기분 날씨 쇼에 오신 걸 환영합니다! 다윤 기상 캐스터, 오늘의 기분 날씨는요?"],["D","Good evening! Today my mood is sunny with a little cloud.","안녕하세요! 오늘 제 기분은 약간 구름 낀 맑음입니다."],["P","Sunny with a cloud? Please explain!","구름 낀 맑음이요? 설명해 주시죠!"],["D","Sunny because I drew a great picture. A little cloud because I have homework.","멋진 그림을 그려서 맑음이에요. 숙제가 있어서 구름이 조금 있어요."],["P","And what was Siheon's mood weather today?","오늘 시헌이의 기분 날씨는 어땠나요?"],["D","Siheon was grumpy this morning. His weather was thunder and lightning!","시헌이는 아침에 심술이 났어요. 시헌이 날씨는 천둥 번개였어요!"],["P","Haha, thunder Siheon! How about your mom?","하하, 천둥 시헌! 어머니는요?"],["D","My mom was calm, like a quiet lake. She is always calm.","엄마는 조용한 호수처럼 차분했어요. 엄마는 항상 차분해요."],["P","Wonderful report! What is tomorrow's mood forecast?","훌륭한 보도였습니다! 내일의 기분 예보는요?"],["D","Tomorrow will be one hundred percent sunny, because it is the weekend!","내일은 백 퍼센트 맑음입니다, 주말이니까요!"]],"role":[["P","What is your mood weather right now?","지금 네 기분 날씨는 어때?"],["D","It is sunny because English class is fun.","영어 수업이 재미있어서 맑음이에요."],["P","When is your mood grumpy?","언제 기분이 심술 나?"],["D","My mood is grumpy when I wake up too early.","너무 일찍 일어나면 심술이 나요."],["P","How do you make a grumpy mood sunny?","심술 난 기분을 어떻게 맑음으로 바꿔?"],["D","I eat something yummy and take a rest.","맛있는 걸 먹고 쉬어요."],["P","When do you feel calm?","언제 차분해져?"],["D","I feel calm when I draw at night.","밤에 그림을 그릴 때 차분해져요."]],"wrap":[["P","Great show! Give me this week's mood weather report in two or three sentences.","멋진 방송이었어! 이번 주 기분 날씨를 두세 문장으로 보도해 줘."],["D","This week my mood was mostly sunny. I was grumpy one morning, but drawing made me calm. Tomorrow will be sunny again!","이번 주 제 기분은 대체로 맑음이었어요. 하루 아침엔 심술이 났지만 그림을 그리니 차분해졌어요. 내일도 맑을 거예요!"]],"tip":"매일 아침 '오늘 기분 날씨는?'을 영어로 물어보면 이번 주 배운 감정 단어가 자연스럽게 복습됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"1주차 총정리","interview":true,"pool":["How do you feel today, and why?","When do you feel nervous?","What makes you feel proud?","What are you scared of?","When were you surprised recently?","What do you do when you feel angry?","When do you feel lonely, and what do you do?","What makes you feel cheerful?","What was the happiest moment of this week?","What is your mood weather today? Please explain."],"tip":"질문 순서를 섞어서 물어보고, 대답할 때 감정 단어에 이유(because)까지 붙이면 크게 칭찬해 주세요."}]},{"sub":"친구 마음 위로하기","days":[{"emoji":"🫂","title":"Day 1 · What's Wrong?","sub":"무슨 일 있어?","words":[["wrong","잘못된, 문제 있는","뤙"],["upset","속상한","업셋"],["cheer up","기운 내다","치어 업"]],"sentence":["What's wrong? You look upset.","무슨 일이야? 너 속상해 보여."],"main":[["P","Dayoon, this week we learn to help sad friends. I will act sad... sniff, sniff...","다윤아, 이번 주엔 슬픈 친구를 돕는 법을 배울 거야. 내가 슬픈 연기를 할게... 훌쩍, 훌쩍..."],["D","What's wrong? You look upset.","무슨 일이에요? 속상해 보여요."],["P","I lost my favorite pen today...","오늘 제일 아끼는 펜을 잃어버렸어..."],["D","Oh no, I'm sorry to hear that. Where did you see it last?","저런, 안됐네요. 마지막으로 어디서 봤어요?"],["P","At the park. I feel so sad.","공원에서. 너무 슬퍼."],["D","Cheer up! We can look for it together tomorrow.","기운 내세요! 내일 같이 찾아봐요."],["P","Really? You are so kind, Dayoon.","정말? 다윤이 정말 친절하다."],["D","And if we can't find it, I will draw you a new pen! A super rainbow pen!","그리고 못 찾으면 제가 새 펜을 그려 드릴게요! 슈퍼 무지개 펜으로요!"],["P","Haha! A drawing of a pen! I feel better already.","하하! 펜 그림이라니! 벌써 기분이 나아졌어."],["D","See? Doctor Dayoon fixes sad hearts!","봤죠? 다윤 박사가 슬픈 마음을 고쳐 드립니다!"]],"role":[["P","Your friend looks sad. What do you say first?","친구가 슬퍼 보여. 먼저 뭐라고 말할까?"],["D","What's wrong? Are you okay?","무슨 일이야? 괜찮아?"],["P","Your friend lost her bag. What do you say?","친구가 가방을 잃어버렸대. 뭐라고 말할까?"],["D","I'm sorry to hear that. Let's look for it together.","안됐다. 같이 찾아보자."],["P","How do you cheer up a sad friend?","슬픈 친구를 어떻게 기운 나게 해?"],["D","I say cheer up and stay with my friend.","기운 내라고 말하고 친구 곁에 있어 줘요."],["P","What made you upset recently?","최근에 뭐 때문에 속상했어?"],["D","I was upset when my drawing got wet.","제 그림이 젖었을 때 속상했어요."]],"wrap":[["P","Well done. What do you say when a friend looks upset? Two sentences, please.","잘했어. 친구가 속상해 보일 때 뭐라고 말하지? 두 문장으로 부탁해."],["D","First I ask, what's wrong? Then I say cheer up and help my friend.","먼저 무슨 일이냐고 물어봐요. 그다음 기운 내라고 말하고 친구를 도와줘요."]],"tip":"부모님이 최대한 시무룩한 연기를 해 주세요. 아이가 'What's wrong?'을 먼저 꺼내는 게 오늘의 목표입니다."},{"emoji":"🛋️","title":"Day 2 · Counselor Dayoon","sub":"상담사 놀이","words":[["problem","고민, 문제","프라블럼"],["advice","조언","어드바이스"],["listen","귀 기울여 듣다","리슨"]],"sentence":["Tell me your problem. I'm listening.","고민을 말해 보세요. 제가 듣고 있어요."],"main":[["P","Welcome to Counselor Dayoon's office! Knock knock. I am Minseo, and I have a problem.","다윤 상담소에 오신 걸 환영합니다! 똑똑. 나는 민서인데, 고민이 있어."],["D","Come in, Minseo! Sit down. Tell me your problem. I'm listening.","들어와, 민서야! 앉아. 고민을 말해 봐. 듣고 있어."],["P","I have a big test, but I keep watching videos instead of studying.","큰 시험이 있는데, 공부는 안 하고 자꾸 영상만 봐."],["D","I see, I see. That is a common problem. Even I have that problem!","그렇군, 그렇군. 아주 흔한 고민이지. 사실 나도 그래!"],["P","Haha! So what is your advice, counselor?","하하! 그래서 상담사님의 조언은 뭔가요?"],["D","My advice is: give your phone to your mom, study for thirty minutes, then watch one video.","내 조언은 이거야. 휴대폰을 엄마께 드리고, 30분 공부한 다음, 영상 하나만 봐."],["P","Hmm, that sounds smart. But what if the video is really long?","음, 똑똑한데. 근데 영상이 진짜 길면 어떡해?"],["D","Then choose a short one! Counselor's rule number two: strawberries after studying help your brain.","그럼 짧은 걸 골라! 상담사 규칙 2번, 공부 후 딸기는 두뇌에 좋습니다."],["P","Is that real science?","그거 진짜 과학이야?"],["D","It is Dayoon science! That will be five hundred won, please.","다윤 과학입니다! 상담비 오백 원 되겠습니다."]],"role":[["P","Counselor, my little brother is too loud. What should I do?","상담사님, 남동생이 너무 시끄러워요. 어떻게 하죠?"],["D","Listen to music, or play with him for ten minutes first.","음악을 들으세요. 아니면 먼저 10분만 같이 놀아 주세요."],["P","Counselor, I feel sleepy at school. Any advice?","상담사님, 학교에서 졸려요. 조언 있나요?"],["D","Go to bed early. I sleep at nine thirty every night!","일찍 자세요. 저는 매일 밤 9시 반에 자요!"],["P","Why is listening important for a counselor?","상담사에게 듣는 건 왜 중요할까?"],["D","Because friends feel better when someone listens.","누가 들어주면 친구 기분이 나아지니까요."],["P","Who listens to your problems?","네 고민은 누가 들어 줘?"],["D","My mom and Minseo listen to my problems.","엄마랑 민서가 제 고민을 들어 줘요."]],"wrap":[["P","Great counseling! What does a good counselor do? Two or three sentences.","훌륭한 상담이었어! 좋은 상담사는 뭘 하지? 두세 문장으로."],["D","A good counselor listens first and asks about the problem. Then I give kind advice. Today I helped Minseo with her study problem!","좋은 상담사는 먼저 듣고 고민에 대해 물어봐요. 그다음 친절한 조언을 해요. 오늘 저는 민서의 공부 고민을 도와줬어요!"]],"tip":"실제 있을 법한 고민(동생, 숙제, 늦잠)으로 상담을 요청해 보세요. advice라는 단어를 아이 입으로 말하게 유도하세요."},{"emoji":"🤗","title":"Day 3 · Don't Worry!","sub":"걱정 마, 괜찮아","words":[["worry","걱정하다","워리"],["mistake","실수","미스테이크"],["hug","안아 주다","허그"]],"sentence":["Don't worry. Everyone makes mistakes.","걱정 마. 누구나 실수를 해."],"main":[["P","Dayoon, today's magic words are 'Don't worry.' I dropped my ice cream on the floor! Waaah!","다윤아, 오늘의 마법의 말은 '걱정 마'야. 내 아이스크림을 바닥에 떨어뜨렸어! 으앙!"],["D","Don't worry! We can share mine. Half and half!","걱정 마세요! 제 거 나눠 먹으면 돼요. 반반씩요!"],["P","Sniff... really? You will share yours?","훌쩍... 정말? 네 걸 나눠 준다고?"],["D","Yes! But not my strawberry ice cream. That one is special. Haha!","네! 근데 딸기 아이스크림은 안 돼요. 그건 특별하니까요. 하하!"],["P","Haha, fair! New situation: I made a mistake on my test. I wrote 'dog' instead of 'door.'","하하, 인정! 새로운 상황이야. 시험에서 실수했어. 'door' 대신 'dog'라고 썼어."],["D","Don't worry. Everyone makes mistakes. A dog door is a fun answer!","걱정 마세요. 누구나 실수해요. 강아지 문이라니 재밌는 답인데요!"],["P","You always make me laugh. One more: I am worried about singing in front of people.","넌 항상 날 웃게 하는구나. 하나 더. 사람들 앞에서 노래하는 게 걱정돼."],["D","It's okay to feel worried. Take a deep breath. I will clap the loudest for you!","걱정되는 건 괜찮아요. 심호흡하세요. 제가 제일 크게 박수 쳐 드릴게요!"],["P","Thank you, Dayoon. Your words are like a warm hug.","고마워, 다윤아. 네 말은 따뜻한 포옹 같아."],["D","Then here is a real hug too! Hug power, one hundred percent!","그럼 진짜 포옹도 드릴게요! 포옹 파워 백 퍼센트!"]],"role":[["P","Your friend is worried about a test. What do you say?","친구가 시험 걱정을 해. 뭐라고 말할까?"],["D","Don't worry. You studied hard. You can do it!","걱정 마. 넌 열심히 공부했잖아. 할 수 있어!"],["P","Your friend made a mistake in front of the class. What do you say?","친구가 반 아이들 앞에서 실수했어. 뭐라고 말할까?"],["D","It's okay. Everyone makes mistakes.","괜찮아. 누구나 실수해."],["P","What do you worry about?","너는 뭐가 걱정돼?"],["D","I sometimes worry about skating tests.","가끔 스케이트 시험이 걱정돼요."],["P","What helps you when you worry?","걱정될 때 뭐가 도움이 돼?"],["D","A hug from my mom helps me a lot.","엄마의 포옹이 큰 도움이 돼요."]],"wrap":[["P","Sweet! Tell me today's magic words and when to use them.","따뜻했어! 오늘의 마법의 말과 언제 쓰는지 말해 줘."],["D","The magic words are don't worry and it's okay. I use them when a friend makes a mistake or feels worried.","마법의 말은 '걱정 마'와 '괜찮아'예요. 친구가 실수하거나 걱정할 때 사용해요."]],"tip":"일상에서 아이가 실수했을 때 부모님이 먼저 'Don't worry, everyone makes mistakes.'라고 말해 주면 표현이 몸에 뱁니다."},{"emoji":"👶","title":"Day 4 · Siheon Is Crying","sub":"동생 달래기 미션","words":[["cry","울다","크라이"],["gentle","다정한","젠틀"],["promise","약속하다","프라미스"]],"sentence":["Stop crying, Siheon. I will play with you.","그만 울어, 시헌아. 내가 같이 놀아 줄게."],"main":[["P","Emergency mission! I am Siheon. Waaaah! My robot is broken! Waaaah!","긴급 미션! 내가 시헌이야. 으아앙! 내 로봇이 부서졌어! 으아앙!"],["D","Oh no, Siheon. Stop crying. Show me the robot.","이런, 시헌아. 그만 울어. 로봇 보여 줘 봐."],["P","Sniff... the arm... the arm came off... Waaah!","훌쩍... 팔이... 팔이 떨어졌어... 으앙!"],["D","It's okay. Look, the arm can go back in. Click! All done!","괜찮아. 봐, 팔이 다시 끼워져. 딸깍! 다 됐다!"],["P","Sniff... really? But I'm still sad...","훌쩍... 정말? 그래도 아직 슬퍼..."],["D","Then I will play robots with you. I promise! Big sister promise!","그럼 내가 로봇 놀이 같이 해 줄게. 약속해! 누나 약속!"],["P","Yay! Dayoon is the best! Can we also eat cookies?","야호! 누나 최고야! 우리 쿠키도 먹을 수 있어?"],["D","Okay, okay. One cookie for you, and two for me. I am the doctor here!","그래, 그래. 너 한 개, 나 두 개. 여기 의사는 나니까!"],["P","Hey! That's not fair! Haha!","야! 그건 불공평해! 하하!"],["D","Haha, just kidding! One and one. Being gentle is my job today.","하하, 농담이야! 하나씩 먹자. 오늘 내 임무는 다정하게 대하기니까."]],"role":[["P","Siheon is crying because he lost the game. What do you say?","시헌이가 게임에서 져서 울어. 뭐라고 말할까?"],["D","Stop crying, Siheon. Let's play one more time.","그만 울어, 시헌아. 한 판 더 하자."],["P","How do you talk to a crying kid?","우는 아이에게 어떻게 말해야 할까?"],["D","I talk in a gentle and soft voice.","다정하고 부드러운 목소리로 말해요."],["P","What do you promise Siheon when he is sad?","시헌이가 슬플 때 뭘 약속해 줘?"],["D","I promise to play with him after my homework.","숙제 끝나고 같이 놀아 주겠다고 약속해요."],["P","When did you cry recently?","최근에 언제 울었어?"],["D","I cried a little at a sad movie about a dog.","강아지가 나오는 슬픈 영화를 보고 조금 울었어요."]],"wrap":[["P","Mission complete! How did you help crying Siheon? Two or three sentences.","미션 완료! 우는 시헌이를 어떻게 도와줬지? 두세 문장으로."],["D","Siheon cried because his robot was broken. I fixed it and promised to play with him. I used a gentle voice like a good big sister!","시헌이가 로봇이 부서져서 울었어요. 제가 고쳐 주고 같이 놀기로 약속했어요. 좋은 누나답게 다정한 목소리를 썼어요!"]],"tip":"실제로 시헌이가 울 때 오늘 배운 'Stop crying, I will play with you.'를 써 보게 하면 최고의 실전 연습이 됩니다."},{"emoji":"🔄","title":"Day 5 · Cheer Me Up, Dayoon!","sub":"반대로! 선생님 위로하기","words":[["terrible","끔찍한","테러블"],["helpful","도움이 되는","헬프풀"],["heart","마음","하트"]],"sentence":["You helped me a lot. You have a warm heart.","네가 큰 도움이 됐어. 너는 마음이 따뜻하구나."],"main":[["P","Today is Reverse Day! You are the teacher, and I am the student with a terrible day.","오늘은 거꾸로 데이! 네가 선생님이고, 나는 끔찍한 하루를 보낸 학생이야."],["D","Hello, student! You look tired. What happened today?","안녕, 학생! 피곤해 보이네. 오늘 무슨 일 있었어?"],["P","Everything went wrong! I was late, I forgot my lunch, and it rained on me!","다 엉망이었어요! 지각하고, 점심 도시락도 잊어버리고, 비까지 맞았어요!"],["D","Oh dear, that sounds like a terrible day. Come here, sit down.","저런, 정말 끔찍한 하루였겠다. 이리 와서 앉아."],["P","And my umbrella broke too... I feel like a wet cat.","우산까지 부러졌어요... 젖은 고양이가 된 기분이에요."],["D","A wet cat! Haha! Don't worry. Bad days make good stories later!","젖은 고양이래! 하하! 걱정 마. 나쁜 날은 나중에 좋은 이야깃거리가 돼!"],["P","Wow... that is deep, Teacher Dayoon. Where did you learn that?","와... 심오한데요, 다윤 선생님. 어디서 배웠어요?"],["D","From my art teacher! When my painting goes wrong, we laugh and start again.","미술 선생님한테요! 제 그림이 망하면 우리는 웃고 다시 시작해요."],["P","You helped me a lot today. You have a warm heart.","오늘 네가 큰 도움이 됐어. 너는 마음이 따뜻해."],["D","Thank you! Teacher Dayoon is always open. Cookie payment, please!","감사합니다! 다윤 선생님 상담소는 항상 열려 있어요. 상담비는 쿠키로 주세요!"]],"role":[["P","Teacher Dayoon, I feel terrible before tests. Help me!","다윤 선생님, 시험 전에 너무 괴로워요. 도와주세요!"],["D","Take a deep breath and think, I can do it.","심호흡을 하고 '난 할 수 있다'라고 생각하세요."],["P","Teacher, nobody sat with me at lunch today.","선생님, 오늘 점심에 아무도 저랑 안 앉았어요."],["D","That sounds lonely. Tomorrow, ask a friend first. Be brave!","외로웠겠다. 내일은 먼저 친구에게 물어보세요. 용기를 내요!"],["P","What makes you a helpful teacher?","무엇이 너를 도움이 되는 선생님으로 만들까?"],["D","I listen well and I make people laugh.","잘 들어주고 사람들을 웃게 하니까요."],["P","Who has the warmest heart in your family?","가족 중 누가 마음이 제일 따뜻해?"],["D","My mom has the warmest heart. She always hugs us.","엄마 마음이 제일 따뜻해요. 항상 우리를 안아 주세요."]],"wrap":[["P","Reverse Day was fun! How did Teacher Dayoon help me today? Two sentences.","거꾸로 데이 재밌었어! 오늘 다윤 선생님이 나를 어떻게 도와줬지? 두 문장으로."],["D","You had a terrible day, so I listened and made you laugh. Helping people makes my heart warm too!","선생님이 끔찍한 하루를 보내서 제가 들어주고 웃게 해 드렸어요. 남을 도우면 제 마음도 따뜻해져요!"]],"tip":"아이가 질문을 주도하는 날입니다. 부모님은 대답을 짧게 하고 아이가 다음 질문을 이어 가게 기다려 주세요."},{"emoji":"💝","title":"Day 6 · Kind Words Power","sub":"칭찬의 힘","words":[["compliment","칭찬","컴플리먼트"],["amazing","굉장한","어메이징"],["sweet","다정한, 달콤한","스위트"]],"sentence":["You are amazing at drawing!","너 그림 진짜 굉장하다!"],"main":[["P","Today is Compliment Battle day! We give compliments back and forth. The one who stops loses!","오늘은 칭찬 배틀이야! 서로 칭찬을 주고받다가 멈추는 사람이 지는 거야!"],["D","I never lose! Okay... You are amazing at making funny faces!","저 절대 안 져요! 좋아요... 선생님은 웃긴 표정을 굉장하게 잘 지어요!"],["P","Thank you! You are amazing at drawing. Your pictures look alive!","고마워! 너는 그림이 굉장해. 네 그림은 살아 있는 것 같아!"],["D","Thank you! Your voice is sweet like honey!","감사해요! 선생님 목소리는 꿀처럼 달콤해요!"],["P","Oh my! Your skating is fantastic. You fly like a bird on ice!","어머! 네 스케이트는 환상적이야. 얼음 위의 새처럼 날아다녀!"],["D","Um... um... your hair looks great today!","음... 음... 오늘 머리가 멋져요!"],["P","Haha, you paused! But nice save. How do compliments make you feel?","하하, 잠깐 멈췄네! 그래도 잘 살렸어. 칭찬을 들으면 기분이 어때?"],["D","Compliments make me feel warm and strong. Like a superhero!","칭찬은 저를 따뜻하고 강하게 해요. 슈퍼히어로처럼요!"],["P","Who will you compliment today at home?","오늘 집에서 누구를 칭찬할 거야?"],["D","I will tell Siheon, your robot dance is amazing! He will love it.","시헌이에게 '네 로봇 춤 굉장해!'라고 말할 거예요. 완전 좋아할걸요."]],"role":[["P","Give a compliment to Minseo.","민서에게 칭찬 한마디 해 봐."],["D","Minseo, you are a sweet and funny friend.","민서야, 너는 다정하고 웃긴 친구야."],["P","Give a compliment to your dad.","아빠에게 칭찬 한마디 해 봐."],["D","Dad, your pasta is amazing! Better than a restaurant.","아빠, 아빠 파스타는 굉장해요! 식당보다 나아요."],["P","What compliment do you want to hear?","너는 어떤 칭찬을 듣고 싶어?"],["D","I want to hear, Dayoon, your drawing is amazing!","'다윤아, 네 그림 굉장하다!'라는 말을 듣고 싶어요."],["P","Why are kind words powerful?","다정한 말은 왜 힘이 셀까?"],["D","Because they make sad people smile again.","슬픈 사람을 다시 웃게 만드니까요."]],"wrap":[["P","You win the battle! Wrap up this comfort week in two or three sentences.","배틀은 네 승리야! 이번 위로 주간을 두세 문장으로 정리해 줘."],["D","This week I learned to say what's wrong, don't worry, and cheer up. I helped Siheon and gave compliments. Kind words are my superpower now!","이번 주에 '무슨 일이야', '걱정 마', '기운 내'를 배웠어요. 시헌이를 도와주고 칭찬도 했어요. 다정한 말은 이제 제 초능력이에요!"]],"tip":"저녁 식사 때 가족 모두 돌아가며 영어로 칭찬 한마디씩 하는 '칭찬 배틀'을 해 보세요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"2주차 총정리","interview":true,"pool":["What do you say when a friend looks upset?","Your friend lost her favorite toy. What do you say?","What advice do you give a friend who watches too many videos?","Why is listening important when a friend is sad?","What do you say when a friend makes a mistake?","How do you help Siheon when he cries?","What do you do when you feel worried?","Give me a compliment in English!","Who has a warm heart in your family, and why?","How do kind words help people?"],"tip":"인형이나 가족을 '고민 있는 친구' 역할로 세워 두고, 아이가 배운 위로 표현을 실제로 쓰게 해 보세요."}]},{"sub":"내 생각 말하기","days":[{"emoji":"💭","title":"Day 1 · I Think So!","sub":"내 생각은 이래요","words":[["think","생각하다","씽크"],["agree","동의하다","어그리"],["disagree","동의하지 않다","디스어그리"]],"sentence":["I think dogs are the best pets.","나는 강아지가 최고의 반려동물이라고 생각해."],"main":[["P","Dayoon, this week is Opinion Week! I say something, you say 'I agree' or 'I disagree.' Ready?","다윤아, 이번 주는 의견 주간이야! 내가 말하면 넌 '동의해' 또는 '동의 안 해'라고 답해. 준비됐어?"],["D","Ready! My brain is warmed up!","준비 완료! 두뇌 예열 끝났어요!"],["P","I think winter is the best season.","나는 겨울이 최고의 계절이라고 생각해."],["D","I disagree! I think summer is the best season. I can swim and eat ice cream!","동의 안 해요! 저는 여름이 최고라고 생각해요. 수영도 하고 아이스크림도 먹을 수 있잖아요!"],["P","Fair point! I think dogs are the best pets.","일리 있네! 나는 강아지가 최고의 반려동물이라고 생각해."],["D","I agree one hundred percent! Dogs are cute and friendly. I really want one!","백 퍼센트 동의해요! 강아지는 귀엽고 다정해요. 진짜 한 마리 갖고 싶어요!"],["P","Haha, I knew it. I think homework is fun.","하하, 그럴 줄 알았어. 나는 숙제가 재미있다고 생각해."],["D","I disagree!! Who thinks homework is fun? Robots, maybe!","동의 안 해요!! 누가 숙제를 재밌다고 생각해요? 로봇이면 몰라도!"],["P","Haha! Last one: I think Dayoon speaks English very well.","하하! 마지막이야. 나는 다윤이가 영어를 아주 잘한다고 생각해."],["D","Hmm... I agree! I practiced a lot this year!","음... 동의합니다! 올해 연습 많이 했으니까요!"]],"role":[["P","I think strawberries are better than grapes. Agree?","나는 딸기가 포도보다 낫다고 생각해. 동의해?"],["D","I agree! Strawberries are my favorite fruit.","동의해요! 딸기는 제가 제일 좋아하는 과일이에요."],["P","I think kids don't need sleep. Agree?","나는 아이들이 잠이 필요 없다고 생각해. 동의해?"],["D","I disagree! Kids need sleep to grow.","동의 안 해요! 아이들은 커야 하니까 잠이 필요해요."],["P","What do you think about your school?","너희 학교에 대해 어떻게 생각해?"],["D","I think my school is fun because of art class.","미술 시간 때문에 학교가 재밌다고 생각해요."],["P","What do you think about Gwacheon?","과천에 대해 어떻게 생각해?"],["D","I think Gwacheon is a great city. It has nice parks.","과천은 좋은 도시라고 생각해요. 멋진 공원이 있어요."]],"wrap":[["P","Strong opinions! Tell me one thing you agree with and one you disagree with.","의견이 확실하네! 동의하는 것 하나, 동의하지 않는 것 하나를 말해 줘."],["D","I agree that dogs are the best pets. I disagree that winter is the best season, because I think summer is better.","강아지가 최고의 반려동물이라는 데 동의해요. 겨울이 최고라는 건 동의 안 해요. 여름이 더 좋다고 생각하거든요."]],"tip":"일부러 아이가 반대할 만한 의견을 던져 주세요. disagree를 외치는 재미가 오늘 수업의 엔진입니다."},{"emoji":"🍕","title":"Day 2 · Pizza vs Pasta Battle","sub":"토론 배틀 1차전","words":[["debate","토론","디베이트"],["delicious","아주 맛있는","딜리셔스"],["win","이기다","윈"]],"sentence":["I think pasta is more delicious than pizza.","나는 파스타가 피자보다 더 맛있다고 생각해."],"main":[["P","Ding ding ding! Welcome to the Great Food Debate: Pizza versus Pasta! I am Team Pizza!","딩딩딩! 위대한 음식 토론에 오신 것을 환영합니다. 피자 대 파스타! 나는 피자 팀이야!"],["D","Then I am Team Pasta, of course! Pasta forever!","그럼 저는 당연히 파스타 팀이죠! 파스타여 영원하라!"],["P","Pizza is delicious because it has cheese, and you can share it with friends!","피자는 치즈가 있어서 맛있고, 친구들과 나눠 먹을 수 있습니다!"],["D","But pasta has cheese too! And I think pasta is more delicious because the sauce hugs every noodle!","하지만 파스타에도 치즈가 있어요! 그리고 소스가 면 하나하나를 안아 주니까 파스타가 더 맛있다고 생각해요!"],["P","The sauce hugs the noodle? Wow, that is poetry! But pizza is faster to eat!","소스가 면을 안아 준다고? 와, 시적인데! 하지만 피자는 더 빨리 먹을 수 있어!"],["D","Fast is not important! Yummy is important! Slurping noodles is the best part!","빠른 건 중요하지 않아요! 맛있는 게 중요하죠! 면 후루룩 소리가 최고 포인트라고요!"],["P","Hmm, strong point. Final question: which food is better for a birthday party?","음, 강력한데. 마지막 질문. 생일 파티엔 어떤 음식이 더 좋을까?"],["D","Pasta party! Everyone gets their own bowl. No fighting over the last piece!","파스타 파티요! 각자 자기 그릇이 있잖아요. 마지막 조각 가지고 싸울 일이 없어요!"],["P","No fighting... that is smart. Judge's decision: Team Pasta wins today!","안 싸운다라... 똑똑하네. 심판 판정, 오늘은 파스타 팀 승리!"],["D","Yes!! I win the debate! Pasta power!","예스!! 토론에서 이겼다! 파스타 파워!"]],"role":[["P","Why do you think pasta is the best food?","왜 파스타가 최고의 음식이라고 생각해?"],["D","Because the sauce is delicious and noodles are fun to eat.","소스가 맛있고 면은 먹는 재미가 있으니까요."],["P","What pizza topping do you like?","피자 토핑은 뭘 좋아해?"],["D","I like cheese and corn on my pizza.","피자엔 치즈랑 옥수수를 좋아해요."],["P","Who cooks pasta in your family?","너희 집에서는 누가 파스타를 요리해?"],["D","My dad cooks pasta on weekends.","주말에 아빠가 파스타를 요리해요."],["P","How does it feel to win a debate?","토론에서 이기니까 기분이 어때?"],["D","It feels amazing! I want to debate again.","정말 굉장해요! 또 토론하고 싶어요."]],"wrap":[["P","Great debate! Why did Team Pasta win? Two sentences, champion.","멋진 토론이었어! 파스타 팀이 왜 이겼지? 챔피언, 두 문장으로."],["D","I won because I gave good reasons. I said pasta is more delicious and a pasta party has no fighting!","좋은 이유를 말해서 이겼어요. 파스타가 더 맛있고, 파스타 파티는 싸울 일이 없다고 했거든요!"]],"tip":"심판 역할로 승패를 확실히 정해 주세요. 이기고 싶은 마음이 because 문장을 술술 나오게 합니다."},{"emoji":"📺","title":"Day 3 · The Yes-No Show","sub":"찬반 퀴즈쇼","words":[["opinion","의견","오피니언"],["true","사실인","트루"],["silly","엉뚱한","실리"]],"sentence":["In my opinion, that is too silly!","제 의견으로는, 그건 너무 엉뚱해요!"],"main":[["P","Welcome to the Yes-No Show! I say silly opinions, and you shout YES or NO with your reason. Lights on!","예스노 쇼에 오신 걸 환영합니다! 내가 엉뚱한 의견을 말하면, 넌 이유와 함께 YES나 NO를 외치는 거야. 조명 켜!"],["D","I'm ready! My buzzer finger is ready too!","준비됐어요! 제 버저 손가락도 준비 완료!"],["P","Opinion one: kids should eat candy for breakfast every day!","의견 1번. 아이들은 매일 아침으로 사탕을 먹어야 한다!"],["D","NO! In my opinion, that is too silly! Your teeth will run away from you!","NO! 제 의견으로는 너무 엉뚱해요! 이빨이 도망가 버릴걸요!"],["P","Haha! Opinion two: art class should be two hours long!","하하! 의견 2번. 미술 시간은 두 시간이어야 한다!"],["D","YES! Art is my favorite subject. One hour is too short for a masterpiece!","YES! 미술은 제가 제일 좋아하는 과목이에요. 명작을 그리기엔 한 시간은 너무 짧아요!"],["P","A masterpiece! Opinion three: it is true that vegetables are yucky.","명작이라니! 의견 3번. 채소는 맛없다는 게 사실이다."],["D","Hmm... half YES, half NO! Carrots are okay, but eggplant... no comment!","음... 반은 YES, 반은 NO! 당근은 괜찮은데, 가지는... 노코멘트!"],["P","No comment! Haha! Final opinion: Dayoon should go to bed at eight o'clock.","노코멘트래! 하하! 마지막 의견. 다윤이는 8시에 자야 한다."],["D","NO WAY! My bedtime is nine thirty. That is the law of this house!","말도 안 돼요! 제 취침 시간은 9시 반이에요. 그게 우리 집 법이라고요!"]],"role":[["P","In your opinion, what is the best subject at school?","네 의견으로는, 학교 최고의 과목이 뭐야?"],["D","In my opinion, art is the best subject.","제 의견으로는 미술이 최고의 과목이에요."],["P","Is it true that you want to be an architect?","네가 건축가가 되고 싶다는 게 사실이야?"],["D","Yes, it's true! An architect or a car designer.","네, 사실이에요! 건축가 아니면 자동차 디자이너요."],["P","Kids should have phones in class. Yes or no?","아이들이 수업 중에 휴대폰을 써도 된다. 예스야 노야?"],["D","No, because nobody will listen to the teacher.","노예요. 아무도 선생님 말을 안 들을 테니까요."],["P","What is the silliest opinion you heard today?","오늘 들은 제일 엉뚱한 의견은 뭐였어?"],["D","Candy for breakfast! That was really silly.","아침으로 사탕이요! 그건 정말 엉뚱했어요."]],"wrap":[["P","The show is over! What does 'in my opinion' mean, and give me one example.","쇼가 끝났습니다! 'in my opinion'이 무슨 뜻인지 말하고 예시 하나를 들어 줘."],["D","'In my opinion' means this is my thinking. In my opinion, art class should be two hours long!","'in my opinion'은 '내 생각에는'이라는 뜻이에요. 제 의견으로는 미술 시간은 두 시간이어야 해요!"]],"tip":"의견이 엉뚱할수록 아이의 반응이 커집니다. YES/NO 뒤에 because 이유를 꼭 붙이도록 기다려 주세요."},{"emoji":"❓","title":"Day 4 · Why Do You Think So?","sub":"이유를 말해요","words":[["reason","이유","리즌"],["important","중요한","임포턴트"],["explain","설명하다","익스플레인"]],"sentence":["I think so because it makes people happy.","사람들을 행복하게 해 주니까 그렇게 생각해요."],"main":[["P","Dayoon, today I am Mr. Why. Whatever you say, I ask why! Tell me your favorite color.","다윤아, 오늘 나는 '왜왜 아저씨'야. 네가 뭘 말하든 왜냐고 물을 거야! 좋아하는 색을 말해 봐."],["D","My favorite color is sky blue.","제가 좋아하는 색은 하늘색이에요."],["P","Why do you think sky blue is the best?","왜 하늘색이 최고라고 생각해?"],["D","Because it looks like summer sky, and it makes me feel calm.","여름 하늘 같고, 마음을 차분하게 해 주니까요."],["P","Good reason! Why is drawing important to you?","좋은 이유야! 그림 그리기는 너에게 왜 중요해?"],["D","Drawing is important because I can show my ideas without words.","그림은 말없이 제 생각을 보여 줄 수 있어서 중요해요."],["P","Wow. Why do you want to be an architect?","와. 왜 건축가가 되고 싶어?"],["D","Because I want to build a house with a big art room. And a strawberry garden!","큰 미술 방이 있는 집을 짓고 싶으니까요. 그리고 딸기 정원도요!"],["P","Haha, of course! Last one: why is Minseo your best friend?","하하, 역시! 마지막이야. 민서는 왜 네 단짝이야?"],["D","Because she laughs at my jokes and keeps my secrets. That is a real friend!","제 농담에 웃어 주고 비밀을 지켜 주니까요. 그게 진짜 친구죠!"]],"role":[["P","Why is sleep important?","잠은 왜 중요할까?"],["D","Because our body grows when we sleep.","잘 때 몸이 자라니까요."],["P","Why do you like summer? Explain!","여름을 왜 좋아해? 설명해 봐!"],["D","Because I can swim and there is no school!","수영할 수 있고 학교도 안 가니까요!"],["P","Why is family important?","가족은 왜 중요할까?"],["D","Because family loves me every day, good day or bad day.","좋은 날이든 나쁜 날이든 가족은 매일 저를 사랑해 주니까요."],["P","Why should we learn English?","우리는 왜 영어를 배워야 할까?"],["D","Because we can make friends all over the world.","전 세계에서 친구를 사귈 수 있으니까요."]],"wrap":[["P","Mr. Why is happy! Pick one opinion and explain your reason in two sentences.","왜왜 아저씨가 만족했어! 의견 하나를 골라 이유를 두 문장으로 설명해 줘."],["D","I think drawing is the most important thing for me. The reason is that I can show my ideas, and it makes me calm and happy.","저에게는 그림이 제일 중요하다고 생각해요. 이유는 제 생각을 보여 줄 수 있고, 저를 차분하고 행복하게 해 주기 때문이에요."]],"tip":"'Why?'를 세 번 연속으로 파고들어 보세요. because 문장이 길어질수록 폭풍 칭찬해 주시면 됩니다."},{"emoji":"🌞","title":"Day 5 · Summer vs Winter Battle","sub":"토론 배틀 2차전","words":[["season","계절","시즌"],["vacation","방학","베이케이션"],["freezing","꽁꽁 어는","프리징"]],"sentence":["Summer is better because vacation is longer.","방학이 더 기니까 여름이 더 좋아요."],"main":[["P","Debate battle round two! Summer versus Winter! I am Team Winter. Brrr, let's go!","토론 배틀 2차전! 여름 대 겨울! 나는 겨울 팀이야. 부르르, 시작하자!"],["D","Team Summer here! The sunshine team always wins!","여름 팀 등장! 햇살 팀은 언제나 승리하죠!"],["P","Winter has snow! You can make snowmen and go sledding!","겨울엔 눈이 있어! 눈사람도 만들고 썰매도 탈 수 있지!"],["D","But winter is freezing! My fingers become ice sticks! Summer has swimming and watermelon!","하지만 겨울은 꽁꽁 얼어요! 손가락이 얼음 막대가 된다고요! 여름엔 수영도 있고 수박도 있어요!"],["P","Hmm! But in winter, you can drink hot chocolate under a warm blanket!","흠! 하지만 겨울엔 따뜻한 이불 속에서 핫초코를 마실 수 있어!"],["D","In summer, I can do that too, with the air conditioner on! Ha!","여름에도 할 수 있어요. 에어컨 켜고요! 하!"],["P","What?! That's cheating! Okay, final point: winter has Christmas!","뭐?! 그건 반칙이지! 좋아, 마지막 포인트. 겨울엔 크리스마스가 있다!"],["D","Summer has summer vacation, and it is longer! More days to play, more days to draw!","여름엔 여름 방학이 있고, 더 길어요! 노는 날도 더 많고 그리는 날도 더 많아요!"],["P","Longer vacation... that is a powerful reason. The judge says: Team Summer wins by one point!","더 긴 방학이라... 강력한 이유네. 심판 판정, 여름 팀이 1점 차 승리!"],["D","Woohoo! Two wins for Dayoon! I am the debate queen!","우후! 다윤이 2연승! 제가 토론 여왕이에요!"]],"role":[["P","Which season is better for you, and why?","너에게는 어떤 계절이 더 좋아? 이유는?"],["D","Summer is better because I love swimming.","수영을 좋아해서 여름이 더 좋아요."],["P","What do you do on summer vacation?","여름 방학에는 뭘 해?"],["D","I swim, draw, and eat cold watermelon.","수영하고 그림 그리고 시원한 수박을 먹어요."],["P","Say one good thing about winter.","겨울의 좋은 점을 하나 말해 봐."],["D","Snow is beautiful, and I like snowball fights.","눈이 아름답고 눈싸움도 좋아해요."],["P","Is Gwacheon freezing in winter?","과천은 겨울에 꽁꽁 얼게 추워?"],["D","Yes! I wear two jackets and a big scarf.","네! 저는 외투를 두 개 입고 큰 목도리를 해요."]],"wrap":[["P","Debate queen! Why did Team Summer win? Two or three sentences.","토론 여왕! 여름 팀이 왜 이겼지? 두세 문장으로."],["D","Team Summer won because I gave strong reasons. Summer has swimming and a longer vacation. Winter is fun, but it is too freezing for me!","강력한 이유를 말해서 여름 팀이 이겼어요. 여름엔 수영과 더 긴 방학이 있어요. 겨울도 재밌지만 저한텐 너무 추워요!"]],"tip":"부모님이 진심으로 반박해 주셔야 토론이 삽니다. 아이 논리가 막히면 'But...'으로 힌트를 던져 주세요."},{"emoji":"🗣️","title":"Day 6 · My 30-Second Opinion","sub":"30초 미니 스피치","words":[["speech","연설","스피치"],["first","첫째로","퍼스트"],["finally","마지막으로","파이널리"]],"sentence":["First, second, finally — that's how I explain!","첫째, 둘째, 마지막으로 — 이렇게 설명해요!"],"main":[["P","Today you become a speaker! A 30-second speech: 'Why dogs are the best pets.' Use first, second, finally!","오늘 너는 연설가가 되는 거야! 30초 스피치, 주제는 '왜 강아지가 최고의 반려동물인가'. first, second, finally를 써 봐!"],["D","Thirty seconds? That's so long! ... Okay, I can do it.","30초요? 엄청 긴데요! ... 좋아요, 할 수 있어요."],["P","Take your time. I will count with my fingers. Ready, go!","천천히 해. 내가 손가락으로 시간을 셀게. 준비, 시작!"],["D","Hello! I think dogs are the best pets. First, dogs are friendly. They always welcome you at the door.","안녕하세요! 저는 강아지가 최고의 반려동물이라고 생각합니다. 첫째, 강아지는 다정해요. 항상 문 앞에서 반겨 줘요."],["P","Good! Keep going, fifteen seconds left!","좋아! 계속해, 15초 남았어!"],["D","Second, dogs can play with you every day. Finally, a dog can be your best friend forever. Thank you!","둘째, 강아지는 매일 같이 놀 수 있어요. 마지막으로, 강아지는 영원한 단짝이 될 수 있어요. 감사합니다!"],["P","Exactly thirty seconds! Perfect timing! How do you feel?","정확히 30초야! 완벽한 타이밍! 기분이 어때?"],["D","My heart was going boom boom, but I did it!","심장이 쿵쿵거렸지만, 해냈어요!"],["P","One tip: look at me, not at the ceiling. The ceiling is not your audience! Haha!","팁 하나. 천장 말고 나를 봐. 천장은 관객이 아니야! 하하!"],["D","Haha! Okay! Next time, eye contact one hundred percent!","하하! 알겠어요! 다음엔 눈 맞춤 백 퍼센트!"]],"role":[["P","What are the three magic words for a speech?","스피치를 위한 마법의 세 단어는 뭐지?"],["D","First, second, and finally!","first, second, 그리고 finally요!"],["P","How do you start a speech?","스피치는 어떻게 시작해?"],["D","I say hello and tell my opinion first.","인사를 하고 먼저 제 의견을 말해요."],["P","What was hard about the speech?","스피치에서 뭐가 어려웠어?"],["D","Speaking for thirty seconds without stopping was hard.","멈추지 않고 30초 동안 말하는 게 어려웠어요."],["P","What will you do better next time?","다음엔 뭘 더 잘할 거야?"],["D","I will make eye contact and speak louder.","눈을 맞추고 더 크게 말할 거예요."]],"wrap":[["P","Amazing first speech! Tell me your speech structure in two sentences.","첫 스피치 굉장했어! 네 스피치 구조를 두 문장으로 말해 줘."],["D","I said my opinion first, then gave reasons with first, second, and finally. My heart went boom boom, but I finished my thirty seconds!","먼저 제 의견을 말하고, first, second, finally로 이유를 말했어요. 심장이 쿵쿵거렸지만 30초를 다 채웠어요!"]],"tip":"휴대폰 타이머로 30초를 재고 성공하면 꼭 박수를! 같은 스피치를 두 번 반복하면 자신감이 눈에 띄게 올라갑니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"3주차 총정리","interview":true,"pool":["I think winter is the best season. Do you agree or disagree? Why?","Which is more delicious, pizza or pasta? Give me your reason.","In your opinion, what is the best subject at school?","Why do you like sky blue? Explain.","Why do you want to be an architect or a car designer?","Kids should eat candy for breakfast. Yes or no? Why?","Why is Minseo your best friend?","Which is better, summer or winter? Give two reasons.","What are the three magic words for a speech?","Give me a short opinion speech: why dogs are great pets."],"tip":"마지막 질문의 미니 스피치는 시간을 재 주세요. 이번 주 배운 first, second, finally가 나오면 대성공입니다."}]},{"sub":"비교해서 말하기","days":[{"emoji":"📏","title":"Day 1 · Bigger and Taller","sub":"비교급 첫걸음","words":[["bigger","더 큰","비거"],["taller","키가 더 큰","톨러"],["smaller","더 작은","스몰러"]],"sentence":["An elephant is bigger than a mouse.","코끼리는 쥐보다 더 커요."],"main":[["P","Dayoon, final week! This week we compare things. Which is bigger, an elephant or a mouse?","다윤아, 마지막 주야! 이번 주엔 비교하기를 배워. 코끼리랑 쥐 중에 뭐가 더 커?"],["D","Easy! An elephant is bigger than a mouse.","쉬워요! 코끼리는 쥐보다 더 커요."],["P","Correct! Now look around your room. Find something smaller than your hand.","정답! 이제 방을 둘러봐. 네 손보다 작은 걸 찾아봐."],["D","My eraser! My eraser is smaller than my hand.","지우개요! 제 지우개는 제 손보다 작아요."],["P","Good! Who is taller, you or Siheon?","좋아! 너랑 시헌이 중에 누가 더 키가 커?"],["D","I am taller than Siheon. He is only seven!","제가 시헌이보다 커요. 걔는 겨우 일곱 살이잖아요!"],["P","And who is taller, you or your dad?","그럼 너랑 아빠 중에는 누가 더 커?"],["D","My dad is much taller than me. But one day, I will be taller than him! Maybe!","아빠가 저보다 훨씬 커요. 하지만 언젠가 제가 아빠보다 커질 거예요! 아마도요!"],["P","Haha! Last quiz: which is bigger, your love for pasta or your love for homework?","하하! 마지막 퀴즈. 파스타 사랑과 숙제 사랑 중 뭐가 더 커?"],["D","My love for pasta is one million times bigger! Sorry, homework!","파스타 사랑이 백만 배 더 커요! 미안, 숙제야!"]],"role":[["P","Which is bigger, the sun or the moon?","태양과 달 중 뭐가 더 커?"],["D","The sun is bigger than the moon.","태양이 달보다 커요."],["P","Who is taller, Minseo or you?","민서랑 너 중에 누가 더 커?"],["D","Minseo is a little taller than me.","민서가 저보다 조금 더 커요."],["P","Find something bigger than your desk.","책상보다 큰 걸 찾아봐."],["D","My bed is bigger than my desk.","제 침대가 책상보다 커요."],["P","Is Gwacheon bigger than Seoul?","과천이 서울보다 커?"],["D","No, Seoul is much bigger than Gwacheon.","아니요, 서울이 과천보다 훨씬 커요."]],"wrap":[["P","You've got it! Compare two things in your house in two sentences.","감 잡았네! 집에 있는 두 가지를 두 문장으로 비교해 줘."],["D","My bed is bigger than my desk. And I am taller than Siheon, but my dad is taller than me.","제 침대는 책상보다 커요. 그리고 저는 시헌이보다 크지만, 아빠는 저보다 커요."]],"tip":"집안 물건 두 개를 들고 'Which is bigger?'를 반복하세요. -er than 리듬이 입에 붙는 게 목표입니다."},{"emoji":"🐶","title":"Day 2 · Dogs vs Cats","sub":"동물 비교 대결","words":[["faster","더 빠른","패스터"],["cuter","더 귀여운","큐터"],["friendlier","더 다정한","프렌들리어"]],"sentence":["Dogs are friendlier than cats.","강아지는 고양이보다 더 다정해요."],"main":[["P","Animal battle time! Dogs versus cats! I know your answer already, but defend it with comparisons!","동물 배틀 시간! 강아지 대 고양이! 네 답은 이미 알지만, 비교급으로 변호해 봐!"],["D","Dogs win! Dogs are friendlier than cats. They love everyone!","강아지 승리! 강아지는 고양이보다 다정해요. 모두를 사랑한다고요!"],["P","But cats are quieter than dogs. Dogs bark all night! Woof woof!","하지만 고양이는 강아지보다 조용해. 강아지는 밤새 짖잖아! 멍멍!"],["D","Not all dogs! And dogs are faster than cats. They can run with you in the park!","다 그런 건 아니에요! 그리고 강아지는 고양이보다 빨라요. 공원에서 같이 뛸 수 있어요!"],["P","Hmm, actually cats are faster in short races... but okay! Which is cuter?","음, 사실 단거리는 고양이가 더 빠른데... 그래 좋아! 어느 쪽이 더 귀여워?"],["D","Puppies are cuter than kittens! Those big eyes! That waggy tail!","강아지가 새끼 고양이보다 귀여워요! 그 큰 눈! 살랑살랑 꼬리!"],["P","Waggy tail, strong point. So, future dog owner Dayoon, what dog do you want?","살랑 꼬리, 강력하네. 그럼 미래의 강아지 주인 다윤 님, 어떤 강아지를 원하나요?"],["D","A small white puppy! I will name him Mochi. Mochi and I will be best friends!","작고 하얀 강아지요! 이름은 모찌라고 지을 거예요. 모찌랑 저는 단짝이 될 거예요!"],["P","Mochi! Cute name. But who will clean Mochi's poop?","모찌! 귀여운 이름이네. 근데 모찌 똥은 누가 치우지?"],["D","Umm... Siheon? Haha! Okay, okay, me. A good owner cleans everything!","음... 시헌이요? 하하! 알겠어요, 알겠어요, 저요. 좋은 주인은 다 치워요!"]],"role":[["P","Which animal is friendlier, a dog or a cat?","강아지랑 고양이 중 어느 동물이 더 다정해?"],["D","I think dogs are friendlier than cats.","강아지가 고양이보다 다정하다고 생각해요."],["P","Which animal is faster, a rabbit or a turtle?","토끼랑 거북이 중 뭐가 더 빨라?"],["D","A rabbit is faster than a turtle.","토끼가 거북이보다 빨라요."],["P","What dog name do you like?","어떤 강아지 이름이 좋아?"],["D","I like Mochi. It sounds soft and cute.","모찌가 좋아요. 부드럽고 귀엽게 들려요."],["P","What will you do with your future puppy?","미래의 강아지랑 뭘 할 거야?"],["D","I will walk him and draw his face every day.","매일 산책시키고 강아지 얼굴을 그릴 거예요."]],"wrap":[["P","Team Dog wins again! Compare dogs and cats in two or three sentences.","강아지 팀 또 승리! 강아지와 고양이를 두세 문장으로 비교해 줘."],["D","Dogs are friendlier and faster than cats. Puppies are cuter too. I want a white puppy named Mochi someday!","강아지는 고양이보다 다정하고 빨라요. 강아지가 더 귀엽기도 해요. 언젠가 모찌라는 하얀 강아지를 키우고 싶어요!"]],"tip":"아이가 강아지를 좋아하니 오늘은 말이 많아지는 날입니다. 비교급 -er/-ier 발음을 살짝 교정해 주세요."},{"emoji":"🍓","title":"Day 3 · Which Is Better?","sub":"먹거리 비교하기","words":[["sweeter","더 달콤한","스위터"],["healthier","더 건강한","헬시어"],["cheaper","더 싼","치퍼"]],"sentence":["Strawberries are sweeter than lemons.","딸기는 레몬보다 더 달콤해요."],"main":[["P","Food market game! I am a fruit seller. Fresh fruits! Which is sweeter, strawberries or lemons?","음식 시장 놀이! 나는 과일 장수야. 신선한 과일이요! 딸기와 레몬 중 뭐가 더 달아요?"],["D","Strawberries are sweeter than lemons, of course! Lemons make my face go squishy!","당연히 딸기가 레몬보다 달죠! 레몬은 제 얼굴을 찌글찌글하게 만들어요!"],["P","Haha, show me the lemon face! ... Perfect! Now, which is healthier, fruit or candy?","하하, 레몬 얼굴 보여 줘! ... 완벽해! 자, 과일과 사탕 중 뭐가 더 건강할까?"],["D","Fruit is healthier than candy. My mom says that every single day!","과일이 사탕보다 건강해요. 엄마가 매일매일 말씀하시거든요!"],["P","Smart mom! Now you be the seller. Sell me something!","똑똑한 엄마네! 이제 네가 장수 해 봐. 나한테 뭐든 팔아 봐!"],["D","Welcome! Today strawberries are cheaper than yesterday! Three thousand won! Sweet like candy, healthier than candy!","어서 오세요! 오늘 딸기가 어제보다 싸요! 삼천 원! 사탕처럼 달고, 사탕보다 건강해요!"],["P","Wow, what a seller! Okay, I will buy two boxes. Anything else?","와, 장사 천재네! 좋아요, 두 박스 살게요. 다른 건요?"],["D","Watermelon! Bigger than a soccer ball, sweeter than juice! Only five thousand won!","수박이요! 축구공보다 크고, 주스보다 달아요! 단돈 오천 원!"],["P","You sold everything! Where did you learn to sell like that?","다 팔았네! 그런 장사 실력은 어디서 배웠어?"],["D","From the Gwacheon market! The sellers there are louder than K-pop singers! Haha!","과천 시장에서요! 거기 상인 아저씨들은 케이팝 가수보다 목소리가 커요! 하하!"]],"role":[["P","Which is sweeter, chocolate or bread?","초콜릿과 빵 중 뭐가 더 달아?"],["D","Chocolate is sweeter than bread.","초콜릿이 빵보다 달아요."],["P","Which is healthier, water or soda?","물과 탄산음료 중 뭐가 더 건강해?"],["D","Water is healthier than soda.","물이 탄산음료보다 건강해요."],["P","Which fruit is cheaper in summer, watermelon or strawberries?","여름엔 수박과 딸기 중 뭐가 더 싸?"],["D","Watermelon is cheaper in summer.","여름엔 수박이 더 싸요."],["P","What snack do you want right now?","지금 무슨 간식이 먹고 싶어?"],["D","I want strawberries with condensed milk!","연유 뿌린 딸기가 먹고 싶어요!"]],"wrap":[["P","The market is closed! Compare two foods in two sentences, seller Dayoon.","시장 문 닫습니다! 다윤 사장님, 음식 두 가지를 두 문장으로 비교해 주세요."],["D","Strawberries are sweeter than lemons and healthier than candy. Water is healthier than soda, but strawberry juice is yummier!","딸기는 레몬보다 달고 사탕보다 건강해요. 물은 탄산음료보다 건강하지만, 딸기 주스가 더 맛있어요!"]],"tip":"마트나 시장에 갔을 때 'Which is cheaper?'를 실제로 물어보세요. 가격표 읽기와 비교급을 동시에 연습할 수 있습니다."},{"emoji":"👨‍👩‍👧‍👦","title":"Day 4 · My Family Rankings","sub":"우리 가족 비교하기","words":[["younger","더 어린","영거"],["stronger","더 힘센","스트롱거"],["funnier","더 웃긴","퍼니어"]],"sentence":["Siheon is younger than me, but he is louder!","시헌이는 나보다 어리지만 목소리는 더 커요!"],"main":[["P","Today we make Family Rankings! Question one: who is younger, you or Siheon?","오늘은 가족 랭킹을 만들자! 1번 질문. 너랑 시헌이 중 누가 더 어려?"],["D","Siheon is younger than me. He is seven and I am ten.","시헌이가 저보다 어려요. 걔는 일곱 살이고 저는 열 살이에요."],["P","Who is stronger, your dad or your mom?","아빠랑 엄마 중 누가 더 힘이 세?"],["D","Hmm, my dad is stronger, but my mom is scarier when we don't clean up! Haha!","음, 아빠가 더 힘세요. 하지만 정리 안 하면 엄마가 더 무서워요! 하하!"],["P","Haha! Every house is the same! Who is funnier, you or Siheon?","하하! 어느 집이나 똑같구나! 너랑 시헌이 중 누가 더 웃겨?"],["D","I am funnier! Siheon just falls down. I make real jokes!","제가 더 웃겨요! 시헌이는 그냥 넘어지는 거고, 저는 진짜 개그를 하죠!"],["P","Real jokes! Okay, who wakes up earlier, you or Siheon?","진짜 개그라니! 좋아, 너랑 시헌이 중 누가 더 일찍 일어나?"],["D","Siheon wakes up earlier than me. He jumps on my bed at seven!","시헌이가 저보다 일찍 일어나요. 7시에 제 침대로 뛰어들어요!"],["P","Final ranking: who draws better, you or your art teacher?","마지막 랭킹. 너랑 미술 선생님 중 누가 그림을 더 잘 그려?"],["D","My teacher draws better than me... for now! Next year, watch out, teacher!","지금은... 선생님이 더 잘 그려요! 내년엔 조심하세요, 선생님!"]],"role":[["P","Who is taller, your mom or your dad?","엄마랑 아빠 중 누가 더 키가 커?"],["D","My dad is taller than my mom.","아빠가 엄마보다 키가 커요."],["P","Who is louder, you or Siheon?","너랑 시헌이 중 누가 더 시끄러워?"],["D","Siheon is much louder than me!","시헌이가 저보다 훨씬 시끄러워요!"],["P","Who is busier, your mom or your dad?","엄마랑 아빠 중 누가 더 바빠?"],["D","I think they are both busy, but my mom (works at home).","둘 다 바쁘신 것 같아요. 그런데 엄마는 (집에서 일하세요)."],["P","Who eats faster in your family?","가족 중 누가 밥을 제일 빨리 먹어?"],["D","My dad eats faster than everyone.","아빠가 모두보다 빨리 드세요."]],"wrap":[["P","Family rankings complete! Give me your top three family facts with comparisons.","가족 랭킹 완성! 비교급을 써서 가족 팩트 세 가지를 말해 줘."],["D","Siheon is younger and louder than me. My dad is taller and stronger than all of us. And I am the funniest — that's a fact!","시헌이는 저보다 어리고 시끄러워요. 아빠는 우리 모두보다 크고 힘세요. 그리고 제가 제일 웃겨요 — 이건 팩트예요!"]],"tip":"가족 모두를 소재로 하면 아이가 신나서 폭로(?)를 시작합니다. 웃으면서 비교급 형태만 살짝 다듬어 주세요."},{"emoji":"🥇","title":"Day 5 · The Best of All","sub":"최고를 뽑아요","words":[["best","최고의","베스트"],["worst","최악의","워스트"],["most","가장","모스트"]],"sentence":["Art is the most exciting class of all.","미술은 모든 수업 중 가장 신나는 수업이에요."],"main":[["P","Today, no more 'than'! Now we pick THE BEST! What is the best food in the world?","오늘은 'than'은 그만! 이제 최고를 뽑는 거야! 세상 최고의 음식은 뭐지?"],["D","Pasta is the best food in the world! Cream pasta, number one!","파스타가 세상 최고의 음식이에요! 크림 파스타, 넘버 원!"],["P","And the worst food?","그럼 최악의 음식은?"],["D","The worst food is eggplant. Sorry, eggplant fans!","최악의 음식은 가지예요. 가지 팬들에겐 미안하지만요!"],["P","Haha! What is the most exciting class at school?","하하! 학교에서 가장 신나는 수업은 뭐야?"],["D","Art is the most exciting class of all. Time flies when I draw!","미술이 모든 수업 중 가장 신나요. 그림 그릴 땐 시간이 순삭이에요!"],["P","Time flies! Nice expression! Who is the funniest person in your class?","시간 순삭! 표현 좋은데! 너희 반에서 가장 웃긴 사람은 누구야?"],["D","Minseo is the funniest. Her dance moves are legendary!","민서가 제일 웃겨요. 걔 춤은 전설이에요!"],["P","Legendary! Final question: what is the best moment of your day?","전설이라니! 마지막 질문. 하루 중 최고의 순간은 언제야?"],["D","Nine o'clock! Homework is done, and I can draw freely before bed. The best thirty minutes of my life!","밤 9시요! 숙제도 끝났고, 자기 전에 자유롭게 그림을 그릴 수 있어요. 제 인생 최고의 30분이에요!"]],"role":[["P","What is the best season of the year?","일 년 중 최고의 계절은 뭐야?"],["D","Summer is the best season of the year.","여름이 일 년 중 최고의 계절이에요."],["P","What is the most beautiful color?","가장 아름다운 색은 뭐야?"],["D","Sky blue is the most beautiful color.","하늘색이 가장 아름다운 색이에요."],["P","Who is the kindest person you know?","네가 아는 가장 친절한 사람은 누구야?"],["D","My mom is the kindest person I know.","엄마가 제가 아는 가장 친절한 사람이에요."],["P","What is the worst chore at home?","집안일 중 최악은 뭐야?"],["D","Cleaning my desk is the worst. Papers everywhere!","책상 정리가 최악이에요. 종이가 사방에 있거든요!"]],"wrap":[["P","Best answers ever! Tell me your top picks in two or three sentences.","역대 최고의 대답이야! 너의 최고 픽들을 두세 문장으로 말해 줘."],["D","Pasta is the best food, and art is the most exciting class. Sky blue is the most beautiful color. And my mom is the kindest person of all!","파스타는 최고의 음식이고 미술은 가장 신나는 수업이에요. 하늘색은 가장 아름다운 색이에요. 그리고 엄마는 모두 중에 가장 친절한 사람이에요!"]],"tip":"어제의 -er than과 오늘의 the best/most를 섞어 물어보며 차이를 느끼게 해 주세요."},{"emoji":"🎙️","title":"Day 6 · My Feelings Speech","sub":"이달의 파이널 스피치","words":[["audience","관객","오디언스"],["confident","자신 있는","컨피던트"],["clap","박수 치다","클랩"]],"sentence":["I feel confident in front of the audience.","관객 앞에서 나는 자신 있어요."],"main":[["P","It's the final stage of Feelings Month! Topic: 'My feelings and my opinion.' Thirty seconds, all your skills!","감정의 달 파이널 무대야! 주제는 '나의 감정과 나의 의견'. 30초, 모든 기술을 다 써 봐!"],["D","The final stage... okay! I feel nervous but confident!","파이널 무대라니... 좋아요! 긴장되지만 자신 있어요!"],["P","That's the spirit! The audience is waiting. Clap clap clap! Go!","바로 그거야! 관객이 기다리고 있어. 짝짝짝! 시작!"],["D","Hello everyone! I am Dayoon. This month I learned about feelings. I feel excited when I skate, and I feel calm when I draw.","안녕하세요, 여러분! 저는 다윤입니다. 이번 달에 감정에 대해 배웠어요. 스케이트 탈 때 신나고, 그림 그릴 때 차분해져요."],["P","Beautiful! Keep going!","아름다워! 계속해!"],["D","In my opinion, feelings are like weather. Rain comes, but the sun always comes back. So don't worry about bad days! Thank you!","제 의견으로는, 감정은 날씨 같아요. 비가 와도 해는 다시 떠요. 그러니 나쁜 날을 걱정하지 마세요! 감사합니다!"],["P","Bravo!! The audience is crying! That weather line was amazing!","브라보!! 관객들이 울고 있어! 그 날씨 문장 정말 굉장했어!"],["D","Thank you, thank you! I made it up myself, from Mood Weather day!","감사합니다, 감사합니다! 기분 날씨 하던 날 생각나서 제가 만든 거예요!"],["P","You connected old learning to new speech. That is real skill! How confident do you feel now, from one to ten?","예전에 배운 걸 새 스피치에 연결했네. 그게 진짜 실력이야! 지금 자신감이 1에서 10 중에 몇이야?"],["D","Nine! I saved one point for next month's one-minute speech!","9요! 다음 달 1분 스피치를 위해 1점은 아껴 뒀어요!"]],"role":[["P","How did you feel before the speech?","스피치 전에 기분이 어땠어?"],["D","I felt nervous, and my hands were cold.","긴장돼서 손이 차가웠어요."],["P","How did you feel after the speech?","스피치 후에는 기분이 어땠어?"],["D","I felt proud and confident. I wanted to do it again!","자랑스럽고 자신 있었어요. 또 하고 싶었어요!"],["P","What was the best part of your speech?","네 스피치에서 최고의 부분은 뭐였어?"],["D","The best part was 'feelings are like weather.'","최고의 부분은 '감정은 날씨 같다'였어요."],["P","What does a good audience do?","좋은 관객은 뭘 하지?"],["D","A good audience listens well and claps loudly!","좋은 관객은 잘 듣고 크게 박수 쳐요!"]],"wrap":[["P","The final stage was a success! Wrap up Feelings Month in three sentences.","파이널 무대 대성공! 감정의 달을 세 문장으로 마무리해 줘."],["D","This month I learned feeling words, comfort words, and opinions. I can compare things and say I agree or disagree. Now I feel confident speaking for thirty seconds!","이번 달에 감정 단어, 위로하는 말, 의견 말하기를 배웠어요. 비교도 할 수 있고 동의, 반대도 말할 수 있어요. 이제 30초 스피치도 자신 있어요!"]],"tip":"가족을 관객으로 모아 진짜 무대처럼 박수를 보내 주세요. 스피치 후 셀프 점수를 물으면 메타인지가 자랍니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"4주차 총정리","interview":true,"pool":["Who is taller, you or Siheon? And who is louder?","Compare dogs and cats. Which do you like more, and why?","Which is healthier, fruit or candy? Explain.","Who is the funniest person in your family?","What is the best food in the world, in your opinion?","What is the most exciting class at school for you?","Sky blue or pink — which is more beautiful to you? Why?","How do you feel before a speech, and how do you feel after?","Feelings are like weather. What does that mean?","Give me a 30-second speech about your feelings and opinions!"],"tip":"한 달 총정리 날입니다. 마지막 스피치 질문은 꼭 시간을 재고, 지난주보다 나아진 점을 구체적으로 칭찬해 주세요."}]}]});
MONTHS.push({"m":12,"theme":"한 해 돌아보기","q":3,"weeks":[{"sub":"올해 배운 것","days":[{"emoji":"📚","title":"Day 1 · This Year I Learned","sub":"올해 배운 것들","words":[["learned","배웠다","런드"],["practiced","연습했다","프랙티스트"],["grow","자라다","그로우"]],"sentence":["This year, I learned to speak English every day.","올해 나는 매일 영어로 말하는 법을 배웠어요."],"main":[["P","Dayoon, it's the last month of our English year! Look back — what did you learn this year?","다윤아, 우리 영어 일 년의 마지막 달이야! 돌아보자. 올해 뭘 배웠어?"],["D","Wow, so many things! I learned to talk about my family, my school, and my feelings.","와, 정말 많아요! 가족, 학교, 감정에 대해 말하는 법을 배웠어요."],["P","That's right! And what did you practice the most?","맞아! 그럼 뭘 제일 많이 연습했어?"],["D","I practiced speaking every day. At the start, I only said yes and no!","매일 말하기를 연습했어요. 처음엔 yes랑 no만 말했다니까요!"],["P","Haha, I remember! You were the yes-no robot!","하하, 기억나! 너 예스노 로봇이었잖아!"],["D","Beep beep! Yes! But now the robot tells jokes in English!","삑삑! 예스! 근데 이제 그 로봇이 영어로 개그를 해요!"],["P","You really did grow this year. What was the hardest thing you learned?","올해 정말 많이 자랐어. 배운 것 중에 제일 어려웠던 건 뭐야?"],["D","Speeches were the hardest. My heart went boom boom every time!","스피치가 제일 어려웠어요. 할 때마다 심장이 쿵쿵거렸어요!"],["P","And now? Can you do a speech?","지금은? 스피치 할 수 있어?"],["D","Now I can! This month I will do a ONE-minute speech. Watch me grow!","이제 할 수 있어요! 이번 달엔 1분 스피치를 할 거예요. 제가 자라는 걸 지켜보세요!"]],"role":[["P","What did you learn in English this year?","올해 영어로 뭘 배웠어?"],["D","I learned to talk about myself, my family, and my feelings.","저 자신, 가족, 감정에 대해 말하는 법을 배웠어요."],["P","What did you practice every week?","매주 뭘 연습했어?"],["D","I practiced the weekly interview every Sunday.","매주 일요일에 주간 인터뷰를 연습했어요."],["P","How did your English grow this year?","올해 네 영어가 어떻게 자랐어?"],["D","At first I said one word. Now I can say long sentences!","처음엔 한 단어만 말했는데, 이제 긴 문장을 말할 수 있어요!"],["P","What was easy, and what was hard?","뭐가 쉬웠고 뭐가 어려웠어?"],["D","Food words were easy. Speeches were hard, but I did them!","음식 단어는 쉬웠어요. 스피치는 어려웠지만 해냈어요!"]],"wrap":[["P","What a year! Tell me three things you learned, in past tense.","대단한 한 해였어! 배운 것 세 가지를 과거형으로 말해 줘."],["D","This year I learned many English words. I practiced speaking every day, and I learned to do a thirty-second speech. I grew a lot!","올해 영어 단어를 많이 배웠어요. 매일 말하기를 연습했고, 30초 스피치도 배웠어요. 저 정말 많이 자랐어요!"]],"tip":"지난 달들의 교재나 그림을 꺼내 놓고 이야기하면 'I learned...' 과거형 문장이 훨씬 풍성해집니다."},{"emoji":"🚂","title":"Day 2 · Time Machine Quiz","sub":"추억 퀴즈 열차","words":[["remember","기억하다","리멤버"],["quiz","퀴즈","퀴즈"],["past","과거","패스트"]],"sentence":["Do you remember what we learned in spring?","우리가 봄에 배운 거 기억나요?"],"main":[["P","All aboard the Time Machine Train! Choo choo! We travel to the past and answer quizzes. First stop: spring!","타임머신 열차에 탑승하세요! 칙칙폭폭! 과거로 가서 퀴즈를 푸는 거야. 첫 정거장, 봄!"],["D","Choo choo! I'm ready, conductor!","칙칙폭폭! 준비됐어요, 기관사님!"],["P","Spring quiz: do you remember how to introduce yourself? Show me!","봄 퀴즈! 자기소개하는 법 기억나? 보여 줘!"],["D","Of course! Hello, my name is Dayoon. I am ten years old. I live in Gwacheon. Too easy!","당연하죠! 안녕하세요, 제 이름은 다윤입니다. 열 살이고요. 과천에 살아요. 너무 쉬워요!"],["P","Excellent! Next stop, summer! Quiz: what did you say about your family?","훌륭해! 다음 정거장, 여름! 퀴즈. 가족에 대해 뭐라고 말했지?"],["D","I have a dad, a mom, and a little brother, Siheon. He was six in the past... now he is seven and still loud!","아빠, 엄마, 남동생 시헌이가 있어요. 과거엔 여섯 살이었는데... 지금은 일곱 살이고 여전히 시끄러워요!"],["P","Haha! Fall station! Do you remember the school words? What was your favorite subject?","하하! 가을역! 학교 단어들 기억나? 제일 좋아하는 과목이 뭐였지?"],["D","Art was and is my favorite subject! Some answers never change!","미술은 그때도 지금도 제일 좋아하는 과목이에요! 어떤 답은 절대 안 변해요!"],["P","Last stop: last month! What were the three speech words?","마지막 정거장, 지난달! 스피치의 세 단어는 뭐였지?"],["D","First, second, finally! Ding ding! Quiz train champion, Dayoon!","First, second, finally! 딩딩! 퀴즈 열차 챔피언, 다윤!"]],"role":[["P","Do you remember your first English class? How was it?","첫 영어 수업 기억나? 어땠어?"],["D","Yes! I was shy and only smiled.","네! 부끄러워서 웃기만 했어요."],["P","What food words do you remember from the past?","예전에 배운 음식 단어 뭐가 기억나?"],["D","I remember pasta, strawberry, and delicious!","파스타, 딸기, 딜리셔스가 기억나요!"],["P","Do you remember a funny class moment?","수업 중 웃겼던 순간 기억나?"],["D","Yes, the lemon face day! My face went squishy!","네, 레몬 얼굴 하던 날이요! 얼굴이 찌글찌글해졌었죠!"],["P","Which month was your favorite?","몇 월이 제일 좋았어?"],["D","I liked the debate month. I won two battles!","토론하던 달이 좋았어요. 두 번이나 이겼거든요!"]],"wrap":[["P","The train is back! Tell me two things you remembered today.","열차가 돌아왔습니다! 오늘 기억해 낸 것 두 가지를 말해 줘."],["D","I remembered how to introduce myself and my family. I also remembered first, second, finally from the speech. My memory is strong!","자기소개와 가족 소개를 기억해 냈어요. 스피치의 first, second, finally도 기억났어요. 제 기억력은 튼튼해요!"]],"tip":"의자를 기차처럼 놓고 정거장마다 '역 도착!'을 외쳐 주세요. 놀이가 커질수록 복습이 즐거워집니다."},{"emoji":"🗺️","title":"Day 3 · My English Journey","sub":"나의 영어 여행기","words":[["journey","여정","저니"],["beginning","시작","비기닝"],["improve","나아지다","임프루브"]],"sentence":["My English improved step by step.","내 영어는 한 걸음씩 나아졌어요."],"main":[["P","Documentary time! 'The English Journey of Dayoon.' I am the narrator: In the beginning, there was a quiet girl...","다큐멘터리 시간! '다윤의 영어 여정'. 내가 내레이터야. 처음에, 조용한 소녀가 있었습니다..."],["D","Haha! That quiet girl was me! In the beginning, I couldn't say anything!","하하! 그 조용한 소녀가 저예요! 처음엔 아무 말도 못 했어요!"],["P","But month by month, something changed... Dayoon, tell our viewers!","하지만 달이 갈수록 무언가 변했습니다... 다윤 씨, 시청자들께 말씀해 주시죠!"],["D","First I learned greetings. Then family words, school words, food words... my English improved step by step!","먼저 인사를 배웠어요. 그다음 가족, 학교, 음식 단어들... 제 영어는 한 걸음씩 나아졌어요!"],["P","Was the journey always easy? Tell us the truth!","여정이 늘 쉬웠나요? 진실을 말해 주세요!"],["D","No way! Some days I was tired and wanted to quit. Grammar monsters attacked me!","절대 아니죠! 어떤 날은 피곤해서 그만두고 싶었어요. 문법 괴물이 절 공격했다고요!"],["P","Grammar monsters! And how did you fight them?","문법 괴물이라니! 어떻게 싸웠나요?"],["D","I practiced aga
