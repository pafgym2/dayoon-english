MONTHS.push({"m":7,"theme":"여행·장소","q":2,"weeks":[{"sub":"설레는 국내 여행","days":[{"emoji":"🚄","title":"Day 1 · Where Do You Want to Go in Korea?","sub":"국내 여행지 고르기","words":[["travel","여행하다","트래블"],["beach","해변","비치"],["famous","유명한","페이머스"]],"sentence":["I want to go to Busan because I love the sea.","나는 바다를 좋아해서 부산에 가고 싶어요."],"main":[["P","Dayoon, let's plan a trip in Korea! Where do you want to go?","다윤아, 우리 한국 여행 계획을 세워 보자! 어디에 가고 싶니?"],["D","I want to go to Busan because I love the sea.","저는 바다를 좋아해서 부산에 가고 싶어요."],["P","Great choice! What is Busan famous for?","좋은 선택이야! 부산은 뭐가 유명하지?"],["D","Busan is famous for its beautiful beaches and fresh fish.","부산은 아름다운 해변과 신선한 생선으로 유명해요."],["P","Who do you want to travel with?","누구랑 같이 여행 가고 싶어?"],["D","I want to travel with my family. Siheon will love the sand!","가족이랑 가고 싶어요. 시헌이는 모래를 정말 좋아할 거예요!"],["P","What will you do at the beach?","해변에서 뭘 할 거야?"],["D","I will swim, play in the waves, and draw the sea.","수영하고, 파도랑 놀고, 바다를 그릴 거예요."],["P","What food will you eat there?","거기서 무슨 음식을 먹을 거야?"],["D","Hmm... I hope they have strawberry pasta! Just kidding!","음... 딸기 파스타가 있으면 좋겠어요! 농담이에요!"],["P","Ha! Now tell me your whole trip plan in five sentences.","하하! 이제 여행 계획 전체를 다섯 문장으로 말해 줘."],["D","I want to go to Busan. I will go with my family this summer. We will swim at the beach. I will draw the blue sea. And we will eat lots of yummy food!","저는 부산에 가고 싶어요. 이번 여름에 가족이랑 갈 거예요. 해변에서 수영할 거예요. 파란 바다를 그릴 거예요. 그리고 맛있는 음식을 많이 먹을 거예요!"]],"role":[["P","Welcome to Happy Travel Agency! How can I help you?","해피 여행사에 오신 것을 환영합니다! 무엇을 도와드릴까요?"],["D","I want to book a trip to Busan, please.","부산 여행을 예약하고 싶어요."],["P","When do you want to go?","언제 가고 싶으세요?"],["D","This summer, please. Summer is my favorite season!","이번 여름이요. 여름은 제가 제일 좋아하는 계절이에요!"],["P","How many people are going?","몇 분이 가시나요?"],["D","Four people. My mom, my dad, my little brother, and me.","네 명이요. 엄마, 아빠, 남동생, 그리고 저요."],["P","Do you want a room with a sea view?","바다가 보이는 방을 원하세요?"],["D","Yes, please! I want to see the sky-blue sea every morning.","네! 매일 아침 하늘색 바다를 보고 싶어요."]],"wrap":[["P","Dayoon, tell me about the place you want to visit.","다윤아, 네가 가고 싶은 곳에 대해 말해 줘."],["D","I want to go to Busan this summer. Busan is famous for its beaches. I will swim and draw the sea with my family.","저는 이번 여름에 부산에 가고 싶어요. 부산은 해변으로 유명해요. 가족이랑 수영하고 바다를 그릴 거예요."]],"tip":"다섯 문장 이어 말하기를 할 때 손가락을 하나씩 접으며 문장 수를 같이 세어 주면 아이가 성취감을 느낍니다."},{"emoji":"🎒","title":"Day 2 · Packing My Suitcase","sub":"여행 가방 싸기 놀이","words":[["pack","(짐을) 싸다","팩"],["suitcase","여행 가방","수트케이스"],["forget","잊다","포겟"]],"sentence":["I will pack my hat and my swimsuit.","저는 모자와 수영복을 챙길 거예요."],"main":[["P","Dayoon, we leave tomorrow! Let's pack your suitcase together.","다윤아, 우리 내일 떠나! 같이 여행 가방을 싸 보자."],["D","Okay! First, I will pack my hat and my swimsuit.","좋아요! 먼저 모자랑 수영복을 챙길 거예요."],["P","Good. What do you need for drawing?","좋아. 그림 그리려면 뭐가 필요하지?"],["D","I need my sketchbook and my sky-blue colored pencil.","스케치북이랑 하늘색 색연필이 필요해요."],["P","Should we pack an umbrella?","우산도 챙겨야 할까?"],["D","Yes, we should. It rains a lot in summer.","네, 챙겨야 해요. 여름에는 비가 많이 오니까요."],["P","What about your little brother? What does Siheon need?","네 남동생은? 시헌이는 뭐가 필요할까?"],["D","He needs his robot toy, or he will cry all night!","시헌이는 로봇 장난감이 필요해요. 안 그러면 밤새 울 거예요!"],["P","Ha! Can we pack the refrigerator? I want cold juice.","하하! 냉장고도 쌀까? 나는 차가운 주스가 마시고 싶은데."],["D","No way! The suitcase is too small. Let's just pack some strawberries!","말도 안 돼요! 가방이 너무 작아요. 그냥 딸기를 좀 챙겨요!"],["P","Deal! Now say everything in your suitcase in five sentences.","좋았어! 이제 가방에 든 것을 다섯 문장으로 말해 봐."],["D","I will pack my hat. I will pack my swimsuit. I need my sketchbook for drawing. I will not forget my toothbrush. And I will pack sweet strawberries!","모자를 챙길 거예요. 수영복을 챙길 거예요. 그림 그릴 스케치북이 필요해요. 칫솔도 잊지 않을 거예요. 그리고 달콤한 딸기를 챙길 거예요!"]],"role":[["P","Oh no, the suitcase is full! What should we take out?","이런, 가방이 꽉 찼어! 뭘 빼야 할까?"],["D","Let's take out the big blanket. The hotel has blankets.","큰 담요를 빼요. 호텔에 담요가 있잖아요."],["P","Smart! Did you forget anything?","똑똑한걸! 잊은 물건은 없니?"],["D","Oh no, I forgot my toothbrush! I will get it now.","앗, 칫솔을 잊었어요! 지금 가져올게요."],["P","Is your suitcase heavy or light?","가방이 무겁니, 가볍니?"],["D","It's a little heavy, but I can carry it.","조금 무겁지만 제가 들 수 있어요."],["P","Are you ready to go?","떠날 준비 됐나요?"],["D","Yes! My suitcase is ready. Busan, here we come!","네! 가방 준비 끝났어요. 부산아, 우리가 간다!"]],"wrap":[["P","Tell me what you packed today.","오늘 뭘 챙겼는지 말해 줘."],["D","I packed my hat, my swimsuit, and my sketchbook. I did not forget my toothbrush. My suitcase is ready for the trip!","모자, 수영복, 스케치북을 챙겼어요. 칫솔도 잊지 않았어요. 제 가방은 여행 준비 완료예요!"]],"tip":"집에 있는 진짜 가방에 물건을 담으며 연습하면 'I will pack ~' 패턴이 몸으로 기억됩니다."},{"emoji":"🏨","title":"Day 3 · Hotel Front Desk","sub":"호텔 프런트 놀이","words":[["check in","체크인하다","체크 인"],["key","열쇠","키"],["stay","머무르다","스테이"]],"sentence":["I'd like to check in, please.","체크인하고 싶어요."],"main":[["P","Good afternoon! Welcome to the Ocean Hotel. How can I help you?","안녕하세요! 오션 호텔에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],["D","Hello! I'd like to check in, please.","안녕하세요! 체크인하고 싶어요."],["P","May I have your name, please?","성함을 알려 주시겠어요?"],["D","My name is Kim Dayoon. D-A-Y-O-O-N.","제 이름은 김다윤이에요. D-A-Y-O-O-N이요."],["P","How long will you stay with us?","얼마나 머무르실 건가요?"],["D","We will stay for two nights.","2박 동안 머무를 거예요."],["P","Here is your key. Your room is number 707.","여기 열쇠입니다. 방은 707호예요."],["D","Thank you! Wow, lucky number seven, twice!","감사합니다! 와, 행운의 숫자 7이 두 번이나!"],["P","Breakfast is from seven to ten. Do you have any questions?","아침 식사는 7시부터 10시까지예요. 질문 있으신가요?"],["D","Yes! Is there a swimming pool? And... do you have a puppy I can pet?","네! 수영장이 있나요? 그리고... 쓰다듬을 수 있는 강아지도 있나요?"],["P","A pool, yes! A puppy... not yet! Enjoy your stay.","수영장은 있어요! 강아지는... 아직 없네요! 즐거운 시간 보내세요."],["D","Thank you! I will swim before breakfast, then eat a lot, and then rest in my room.","감사합니다! 아침 먹기 전에 수영하고, 많이 먹고, 그다음 방에서 쉴 거예요."]],"role":[["P","Ring ring! Front desk, how can I help you?","따르릉! 프런트입니다, 무엇을 도와드릴까요?"],["D","Hello, this is room 707. Can I get more towels, please?","안녕하세요, 707호인데요. 수건을 더 주실 수 있나요?"],["P","Of course. How many towels do you need?","물론이죠. 수건이 몇 장 필요하세요?"],["D","Two, please. My brother made his towel all wet!","두 장이요. 동생이 수건을 다 젖게 만들었어요!"],["P","No problem. Anything else?","알겠습니다. 더 필요한 것 있으세요?"],["D","What time does the pool close?","수영장은 몇 시에 닫나요?"],["P","It closes at nine at night.","밤 9시에 닫아요."],["D","Perfect! I go to bed at nine thirty, so I can swim first!","완벽해요! 저는 9시 30분에 자니까 그전에 수영할 수 있어요!"]],"wrap":[["P","Tell me how to check in at a hotel.","호텔에서 체크인하는 법을 말해 줘."],["D","First, I say my name at the front desk. Then I get my room key. We will stay for two nights and swim in the pool!","먼저 프런트에서 이름을 말해요. 그다음 방 열쇠를 받아요. 우리는 2박을 머무르고 수영장에서 수영할 거예요!"]],"tip":"식탁을 프런트 데스크처럼 꾸미고 장난감 열쇠를 주고받으면 실제 호텔에서도 아이가 직접 말해 보고 싶어 합니다."},{"emoji":"🏖️","title":"Day 4 · A Day at the Beach","sub":"해변에서의 하루","words":[["sandcastle","모래성","샌드캐슬"],["wave","파도","웨이브"],["sunscreen","자외선 차단제","선스크린"]],"sentence":["Let's build a huge sandcastle together!","우리 같이 커다란 모래성을 쌓자!"],"main":[["P","We are finally at the beach! What do we put on first?","드디어 해변에 왔다! 제일 먼저 뭘 발라야 하지?"],["D","Sunscreen! The summer sun is very strong.","자외선 차단제요! 여름 햇살은 아주 강하니까요."],["P","Right! What do you want to do first?","맞아! 제일 먼저 뭐 하고 싶어?"],["D","Let's build a huge sandcastle together!","같이 커다란 모래성을 쌓아요!"],["P","What will your sandcastle look like?","네 모래성은 어떻게 생겼을까?"],["D","It will have three towers and a bridge. I'm going to be an architect, you know!","탑 세 개랑 다리가 있을 거예요. 저 커서 건축가 될 거잖아요!"],["P","A real beach architect! Oh no, here comes a big wave!","진짜 해변 건축가네! 어어, 큰 파도가 온다!"],["D","Run! Save the castle! ... Oh no, the tower fell down.","도망쳐요! 성을 지켜요! ... 아이고, 탑이 무너졌어요."],["P","Don't worry. What should we do now?","괜찮아. 이제 어떻게 할까?"],["D","Let's build it again, bigger and stronger! Waves can't beat us!","다시 지어요, 더 크고 튼튼하게요! 파도는 우리를 못 이겨요!"],["P","Now tell me about our beach day in five sentences.","이제 우리의 해변 하루를 다섯 문장으로 말해 봐."],["D","We went to the beach today. First, we put on sunscreen. Then we built a huge sandcastle. A big wave broke one tower. But we built it again even bigger!","오늘 우리는 해변에 갔어요. 먼저 자외선 차단제를 발랐어요. 그리고 커다란 모래성을 쌓았어요. 큰 파도가 탑 하나를 무너뜨렸어요. 하지만 우리는 더 크게 다시 지었어요!"]],"role":[["P","I'm the ice cream seller! Ice cream! Cold ice cream!","나는 아이스크림 장수야! 아이스크림! 시원한 아이스크림!"],["D","Excuse me! One strawberry ice cream, please.","저기요! 딸기 아이스크림 하나 주세요."],["P","Here you go. That's one thousand won... or one seashell!","여기 있어요. 천 원입니다... 아니면 조개껍데기 하나요!"],["D","A seashell? Here's the prettiest one I found!","조개껍데기요? 제가 찾은 제일 예쁜 걸로 드릴게요!"],["P","Wonderful! How is the water today?","좋아요! 오늘 물은 어때요?"],["D","It's cool and fun. The waves are jumping like puppies!","시원하고 재미있어요. 파도가 강아지처럼 폴짝폴짝 뛰어요!"],["P","What a lovely picture! Are you having a good day?","정말 멋진 표현이네요! 오늘 즐거워요?"],["D","Yes! This is the best beach day ever!","네! 오늘은 최고의 해변 날이에요!"]],"wrap":[["P","What did you do at the beach today?","오늘 해변에서 뭐 했니?"],["D","I put on sunscreen and built a big sandcastle. A wave broke it, but we built it again. I also ate strawberry ice cream!","자외선 차단제를 바르고 큰 모래성을 쌓았어요. 파도가 무너뜨렸지만 다시 지었어요. 딸기 아이스크림도 먹었어요!"]],"tip":"'파도가 강아지처럼 뛴다' 같은 비유 표현을 아이가 만들면 크게 칭찬해 주세요. 창의적 문장이 회화 자신감을 키웁니다."},{"emoji":"📸","title":"Day 5 · My Trip Memories","sub":"여행 추억 말하기 (과거형)","words":[["memory","추억","메모리"],["took","찍었다 (take의 과거)","툭"],["wonderful","아주 멋진","원더풀"]],"sentence":["I took many pictures on my trip.","여행에서 사진을 많이 찍었어요."],"main":[["P","Welcome home, Dayoon! How was your trip to Busan?","집에 온 걸 환영해, 다윤아! 부산 여행은 어땠니?"],["D","It was wonderful! I want to go again right now.","정말 멋졌어요! 지금 당장 또 가고 싶어요."],["P","What did you do there?","거기서 뭐 했어?"],["D","I swam in the sea and took many pictures.","바다에서 수영하고 사진을 많이 찍었어요."],["P","What was your favorite memory?","가장 좋았던 추억은 뭐야?"],["D","My favorite memory is the sandcastle. Siheon sat on it by mistake!","제일 좋은 추억은 모래성이에요. 시헌이가 실수로 그 위에 앉았거든요!"],["P","Oh no! Was he okay?","저런! 시헌이는 괜찮았어?"],["D","He was fine, but the castle became a pancake! We laughed so much.","시헌이는 괜찮았는데 성이 팬케이크가 됐어요! 우리는 엄청 웃었어요."],["P","What did you eat there?","거기서 뭘 먹었니?"],["D","I ate fresh fish and strawberry ice cream. It was so delicious.","신선한 생선이랑 딸기 아이스크림을 먹었어요. 정말 맛있었어요."],["P","Now tell me your whole trip story in six sentences, like a storyteller!","이제 이야기꾼처럼 여행 이야기를 여섯 문장으로 들려줘!"],["D","Last week, I went to Busan with my family. I swam in the blue sea. We built a big sandcastle. Siheon sat on it and it became a pancake! We ate delicious fish. It was a wonderful trip!","지난주에 가족이랑 부산에 갔어요. 파란 바다에서 수영했어요. 큰 모래성을 지었어요. 시헌이가 앉아서 팬케이크가 됐어요! 맛있는 생선을 먹었어요. 정말 멋진 여행이었어요!"]],"role":[["P","Hello! I'm a TV reporter. Can I ask you about your vacation?","안녕하세요! 저는 TV 기자입니다. 휴가에 대해 여쭤봐도 될까요?"],["D","Sure! I love talking about my trip.","물론이죠! 여행 이야기라면 얼마든지요."],["P","Where did you go, and who did you go with?","어디에 갔고, 누구와 갔나요?"],["D","I went to Busan with my mom, dad, and little brother.","엄마, 아빠, 남동생이랑 부산에 갔어요."],["P","What was the funniest moment?","가장 웃긴 순간은 뭐였나요?"],["D","My brother turned our sandcastle into a pancake!","동생이 우리 모래성을 팬케이크로 만들었어요!"],["P","Ha! Last question. Will you go again?","하하! 마지막 질문입니다. 또 갈 건가요?"],["D","Yes! Next time, I will build a castle far from my brother.","네! 다음엔 동생한테서 멀리 떨어진 곳에 성을 지을 거예요."]],"wrap":[["P","Tell me your best trip memory.","최고의 여행 추억을 말해 줘."],["D","I went to Busan and swam in the sea. I took many pictures with my family. It was a wonderful memory!","부산에 가서 바다에서 수영했어요. 가족이랑 사진을 많이 찍었어요. 정말 멋진 추억이었어요!"]],"tip":"실제 가족 여행 사진을 한 장 보여 주며 'What did you do here?'라고 물으면 과거형 연습이 훨씬 생생해집니다."},{"emoji":"🗺️","title":"Day 6 · Tour Guide Dayoon","sub":"과천 여행 가이드 놀이 (다윤이가 안내!)","words":[["guide","안내원","가이드"],["follow","따라오다","팔로우"],["ticket","입장권","티켓"]],"sentence":["Follow me, everyone!","여러분, 저를 따라오세요!"],"main":[["P","Today, you are the tour guide and I am the tourist! Where am I?","오늘은 네가 여행 가이드, 나는 관광객이야! 여기가 어디죠?"],["D","Welcome to Gwacheon! I am your guide, Dayoon. Follow me, everyone!","과천에 오신 것을 환영합니다! 저는 가이드 다윤입니다. 여러분, 저를 따라오세요!"],["P","Ooh, exciting! What can I see in Gwacheon?","오, 신난다! 과천에서는 뭘 볼 수 있나요?"],["D","You can see the big zoo and the amusement park. You can also see the science museum!","커다란 동물원과 놀이공원을 볼 수 있어요. 과학관도 볼 수 있고요!"],["P","A zoo? What animals live there?","동물원이요? 어떤 동물들이 사나요?"],["D","Lions, tigers, and many birds live there. My favorite is the wolf... just kidding, it's the puppy-like fox!","사자, 호랑이, 그리고 많은 새들이 살아요. 제가 제일 좋아하는 건 늑대... 농담이에요, 강아지 닮은 여우예요!"],["P","Where should I eat lunch, guide?","가이드님, 점심은 어디서 먹으면 좋을까요?"],["D","There is a great pasta restaurant near the park. I give it five stars!","공원 근처에 아주 좋은 파스타 식당이 있어요. 별 다섯 개 드립니다!"],["P","How much is the zoo ticket?","동물원 입장권은 얼마인가요?"],["D","It's cheap! And kids under eight, like my brother, pay less.","싸요! 그리고 제 동생처럼 8살 미만 어린이는 더 적게 내요."],["P","Amazing tour! Can you introduce Gwacheon in five sentences?","멋진 투어네요! 과천을 다섯 문장으로 소개해 줄래요?"],["D","Gwacheon is my city. It has a big zoo and an amusement park. You can ride fun rides there. The pasta near the park is delicious. Please visit Gwacheon!","과천은 제가 사는 도시예요. 큰 동물원과 놀이공원이 있어요. 거기서 재미있는 놀이기구를 탈 수 있어요. 공원 근처 파스타가 맛있어요. 과천에 꼭 놀러 오세요!"]],"role":[["P","Guide Dayoon! I lost my ticket. What should I do?","다윤 가이드님! 표를 잃어버렸어요. 어떡하죠?"],["D","Don't worry! Let's go to the ticket office together.","걱정 마세요! 같이 매표소로 가요."],["P","Thank you. Also, I'm tired. Can we rest?","고마워요. 그런데 저 피곤해요. 좀 쉴 수 있을까요?"],["D","Sure. There is a bench under the big tree. Let's sit there.","그럼요. 큰 나무 아래에 벤치가 있어요. 거기 앉아요."],["P","You are a kind guide! What is next on the tour?","친절한 가이드네요! 다음 코스는 뭐예요?"],["D","Next, we will watch the dolphin-shaped fountain. It's my favorite spot for drawing.","다음은 돌고래 모양 분수를 볼 거예요. 제가 그림 그리기 제일 좋아하는 곳이에요."],["P","How was your day as a guide?","가이드로 보낸 하루는 어땠어요?"],["D","It was fun but my legs hurt! Guides need strong legs!","재미있었지만 다리가 아파요! 가이드는 튼튼한 다리가 필요해요!"]],"wrap":[["P","Introduce your city like a real guide.","진짜 가이드처럼 네 도시를 소개해 봐."],["D","Welcome to Gwacheon! It has a big zoo and a fun amusement park. Follow me and I will show you everything!","과천에 오신 것을 환영합니다! 큰 동물원과 재미있는 놀이공원이 있어요. 저를 따라오시면 전부 보여 드릴게요!"]],"tip":"아이에게 가이드 깃발(연필이나 리모컨)을 쥐여 주면 역할에 몰입해 자신 있게 문장을 이어 갑니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"1주차 총정리 · 국내 여행 인터뷰","interview":true,"pool":["Where do you want to go in Korea, and why?","What will you pack in your suitcase for a trip?","What do you say at a hotel front desk when you arrive?","How long will you stay at the hotel?","What can you do at the beach? Tell me three things.","What was your favorite trip memory? What happened?","What did you eat on your last trip?","What can tourists see in Gwacheon?","Who do you want to travel with, and why?","Tell me your dream trip plan in five sentences."],"tip":"인터뷰 중 아이가 막히면 답을 알려 주지 말고 이번 주 배운 첫 단어만 살짝 던져 주세요. 스스로 완성하는 경험이 중요합니다."}]},{"sub":"뉴질랜드·호주 특집","days":[{"emoji":"🛂","title":"Day 1 · At the Airport","sub":"공항 체크인 놀이","words":[["passport","여권","패스포트"],["boarding pass","탑승권","보딩 패스"],["gate","탑승구","게이트"]],"sentence":["Here is my passport.","여기 제 여권이요."],"main":[["P","Good morning! Welcome to Incheon Airport. Where are you flying today?","안녕하세요! 인천공항입니다. 오늘 어디로 가시나요?"],["D","Good morning! I'm flying to New Zealand. Here is my passport.","안녕하세요! 뉴질랜드에 가요. 여기 제 여권이요."],["P","New Zealand! That's a long flight. How many bags do you have?","뉴질랜드요! 긴 비행이네요. 가방이 몇 개인가요?"],["D","I have one big suitcase and one small backpack.","큰 여행 가방 하나랑 작은 배낭 하나요."],["P","Please put the suitcase here. Oh! Is something moving inside?","여행 가방을 여기 올려 주세요. 어! 안에서 뭔가 움직이는데요?"],["D","Oh no, that's my brother's toy robot! It turned on by itself!","아이코, 동생 장난감 로봇이에요! 저절로 켜졌나 봐요!"],["P","Phew! Here is your boarding pass. Your gate is number 24.","휴! 여기 탑승권입니다. 탑승구는 24번이에요."],["D","Gate 24. What time does boarding start?","24번 게이트요. 탑승은 몇 시에 시작해요?"],["P","At eleven o'clock. Don't be late!","11시요. 늦지 마세요!"],["D","I won't! I wake up at seven thirty every day, so I'm never late.","안 늦어요! 저는 매일 7시 30분에 일어나서 절대 안 늦거든요."],["P","Perfect traveler! Can you tell me your airport steps in order?","완벽한 여행자네요! 공항에서 하는 일을 순서대로 말해 줄래요?"],["D","First, I show my passport. Next, I check my suitcase. Then, I get my boarding pass. After that, I find gate 24. Finally, I get on the plane!","먼저 여권을 보여 줘요. 다음에 가방을 부쳐요. 그리고 탑승권을 받아요. 그 후에 24번 게이트를 찾아요. 마지막으로 비행기를 타요!"]],"role":[["P","Beep! Security check! Please put your backpack in the basket.","삑! 보안 검색입니다! 배낭을 바구니에 넣어 주세요."],["D","Okay, here it is. Should I take off my hat too?","네, 여기요. 모자도 벗어야 하나요?"],["P","Yes, please. Do you have any water bottles?","네, 부탁해요. 물병이 있나요?"],["D","Oh, I have one. I will drink it all right now! Gulp gulp!","아, 하나 있어요. 지금 다 마셔 버릴게요! 꿀꺽꿀꺽!"],["P","Ha! Walk through slowly, please. Beep beep!","하하! 천천히 통과해 주세요. 삑삑!"],["D","What? What is it? Oh... it's my hairpin!","네? 뭐예요? 아... 제 머리핀이네요!"],["P","All clear! Have a nice flight. Where is your gate?","통과입니다! 좋은 비행 되세요. 게이트가 어디죠?"],["D","Gate 24! I will run... no, I will walk fast!","24번이요! 뛰어갈... 아니, 빠르게 걸어갈게요!"]],"wrap":[["P","What do you do at the airport before your flight?","비행기 타기 전에 공항에서 뭘 하지?"],["D","I show my passport and check my suitcase. Then I get my boarding pass. Finally, I go to my gate and get on the plane!","여권을 보여 주고 가방을 부쳐요. 그다음 탑승권을 받아요. 마지막으로 게이트로 가서 비행기를 타요!"]],"tip":"First, Next, Then, Finally 순서 표현은 손가락 계단을 만들며 말하면 아이 머리에 오래 남습니다."},{"emoji":"🐑","title":"Day 2 · Hello, New Zealand!","sub":"양과 키위새의 나라","words":[["sheep","양","쉽"],["island","섬","아일랜드"],["nature","자연","네이처"]],"sentence":["New Zealand has more sheep than people!","뉴질랜드에는 사람보다 양이 더 많아요!"],"main":[["P","We landed in New Zealand! It's one of your dream countries, right?","뉴질랜드에 도착했다! 네가 가 보고 싶은 나라 중 하나지?"],["D","Yes! I really wanted to come here. The air feels so fresh!","네! 정말 오고 싶었어요. 공기가 너무 상쾌해요!"],["P","Look at the hills! What are those white dots?","언덕 좀 봐! 저 하얀 점들은 뭘까?"],["D","Wow, they are sheep! There are hundreds of them!","와, 양이에요! 수백 마리나 있어요!"],["P","Fun fact: New Zealand has more sheep than people!","재미있는 사실 하나. 뉴질랜드에는 사람보다 양이 더 많아!"],["D","Really? Then maybe a sheep should be the president! Baa!","정말요? 그럼 양이 대통령 해야겠네요! 메에!"],["P","Ha! What bird lives only in New Zealand?","하하! 뉴질랜드에만 사는 새는 뭘까?"],["D","The kiwi bird! It's round and it can't fly. It looks like a fuzzy ball.","키위새요! 동글동글하고 날지 못해요. 보송보송한 공처럼 생겼어요."],["P","What do you want to do on this island?","이 섬에서 뭘 하고 싶어?"],["D","I want to see the mountains and draw the beautiful nature here.","산을 보고 여기의 아름다운 자연을 그리고 싶어요."],["P","Tell me about New Zealand in five sentences for your friend Minseo.","민서에게 들려줄 뉴질랜드 이야기를 다섯 문장으로 해 봐."],["D","Minseo, I'm in New Zealand! It is a beautiful island country. There are more sheep than people here. The kiwi bird can't fly. I will draw the mountains for you!","민서야, 나 뉴질랜드에 있어! 여기는 아름다운 섬나라야. 사람보다 양이 더 많아. 키위새는 날지 못해. 너를 위해 산을 그려 줄게!"]],"role":[["P","Hello! I'm a sheep farmer. Do you want to feed the sheep?","안녕하세요! 저는 양 목장 주인이에요. 양에게 먹이 줘 볼래요?"],["D","Yes, please! What do sheep eat?","네, 좋아요! 양은 뭘 먹어요?"],["P","They eat grass. Hold your hand flat like this.","풀을 먹어요. 손을 이렇게 펴세요."],["D","Wow, its mouth tickles! The wool is so soft.","와, 입이 간지러워요! 털이 정말 부드러워요."],["P","This little lamb has no name. Can you name her?","이 아기 양은 이름이 없어요. 이름 지어 줄래요?"],["D","Hmm... Cloud! Because she looks like a fluffy white cloud.","음... 클라우드요! 폭신한 하얀 구름처럼 생겼으니까요."],["P","Cloud loves it! Baa! Will you remember her?","클라우드가 좋아해요! 메에! 이 아이를 기억할 건가요?"],["D","Of course! I will draw Cloud in my sketchbook tonight.","당연하죠! 오늘 밤 스케치북에 클라우드를 그릴 거예요."]],"wrap":[["P","What did you learn about New Zealand?","뉴질랜드에 대해 뭘 배웠니?"],["D","New Zealand is a beautiful island country. It has more sheep than people. The kiwi bird lives there and it can't fly!","뉴질랜드는 아름다운 섬나라예요. 사람보다 양이 더 많아요. 키위새가 사는데 날지 못해요!"]],"tip":"지도나 지구본에서 뉴질랜드를 함께 찾아보세요. 위치를 눈으로 확인하면 나라 이야기가 진짜 지식이 됩니다."},{"emoji":"🦘","title":"Day 3 · G'day, Australia!","sub":"캥거루와 코알라의 나라","words":[["kangaroo","캥거루","캥거루"],["koala","코알라","코알라"],["pouch","(캥거루의) 주머니","파우치"]],"sentence":["Kangaroos can jump very high.","캥거루는 아주 높이 뛸 수 있어요."],"main":[["P","Next stop, Australia! Do you know how they say hello here?","다음 여행지는 호주! 여기서는 인사를 어떻게 하는지 아니?"],["D","Hmm... Hello, mate?","음... 헬로, 메이트?"],["P","Close! They say G'day, mate! Try it!","비슷해! '그다이, 메이트!'라고 해. 해 봐!"],["D","G'day, mate! Haha, that sounds funny and cool!","그다이, 메이트! 하하, 웃기고 멋진 말이네요!"],["P","Look over there! What is that animal hopping?","저기 봐! 폴짝폴짝 뛰는 저 동물은 뭐지?"],["D","A kangaroo! Kangaroos can jump very high. And look, there's a baby in her pouch!","캥거루예요! 캥거루는 아주 높이 뛸 수 있어요. 그리고 보세요, 주머니에 아기가 있어요!"],["P","So cute! And who is sleeping in that tree?","너무 귀엽다! 그럼 저 나무에서 자고 있는 건 누구지?"],["D","A koala! Koalas sleep about twenty hours a day.","코알라요! 코알라는 하루에 스무 시간쯤 자요."],["P","Twenty hours! Is that more than Siheon?","스무 시간이나! 시헌이보다 많이 자는 거야?"],["D","Yes! Even Siheon can't beat a koala. And he really tries!","네! 시헌이도 코알라는 못 이겨요. 진짜 열심히 자는데도요!"],["P","Ha! Now compare the two animals in five sentences.","하하! 이제 두 동물을 다섯 문장으로 비교해 봐."],["D","Kangaroos and koalas live in Australia. Kangaroos can jump very high. They carry babies in their pouches. Koalas can't jump, but they climb trees. And koalas sleep almost all day!","캥거루와 코알라는 호주에 살아요. 캥거루는 아주 높이 뛸 수 있어요. 주머니에 아기를 넣고 다녀요. 코알라는 못 뛰지만 나무를 잘 타요. 그리고 코알라는 거의 하루 종일 자요!"]],"role":[["P","Welcome to the wildlife park! I'm the ranger. Which animal first?","야생동물 공원에 오신 걸 환영해요! 저는 사육사입니다. 어떤 동물부터 볼까요?"],["D","The kangaroos, please! Can I feed them?","캥거루부터요! 먹이를 줘도 되나요?"],["P","Sure. Hold the food low. Oh, this one is coming to you!","그럼요. 먹이를 낮게 들어요. 오, 이 녀석이 다가오네요!"],["D","Hello, kangaroo! Wow, it ate from my hand! Its nose is soft.","안녕, 캥거루야! 와, 제 손에서 먹었어요! 코가 부드러워요."],["P","Now, do you want to hold a koala for a photo?","이제 코알라 안고 사진 찍을래요?"],["D","Yes! Oh... it's heavier than I thought. And it smells like cough drops!","네! 어... 생각보다 무거워요. 그리고 목캔디 냄새가 나요!"],["P","That's the eucalyptus! Say cheese!","그건 유칼립투스 냄새예요! 치즈 하세요!"],["D","Cheese! Please send this photo to my best friend Minseo!","치즈! 이 사진 제 단짝 민서에게 보내 주세요!"]],"wrap":[["P","Tell me about the animals in Australia.","호주의 동물들에 대해 말해 줘."],["D","Kangaroos can jump very high and carry babies in their pouches. Koalas sleep twenty hours a day. I held a koala and it smelled like cough drops!","캥거루는 높이 뛰고 주머니에 아기를 넣고 다녀요. 코알라는 하루에 스무 시간 자요. 코알라를 안아 봤는데 목캔디 냄새가 났어요!"]],"tip":"'G'day, mate!'를 오늘의 가족 인사로 정해 보세요. 하루 종일 쓰다 보면 억양까지 자연스러워집니다."},{"emoji":"🤿","title":"Day 4 · The Great Barrier Reef","sub":"산호초 바다 탐험","words":[["coral","산호","코럴"],["snorkel","스노클을 하다","스노클"],["colorful","알록달록한","컬러풀"]],"sentence":["I want to snorkel and see the coral.","스노클을 하면서 산호를 보고 싶어요."],"main":[["P","Today we visit the Great Barrier Reef, the biggest coral reef in the world!","오늘은 세계에서 가장 큰 산호초, 그레이트 배리어 리프에 간다!"],["D","The pictures look amazing! I want to snorkel and see the coral.","사진이 정말 굉장해요! 스노클을 하면서 산호를 보고 싶어요."],["P","Put on your mask. What do you think we will see?","마스크를 쓰자. 뭘 보게 될 것 같아?"],["D","Maybe colorful fish, sea turtles, and... a mermaid?","알록달록한 물고기, 바다거북, 그리고... 인어요?"],["P","Ha! Maybe! Splash! Look down. What do you see?","하하! 어쩌면! 첨벙! 아래를 봐. 뭐가 보여?"],["D","Wow! The coral looks like a rainbow garden! There are so many fish!","와! 산호가 무지개 정원 같아요! 물고기가 정말 많아요!"],["P","Look, a sea turtle is swimming next to you!","봐, 바다거북이 네 옆에서 헤엄치고 있어!"],["D","Hello, turtle! It swims so slowly and calmly. It's like a flying carpet!","안녕, 거북아! 아주 천천히 여유롭게 헤엄쳐요. 하늘을 나는 양탄자 같아요!"],["P","What color is your favorite fish here?","여기서 제일 마음에 드는 물고기는 무슨 색이야?"],["D","The sky-blue one, of course! It matches my favorite color.","당연히 하늘색 물고기죠! 제가 제일 좋아하는 색이랑 똑같아요."],["P","Time to go up! Tell me about the reef in five sentences.","이제 올라가자! 산호초 이야기를 다섯 문장으로 해 봐."],["D","Today I snorkeled at the Great Barrier Reef. The coral looked like a rainbow garden. I saw many colorful fish. A sea turtle swam next to me. My favorite was the sky-blue fish!","오늘 그레이트 배리어 리프에서 스노클을 했어요. 산호가 무지개 정원 같았어요. 알록달록한 물고기를 많이 봤어요. 바다거북이 제 옆에서 헤엄쳤어요. 제일 좋았던 건 하늘색 물고기예요!"]],"role":[["P","I'm your diving teacher. First rule: never touch the coral. Why?","나는 다이빙 선생님이야. 첫 번째 규칙, 산호를 절대 만지지 않기. 왜일까?"],["D","Because coral is alive! We should protect it.","산호는 살아 있으니까요! 우리가 지켜 줘야 해요."],["P","Excellent! Second rule: stay close to me. Ready?","훌륭해! 두 번째 규칙, 내 옆에 붙어 있기. 준비됐니?"],["D","Ready! One, two, three, jump!","준비됐어요! 하나, 둘, 셋, 점프!"],["P","Point at the fish you like. That one? It has orange and white stripes.","마음에 드는 물고기를 가리켜 봐. 저거? 주황색과 흰색 줄무늬가 있네."],["D","It looks like the movie fish! Hello, little friend!","영화에 나오는 물고기 같아요! 안녕, 꼬마 친구!"],["P","Great dive today! What was the best part?","오늘 다이빙 최고였어! 뭐가 제일 좋았니?"],["D","Everything! But the turtle was the best. I want to come back with my family.","전부요! 그래도 거북이가 최고였어요. 가족이랑 꼭 다시 오고 싶어요."]],"wrap":[["P","What did you see under the sea today?","오늘 바닷속에서 뭘 봤니?"],["D","I saw colorful coral and many fish. A sea turtle swam next to me. We should never touch the coral because it is alive!","알록달록한 산호와 많은 물고기를 봤어요. 바다거북이 옆에서 헤엄쳤어요. 산호는 살아 있으니까 절대 만지면 안 돼요!"]],"tip":"욕조나 세숫대야에 얼굴을 살짝 담그는 스노클 흉내를 내면 아이가 깔깔 웃으며 표현을 기억합니다."},{"emoji":"✈️","title":"Day 5 · Flight Attendant Dayoon","sub":"기내 승무원 놀이 (다윤이가 승무원!)","words":[["seatbelt","안전벨트","시트벨트"],["passenger","승객","패신저"],["fasten","매다","패슨"]],"sentence":["Please fasten your seatbelt.","안전벨트를 매 주세요."],"main":[["P","Today you are the flight attendant, and I'm the passenger! I just sat down.","오늘은 네가 승무원, 나는 승객이야! 방금 자리에 앉았어."],["D","Welcome aboard! This is flight 707 to Sydney. Please fasten your seatbelt.","탑승을 환영합니다! 시드니행 707편입니다. 안전벨트를 매 주세요."],["P","Oops, I can't find my seatbelt. Can you help me?","이런, 안전벨트를 못 찾겠어요. 도와줄래요?"],["D","Of course! Here it is. Click! Now you are safe.","물론이죠! 여기 있어요. 딸깍! 이제 안전합니다."],["P","Excuse me, I'm thirsty. What drinks do you have?","저기요, 목이 말라요. 어떤 음료가 있나요?"],["D","We have water, orange juice, and strawberry juice. The strawberry juice is my pick!","물, 오렌지 주스, 딸기 주스가 있어요. 저는 딸기 주스 추천이요!"],["P","Strawberry juice, please. Oh no, the plane is shaking!","딸기 주스 주세요. 어어, 비행기가 흔들려요!"],["D","Don't worry, passengers! It's just a little bumpy sky. Hold your cup!","승객 여러분, 걱정 마세요! 하늘이 조금 울퉁불퉁할 뿐이에요. 컵을 잡으세요!"],["P","Bumpy sky! Ha! What can I watch on this flight?","울퉁불퉁한 하늘이라니! 하하! 이 비행기에서 뭘 볼 수 있죠?"],["D","You can watch movies on the screen. I recommend the one about a dog. I cried three times!","화면으로 영화를 볼 수 있어요. 강아지 나오는 영화 추천해요. 저는 세 번 울었어요!"],["P","We are landing soon. What should passengers do?","곧 착륙합니다. 승객들은 뭘 해야 하죠?"],["D","Please sit down, fasten your seatbelt, and open the window shade. Thank you for flying with us!","자리에 앉아 안전벨트를 매고 창문 덮개를 열어 주세요. 저희 비행기를 이용해 주셔서 감사합니다!"]],"role":[["P","Attendant! My little son dropped his toy under the seat.","승무원! 우리 어린 아들이 의자 밑에 장난감을 떨어뜨렸어요."],["D","I will find it. Got it! Here you go, little passenger.","제가 찾아볼게요. 찾았다! 여기 있어요, 꼬마 승객님."],["P","Thank you! Also, what time do we land in Sydney?","고마워요! 그리고 시드니에는 몇 시에 도착하죠?"],["D","We land at nine in the morning. You can sleep now.","아침 9시에 착륙합니다. 지금 주무셔도 돼요."],["P","Can I have a blanket, please? It's cold.","담요 좀 주시겠어요? 춥네요."],["D","Here is a warm blanket. Sweet dreams, passenger!","여기 따뜻한 담요요. 좋은 꿈 꾸세요, 승객님!"],["P","You are the kindest attendant ever. Do you like this job?","당신은 최고로 친절한 승무원이에요. 이 일이 좋아요?"],["D","Yes, but my dream job is different. I will design the planes... I mean, cars!","네, 하지만 제 꿈은 달라요. 저는 비행기를 디자인할... 아니, 자동차요!"]],"wrap":[["P","What does a flight attendant say to passengers?","승무원은 승객에게 뭐라고 말하지?"],["D","Welcome aboard! Please fasten your seatbelt. We have juice and water, and we land at nine o'clock!","탑승을 환영합니다! 안전벨트를 매 주세요. 주스와 물이 있고, 우리는 9시에 착륙합니다!"]],"tip":"소파를 비행기 좌석 삼아 진짜 컵을 서빙하게 해 보세요. 역할이 바뀌면 아이 발화량이 두 배가 됩니다."},{"emoji":"📅","title":"Day 6 · My Dream Trip Plan","sub":"나만의 여행 계획 발표","words":[["plan","계획","플랜"],["first","먼저","퍼스트"],["finally","마지막으로","파이널리"]],"sentence":["First, I will visit Sydney. Finally, I will see the kiwi birds.","먼저 시드니에 가고, 마지막으로 키위새를 볼 거예요."],"main":[["P","You are the trip planner today! Plan our dream trip to Australia and New Zealand.","오늘은 네가 여행 플래너야! 호주와 뉴질랜드 꿈의 여행을 계획해 줘."],["D","Yes! My plan has five days. Are you ready to hear it?","네! 제 계획은 5일짜리예요. 들을 준비 되셨나요?"],["P","Ready! Day one?","준비 완료! 첫째 날은?"],["D","First, we will fly to Sydney and see the Opera House. It looks like white seashells!","먼저 시드니로 날아가서 오페라 하우스를 볼 거예요. 하얀 조개껍데기처럼 생겼어요!"],["P","Beautiful! What about day two and three?","멋지다! 둘째 날과 셋째 날은?"],["D","Next, we will meet kangaroos and koalas. Then, we will snorkel at the reef.","다음엔 캥거루와 코알라를 만나요. 그다음엔 산호초에서 스노클을 해요."],["P","And then we fly to New Zealand?","그다음엔 뉴질랜드로 가는 거야?"],["D","Yes! After that, we will see the sheep farms and the mountains.","네! 그 후에 양 목장과 산을 볼 거예요."],["P","And the last day?","마지막 날은?"],["D","Finally, we will find the kiwi bird and say goodbye. Then home to Gwacheon!","마지막으로 키위새를 찾고 작별 인사를 해요. 그리고 과천 집으로!"],["P","Perfect plan! Now say the whole plan from start to finish, like a real planner!","완벽한 계획이야! 이제 진짜 플래너처럼 처음부터 끝까지 말해 봐!"],["D","First, we will see the Opera House in Sydney. Next, we will meet kangaroos and koalas. Then, we will snorkel at the Great Barrier Reef. After that, we will visit the sheep farms in New Zealand. Finally, we will find a kiwi bird. It will be the best trip ever!","먼저 시드니에서 오페라 하우스를 봐요. 다음엔 캥거루와 코알라를 만나요. 그다음엔 그레이트 배리어 리프에서 스노클을 해요. 그 후에 뉴질랜드 양 목장에 가요. 마지막으로 키위새를 찾아요. 최고의 여행이 될 거예요!"]],"role":[["P","Planner Dayoon, how much money do we need for this trip?","다윤 플래너님, 이 여행에 돈이 얼마나 필요할까요?"],["D","A lot! We should save money. Let's put coins in the piggy bank every day.","많이요! 우리 저축해야 해요. 매일 돼지 저금통에 동전을 넣어요."],["P","Good idea. Who is coming on this trip?","좋은 생각이야. 이 여행엔 누가 가나요?"],["D","Mom, Dad, Siheon, and me. Maybe Minseo can come too!","엄마, 아빠, 시헌이, 그리고 저요. 어쩌면 민서도 올 수 있어요!"],["P","What is the number one thing you want to see?","가장 보고 싶은 것 딱 하나는 뭐예요?"],["D","The koala! I want to draw it sleeping in the tree.","코알라요! 나무에서 자는 모습을 그리고 싶어요."],["P","When should we go on this dream trip?","이 꿈의 여행은 언제 가면 좋을까요?"],["D","Next summer! I will be ready. My English will be even better by then!","내년 여름이요! 준비하고 있을게요. 그때쯤 제 영어는 더 늘어 있을 거예요!"]],"wrap":[["P","Tell me your dream trip plan one more time, short and sweet.","네 꿈의 여행 계획을 짧고 멋지게 한 번 더 말해 줘."],["D","First, we will visit Sydney in Australia. Then we will snorkel and meet koalas. Finally, we will see the sheep and kiwi birds in New Zealand!","먼저 호주 시드니에 가요. 그다음 스노클을 하고 코알라를 만나요. 마지막으로 뉴질랜드에서 양과 키위새를 봐요!"]],"tip":"아이가 발표를 마치면 박수와 함께 'Which day sounds the most fun?'이라고 물어 한 문장을 더 끌어내 주세요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"2주차 총정리 · 뉴질랜드·호주 인터뷰","interview":true,"pool":["What do you show at the airport check-in counter?","What do you do at the airport? Tell me in order with First, Next, and Finally.","What is special about New Zealand?","Can a kiwi bird fly? Tell me about it.","How do people say hello in Australia?","Compare a kangaroo and a koala. How are they different?","What did you see at the Great Barrier Reef?","Why should we never touch the coral?","What does a flight attendant say to passengers?","Tell me your dream trip plan in five or six sentences."],"tip":"질문 순서를 아이가 직접 뽑게 하세요(쪽지 뽑기). 뽑는 재미가 인터뷰 긴장감을 줄여 줍니다."}]},{"sub":"길을 물어봐요","days":[{"emoji":"🧭","title":"Day 1 · Go Straight, Turn Left!","sub":"기본 길 안내 표현","words":[["straight","곧장","스트레이트"],["turn","돌다","턴"],["corner","모퉁이","코너"]],"sentence":["Go straight and turn left at the corner.","곧장 가다가 모퉁이에서 왼쪽으로 도세요."],"main":[["P","Excuse me! I'm lost. Where is the library?","실례합니다! 길을 잃었어요. 도서관이 어디에 있나요?"],["D","Don't worry! Go straight and turn left at the corner.","걱정 마세요! 곧장 가다가 모퉁이에서 왼쪽으로 도세요."],["P","Go straight... turn left... And then?","곧장 가서... 왼쪽으로... 그다음은요?"],["D","Then you will see a big white building. That's the library!","그러면 큰 하얀 건물이 보일 거예요. 그게 도서관이에요!"],["P","Is it far from here?","여기서 먼가요?"],["D","No, it takes about five minutes on foot.","아니요, 걸어서 5분 정도 걸려요."],["P","Thank you! By the way, which is your left hand?","고마워요! 그런데 어느 쪽이 왼손이죠?"],["D","This one! I write and draw with my right hand, so the other one is left!","이쪽이요! 저는 오른손으로 글씨 쓰고 그림 그리니까, 반대쪽이 왼쪽이에요!"],["P","Smart trick! What if I turn right instead?","똑똑한 방법이네요! 만약 오른쪽으로 돌면 어떻게 되죠?"],["D","Then you will meet a big dog at the pet shop. Actually... turn right! I love that dog!","그러면 펫숍의 큰 강아지를 만나게 돼요. 사실... 오른쪽으로 도세요! 저 그 강아지 좋아해요!"],["P","Ha! Give me the full directions one more time, slowly.","하하! 전체 길 안내를 천천히 한 번만 더 해 줘요."],["D","Okay! Go straight for five minutes. Turn left at the corner. You will see a big white building. That is the library. You can't miss it!","네! 5분 동안 곧장 가세요. 모퉁이에서 왼쪽으로 도세요. 큰 하얀 건물이 보일 거예요. 그게 도서관이에요. 못 찾을 수가 없어요!"]],"role":[["P","Robot game! I'm a robot. Move me with directions. Beep!","로봇 놀이! 나는 로봇이야. 길 안내로 나를 움직여 봐. 삑!"],["D","Robot, go straight three steps!","로봇, 앞으로 세 걸음 가세요!"],["P","Beep. One, two, three. Now what?","삑. 하나, 둘, 셋. 이제 뭘 할까요?"],["D","Turn right and walk to the sofa!","오른쪽으로 돌아서 소파까지 걸어가세요!"],["P","Beep beep. I am at the sofa. Next order?","삑삑. 소파에 도착했습니다. 다음 명령은?"],["D","Sit down and... give me a high five!","앉아서... 하이파이브 해 주세요!"],["P","Beep! High five! Where did the robot go today?","삑! 하이파이브! 오늘 로봇이 어디로 갔죠?"],["D","The robot went straight, turned right, and sat on the sofa!","로봇은 곧장 가서, 오른쪽으로 돌고, 소파에 앉았어요!"]],"wrap":[["P","How do I get to the library? Tell me again.","도서관에 어떻게 가는지 다시 말해 줘."],["D","Go straight and turn left at the corner. You will see a big white building. It takes five minutes on foot!","곧장 가다가 모퉁이에서 왼쪽으로 도세요. 큰 하얀 건물이 보여요. 걸어서 5분 걸려요!"]],"tip":"거실에서 실제로 걸으며 straight, turn left를 몸으로 연습하면 방향 감각과 영어가 함께 자랍니다."},{"emoji":"💎","title":"Day 2 · The Treasure Hunt","sub":"집 안 보물찾기 놀이","words":[["treasure","보물","트레저"],["behind","~ 뒤에","비하인드"],["under","~ 아래에","언더"]],"sentence":["The treasure is hiding behind the sofa!","보물이 소파 뒤에 숨어 있어요!"],"main":[["P","Captain Dayoon! I have an old treasure map. Will you help me?","다윤 선장님! 나에게 오래된 보물 지도가 있어요. 도와줄래요?"],["D","Aye aye! Captain Dayoon is ready! Where do we start?","아이 아이! 다윤 선장 준비 완료! 어디서 시작하죠?"],["P","The map says: start at the door and take four steps forward.","지도에 쓰여 있길, 문에서 시작해서 앞으로 네 걸음."],["D","One, two, three, four! Now I'm next to the bookshelf.","하나, 둘, 셋, 넷! 이제 책장 옆에 있어요."],["P","Now look under something soft and blue.","이제 부드럽고 파란 것 아래를 봐요."],["D","Soft and blue... the sky-blue cushion! I will look under it... A key!","부드럽고 파란 것... 하늘색 쿠션이요! 그 아래를 볼게요... 열쇠다!"],["P","A golden key! The last clue: the treasure sleeps behind the tallest thing.","황금 열쇠! 마지막 단서, 보물은 가장 키가 큰 것 뒤에서 잔다."],["D","The tallest thing... Dad? No, the refrigerator! Let me check behind it!","가장 키 큰 것... 아빠? 아니, 냉장고예요! 뒤를 확인해 볼게요!"],["P","And? What do you see, Captain?","그래서? 뭐가 보이나요, 선장님?"],["D","A box! Inside there are... strawberries! The sweetest treasure in the world!","상자예요! 안에는... 딸기가 있어요! 세상에서 제일 달콤한 보물이에요!"],["P","You did it! Tell me the whole hunt story in five sentences.","해냈다! 보물찾기 이야기를 다섯 문장으로 말해 봐요."],["D","I started at the door. I took four steps forward. I found a key under the sky-blue cushion. The treasure was behind the refrigerator. It was a box of strawberries!","문에서 시작했어요. 앞으로 네 걸음 갔어요. 하늘색 쿠션 아래에서 열쇠를 찾았어요. 보물은 냉장고 뒤에 있었어요. 딸기 한 상자였어요!"]],"role":[["P","Now you hide the treasure and give me clues! I close my eyes.","이제 네가 보물을 숨기고 단서를 줘! 나는 눈을 감을게."],["D","Done! First clue: go to the room where we eat.","다 됐어요! 첫 번째 단서, 우리가 밥 먹는 방으로 가세요."],["P","The kitchen! I'm here. Next clue, please.","주방이구나! 왔어요. 다음 단서 주세요."],["D","Look under the table. But watch your head!","식탁 아래를 보세요. 머리 조심하고요!"],["P","Ouch! Too late. There is a note here: look behind the biggest chair.","아야! 늦었네. 여기 쪽지가 있다. 가장 큰 의자 뒤를 보시오."],["D","You are getting close! Warm... warmer... hot!","가까워지고 있어요! 따뜻... 더 따뜻... 뜨거워요!"],["P","Found it! A drawing of a puppy! Did you draw this?","찾았다! 강아지 그림이네! 네가 그렸어?"],["D","Yes! That's the treasure. My drawings are very expensive, you know!","네! 그게 보물이에요. 제 그림은 아주 비싸다고요!"]],"wrap":[["P","Where was the treasure hiding today?","오늘 보물이 어디에 숨어 있었지?"],["D","The key was under the sky-blue cushion. The treasure was behind the refrigerator. It was a box of sweet strawberries!","열쇠는 하늘색 쿠션 아래에 있었어요. 보물은 냉장고 뒤에 있었어요. 달콤한 딸기 한 상자였어요!"]],"tip":"under, behind, next to 같은 위치 표현은 진짜 물건을 숨기고 찾을 때 가장 빨리 익혀집니다. 주말에 꼭 한 번 해 보세요."},{"emoji":"🚏","title":"Day 3 · Take Bus Number Seven","sub":"버스·지하철로 길 찾기","words":[["take","(교통수단을) 타다","테이크"],["bus stop","버스 정류장","버스 스탑"],["get off","내리다","겟 오프"]],"sentence":["Take bus number seven and get off at the park.","7번 버스를 타고 공원에서 내리세요."],"main":[["P","Excuse me, how can I get to the Grand Park?","실례합니다, 대공원까지 어떻게 가나요?"],["D","You can take bus number seven. The bus stop is over there.","7번 버스를 타시면 돼요. 버스 정류장은 저쪽에 있어요."],["P","Bus number seven. Where do I get off?","7번 버스요. 어디서 내리나요?"],["D","Get off at the fourth stop. You will hear the announcement.","네 번째 정류장에서 내리세요. 안내 방송이 나올 거예요."],["P","Can I take the subway instead?","대신 지하철을 탈 수도 있나요?"],["D","Yes! Take line four and get off at Grand Park Station. It's faster.","네! 4호선을 타고 대공원역에서 내리세요. 그게 더 빨라요."],["P","Which one do you like better, the bus or the subway?","버스랑 지하철 중에 뭐가 더 좋아요?"],["D","The bus! I can watch the sky and the trees from the window.","버스요! 창밖으로 하늘과 나무를 볼 수 있거든요."],["P","Nice. Oh no, I only have a card with no money on it!","좋네요. 이런, 저는 돈이 없는 카드밖에 없어요!"],["D","Ha! Then you should walk... for one hour! Just kidding, you can charge it at the station.","하하! 그럼 걸어가셔야 해요... 한 시간 동안요! 농담이에요, 역에서 충전할 수 있어요."],["P","Phew! Tell me the whole way one more time.","휴! 가는 길을 처음부터 한 번 더 말해 줘요."],["D","Take bus number seven at that bus stop. Ride for four stops. Get off at the Grand Park stop. Then walk straight for two minutes. Have fun at the park!","저 정류장에서 7번 버스를 타세요. 네 정류장을 가세요. 대공원 정류장에서 내리세요. 그리고 2분 동안 곧장 걸으세요. 공원에서 재미있게 노세요!"]],"role":[["P","Ding! I'm the bus driver. Welcome! Where are you going?","딩동! 나는 버스 기사입니다. 어서 오세요! 어디 가세요?"],["D","Hello! Does this bus go to the Grand Park?","안녕하세요! 이 버스 대공원에 가나요?"],["P","Yes, it does. Please tap your card. Beep!","네, 갑니다. 카드를 찍어 주세요. 삑!"],["D","Thank you. How many stops to the park?","감사합니다. 공원까지 몇 정거장이에요?"],["P","Four stops. Please hold the handle. The road is bumpy today!","네 정거장이요. 손잡이를 잡으세요. 오늘 길이 울퉁불퉁해요!"],["D","Whoa! This bus jumps like a kangaroo!","우와! 이 버스는 캥거루처럼 뛰네요!"],["P","Ha! Next stop, Grand Park! Anyone getting off?","하하! 다음 정류장은 대공원입니다! 내리실 분?"],["D","Me! I'm getting off. Thank you, driver! Have a safe day!","저요! 저 내려요. 기사님 감사합니다! 안전 운전하세요!"]],"wrap":[["P","How do I get to the Grand Park by bus?","버스로 대공원까지 어떻게 가지?"],["D","Take bus number seven at the bus stop. Ride for four stops and get off at the park. Then walk straight for two minutes!","정류장에서 7번 버스를 타세요. 네 정거장 가서 공원에서 내려요. 그리고 2분 동안 곧장 걸어요!"]],"tip":"다음에 실제 버스를 탈 때 'We get off at the next stop!'이라고 아이가 외치게 해 보세요. 배운 표현이 현실과 연결됩니다."},{"emoji":"🏬","title":"Day 4 · Lost in the Mall","sub":"쇼핑몰에서 길 찾기","words":[["floor","층","플로어"],["elevator","엘리베이터","엘리베이터"],["restroom","화장실","레스트룸"]],"sentence":["The toy store is on the third floor.","장난감 가게는 3층에 있어요."],"main":[["P","Welcome to the Star Mall information desk! Can I help you?","스타몰 안내 데스크입니다! 도와드릴까요?"],["D","Yes, please! Where is the toy store? My brother is crying.","네, 부탁해요! 장난감 가게가 어디예요? 제 동생이 울고 있어요."],["P","Oh no! The toy store is on the third floor, next to the bookstore.","저런! 장난감 가게는 3층, 서점 옆에 있어요."],["D","Third floor. Should I take the elevator or the stairs?","3층이요. 엘리베이터를 탈까요, 계단으로 갈까요?"],["P","The elevator is faster. It's behind you, near the fountain.","엘리베이터가 더 빨라요. 뒤쪽 분수 근처에 있어요."],["D","Thank you! Oh, one more thing. Where is the restroom?","감사합니다! 아, 하나만 더요. 화장실은 어디예요?"],["P","It's on every floor, next to the elevator.","모든 층 엘리베이터 옆에 있어요."],["D","Perfect. And... where is the pasta restaurant? I'm asking for me, not my brother!","완벽해요. 그리고... 파스타 식당은 어디예요? 동생 말고 저를 위해 묻는 거예요!"],["P","Ha! The food court is on the fifth floor. Anything else?","하하! 푸드코트는 5층이에요. 더 필요한 것 있나요?"],["D","No, that's all. You are very kind!","아니요, 그게 다예요. 정말 친절하시네요!"],["P","Can you repeat your plan so you don't get lost?","길을 안 잃게 계획을 다시 말해 볼래요?"],["D","Sure! First, I will take the elevator near the fountain. Then, I will go to the toy store on the third floor. After that, we will eat pasta on the fifth floor. My brother will stop crying!","네! 먼저 분수 근처 엘리베이터를 타요. 그다음 3층 장난감 가게로 가요. 그 후에 5층에서 파스타를 먹어요. 동생은 울음을 그칠 거예요!"]],"role":[["P","Ding! This is the mall announcement. A little boy is looking for his sister!","딩동! 쇼핑몰 안내 방송입니다. 한 남자아이가 누나를 찾고 있습니다!"],["D","Oh no, that's Siheon! Where is the announcement room?","이런, 시헌이잖아요! 방송실이 어디예요?"],["P","It's on the first floor. He is safe and eating a cookie.","1층에 있어요. 동생은 무사히 쿠키를 먹고 있어요."],["D","Of course he is. He never cries when there are cookies!","그럼 그렇죠. 걔는 쿠키만 있으면 절대 안 울어요!"],["P","Here he is! What do you say to your brother?","여기 있어요! 동생한테 뭐라고 말할래요?"],["D","Siheon! Don't walk away alone! Hold my hand, okay?","시헌아! 혼자 돌아다니면 안 돼! 내 손 잡아, 알았지?"],["P","Good sister! What is the rule for the mall now?","좋은 누나네요! 이제 쇼핑몰 규칙이 뭐죠?"],["D","Stay together! And if you are lost, go to the information desk on the first floor.","같이 다니기요! 그리고 길을 잃으면 1층 안내 데스크로 가는 거예요."]],"wrap":[["P","What do you do if you get lost in a mall?","쇼핑몰에서 길을 잃으면 어떻게 해야 하지?"],["D","I go to the information desk on the first floor. I say my name and ask for help. And I always stay with my family!","1층 안내 데스크로 가요. 제 이름을 말하고 도움을 요청해요. 그리고 항상 가족이랑 같이 다녀요!"]],"tip":"실제 마트나 몰에서 'Which floor is it on?'을 아이가 직원 대신 부모에게 묻고 답하게 해 보세요. 안전 교육도 함께 됩니다."},{"emoji":"🙋","title":"Day 5 · Helping a Tourist","sub":"여행객 도와주기 (다윤이가 안내!)","words":[["tourist","여행객","투어리스트"],["across from","~ 맞은편에","어크로스 프롬"],["near","~ 가까이에","니어"]],"sentence":["It's across from the park.","공원 맞은편에 있어요."],"main":[["P","Excuse me, little friend! I'm a tourist from Australia. G'day!","실례해요, 꼬마 친구! 나는 호주에서 온 여행객이에요. 그다이!"],["D","G'day, mate! Welcome to Gwacheon! How can I help you?","그다이, 메이트! 과천에 오신 걸 환영해요! 어떻게 도와드릴까요?"],["P","Wow, you know our greeting! I'm looking for a good restaurant.","와, 우리 인사를 아네요! 맛있는 식당을 찾고 있어요."],["D","There is a great one near here. It's across from the park.","이 근처에 아주 좋은 곳이 있어요. 공원 맞은편이에요."],["P","Across from the park. What food do they have?","공원 맞은편이요. 어떤 음식이 있나요?"],["D","They have Korean food. You should try bibimbap. It's like a rainbow in a bowl!","한국 음식이요. 비빔밥을 꼭 드셔 보세요. 그릇에 담긴 무지개 같아요!"],["P","A rainbow in a bowl! And where can I buy a gift for my daughter?","그릇에 담긴 무지개라니! 그리고 딸을 위한 선물은 어디서 사죠?"],["D","There is a gift shop near the station. They have cute socks and fans.","역 근처에 선물 가게가 있어요. 귀여운 양말이랑 부채를 팔아요."],["P","You are better than my guidebook! Are you a professional guide?","가이드북보다 낫네요! 혹시 전문 가이드예요?"],["D","Not yet! I'm ten. But my dream is big, so who knows?","아직요! 저는 열 살이에요. 하지만 제 꿈은 크니까, 모르는 일이죠?"],["P","Ha! Can you say the two directions again for me?","하하! 두 가지 길 안내를 다시 말해 줄래요?"],["D","Sure! The restaurant is across from the park. Try the bibimbap. The gift shop is near the station. Buy the cute socks. Enjoy Korea, mate!","네! 식당은 공원 맞은편이에요. 비빔밥을 드셔 보세요. 선물 가게는 역 근처예요. 귀여운 양말을 사세요. 한국 여행 즐기세요, 메이트!"]],"role":[["P","Oh no, it's raining! Tourist needs help again! Where can I buy an umbrella?","이런, 비가 와요! 여행객이 또 도움이 필요해요! 우산은 어디서 사죠?"],["D","The convenience store! It's right there, near the bus stop.","편의점이요! 바로 저기, 버스 정류장 근처에 있어요."],["P","Thank you! Can you say umbrella in Korean?","고마워요! 우산을 한국어로 뭐라고 해요?"],["D","We say u-san! Repeat after me. U-san!","우산이라고 해요! 따라 해 보세요. 우-산!"],["P","U-san! Did I say it right?","우-산! 제대로 말했나요?"],["D","Perfect! Now you are half Korean!","완벽해요! 이제 절반은 한국인이에요!"],["P","Ha! Thank you for everything, little guide.","하하! 모든 게 고마워요, 꼬마 가이드님."],["D","You're welcome! Have a wonderful trip in Korea!","천만에요! 한국에서 멋진 여행 하세요!"]],"wrap":[["P","A tourist asks you where the restaurant is. What do you say?","여행객이 식당이 어디냐고 물으면 뭐라고 말할래?"],["D","It's across from the park, near the bus stop. You should try bibimbap. It's like a rainbow in a bowl!","공원 맞은편, 버스 정류장 근처에 있어요. 비빔밥을 드셔 보세요. 그릇에 담긴 무지개 같아요!"]],"tip":"오늘은 아이가 '도움을 주는 사람'이 되는 날입니다. 일부러 헤매는 연기를 해서 아이가 주도권을 갖게 해 주세요."},{"emoji":"📍","title":"Day 6 · My Neighborhood Map","sub":"우리 동네 지도 그리며 말하기","words":[["neighborhood","동네","네이버후드"],["between","~ 사이에","비트윈"],["next to","~ 옆에","넥스트 투"]],"sentence":["The bakery is next to my school.","빵집은 우리 학교 옆에 있어요."],"main":[["P","Today, let's draw a map of your neighborhood! You are the map artist.","오늘은 우리 동네 지도를 그리자! 네가 지도 화가야."],["D","Yes! Drawing is my favorite! First, I will draw my apartment here.","좋아요! 그림 그리기는 제가 제일 좋아하는 거예요! 먼저 여기에 우리 아파트를 그릴게요."],["P","Good start. What is next to your apartment?","좋은 시작이야. 아파트 옆에는 뭐가 있지?"],["D","The playground is next to my apartment. Siheon lives there... I mean, he plays there all day!","놀이터가 아파트 옆에 있어요. 시헌이가 거기 살아요... 아니, 하루 종일 논다고요!"],["P","Ha! Where is your school on this map?","하하! 이 지도에서 학교는 어디야?"],["D","My school is here, and the bakery is next to my school. It smells amazing every morning.","학교는 여기고, 빵집이 학교 옆에 있어요. 아침마다 냄새가 끝내줘요."],["P","What is between your home and the school?","집이랑 학교 사이에는 뭐가 있어?"],["D","The flower shop is between my home and the school. I say hello to the shop cat every day.","집과 학교 사이에 꽃집이 있어요. 저는 매일 가게 고양이한테 인사해요."],["P","Where is your skating academy?","스케이트 학원은 어디에 있지?"],["D","It's across from the market. I go there after school.","시장 맞은편에 있어요. 방과 후에 거기 가요."],["P","Beautiful map! Now introduce your neighborhood in six sentences.","멋진 지도야! 이제 우리 동네를 여섯 문장으로 소개해 봐."],["D","This is my neighborhood in Gwacheon. My apartment is here, next to the playground. The flower shop is between my home and my school. The bakery is next to my school. My skating academy is across from the market. I love my neighborhood!","여기는 과천에 있는 우리 동네예요. 우리 아파트는 여기, 놀이터 옆이에요. 꽃집은 집과 학교 사이에 있어요. 빵집은 학교 옆에 있어요. 스케이트 학원은 시장 맞은편이에요. 저는 우리 동네가 좋아요!"]],"role":[["P","I'm a new neighbor! I just moved here. Where should I go first?","나는 새 이웃이에요! 방금 이사 왔어요. 어디부터 가 봐야 하죠?"],["D","Welcome! Go to the bakery first. The cream bread is the best.","환영해요! 빵집부터 가 보세요. 크림빵이 최고예요."],["P","Yum! Where can my kids play?","맛있겠다! 우리 아이들은 어디서 놀 수 있나요?"],["D","The playground next to my apartment! My brother is always there. He can be their friend!","우리 아파트 옆 놀이터요! 제 동생이 맨날 거기 있어요. 친구가 되어 줄 거예요!"],["P","Great! Is there a place to exercise?","좋아요! 운동할 곳도 있나요?"],["D","Yes, there is a park near the school. People walk their dogs there. So many cute dogs!","네, 학교 근처에 공원이 있어요. 사람들이 강아지를 산책시켜요. 귀여운 강아지가 정말 많아요!"],["P","You know everything! Thank you, neighbor!","모르는 게 없네요! 고마워요, 이웃님!"],["D","You're welcome! Knock on my door if you get lost!","천만에요! 길 잃으면 저희 집 문을 두드리세요!"]],"wrap":[["P","Tell me about two places in your neighborhood.","우리 동네의 장소 두 곳을 말해 줘."],["D","The bakery is next to my school and it smells amazing. My skating academy is across from the market. I love my neighborhood in Gwacheon!","빵집은 학교 옆인데 냄새가 끝내줘요. 스케이트 학원은 시장 맞은편이에요. 저는 과천 우리 동네가 좋아요!"]],"tip":"아이가 그린 동네 지도를 벽에 붙여 두세요. 다음 주까지 지나가며 한 문장씩 말하게 하면 복습이 저절로 됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"3주차 총정리 · 길 묻기 인터뷰","interview":true,"pool":["How do I get to the library? Give me directions.","Where was the treasure hiding? Use under and behind.","Which bus goes to the Grand Park, and where do I get off?","Do you like the bus or the subway better? Why?","Which floor is the toy store on in the mall?","What should you do if you get lost in a mall?","A tourist asks you about a good restaurant. What do you say?","What is next to your school in your neighborhood?","What is between your home and your school?","Introduce your neighborhood in five sentences."],"tip":"아이 답변에 방향 표현이 나오면 부모가 실제로 그 방향으로 몸을 돌려 주세요. 말이 맞았다는 확인이 즉각 됩니다."}]},{"sub":"신나는 탈것 세상","days":[{"emoji":"🚇","title":"Day 1 · Bus or Subway?","sub":"탈것 비교하기","words":[["subway","지하철","서브웨이"],["faster","더 빠른","패스터"],["crowded","붐비는","크라우디드"]],"sentence":["The subway is faster than the bus.","지하철이 버스보다 더 빨라요."],"main":[["P","Dayoon, we are going to Seoul today. Bus or subway?","다윤아, 오늘 서울에 갈 거야. 버스랑 지하철 중에 뭘 탈까?"],["D","Hmm, the subway is faster than the bus. Let's take the subway!","음, 지하철이 버스보다 빨라요. 지하철 타요!"],["P","But the subway is very crowded in the morning.","그런데 아침에는 지하철이 아주 붐비는데."],["D","That's true. Then the bus is more comfortable. We can sit and look outside.","맞아요. 그럼 버스가 더 편해요. 앉아서 밖을 볼 수 있잖아요."],["P","So which one wins today?","그래서 오늘의 승자는 누구야?"],["D","The bus wins! Comfortable seats beat fast trains today.","버스 승리! 오늘은 편한 자리가 빠른 열차를 이겨요."],["P","Nice choice. Which is cheaper, a bike or a bus?","좋은 선택이야. 자전거랑 버스 중엔 뭐가 더 싸지?"],["D","A bike is cheaper! It's free after you buy it. And it makes my legs strong.","자전거가 더 싸요! 사고 나면 공짜잖아요. 다리도 튼튼해져요."],["P","What is the most fun ride in the world for you?","너에게 세상에서 제일 재미있는 탈것은 뭐야?"],["D","The roller coaster! It's the fastest, the loudest, and the screamiest! Is that a word?","롤러코스터요! 제일 빠르고, 제일 시끄럽고, 제일 소리 지르게 돼요! 이런 말이 있나요?"],["P","Ha! It is now! Compare three rides for me in five sentences.","하하! 이제부터 있는 걸로 하자! 탈것 세 개를 다섯 문장으로 비교해 봐."],["D","The subway is faster than the bus. The bus is more comfortable than the subway. A bike is cheaper than both. But the roller coaster is the most fun. I want to ride it this weekend!","지하철은 버스보다 빨라요. 버스는 지하철보다 편해요. 자전거는 둘 다보다 싸요. 하지만 롤러코스터가 제일 재미있어요. 이번 주말에 타고 싶어요!"]],"role":[["P","Quiz time! I say a ride, you say one thing about it. Taxi!","퀴즈 시간! 내가 탈것을 말하면 한 가지 특징을 말해 줘. 택시!"],["D","A taxi is fast, but it's more expensive than the bus.","택시는 빠르지만 버스보다 비싸요."],["P","Correct! Airplane!","정답! 비행기!"],["D","An airplane is the fastest. It flies over the clouds!","비행기가 제일 빨라요. 구름 위를 날아요!"],["P","Walking!","걷기!"],["D","Walking is the slowest, but it's free and healthy!","걷기는 제일 느리지만 공짜고 건강에 좋아요!"],["P","Last one. A turtle's back!","마지막이야. 거북이 등!"],["D","Ha! It's the slowest taxi in the sea. One year to Busan, please!","하하! 바다에서 제일 느린 택시예요. 부산까지 1년 걸려요!"]],"wrap":[["P","Compare the bus and the subway for me.","버스와 지하철을 비교해 줘."],["D","The subway is faster than the bus. But the bus is more comfortable. I like the bus because I can watch the sky!","지하철이 버스보다 빨라요. 하지만 버스가 더 편해요. 저는 하늘을 볼 수 있어서 버스가 좋아요!"]],"tip":"비교급 -er than은 두 손을 저울처럼 위아래로 움직이며 말하면 아이가 개념을 눈으로 이해합니다."},{"emoji":"🚄","title":"Day 2 · Riding the KTX","sub":"기차 여행 표현","words":[["train","기차","트레인"],["station","역","스테이션"],["arrive","도착하다","어라이브"]],"sentence":["How long does it take to Busan?","부산까지 얼마나 걸려요?"],"main":[["P","We are at Seoul Station! The KTX is waiting. Are you excited?","서울역에 도착했다! KTX가 기다리고 있어. 신나니?"],["D","Yes! The train looks like a long white arrow!","네! 기차가 길고 하얀 화살 같아요!"],["P","Nice one! Let's find our seats. We are in car 5, seats 3A and 3B.","멋진 표현이야! 자리를 찾자. 우리는 5호차 3A, 3B야."],["D","Found them! Can I sit by the window, please?","찾았어요! 제가 창가에 앉아도 돼요?"],["P","Sure. Now, ask me the big question about time.","그래. 이제 시간에 대한 중요한 질문을 해 봐."],["D","How long does it take to Busan?","부산까지 얼마나 걸려요?"],["P","It takes about two and a half hours. What will you do on the train?","두 시간 반 정도 걸려. 기차에서 뭘 할 거야?"],["D","I will draw the mountains and rivers from the window. The world runs backwards outside!","창밖의 산과 강을 그릴 거예요. 밖에서 세상이 뒤로 달려가요!"],["P","Poetic! The train is so fast. How fast do you think it goes?","시인 같네! 기차가 정말 빠르지. 얼마나 빠를 것 같아?"],["D","About three hundred kilometers per hour! Faster than a cheetah!","시속 300킬로미터쯤이요! 치타보다 빨라요!"],["P","We will arrive soon. Tell me about our train ride in five sentences.","곧 도착이야. 우리 기차 여행을 다섯 문장으로 말해 봐."],["D","We took the KTX at Seoul Station. I sat by the window. The train went three hundred kilometers per hour. I drew the mountains outside. We arrived in Busan in two and a half hours!","우리는 서울역에서 KTX를 탔어요. 저는 창가에 앉았어요. 기차는 시속 300킬로미터로 달렸어요. 저는 창밖의 산을 그렸어요. 두 시간 반 만에 부산에 도착했어요!"]],"role":[["P","Tickets, please! I'm the train conductor.","표 검사합니다! 나는 기차 승무원이에요."],["D","Here is my ticket. Seat 3A, by the window!","여기 제 표요. 창가 자리 3A예요!"],["P","Thank you. Would you like anything from the snack cart?","감사합니다. 간식 카트에서 뭐 드릴까요?"],["D","Do you have anything with strawberries?","딸기 들어간 것 있나요?"],["P","We have strawberry milk and cookies.","딸기 우유랑 쿠키가 있어요."],["D","Strawberry milk, please! Trains make me hungry.","딸기 우유 주세요! 기차 타면 배가 고파져요."],["P","Here you go. Next stop is Busan. Don't forget your bag!","여기 있어요. 다음 역은 부산입니다. 가방 잊지 마세요!"],["D","I won't! Thank you! I will hug my bag like a teddy bear.","안 잊어요! 감사합니다! 가방을 곰 인형처럼 꼭 안고 있을게요."]],"wrap":[["P","Tell me about riding the KTX.","KTX 타는 것에 대해 말해 줘."],["D","I took the KTX at the station and sat by the window. It takes two and a half hours to Busan. The train is faster than a cheetah!","역에서 KTX를 타고 창가에 앉았어요. 부산까지 두 시간 반 걸려요. 기차는 치타보다 빨라요!"]],"tip":"'How long does it take?'는 여행 필수 문장입니다. 엘리베이터, 라면 끓이기 등 일상에서 자꾸 물어봐 주세요."},{"emoji":"⛴️","title":"Day 3 · On the Ferry","sub":"배 타고 섬으로","words":[["ferry","여객선","페리"],["deck","갑판","데크"],["seagull","갈매기","시걸"]],"sentence":["Let's go up to the deck!","갑판으로 올라가자!"],"main":[["P","Today we ride a ferry to an island! Have you ever been on a big ship?","오늘은 여객선을 타고 섬에 간다! 큰 배 타 본 적 있어?"],["D","No, this is my first time! My heart is going boom boom!","아니요, 처음이에요! 심장이 쿵쿵 뛰어요!"],["P","The ship is moving! How does it feel?","배가 움직인다! 느낌이 어때?"],["D","It feels like the floor is dancing! Whoa, I'm walking like a penguin!","바닥이 춤추는 것 같아요! 우와, 저 펭귄처럼 걷고 있어요!"],["P","Ha! Let's go up to the deck. What can you see?","하하! 갑판으로 올라가자. 뭐가 보여?"],["D","I can see the wide blue sea and white seagulls! One is following our ship!","넓고 파란 바다랑 하얀 갈매기가 보여요! 한 마리가 우리 배를 따라와요!"],["P","Maybe it wants your snack. Watch out!","네 간식을 노리는 걸지도 몰라. 조심해!"],["D","No way, seagull! This shrimp snack is mine! Okay... just one.","안 돼, 갈매기야! 이 새우 과자는 내 거야! 알았어... 딱 하나만."],["P","So kind! How long does the ferry take to the island?","마음도 착하지! 여객선으로 섬까지 얼마나 걸리지?"],["D","It takes about forty minutes. I hope I don't get seasick!","40분 정도 걸려요. 뱃멀미 안 했으면 좋겠어요!"],["P","Look, the island! Tell me about the ferry ride in five sentences.","봐, 섬이다! 배 탄 이야기를 다섯 문장으로 해 봐."],["D","Today I rode a ferry for the first time. The floor danced and I walked like a penguin. I went up to the deck. A seagull followed us and I shared my snack. The sea was big and beautiful!","오늘 처음으로 여객선을 탔어요. 바닥이 춤춰서 펭귄처럼 걸었어요. 갑판에 올라갔어요. 갈매기가 따라와서 과자를 나눠 줬어요. 바다는 크고 아름다웠어요!"]],"role":[["P","Ahoy! I'm the ship captain. Do you want to see the captain's room?","어이! 나는 이 배의 선장이다. 조종실 구경할래요?"],["D","Ahoy, Captain! Yes, please! Wow, so many buttons!","아하이, 선장님! 네, 좋아요! 와, 버튼이 엄청 많아요!"],["P","This is the wheel. Do you want to hold it for a second?","이게 조타륜이야. 잠깐 잡아 볼래?"],["D","Really? I'm driving a ship! Everyone, hold on tight!","정말요? 제가 배를 운전해요! 여러분, 꽉 잡으세요!"],["P","Careful! Which way to the island, sailor?","조심해! 섬은 어느 쪽이지, 선원?"],["D","Straight ahead, Captain! I can see it with my super eyes!","곧장 앞이요, 선장님! 제 슈퍼 눈으로 보여요!"],["P","Great job! What do we say when we arrive?","잘했어! 도착하면 뭐라고 하지?"],["D","Land ho! We arrived safely. Thank you, Captain!","육지다! 우리는 무사히 도착했어요. 감사합니다, 선장님!"]],"wrap":[["P","What was special about the ferry today?","오늘 여객선에서 뭐가 특별했어?"],["D","I rode a ferry for the first time and went up to the deck. A seagull followed our ship. I even held the captain's wheel!","처음으로 여객선을 타고 갑판에 올라갔어요. 갈매기가 우리 배를 따라왔어요. 심지어 선장님 조타륜도 잡아 봤어요!"]],"tip":"'첫 경험' 이야기는 아이 발화가 가장 길어지는 주제입니다. It was my first time 문장을 오늘 꼭 한 번 말하게 하세요."},{"emoji":"🚲","title":"Day 4 · Bikes and Skates","sub":"자전거와 스케이트","words":[["ride","타다","라이드"],["helmet","헬멧","헬멧"],["balance","균형","밸런스"]],"sentence":["I can ride my bike without falling!","저는 넘어지지 않고 자전거를 탈 수 있어요!"],"main":[["P","Dayoon, you go to a skating academy, right? Tell me about it!","다윤아, 너 스케이트 학원 다니지? 얘기해 줘!"],["D","Yes! I skate twice a week. At first I fell a lot, but now I'm pretty good!","네! 일주일에 두 번 타요. 처음엔 많이 넘어졌는데 지금은 꽤 잘 타요!"],["P","What is the most important thing when you skate?","스케이트 탈 때 제일 중요한 게 뭐야?"],["D","Balance! And wearing a helmet. Safety first!","균형이요! 그리고 헬멧 쓰기요. 안전이 최우선!"],["P","Right! Can you ride a bike too?","맞아! 자전거도 탈 수 있어?"],["D","Yes, I can ride my bike without falling! Skating helped my balance.","네, 넘어지지 않고 자전거를 탈 수 있어요! 스케이트가 균형 잡기에 도움이 됐어요."],["P","Which is harder, skating or biking?","스케이트랑 자전거 중에 뭐가 더 어려워?"],["D","Skating is harder. On a bike, the wheels help you. On skates, only your legs help you!","스케이트가 더 어려워요. 자전거는 바퀴가 도와주지만, 스케이트는 다리만 도와주거든요!"],["P","Wise words! What about Siheon? Can he ride a bike?","명언이네! 시헌이는? 자전거 탈 수 있어?"],["D","He rides a bike with training wheels. He says he's a motorcycle racer. Vroom vroom!","시헌이는 보조 바퀴 달린 자전거를 타요. 자기가 오토바이 선수래요. 부릉부릉!"],["P","Ha! Tell me about your riding skills in five sentences.","하하! 네 타기 실력을 다섯 문장으로 말해 봐."],["D","I go to a skating academy twice a week. At first, I fell down a lot. Now I can skate fast with good balance. I can also ride my bike without falling. But I always wear my helmet!","저는 일주일에 두 번 스케이트 학원에 가요. 처음에는 많이 넘어졌어요. 지금은 균형을 잘 잡고 빠르게 타요. 자전거도 안 넘어지고 탈 수 있어요. 하지만 항상 헬멧을 써요!"]],"role":[["P","Welcome to the bike rental shop! Which bike do you want?","자전거 대여점에 오신 걸 환영해요! 어떤 자전거를 원하세요?"],["D","The sky-blue one, please! How much is it for one hour?","하늘색 자전거요! 한 시간에 얼마예요?"],["P","Three thousand won. Here is a helmet too. It's free.","3천 원이요. 여기 헬멧도요. 이건 공짜예요."],["D","Thank you! Does this bike have a bell?","감사합니다! 이 자전거에 종이 있나요?"],["P","Yes, ring it like this. Ring ring! Try it.","네, 이렇게 울려요. 따르릉! 해 보세요."],["D","Ring ring! Excuse me, superstar rider coming through!","따르릉! 실례합니다, 슈퍼스타 라이더 지나갑니다!"],["P","Ha! Come back before six, okay?","하하! 6시 전에는 돌아오세요, 알았죠?"],["D","Okay! I will ride along the river and come back at five thirty!","네! 강을 따라 타다가 5시 30분에 돌아올게요!"]],"wrap":[["P","What can you ride, and what do you always wear?","너는 뭘 탈 수 있고, 항상 뭘 착용하지?"],["D","I can skate and ride my bike without falling. Skating gave me good balance. And I always wear my helmet for safety!","저는 스케이트도 타고 자전거도 안 넘어지고 탈 수 있어요. 스케이트 덕분에 균형 감각이 좋아졌어요. 그리고 안전을 위해 항상 헬멧을 써요!"]],"tip":"아이가 실제로 잘하는 것(스케이트)을 영어로 자랑하게 해 주세요. 진짜 경험은 가장 긴 영어 문장을 끌어냅니다."},{"emoji":"🚗","title":"Day 5 · Car Designer Dayoon","sub":"미래 자동차 디자이너 놀이","words":[["design","디자인하다","디자인"],["future","미래","퓨처"],["invent","발명하다","인벤트"]],"sentence":["I will design a flying car.","저는 하늘을 나는 자동차를 디자인할 거예요."],"main":[["P","Breaking news! Famous car designer Dayoon is here! Please introduce yourself.","속보입니다! 유명한 자동차 디자이너 다윤 님이 오셨습니다! 자기소개 부탁드려요."],["D","Hello! I'm Dayoon, a car designer from Korea. I design cars of the future!","안녕하세요! 저는 한국의 자동차 디자이너 다윤입니다. 미래의 자동차를 디자인해요!"],["P","What is your newest design?","최신 디자인 작품은 무엇인가요?"],["D","I will design a flying car! It drives on the road and flies over traffic jams.","하늘을 나는 자동차를 디자인할 거예요! 도로를 달리다가 차가 막히면 위로 날아가요."],["P","Amazing! What color is it?","굉장해요! 무슨 색인가요?"],["D","Sky blue, of course! In the sky, it can hide like a chameleon.","당연히 하늘색이죠! 하늘에서는 카멜레온처럼 숨을 수 있어요."],["P","What special buttons does it have?","특별한 버튼은 뭐가 있나요?"],["D","The red button makes pasta while you drive. The green button cleans your little brother's mess!","빨간 버튼은 운전 중에 파스타를 만들어 줘요. 초록 버튼은 남동생이 어지른 걸 치워 줘요!"],["P","Every parent will buy it! Why do you want to invent cars?","모든 부모가 사겠네요! 왜 자동차를 발명하고 싶나요?"],["D","Because I love drawing and machines. Design is drawing that moves!","그림이랑 기계를 좋아하니까요. 디자인은 움직이는 그림이에요!"],["P","Beautiful answer! Present your dream car in five sentences.","아름다운 대답이네요! 꿈의 자동차를 다섯 문장으로 발표해 주세요."],["D","This is my dream car, the Sky Runner. It is sky blue and very fast. It can fly over traffic jams. It makes pasta with the red button. I will invent it when I grow up!","이것이 제 꿈의 자동차, 스카이 러너입니다. 하늘색이고 아주 빨라요. 교통 체증 위로 날 수 있어요. 빨간 버튼으로 파스타를 만들어요. 제가 커서 발명할 거예요!"]],"role":[["P","I'm a customer at your car shop. I need a car for my five dogs!","나는 당신 자동차 가게의 손님이에요. 강아지 다섯 마리를 위한 차가 필요해요!"],["D","Five dogs! Then you need the Puppy Bus. It has five little windows for five noses!","다섯 마리요! 그럼 퍼피 버스가 필요해요. 코 다섯 개를 위한 작은 창문이 다섯 개 있어요!"],["P","Ha! Does it have anything else for dogs?","하하! 강아지를 위한 다른 기능도 있나요?"],["D","Yes, a snack machine and a small shower for muddy paws.","네, 간식 기계랑 진흙 묻은 발을 씻는 작은 샤워기요."],["P","I love it. But is it safe?","마음에 들어요. 그런데 안전한가요?"],["D","Very safe! Every dog gets a seatbelt. Safety first, even for puppies!","아주 안전해요! 강아지마다 안전벨트가 있어요. 강아지도 안전이 최우선!"],["P","Sold! When can I get it?","살게요! 언제 받을 수 있죠?"],["D","In about twenty years... when I become a real designer! Please wait!","20년쯤 뒤에요... 제가 진짜 디자이너가 되면요! 기다려 주세요!"]],"wrap":[["P","Tell me about your dream car.","네 꿈의 자동차에 대해 말해 줘."],["D","My dream car is the Sky Runner. It is sky blue and it can fly. I will design it when I become a car designer!","제 꿈의 차는 스카이 러너예요. 하늘색이고 날 수 있어요. 제가 자동차 디자이너가 되면 디자인할 거예요!"]],"tip":"오늘 대화 후 아이가 꿈의 자동차를 실제로 그리게 하고, 그림을 보며 영어로 한 번 더 설명하게 해 보세요."},{"emoji":"🎈","title":"Day 6 · Up in a Hot Air Balloon","sub":"열기구 상상 여행","words":[["hot air balloon","열기구","핫 에어 벌룬"],["float","떠다니다","플로트"],["view","경치","뷰"]],"sentence":["We are floating above the clouds!","우리는 구름 위에 떠 있어요!"],"main":[["P","Close your eyes. We are getting into a giant hot air balloon. Ready?","눈을 감아 봐. 우리는 거대한 열기구에 타고 있어. 준비됐니?"],["D","Ready! The basket is a little wobbly. Let's go up!","준비됐어요! 바구니가 조금 흔들려요. 올라가요!"],["P","Whoosh! We are rising! What do you see below?","슈웅! 올라간다! 아래에 뭐가 보여?"],["D","Our apartment looks like a LEGO block! And the cars look like ants!","우리 아파트가 레고 블록 같아요! 자동차들은 개미 같아요!"],["P","We are going higher. Now we are floating above the clouds!","더 올라간다. 이제 우리는 구름 위에 떠 있어!"],["D","Wow! The clouds look like soft white pillows. Can I touch one?","와! 구름이 폭신한 하얀 베개 같아요. 하나 만져 봐도 돼요?"],["P","Try it! How does it feel?","해 봐! 느낌이 어때?"],["D","It feels like... cold cotton candy! I want to take a nap on it.","차가운 솜사탕 같아요! 그 위에서 낮잠 자고 싶어요."],["P","Ha! The view is amazing. Where should we float to?","하하! 경치가 끝내준다. 어디로 떠갈까?"],["D","To New Zealand! It's far, but balloons don't need tickets!","뉴질랜드로요! 멀지만 열기구는 표가 필요 없잖아요!"],["P","Good thinking! Describe our balloon trip in five sentences.","좋은 생각이야! 우리 열기구 여행을 다섯 문장으로 묘사해 봐."],["D","We flew in a hot air balloon today. Our town looked like LEGO blocks. We floated above the clouds. The clouds felt like cold cotton candy. It was the best view of my life!","오늘 우리는 열기구를 탔어요. 우리 동네가 레고 블록처럼 보였어요. 구름 위를 떠다녔어요. 구름은 차가운 솜사탕 같았어요. 제 인생 최고의 경치였어요!"]],"role":[["P","I'm the balloon pilot. Oh no, a bird family landed on our balloon!","나는 열기구 조종사야. 어어, 새 가족이 우리 열기구에 앉았어!"],["D","Welcome aboard, birds! But please don't peck the balloon!","새들아, 탑승을 환영해! 그런데 제발 열기구를 쪼지 마!"],["P","The wind is getting strong. Should we go up or down?","바람이 강해지고 있어. 올라갈까, 내려갈까?"],["D","Let's go down slowly. Safety first, pilot!","천천히 내려가요. 조종사님, 안전이 최우선이에요!"],["P","Good call. Look, a rainbow over there!","좋은 판단이야. 봐, 저기 무지개다!"],["D","Let's float through it! I want to know what rainbows smell like!","무지개를 통과해서 떠가요! 무지개는 무슨 냄새인지 알고 싶어요!"],["P","What do they smell like, then?","그래서 무슨 냄새였어?"],["D","Strawberries! Rainbows definitely smell like strawberries!","딸기요! 무지개는 확실히 딸기 냄새가 나요!"]],"wrap":[["P","Tell me about your imaginary balloon trip.","상상 열기구 여행에 대해 말해 줘."],["D","I floated above the clouds in a hot air balloon. The clouds felt like cold cotton candy. And the rainbow smelled like strawberries!","열기구를 타고 구름 위를 떠다녔어요. 구름은 차가운 솜사탕 같았어요. 그리고 무지개에서 딸기 냄새가 났어요!"]],"tip":"상상 여행 날은 정답이 없습니다. 아이의 엉뚱한 대답일수록 'Tell me more!'로 이어서 문장을 늘려 주세요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"4주차 총정리 · 탈것 인터뷰","interview":true,"pool":["Which is faster, the bus or the subway?","Which ride do you like best? Why?","How long does the KTX take to Busan?","What did you do on the train?","Tell me about your first ferry ride.","What is the most important thing when you skate or ride a bike?","Can you ride a bike? Tell me about it.","Describe your dream car in three sentences.","What did the clouds feel like in the balloon?","Compare three rides using faster, cheaper, or more fun."],"tip":"이번 주는 비교 표현이 핵심입니다. 아이가 -er than을 쓸 때마다 점수 1점을 주는 게임으로 진행해 보세요."}]}]});
MONTHS.push({"m":8,"theme":"동물·자연","q":2,"weeks":[{"sub":"동물 묘사하기","days":[{"emoji":"🦒","title":"Day 1 · It Has a Long Neck!","sub":"동물 생김새 묘사","words":[["neck","목","넥"],["spots","점무늬","스팟츠"],["tongue","혀","텅"]],"sentence":["A giraffe has a long neck and brown spots.","기린은 긴 목과 갈색 점무늬가 있어요."],"main":[["P","Welcome to Animal Studio! Today's model is... the giraffe! Describe it.","동물 스튜디오에 오신 걸 환영합니다! 오늘의 모델은... 기린! 묘사해 봐."],["D","A giraffe has a long neck and brown spots. It's the tallest animal in the world!","기린은 긴 목과 갈색 점무늬가 있어요. 세상에서 가장 키가 큰 동물이에요!"],["P","Excellent! Why does it have such a long neck?","훌륭해! 왜 그렇게 목이 길까?"],["D","Because it eats leaves from tall trees. Its neck is like a ladder!","높은 나무의 잎을 먹으니까요. 목이 사다리 같아요!"],["P","Fun fact: a giraffe's tongue is purple and fifty centimeters long!","재미있는 사실, 기린의 혀는 보라색이고 50센티미터야!"],["D","Fifty centimeters? That's longer than my arm! Yuck and wow at the same time!","50센티미터요? 제 팔보다 길어요! 우웩이면서 동시에 우와예요!"],["P","Ha! Now describe an elephant for me.","하하! 이제 코끼리를 묘사해 봐."],["D","An elephant has big ears and a long trunk. It has gray skin and it's very heavy.","코끼리는 큰 귀와 긴 코가 있어요. 회색 피부에 아주 무거워요."],["P","Great! If you were an animal, what would you look like?","좋아! 네가 동물이라면 어떻게 생겼을까?"],["D","I would have sky-blue fur, a fluffy tail, and fast legs for skating!","저는 하늘색 털에 복슬복슬한 꼬리, 스케이트를 위한 빠른 다리를 가질 거예요!"],["P","A brand new animal! Now describe the giraffe fully, in five sentences.","완전히 새로운 동물이네! 이제 기린을 다섯 문장으로 완전히 묘사해 봐."],["D","A giraffe is the tallest animal in the world. It has a very long neck. It has brown spots on its body. Its purple tongue is fifty centimeters long. It eats leaves from tall trees!","기린은 세상에서 가장 키가 큰 동물이에요. 아주 긴 목을 가졌어요. 몸에는 갈색 점무늬가 있어요. 보라색 혀는 50센티미터나 돼요. 높은 나무의 잎을 먹어요!"]],"role":[["P","I'm a painter, but I've never seen a zebra! Describe it so I can paint it.","나는 화가인데 얼룩말을 한 번도 못 봤어! 그릴 수 있게 묘사해 줘."],["D","Okay! First, paint a horse shape. It has four long legs.","네! 먼저 말 모양을 그리세요. 긴 다리가 네
