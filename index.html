in the next day. And my mom gave me strawberries for power!","다음 날 다시 연습했어요. 그리고 엄마가 파워 충전용 딸기를 주셨죠!"],["P","And now, at the end of the journey, how is your English?","그리고 이제 여정의 끝에서, 당신의 영어는 어떤가요?"],["D","Now I can joke, debate, and make speeches in English. The quiet girl became a talking machine!","이제 영어로 농담도 하고, 토론도 하고, 스피치도 해요. 그 조용한 소녀가 수다 기계가 됐답니다!"]],"role":[["P","How was your English in the beginning?","처음에 네 영어는 어땠어?"],["D","In the beginning, I only knew hello and bye.","처음엔 hello랑 bye밖에 몰랐어요."],["P","How did you improve your English?","영어를 어떻게 향상시켰어?"],["D","I practiced a little every day, even on tired days.","피곤한 날에도 매일 조금씩 연습했어요."],["P","What part of the journey was the most fun?","여정에서 어떤 부분이 제일 재밌었어?"],["D","The role-play games were the most fun.","역할 놀이가 제일 재밌었어요."],["P","What do you want to improve next year?","내년엔 뭘 더 나아지게 하고 싶어?"],["D","I want to improve my long speeches and reading.","긴 스피치와 읽기를 더 잘하고 싶어요."]],"wrap":[["P","What a documentary! Summarize your English journey in three sentences.","굉장한 다큐였어! 네 영어 여정을 세 문장으로 요약해 줘."],["D","In the beginning, I was quiet and shy. I practiced every day, and my English improved step by step. Now I can talk, joke, and give speeches in English!","처음에 저는 조용하고 부끄러움이 많았어요. 매일 연습해서 영어가 한 걸음씩 나아졌어요. 이제 영어로 말하고, 농담하고, 스피치도 해요!"]],"tip":"다큐 내레이터처럼 낮고 진지한 목소리로 시작해 주세요. 아이가 웃으면서 과거형 문장을 쏟아 내게 됩니다."},{"emoji":"💪","title":"Day 4 · I Couldn't, But Now I Can!","sub":"못했지만 이젠 해요","words":[["could","할 수 있었다","쿠드"],["couldn't","할 수 없었다","쿠든트"],["skill","실력, 기술","스킬"]],"sentence":["I couldn't read English books, but now I can!","예전엔 영어책을 못 읽었지만 이제는 읽을 수 있어요!"],"main":[["P","Today's game: 'I couldn't, but now I can!' We take turns. Me first: I couldn't cook, but now I can make ramen!","오늘의 게임은 '못했지만 이젠 해요!'야. 번갈아 말하자. 나 먼저. 난 요리를 못했지만 이제 라면은 끓일 수 있어!"],["D","Ramen is cooking? Hmm, half a point! My turn: I couldn't spin on the ice, but now I can!","라면이 요리예요? 음, 반 점만 드릴게요! 제 차례예요. 얼음 위에서 회전을 못했지만 이제 할 수 있어요!"],["P","A spin! That's a real skill! Your turn again — English version!","회전이라니! 그건 진짜 기술이지! 다시 네 차례야. 영어 버전으로!"],["D","I couldn't say long sentences, but now I can talk for thirty seconds without stopping!","긴 문장을 못 말했지만, 이제 안 멈추고 30초 동안 말할 수 있어요!"],["P","True! I heard it myself! What about drawing?","사실이지! 내가 직접 들었잖아! 그림은 어때?"],["D","I couldn't draw hands last year. Hands were so hard! But now my hands look like hands, not potatoes!","작년엔 손을 못 그렸어요. 손은 너무 어려웠어요! 근데 이제 제가 그린 손은 감자가 아니라 손처럼 보여요!"],["P","Haha! Potato hands! What could you always do well?","하하! 감자 손이래! 늘 잘할 수 있었던 건 뭐야?"],["D","I could always eat fast. That skill was born with me!","먹는 건 항상 빨리 할 수 있었어요. 그 기술은 타고났어요!"],["P","Born with it! And what can't you do yet?","타고났다니! 그럼 아직 못하는 건 뭐야?"],["D","I can't ride a two-wheel bike yet. But next year... you know my style. I couldn't, but now I can!","아직 두발자전거를 못 타요. 하지만 내년엔... 제 스타일 아시죠. 못했지만, 이젠 해요!"]],"role":[["P","What couldn't you do in English last year?","작년에 영어로 뭘 못했어?"],["D","I couldn't answer questions. Now I can answer fast!","질문에 대답을 못했어요. 이제는 빨리 대답할 수 있어요!"],["P","What couldn't you do at skating before?","예전에 스케이트에서 뭘 못했어?"],["D","I couldn't skate backwards. Now I can do it!","뒤로 타는 걸 못했어요. 이제 할 수 있어요!"],["P","What skill do you want next?","다음엔 어떤 기술을 갖고 싶어?"],["D","I want the skill to draw cars like a real designer.","진짜 디자이너처럼 자동차를 그리는 기술을 갖고 싶어요."],["P","What could Siheon do this year?","올해 시헌이는 뭘 할 수 있게 됐어?"],["D","He couldn't read, but now he can read easy books.","글을 못 읽었는데, 이제 쉬운 책을 읽을 수 있어요."]],"wrap":[["P","So much growth! Give me your best 'I couldn't, but now I can' sentences. Two or three!","정말 많이 컸다! 최고의 '못했지만 이젠 해요' 문장을 두세 개 말해 줘."],["D","I couldn't say long sentences, but now I can speak for thirty seconds. I couldn't draw hands, but now I can. Next year, I will ride a two-wheel bike too!","긴 문장을 못 말했지만 이제 30초 동안 말해요. 손을 못 그렸지만 이제 그릴 수 있어요. 내년엔 두발자전거도 탈 거예요!"]],"tip":"부모님의 'I couldn't' 고백(요리, 운전 등)을 먼저 들려주세요. 아이가 안심하고 자기 이야기를 꺼냅니다."},{"emoji":"🏫","title":"Day 5 · My Fourth Grade Story","sub":"4학년 학교생활 돌아보기","words":[["grade","학년","그레이드"],["classmate","반 친구","클래스메이트"],["field trip","현장 학습","필드 트립"]],"sentence":["Fourth grade was busy but fun.","4학년은 바빴지만 재미있었어요."],"main":[["P","Dayoon, fourth grade is almost over! How was your year at school?","다윤아, 4학년이 거의 끝나 가네! 올해 학교생활은 어땠어?"],["D","Fourth grade was busy but fun. We did so many things!","4학년은 바빴지만 재미있었어요. 정말 많은 걸 했어요!"],["P","What did you do with your classmates?","반 친구들이랑 뭘 했어?"],["D","We went on a field trip to a science museum. Minseo and I got lost for five minutes!","과학관으로 현장 학습을 갔어요. 민서랑 저는 5분 동안 길을 잃었었어요!"],["P","Lost in the museum?! What happened?","박물관에서 길을 잃었다고?! 무슨 일이 있었는데?"],["D","We followed a robot dog... and our class was gone! But Ms. (Kim) found us. She was not happy!","로봇 강아지를 따라갔는데... 우리 반이 사라졌어요! 근데 (김) 선생님이 우리를 찾았어요. 기분이 안 좋아 보이셨죠!"],["P","Haha! A robot dog trap! What was your best class this year?","하하! 로봇 강아지의 함정이라니! 올해 최고의 수업은 뭐였어?"],["D","Art class! We painted big posters for the school festival. Mine had a sky-blue whale!","미술 수업이요! 학교 축제 포스터를 크게 그렸어요. 제 건 하늘색 고래였어요!"],["P","A sky-blue whale, so Dayoon! Did anything change in you this year?","하늘색 고래라니, 정말 다윤답다! 올해 네 안에서 변한 게 있어?"],["D","Yes! I raised my hand more in class. Fourth-grade Dayoon was braver than third-grade Dayoon!","네! 수업 시간에 손을 더 많이 들었어요. 4학년 다윤이는 3학년 다윤이보다 용감했어요!"]],"role":[["P","What grade are you in, and how was it?","몇 학년이야? 그리고 어땠어?"],["D","I am in fourth grade. It was busy but fun!","4학년이에요. 바빴지만 재밌었어요!"],["P","Where did you go on your field trip?","현장 학습은 어디로 갔어?"],["D","We went to a science museum.","과학관에 갔어요."],["P","Who was your favorite classmate this year?","올해 제일 좋았던 반 친구는 누구야?"],["D","Minseo, of course! We sat together after summer.","당연히 민서죠! 여름 이후로 짝꿍이었어요."],["P","What did you make in art class?","미술 시간에 뭘 만들었어?"],["D","I painted a festival poster with a sky-blue whale.","하늘색 고래가 있는 축제 포스터를 그렸어요."]],"wrap":[["P","Fourth grade sounds wonderful! Sum it up in three sentences, past tense!","4학년 정말 멋졌네! 과거형으로 세 문장으로 요약해 봐!"],["D","Fourth grade was busy but fun. I went on a field trip, painted a big poster, and got lost with Minseo once! I was braver than before.","4학년은 바빴지만 재밌었어요. 현장 학습도 가고, 큰 포스터도 그리고, 민서랑 한 번 길도 잃었어요! 저는 예전보다 용감해졌어요."]],"tip":"학교 알림장이나 사진을 보며 실제 있었던 일을 소재로 쓰면 과거형 문장이 진짜 이야기가 됩니다."},{"emoji":"⛸️","title":"Day 6 · Skating and Art Report","sub":"취미 성장 보고서","words":[["lesson","수업, 레슨","레슨"],["artwork","미술 작품","아트워크"],["effort","노력","에포트"]],"sentence":["I put a lot of effort into my hobbies this year.","올해 나는 취미에 많은 노력을 쏟았어요."],"main":[["P","Today you are the boss of Hobby Company! Give me your year-end report: the Skating Department first!","오늘 너는 취미 주식회사의 사장님이야! 연말 보고서를 발표해 주세요. 먼저 스케이트 부서!"],["D","Ahem! Skating Department report: this year we took lessons every week. We learned two new jumps and one spin!","에헴! 스케이트 부서 보고입니다. 올해 저희는 매주 레슨을 받았습니다. 새 점프 두 개와 회전 한 개를 배웠습니다!"],["P","Excellent numbers! Any problems in the department, boss?","훌륭한 실적이군요! 부서에 문제는 없었습니까, 사장님?"],["D","One problem: we fell down about... two hundred times. But falling is part of the job!","문제 하나 있습니다. 약... 이백 번 넘어졌습니다. 하지만 넘어지는 것도 업무의 일부죠!"],["P","Haha! Strong company spirit! Now the Art Department!","하하! 회사 정신이 훌륭하군요! 이제 미술 부서!"],["D","Art Department made over fifty artworks this year! Best artwork: the sky-blue whale poster!","미술 부서는 올해 작품 오십 개 이상을 만들었습니다! 최고 작품은 하늘색 고래 포스터입니다!"],["P","Fifty artworks! Where did all that effort come from?","작품이 오십 개라니! 그 노력은 다 어디서 나왔죠?"],["D","From love! When you love something, effort is easy. That's my company motto!","사랑에서요! 좋아하는 일이면 노력은 쉬워요. 그게 저희 회사 사훈입니다!"],["P","Beautiful motto, boss! Plans for next year?","멋진 사훈입니다, 사장님! 내년 계획은요?"],["D","Next year, the company will draw cars and buildings. We are preparing for the designer future!","내년에 우리 회사는 자동차와 건물을 그릴 겁니다. 디자이너의 미래를 준비 중입니다!"]],"role":[["P","How often did you take skating lessons?","스케이트 레슨은 얼마나 자주 받았어?"],["D","I took lessons once a week, after school.","방과 후에 일주일에 한 번 받았어요."],["P","What was your best artwork this year?","올해 최고의 작품은 뭐였어?"],["D","My best artwork was the sky-blue whale poster.","최고 작품은 하늘색 고래 포스터였어요."],["P","Why is effort important for hobbies?","취미에 노력이 왜 중요할까?"],["D","Because skills grow only with effort.","실력은 노력해야만 자라니까요."],["P","Which hobby will you keep next year?","내년에도 계속할 취미는 뭐야?"],["D","Both! Skating for my body, drawing for my dreams.","둘 다요! 스케이트는 몸을 위해, 그림은 꿈을 위해서요."]],"wrap":[["P","Meeting over, boss! Give the final hobby report in three sentences.","회의 끝났습니다, 사장님! 마지막 취미 보고를 세 문장으로 해 주세요."],["D","This year I took skating lessons every week and learned new jumps. I made more than fifty artworks. I put a lot of effort into my hobbies, and I am proud!","올해 매주 스케이트 레슨을 받고 새 점프를 배웠어요. 작품도 오십 개 넘게 만들었어요. 취미에 많은 노력을 쏟았고, 자랑스러워요!"]],"tip":"'사장님 보고' 콘셉트로 존댓말 톤 연기를 시켜 보세요. 숫자(횟수, 개수)를 넣어 말하면 문장이 구체적으로 자랍니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"1주차 총정리","interview":true,"pool":["What did you learn in English this year?","How was your English in the beginning of the year?","Do you remember your first English class? How was it?","What couldn't you do before, but now you can?","How did you improve your English?","How was fourth grade? Tell me in past tense.","Where did you go on your field trip?","What did you learn at skating this year?","What was your best artwork this year?","What was the hardest thing this year, and how did you beat it?"],"tip":"모든 대답이 과거형으로 나오는지 들어 주세요. was, went, learned가 들리면 그 자리에서 바로 칭찬!"}]},{"sub":"최고의 기억들","days":[{"emoji":"🌟","title":"Day 1 · My Best Memory","sub":"올해 최고의 기억","words":[["memory","기억, 추억","메모리"],["special","특별한","스페셜"],["unforgettable","잊을 수 없는","언포게터블"]],"sentence":["My best memory of this year is our family trip.","올해 나의 최고의 기억은 가족 여행이에요."],"main":[["P","Dayoon, close your eyes. Think about this whole year... Now open! What is your best memory?","다윤아, 눈을 감아 봐. 올해 전체를 떠올려 보고... 이제 떠! 최고의 기억이 뭐야?"],["D","My best memory is our family trip to the beach last summer!","최고의 기억은 지난여름 가족 바다 여행이에요!"],["P","The beach! What made it so special?","바다! 뭐가 그렇게 특별했어?"],["D","We swam all day, and Dad made pasta at the pension. Beach pasta tastes ten times better!","하루 종일 수영했고, 아빠가 펜션에서 파스타를 만들어 줬어요. 바다에서 먹는 파스타는 열 배 더 맛있어요!"],["P","Haha, beach pasta! Was there an unforgettable moment?","하하, 바다 파스타! 잊을 수 없는 순간도 있었어?"],["D","Yes! At night, we saw fireworks on the beach. Siheon screamed louder than the fireworks!","네! 밤에 해변에서 불꽃놀이를 봤어요. 시헌이가 불꽃보다 크게 소리 질렀어요!"],["P","Louder than fireworks! That's Siheon! Do you have a special memory with Minseo too?","불꽃보다 크게! 역시 시헌이야! 민서와의 특별한 기억도 있어?"],["D","Yes, we had a sleepover at my house. We drew pictures and talked until ten o'clock. Thirty minutes over bedtime — shhh!","네, 우리 집에서 같이 잤어요. 그림 그리고 10시까지 수다 떨었어요. 취침 시간 30분 초과 — 쉿!"],["P","Haha, your secret is safe! Why do you think we keep memories?","하하, 비밀 지켜 줄게! 우리는 왜 추억을 간직할까?"],["D","Because memories are like candy for the heart. Sweet forever!","추억은 마음의 사탕이니까요. 영원히 달콤해요!"]],"role":[["P","What is your best memory of this year?","올해 최고의 기억이 뭐야?"],["D","My best memory is the family beach trip.","최고의 기억은 가족 바다 여행이에요."],["P","What special thing did you do with Minseo?","민서랑 어떤 특별한 걸 했어?"],["D","We had a sleepover and drew pictures together.","같이 자면서 그림을 그렸어요."],["P","What was unforgettable about the trip?","여행에서 뭐가 잊을 수 없었어?"],["D","The fireworks at night were unforgettable.","밤의 불꽃놀이가 잊을 수 없었어요."],["P","What memory made your family laugh?","가족을 웃게 한 기억은 뭐야?"],["D","Siheon screamed louder than the fireworks!","시헌이가 불꽃보다 크게 소리 지른 거요!"]],"wrap":[["P","Sweet memories! Tell me about your best memory in three sentences.","달콤한 추억이네! 최고의 기억을 세 문장으로 말해 줘."],["D","My best memory is the family beach trip last summer. We swam, ate beach pasta, and watched fireworks. It was special and unforgettable!","최고의 기억은 지난여름 가족 바다 여행이에요. 수영하고, 바다 파스타를 먹고, 불꽃놀이를 봤어요. 특별하고 잊을 수 없는 기억이에요!"]],"tip":"가족사진을 한 장 보여 주며 시작하세요. 실제 기억이 소환되면 과거형 문장이 저절로 터져 나옵니다."},{"emoji":"🏅","title":"Day 2 · The Dayoon Awards","sub":"올해의 시상식","words":[["award","상","어워드"],["winner","수상자","위너"],["congratulations","축하합니다","컹그래츄레이션스"]],"sentence":["The winner of this award is... my mom!","이 상의 수상자는 바로... 우리 엄마입니다!"],"main":[["P","Ladies and gentlemen, welcome to the Dayoon Awards! You are the host. Give awards to your family!","신사 숙녀 여러분, 다윤 어워드에 오신 것을 환영합니다! 네가 진행자야. 가족들에게 상을 줘 봐!"],["D","Welcome, everyone! The first award is Best Cook of the Year. The winner is... my dad, for his weekend pasta!","환영합니다, 여러분! 첫 번째 상은 올해의 요리왕입니다. 수상자는... 주말 파스타의 주인공, 우리 아빠!"],["P","Congratulations, Dad! Clap clap! Next award, please!","축하합니다, 아버님! 짝짝! 다음 상 주세요!"],["D","Next, the Warmest Heart Award goes to... my mom! She hugged me every single day this year.","다음, 가장 따뜻한 마음상은... 우리 엄마! 올해 하루도 빠짐없이 저를 안아 주셨어요."],["P","Beautiful! Congratulations! And is there an award for Siheon?","아름답네요! 축하합니다! 시헌이를 위한 상도 있나요?"],["D","Of course. Siheon wins... the Loudest Alarm Award! He woke me up at seven every morning. Congratulations... I guess?","당연하죠. 시헌이는... 가장 시끄러운 알람상 수상! 매일 아침 7시에 절 깨웠거든요. 축하해... 아마도?"],["P","Haha! The Loudest Alarm! And what about an award for Minseo?","하하! 최고 시끄러운 알람이라니! 민서에게 줄 상은?"],["D","Minseo wins the Best Friend of the Year Award, for laughing at all my jokes, even the bad ones!","민서는 올해의 단짝상 수상입니다. 제 개그에 다 웃어 줬거든요. 재미없는 것까지도요!"],["P","And the final award... for Dayoon herself?","그리고 마지막 상은... 다윤이 본인에게?"],["D","I give myself the Never Give Up Award! I fell two hundred times at skating, but I got up two hundred and one times!","저 자신에게는 포기하지 않기상을 줍니다! 스케이트에서 이백 번 넘어졌지만, 이백한 번 일어났으니까요!"]],"role":[["P","Who wins the Best Cook award in your family?","너희 가족 요리왕 상은 누구야?"],["D","My dad wins it for his weekend pasta.","주말 파스타로 아빠가 받아요."],["P","What award do you give yourself, and why?","너 자신에겐 무슨 상을 줘? 이유는?"],["D","The Never Give Up Award, because I always got up again.","포기하지 않기상이요. 항상 다시 일어났으니까요."],["P","What do you say to a winner?","수상자에게 뭐라고 말하지?"],["D","Congratulations! You deserve it!","축하합니다! 받을 만해요!"],["P","What award do you want to win next year?","내년엔 무슨 상을 받고 싶어?"],["D","The Best English Speaker Award!","최고의 영어 스피커상이요!"]],"wrap":[["P","What a ceremony! Announce your two favorite awards again, in full sentences.","멋진 시상식이었어! 제일 마음에 드는 상 두 개를 완전한 문장으로 다시 발표해 줘."],["D","The Warmest Heart Award goes to my mom for her daily hugs. And I win the Never Give Up Award, because I fell two hundred times but got up two hundred and one times!","가장 따뜻한 마음상은 매일 안아 주신 엄마께 드립니다. 그리고 포기하지 않기상은 제가 받아요. 이백 번 넘어졌지만 이백한 번 일어났으니까요!"]],"tip":"종이로 즉석 트로피나 메달을 만들어 진짜 수여식을 해 보세요. 저녁에 가족 앞 재시상식을 하면 완벽한 복습이 됩니다."},{"emoji":"📸","title":"Day 3 · Family Photo Album","sub":"사진첩 넘기기","words":[["album","앨범","앨범"],["photo","사진","포토"],["smile","미소 짓다","스마일"]],"sentence":["In this photo, we were smiling at the beach.","이 사진에서 우리는 바닷가에서 웃고 있었어요."],"main":[["P","Today, bring a real photo or imagine one! We open the family album. Page one — what do you see?","오늘은 진짜 사진을 가져오거나 상상해 보자! 가족 앨범을 펼칩니다. 첫 페이지, 뭐가 보여?"],["D","I see our beach photo! In this photo, we were all smiling. Siheon's face was full of ice cream!","바다 사진이 보여요! 이 사진에서 우리 모두 웃고 있었어요. 시헌이 얼굴은 아이스크림 범벅이었죠!"],["P","Haha! Ice cream face! Next page. A birthday photo?","하하! 아이스크림 얼굴! 다음 페이지. 생일 사진인가?"],["D","Yes, my tenth birthday! I wore a sky-blue dress, and the cake had strawberries on top. My dream cake!","네, 제 열 번째 생일이요! 하늘색 원피스를 입었고, 케이크 위에 딸기가 있었어요. 꿈의 케이크죠!"],["P","A dream cake! Who came to the party?","꿈의 케이크라니! 파티엔 누가 왔어?"],["D","Minseo came, and two more classmates. We played games and laughed so much!","민서랑 반 친구 두 명이 더 왔어요. 게임하고 엄청 웃었어요!"],["P","Next page... oh, what is this funny one?","다음 페이지... 오, 이 웃긴 사진은 뭐야?"],["D","That's Dad sleeping on the sofa with Siheon's toy on his head! We took it secretly. Shhh, top secret photo!","소파에서 주무시는 아빠 머리 위에 시헌이 장난감이 올라간 사진이에요! 몰래 찍었어요. 쉿, 일급비밀 사진!"],["P","Haha! Every album needs one! Which photo is your treasure?","하하! 앨범마다 그런 사진 하나는 있어야지! 어떤 사진이 네 보물이야?"],["D","The beach photo. When I look at it, I can hear the waves and smell the pasta again!","바다 사진이요. 그 사진을 보면 파도 소리가 들리고 파스타 냄새가 다시 나요!"]],"role":[["P","What is in your favorite photo?","네가 제일 좋아하는 사진엔 뭐가 있어?"],["D","My family is smiling at the beach.","우리 가족이 바닷가에서 웃고 있어요."],["P","What did you wear on your birthday?","생일에 뭘 입었어?"],["D","I wore a sky-blue dress.","하늘색 원피스를 입었어요."],["P","Who took the funny photo of Dad?","아빠의 웃긴 사진은 누가 찍었어?"],["D","Siheon and I took it secretly!","시헌이랑 제가 몰래 찍었어요!"],["P","Why are photos important?","사진은 왜 중요할까?"],["D","Because they keep our memories forever.","우리 추억을 영원히 간직해 주니까요."]],"wrap":[["P","Album closed! Describe two photos from this year, past tense please.","앨범을 덮습니다! 올해 사진 두 장을 과거형으로 묘사해 줘."],["D","In the beach photo, we were smiling and Siheon's face was full of ice cream. In my birthday photo, I wore a sky-blue dress and the cake had strawberries!","바다 사진에서 우리는 웃고 있었고 시헌이 얼굴은 아이스크림 범벅이었어요. 생일 사진에서 저는 하늘색 원피스를 입었고 케이크엔 딸기가 있었어요!"]],"tip":"휴대폰 사진첩을 함께 넘기며 'In this photo...'로 시작하는 문장을 사진마다 하나씩 만들어 보세요."},{"emoji":"😂","title":"Day 4 · The Funniest Moment Show","sub":"올해의 개그 장면","words":[["laugh","웃다","래프"],["joke","농담","조크"],["hilarious","너무 웃긴","힐레리어스"]],"sentence":["It was so hilarious that I couldn't stop laughing.","너무 웃겨서 웃음을 멈출 수 없었어요."],"main":[["P","Welcome to the Funniest Moment Show! Tonight, we replay the funniest scenes of the year! Scene number one, go!","올해의 개그 장면 쇼에 오신 걸 환영합니다! 오늘 밤, 올해 가장 웃긴 장면들을 다시 보여 드립니다! 1번 장면, 시작!"],["D","Scene one: Siheon put on Dad's big shoes and walked like a penguin... then boom! He sat on the laundry basket!","1번 장면! 시헌이가 아빠 큰 신발을 신고 펭귄처럼 걷다가... 쿵! 빨래 바구니에 주저앉았어요!"],["P","Hahaha! A penguin crash! How did everyone react?","하하하! 펭귄 추락 사고! 다들 어떻게 반응했어?"],["D","We laughed so hard. Even Siheon laughed inside the basket! It was hilarious!","다들 엄청 웃었어요. 시헌이도 바구니 안에서 웃었다니까요! 진짜 너무 웃겼어요!"],["P","Scene number two, please!","2번 장면 부탁합니다!"],["D","Scene two: at school, Ms. (Kim) said 'Open your books,' and one classmate opened his lunch box instead!","2번 장면! 학교에서 (김) 선생님이 '책 펴세요' 했는데, 한 친구가 도시락을 열었어요!"],["P","A lunch box! Wrong book! Haha! Did the teacher laugh too?","도시락이라니! 책이 아니잖아! 하하! 선생님도 웃으셨어?"],["D","Yes! She tried to be serious, but she laughed first. The whole class exploded!","네! 진지하려고 하셨는데 선생님이 먼저 터졌어요. 반 전체가 빵 터졌죠!"],["P","Final scene: your funniest English class moment this year?","마지막 장면! 올해 영어 수업에서 제일 웃겼던 순간은?"],["D","When I said 'potato hands'! Even today, I laugh when I draw hands. My jokes live forever!","제가 '감자 손'이라고 했을 때요! 지금도 손 그릴 때마다 웃어요. 제 개그는 영원합니다!"]],"role":[["P","What was the funniest moment at home this year?","올해 집에서 제일 웃긴 순간은 뭐였어?"],["D","Siheon's penguin walk and the basket crash!","시헌이의 펭귄 걸음과 바구니 추락이요!"],["P","Who tells the best jokes in your class?","너희 반에서 누가 농담을 제일 잘해?"],["D","Minseo tells hilarious jokes with funny dances.","민서가 웃긴 춤과 함께 완전 웃긴 농담을 해요."],["P","What makes you laugh the most?","뭐가 너를 제일 웃게 해?"],["D","Silly animal videos make me laugh the most.","엉뚱한 동물 영상이 저를 제일 웃게 해요."],["P","Tell me a joke in English!","영어로 농담 하나 해 봐!"],["D","What do you call a cold dog? A chili dog! Haha!","추운 강아지를 뭐라고 부르게요? 칠리 도그! 하하!"]],"wrap":[["P","My stomach hurts from laughing! Retell the funniest scene of the year in two or three sentences.","웃겨서 배가 아프다! 올해 제일 웃긴 장면을 두세 문장으로 다시 말해 줘."],["D","Siheon wore Dad's big shoes and walked like a penguin. Then he fell into the laundry basket! It was so hilarious that even he couldn't stop laughing.","시헌이가 아빠의 큰 신발을 신고 펭귄처럼 걸었어요. 그러다 빨래 바구니에 빠졌어요! 너무 웃겨서 시헌이 본인도 웃음을 못 멈췄어요."]],"tip":"부모님도 올해 웃겼던 가족 장면 하나를 영어로 들려주세요. 웃음이 터진 날의 표현은 절대 잊히지 않습니다."},{"emoji":"🔍","title":"Day 5 · Guess My Memory","sub":"추억 스무고개","words":[["hint","힌트","힌트"],["secret","비밀","시크릿"],["correct","정답인","커렉트"]],"sentence":["Give me a hint! Was it in summer?","힌트 주세요! 여름이었나요?"],"main":[["P","Memory guessing game! I think of YOUR memory, you guess which one. First hint: it was cold.","추억 맞히기 게임! 내가 '너의' 추억 하나를 생각할게. 네가 맞혀 봐. 첫 힌트, 추웠어."],["D","Cold... was it in winter?","추웠다... 겨울이었나요?"],["P","Correct! Second hint: you wore special shoes.","정답! 두 번째 힌트, 너는 특별한 신발을 신었어."],["D","Special shoes... skates! Was it at the ice rink?","특별한 신발... 스케이트! 아이스링크였나요?"],["P","Yes! Final hint: that day, you did something for the first time.","맞아! 마지막 힌트, 그날 너는 처음으로 뭔가를 해냈어."],["D","I know! My first spin! The day I landed my first spin without falling!","알겠어요! 첫 회전이요! 안 넘어지고 첫 회전을 성공한 날!"],["P","Correct! Three hints, perfect guess! Now you give me hints about a secret memory!","정답! 힌트 세 개 만에 완벽하게 맞혔어! 이제 네가 비밀 추억의 힌트를 줘 봐!"],["D","Okay! Hint one: it happened at night. Hint two: there was a lot of noise in the sky.","좋아요! 힌트 하나, 밤에 일어난 일이에요. 힌트 둘, 하늘에서 큰 소리가 났어요."],["P","Night, noise in the sky... the beach fireworks?","밤에, 하늘에서 소리... 바다 불꽃놀이?"],["D","Correct! You are good at this! Okay, one more round — this memory smells like tomato sauce...","정답! 잘하시는데요! 좋아요, 한 판 더. 이 추억은 토마토소스 냄새가 나요..."]],"role":[["P","How do you ask for a hint in English?","영어로 힌트를 어떻게 달라고 하지?"],["D","Give me a hint, please!","힌트 좀 주세요!"],["P","Give me a hint about your favorite place this year.","올해 좋아했던 장소에 대한 힌트를 줘 봐."],["D","It is cold, big, and I wear special shoes there.","춥고, 크고, 거기서 특별한 신발을 신어요."],["P","Is it the ice rink? Am I correct?","아이스링크야? 정답이야?"],["D","Correct! You got it in one try!","정답이에요! 한 번에 맞혔어요!"],["P","What secret memory did nobody guess?","아무도 못 맞힌 비밀 추억은 뭐야?"],["D","My secret: I hid a drawing inside my desk for Mom's birthday!","제 비밀은요, 엄마 생신 선물 그림을 책상 속에 숨겨 뒀던 거예요!"]],"wrap":[["P","Great detective work! Which memory did I guess, and which did you guess? Two sentences.","훌륭한 추리였어! 내가 맞힌 추억과 네가 맞힌 추억이 뭐였지? 두 문장으로."],["D","You guessed my beach fireworks memory from my hints. I guessed my first spin at the ice rink — winter, special shoes, first time!","선생님은 제 힌트로 바다 불꽃놀이 추억을 맞혔어요. 저는 아이스링크 첫 회전을 맞혔어요. 겨울, 특별한 신발, 첫 성공!"]],"tip":"힌트는 꼭 영어로 세 개씩 주고받게 하세요. It was..., There was... 패턴이 자연스럽게 반복됩니다."},{"emoji":"💌","title":"Day 6 · Thank You, This Year","sub":"고마운 사람들에게","words":[["thankful","감사하는","쌩크풀"],["letter","편지","레터"],["dear","친애하는, ~에게","디어"]],"sentence":["Dear Mom, thank you for everything this year.","엄마에게, 올해 모든 것에 감사해요."],"main":[["P","Before the year ends, let's send thank-you messages! Who are you thankful for? Start with 'Dear...'","해가 끝나기 전에 감사 메시지를 보내자! 누구에게 감사해? 'Dear...'로 시작해 봐."],["D","Dear Mom, thank you for the warm hugs and the strawberry snacks. You are my sunshine!","엄마에게, 따뜻한 포옹과 딸기 간식 감사해요. 엄마는 제 햇살이에요!"],["P","So sweet! She will love it. Next letter?","정말 다정하다! 엄마가 좋아하시겠어. 다음 편지는?"],["D","Dear Dad, thank you for the weekend pasta and the piggyback rides. Please make pasta tomorrow too!","아빠에게, 주말 파스타와 목말 감사해요. 내일도 파스타 해 주세요!"],["P","Haha! A thank-you letter and an order at the same time! Anyone else?","하하! 감사 편지이자 동시에 주문서네! 또 누구 있어?"],["D","Dear Minseo, thank you for laughing at my jokes and keeping my secrets. Best friends forever!","민서에게, 내 농담에 웃어 주고 비밀을 지켜 줘서 고마워. 영원한 단짝!"],["P","And... is there a letter for Siheon?","그리고... 시헌이한테 보낼 편지도 있을까?"],["D","Hmm... Dear Siheon, thank you for... hmm... being my alarm? And for making me laugh. Don't touch my pencils. Love, your sister.","음... 시헌이에게, 고마워... 음... 내 알람이 되어 줘서? 그리고 웃게 해 줘서. 내 색연필은 만지지 마. 사랑을 담아, 누나가."],["P","Haha! The most honest letter ever! Last one — a letter to yourself?","하하! 역대 가장 솔직한 편지야! 마지막으로, 너 자신에게 편지를 쓴다면?"],["D","Dear Dayoon, thank you for not giving up. You fell many times, but you always got up. I am thankful for you!","다윤에게, 포기하지 않아 줘서 고마워. 많이 넘어졌지만 항상 일어났지. 네가 있어서 감사해!"]],"role":[["P","Who are you most thankful for this year?","올해 누구에게 가장 감사해?"],["D","I am most thankful for my mom.","엄마에게 가장 감사해요."],["P","How do you start a letter in English?","영어 편지는 어떻게 시작하지?"],["D","I start with Dear and the person's name.","Dear와 그 사람 이름으로 시작해요."],["P","What are you thankful for at school?","학교에서는 뭐가 감사해?"],["D","I am thankful for art class and my classmates.","미술 수업과 반 친구들이 감사해요."],["P","What do you say to Minseo in your letter?","편지에서 민서에게 뭐라고 말해?"],["D","Thank you for being my best friend forever!","영원한 단짝이 되어 줘서 고맙다고요!"]],"wrap":[["P","Beautiful letters! Say your favorite one again, from Dear to the end.","아름다운 편지들이야! 제일 마음에 드는 편지를 Dear부터 끝까지 다시 말해 줘."],["D","Dear Dayoon, thank you for not giving up this year. You fell many times, but you always got up. I am thankful for you!","다윤에게, 올해 포기하지 않아 줘서 고마워. 많이 넘어졌지만 항상 다시 일어났어. 네가 있어서 감사해!"]],"tip":"오늘 말한 편지 중 하나를 실제 카드에 영어로 적어 전달하게 해 주세요. 쓰기와 말하기가 한 번에 연결됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"2주차 총정리","interview":true,"pool":["What is your best memory of this year? Why?","What was unforgettable about your family trip?","What award do you give your mom, and why?","What award do you give yourself?","Describe your favorite photo of this year.","What was the funniest moment at home this year?","Tell me a joke in English!","Give me three hints about a memory, and I will guess.","Who are you thankful for this year, and why?","How do you start a thank-you letter in English?"],"tip":"추억 이야기는 답이 길어지기 좋은 주제입니다. 한 문장으로 끝나면 'Tell me more!'로 한 번 더 끌어내 주세요."}]},{"sub":"새해 나의 계획","days":[{"emoji":"🎯","title":"Day 1 · Next Year, I Will!","sub":"미래형 첫걸음","words":[["will","~할 것이다","윌"],["plan","계획","플랜"],["goal","목표","골"]],"sentence":["Next year, I will read one English book every month.","내년에 나는 매달 영어책을 한 권씩 읽을 거예요."],"main":[["P","Dayoon, we looked at the past. Now let's jump to the future! What will you do next year?","다윤아, 과거를 봤으니 이제 미래로 점프하자! 내년에 뭘 할 거야?"],["D","Next year, I will be eleven, and I will be in fifth grade!","내년에 저는 열한 살이 되고, 5학년이 돼요!"],["P","Fifth grade! Big sister of the school! What is your number one goal?","5학년! 학교의 왕언니네! 첫 번째 목표는 뭐야?"],["D","My number one goal: I will read one English book every month. Twelve books in one year!","제 1번 목표는요, 매달 영어책 한 권 읽기예요. 일 년에 열두 권!"],["P","Twelve books! Excellent plan! Any skating goals?","열두 권! 훌륭한 계획이야! 스케이트 목표도 있어?"],["D","Yes! I will learn a new jump, and I will not cry when I fall. Well... I will try!","네! 새 점프를 배울 거고, 넘어져도 안 울 거예요. 음... 노력은 할게요!"],["P","Haha, trying counts! What will you do for your family?","하하, 노력도 쳐줄게! 가족을 위해서는 뭘 할 거야?"],["D","I will play with Siheon more, and I will help Mom with the dishes. Sometimes. On good days!","시헌이랑 더 놀아 주고, 엄마 설거지를 도울 거예요. 가끔요. 기분 좋은 날에요!"],["P","Haha! Honest planner! And your biggest dream plan?","하하! 솔직한 계획가네! 가장 큰 꿈의 계획은?"],["D","I will draw one hundred buildings and cars. Future architect Dayoon starts now!","건물이랑 자동차를 백 개 그릴 거예요. 미래의 건축가 다윤, 지금부터 시작합니다!"]],"role":[["P","How old will you be next year?","내년에 몇 살이 돼?"],["D","I will be eleven years old.","열한 살이 돼요."],["P","What is your English goal for next year?","내년 영어 목표는 뭐야?"],["D","I will read one English book every month.","매달 영어책 한 권을 읽을 거예요."],["P","What will you do for your health?","건강을 위해서는 뭘 할 거야?"],["D","I will keep skating and eat more vegetables. Except eggplant!","스케이트를 계속 타고 채소를 더 먹을 거예요. 가지만 빼고요!"],["P","What plan are you most excited about?","어떤 계획이 제일 기대돼?"],["D","Drawing one hundred buildings and cars!","건물과 자동차 백 개 그리기요!"]],"wrap":[["P","Great plans! Tell me your top three goals with 'I will.'","멋진 계획이야! 'I will'로 최고 목표 세 가지를 말해 줘."],["D","Next year, I will read twelve English books. I will learn a new jump at skating. And I will draw one hundred buildings and cars for my architect dream!","내년에 영어책 열두 권을 읽을 거예요. 스케이트에서 새 점프를 배울 거예요. 그리고 건축가의 꿈을 위해 건물과 자동차 백 개를 그릴 거예요!"]],"tip":"목표를 숫자로 말하게 해 주세요(몇 권, 몇 개). 막연한 계획보다 기억에 남고 미래형 연습도 구체적이 됩니다."},{"emoji":"🎆","title":"Day 2 · New Year Wish Ceremony","sub":"새해 소원 발표식","words":[["wish","소원","위시"],["announce","발표하다","어나운스"],["come true","이루어지다","컴 트루"]],"sentence":["I wish my dream will come true next year.","내년에 내 꿈이 이루어지길 바라요."],"main":[["P","Ding— The New Year bell is ringing! Welcome to the Wish Ceremony. Please step up and announce your wishes!","댕— 새해 종이 울립니다! 소원 발표식에 오신 것을 환영합니다. 앞으로 나와 소원을 발표해 주세요!"],["D","Ahem! I, Dayoon of Gwacheon, announce my first wish: I wish for a puppy! A small white one named Mochi!","에헴! 과천의 다윤, 첫 번째 소원을 발표합니다. 강아지를 원합니다! 모찌라는 이름의 작고 하얀 강아지요!"],["P","The classic Dayoon wish! The bell hears you! Second wish?","역시 다윤의 클래식 소원! 종이 듣고 있습니다! 두 번째 소원은?"],["D","Second wish: I wish our family will travel to New Zealand or Australia. I want to see kangaroos and sheep!","두 번째 소원! 우리 가족이 뉴질랜드나 호주로 여행 가길 바랍니다. 캥거루랑 양을 보고 싶어요!"],["P","A big travel wish! And if you meet a kangaroo, what will you say?","커다란 여행 소원이네! 캥거루를 만나면 뭐라고 말할 거야?"],["D","G'day, kangaroo! Nice pocket! Haha! I practiced Australian!","굿다이, 캥거루! 주머니 멋진데! 하하! 호주식 인사 연습했어요!"],["P","Haha, perfect! Third and final wish, please!","하하, 완벽해! 세 번째이자 마지막 소원 발표해 주세요!"],["D","Third wish: I wish everyone in my family will be healthy and laugh every day. This wish is the most important one.","세 번째 소원! 우리 가족 모두가 건강하고 매일 웃길 바랍니다. 이 소원이 제일 중요해요."],["P","The bell rings three times! May your wishes come true! How do you feel now?","종이 세 번 울립니다! 소원이 이루어지길! 지금 기분이 어때?"],["D","I feel hopeful! New year, new Dayoon — but same love for pasta!","희망차요! 새해엔 새로운 다윤! 하지만 파스타 사랑은 그대로예요!"]],"role":[["P","What is your first wish for next year?","내년 첫 번째 소원이 뭐야?"],["D","I wish for a small white puppy named Mochi.","모찌라는 작고 하얀 강아지를 원해요."],["P","Where do you wish to travel?","어디로 여행 가길 바라?"],["D","I wish to travel to New Zealand or Australia.","뉴질랜드나 호주로 여행 가고 싶어요."],["P","What is your most important wish?","가장 중요한 소원은 뭐야?"],["D","I wish my family will be healthy and happy.","가족이 건강하고 행복하길 바라요."],["P","How can wishes come true?","소원은 어떻게 이루어질까?"],["D","Wishes come true when we work hard and don't give up.","열심히 노력하고 포기하지 않으면 이루어져요."]],"wrap":[["P","The ceremony ends! Announce your three wishes one more time, loud and proud!","발표식이 끝납니다! 세 가지 소원을 크고 당당하게 한 번 더 발표해 주세요!"],["D","I announce my wishes: I wish for a puppy named Mochi. I wish to travel to New Zealand or Australia. And I wish my family will be healthy and laugh every day!","제 소원을 발표합니다. 모찌라는 강아지를 원합니다. 뉴질랜드나 호주로 여행 가고 싶습니다. 그리고 가족이 건강하고 매일 웃길 바랍니다!"]],"tip":"종 소리 효과음(컵 두드리기)을 넣어 진짜 의식처럼 진행해 보세요. 소원을 종이에 적어 벽에 붙이면 두고두고 복습됩니다."},{"emoji":"🏗️","title":"Day 3 · Future Designer Dayoon","sub":"미래의 나 인터뷰","words":[["future","미래","퓨처"],["architect","건축가","아키텍트"],["design","디자인하다","디자인"]],"sentence":["In the future, I will design amazing buildings.","미래에 나는 굉장한 건물들을 디자인할 거예요."],"main":[["P","Time travel news! We are in the year 2046! I am interviewing the famous designer... Dayoon! Hello!","시간 여행 뉴스! 여기는 2046년입니다! 유명 디자이너 다윤 님을 인터뷰합니다! 안녕하세요!"],["D","Hello! Welcome to my design studio in Gwacheon! Well, it's a world-famous studio now!","안녕하세요! 과천에 있는 제 디자인 스튜디오에 오신 걸 환영합니다! 뭐, 이제는 세계적으로 유명한 스튜디오죠!"],["P","Amazing! Designer Dayoon, what did you design this year?","굉장하네요! 다윤 디자이너님, 올해는 무엇을 디자인하셨나요?"],["D","I designed a sky-blue museum shaped like a whale! And a car that looks like a strawberry!","고래 모양의 하늘색 미술관을 디자인했어요! 그리고 딸기처럼 생긴 자동차도요!"],["P","A strawberry car! Does it smell sweet too?","딸기 자동차라니! 냄새도 달콤한가요?"],["D","Of course! And the horn says 'yum yum' instead of 'beep beep'! Haha!","물론이죠! 그리고 경적이 '빵빵' 대신 '냠냠' 소리를 내요! 하하!"],["P","Haha! Genius! What will you design next, in the future?","하하! 천재네요! 미래에는 다음으로 뭘 디자인하실 건가요?"],["D","Next, I will design a house for my family. Mom's garden, Dad's kitchen, and a big art room for me!","다음엔 우리 가족을 위한 집을 디자인할 거예요. 엄마의 정원, 아빠의 주방, 그리고 저를 위한 큰 미술 방!"],["P","And a room for Siheon?","시헌이 방은요?"],["D","Hmm... okay, a soundproof room for Siheon! The quietest room in the house! Haha!","음... 좋아요, 시헌이에겐 방음 방을! 집에서 제일 조용한 방이요! 하하!"]],"role":[["P","What will you be in the future?","미래에 뭐가 될 거야?"],["D","I will be an architect or a car designer.","건축가나 자동차 디자이너가 될 거예요."],["P","What building will you design first?","어떤 건물을 제일 먼저 디자인할 거야?"],["D","I will design a whale-shaped museum in sky blue.","하늘색 고래 모양 미술관을 디자인할 거예요."],["P","What do you need to become a designer?","디자이너가 되려면 뭐가 필요할까?"],["D","I need drawing skills, math, and big imagination.","그림 실력, 수학, 그리고 큰 상상력이 필요해요."],["P","Who will live in your future house?","네 미래의 집에는 누가 살 거야?"],["D","My family, and my puppy Mochi will live there too!","우리 가족이요. 강아지 모찌도 같이 살 거예요!"]],"wrap":[["P","Back to today! Tell me about future designer Dayoon in three sentences.","현재로 복귀! 미래의 디자이너 다윤에 대해 세 문장으로 말해 줘."],["D","In the future, I will be an architect or a car designer. I will design a whale-shaped museum and a strawberry car. And I will build a house for my family and Mochi!","미래에 저는 건축가나 자동차 디자이너가 될 거예요. 고래 모양 미술관과 딸기 자동차를 디자인할 거예요. 그리고 가족과 모찌를 위한 집을 지을 거예요!"]],"tip":"인터뷰 후 아이가 말한 미래의 건물이나 자동차를 실제로 그리게 해 보세요. 그림에 영어 이름을 붙이면 금상첨화!"},{"emoji":"✈️","title":"Day 4 · Dream Trip Planning","sub":"뉴질랜드·호주 여행 계획","words":[["travel","여행하다","트래블"],["abroad","해외로","어브로드"],["suitcase","여행 가방","수트케이스"]],"sentence":["Someday, I will travel abroad with my family.","언젠가 나는 가족과 해외여행을 갈 거예요."],"main":[["P","Travel agency open! I am your travel agent. Where do you want to travel, customer?","여행사 오픈! 제가 여행 담당자입니다. 손님, 어디로 여행 가고 싶으세요?"],["D","Hello! I want to travel abroad — to New Zealand and Australia, please! Both, if possible!","안녕하세요! 해외로 가고 싶어요. 뉴질랜드랑 호주로 부탁해요! 가능하면 둘 다요!"],["P","Both! A big trip! What will you do in New Zealand?","둘 다요! 대형 여행이네요! 뉴질랜드에서는 뭘 하실 건가요?"],["D","I will see mountains and sheep, and I will draw the beautiful landscape. Sheep are fluffy models!","산이랑 양을 보고, 아름다운 풍경을 그릴 거예요. 양은 복슬복슬한 모델이죠!"],["P","Fluffy models! And in Australia?","복슬복슬 모델이라니! 호주에서는요?"],["D","I will meet kangaroos and koalas, and I will swim at the big beach!","캥거루랑 코알라를 만나고, 큰 해변에서 수영할 거예요!"],["P","Perfect plan! Now, what will you pack in your suitcase?","완벽한 계획입니다! 자, 여행 가방에는 뭘 싸실 건가요?"],["D","I will pack my sketchbook, colored pencils, a swimsuit, and... snacks. Many, many snacks!","스케치북, 색연필, 수영복, 그리고... 간식을 쌀 거예요. 아주아주 많은 간식이요!"],["P","A suitcase full of snacks! And who will carry it?","간식으로 가득 찬 가방이군요! 그건 누가 들죠?"],["D","Dad will carry it! He is the strongest. That's why we bring him! Haha!","아빠가 들 거예요! 제일 힘세니까요. 그래서 아빠를 데려가는 거예요! 하하!"]],"role":[["P","Where do you want to travel someday?","언젠가 어디로 여행 가고 싶어?"],["D","I want to travel to New Zealand and Australia.","뉴질랜드랑 호주로 여행 가고 싶어요."],["P","What will you do there?","거기서 뭘 할 거야?"],["D","I will see kangaroos and draw the landscape.","캥거루를 보고 풍경을 그릴 거예요."],["P","What will you pack in your suitcase?","여행 가방에 뭘 쌀 거야?"],["D","I will pack my sketchbook, a swimsuit, and snacks.","스케치북, 수영복, 간식을 쌀 거예요."],["P","How will you go abroad?","해외에는 어떻게 갈 거야?"],["D","We will fly on a big airplane. My first flight!","큰 비행기를 타고 갈 거예요. 제 첫 비행이요!"]],"wrap":[["P","Booking complete! Tell me your dream trip plan in three sentences.","예약 완료! 꿈의 여행 계획을 세 문장으로 말해 주세요."],["D","Someday, I will travel abroad to New Zealand and Australia with my family. I will draw sheep and meet kangaroos. I will pack my sketchbook and many snacks!","언젠가 가족과 함께 뉴질랜드와 호주로 해외여행을 갈 거예요. 양을 그리고 캥거루를 만날 거예요. 스케치북과 간식을 잔뜩 챙길 거예요!"]],"tip":"지도나 지구본에서 뉴질랜드·호주를 함께 찾아보세요. 실제 위치를 보면 여행 문장에 진심이 담깁니다."},{"emoji":"⏳","title":"Day 5 · Time Capsule Letter","sub":"타임캡슐 놀이","words":[["capsule","캡슐","캡슐"],["someday","언젠가","섬데이"],["open","열다","오픈"]],"sentence":["We will open this capsule in one year.","우리는 일 년 뒤에 이 캡슐을 열 거예요."],"main":[["P","Today we make a time capsule! We put in messages for Dayoon of next year. What goes in first?","오늘은 타임캡슐을 만들자! 내년의 다윤이에게 보내는 메시지를 넣는 거야. 첫 번째로 뭘 넣을까?"],["D","First, a message: Dear future Dayoon, hello from the past! Are you taller now? I hope so!","먼저 메시지요. 미래의 다윤에게, 과거에서 인사해! 지금은 키가 더 컸니? 그러길 바라!"],["P","Haha! A height check! What question will you ask future Dayoon?","하하! 키 확인이라니! 미래의 다윤이에게 어떤 질문을 할래?"],["D","Did you read twelve English books? Did you get the puppy? Answer me, future Dayoon!","영어책 열두 권 읽었니? 강아지는 생겼어? 대답해 줘, 미래의 다윤!"],["P","Big questions! What small thing will you put in the capsule?","중요한 질문들이네! 캡슐에 어떤 작은 물건을 넣을 거야?"],["D","My best drawing of this year — the sky-blue whale! And one strawberry candy.","올해 최고의 그림, 하늘색 고래요! 그리고 딸기 사탕 한 개요."],["P","Wait, the candy... will it survive one year?","잠깐, 그 사탕... 일 년을 버틸 수 있을까?"],["D","Hmm... maybe I should protect it... in my mouth! Haha! Okay, okay, a candy wrapper then!","음... 안전하게 보관해야겠어요... 제 입속에요! 하하! 알겠어요, 그럼 사탕 껍질로 할게요!"],["P","Haha! Smart choice! When will we open this capsule?","하하! 현명한 선택이야! 이 캡슐은 언제 열까?"],["D","We will open it someday next December. Future Dayoon, see you in one year! Don't forget the hiding place!","내년 12월 언젠가 열 거예요. 미래의 다윤아, 일 년 뒤에 보자! 숨긴 곳 잊지 마!"]],"role":[["P","What message will you put in the capsule?","캡슐에 어떤 메시지를 넣을 거야?"],["D","Dear future Dayoon, hello from the past!","미래의 다윤에게, 과거에서 인사해!"],["P","What thing will you put inside?","안에 어떤 물건을 넣을 거야?"],["D","I will put my whale drawing inside.","제 고래 그림을 넣을 거예요."],["P","When will you open the capsule?","캡슐은 언제 열 거야?"],["D","I will open it someday next December.","내년 12월 언젠가 열 거예요."],["P","What do you hope future Dayoon will say?","미래의 다윤이가 뭐라고 말하길 바라?"],["D","I hope she will say, we did everything on the list!","'우리 목록에 있는 거 다 했어!'라고 말하길 바라요."]],"wrap":[["P","Capsule sealed! Explain our time capsule in two or three sentences.","캡슐 봉인 완료! 우리 타임캡슐을 두세 문장으로 설명해 줘."],["D","Today we made a time capsule with a letter and my whale drawing. I asked future Dayoon about the books and the puppy. We will open it someday next December!","오늘 편지와 고래 그림을 넣은 타임캡슐을 만들었어요. 미래의 다윤이에게 책과 강아지에 대해 물어봤어요. 내년 12월 언젠가 열 거예요!"]],"tip":"실제 상자에 편지와 그림을 넣어 봉인하고 열기로 한 날짜를 적어 두세요. 내년에 여는 순간이 최고의 복습이 됩니다."},{"emoji":"🤝","title":"Day 6 · Promises to Myself","sub":"나와의 약속","words":[["habit","습관","해빗"],["resolution","새해 다짐","레졸루션"],["keep","지키다","킵"]],"sentence":["I will keep my promises little by little.","나는 내 약속들을 조금씩 지켜 나갈 거예요."],"main":[["P","New year resolutions time! But here is the rule: only REAL promises you can keep. No superhero promises!","새해 다짐 시간! 근데 규칙이 있어. 지킬 수 있는 '진짜' 약속만! 슈퍼히어로 약속은 금지!"],["D","Haha, okay! So 'I will fly to school' is out?","하하, 알겠어요! 그럼 '학교까지 날아서 갈 거예요'는 탈락이죠?"],["P","Out! Give me a real resolution, a small habit.","탈락! 진짜 다짐, 작은 습관을 말해 봐."],["D","Resolution one: I will speak English for ten minutes every day. Ten minutes is easy — I talk a lot anyway!","다짐 1번, 매일 10분씩 영어로 말하기요. 10분은 쉬워요. 어차피 저 말 많잖아요!"],["P","True! Good habit! Number two?","사실이지! 좋은 습관이야! 2번은?"],["D","Resolution two: I will pack my school bag at night, not in the morning. Morning Dayoon is always in a hurry!","다짐 2번, 아침 말고 밤에 책가방 싸기요. 아침의 다윤이는 항상 허둥지둥이거든요!"],["P","Haha! Morning Dayoon versus Night Dayoon! Number three?","하하! 아침 다윤 대 밤 다윤이네! 3번은?"],["D","Resolution three: I will be nicer to Siheon. I will share my snacks... the not-strawberry ones.","다짐 3번, 시헌이에게 더 잘해 주기요. 간식도 나눠 줄 거예요... 딸기 아닌 것들로요."],["P","Haha, one strawberry exception! How will you keep these promises?","하하, 딸기 예외 조항이라니! 이 약속들을 어떻게 지킬 거야?"],["D","Little by little, one day at a time. Big changes start with small habits — Teacher Dayoon said that!","조금씩, 하루에 하나씩요. 큰 변화는 작은 습관에서 시작한다 — 다윤 선생님 말씀입니다!"]],"role":[["P","What is your first resolution?","첫 번째 다짐이 뭐야?"],["D","I will speak English for ten minutes every day.","매일 10분씩 영어로 말할 거예요."],["P","What habit will you change in the morning?","아침 습관 중 뭘 바꿀 거야?"],["D","I will pack my bag at night instead.","대신 밤에 가방을 쌀 거예요."],["P","How will you be nicer to Siheon?","시헌이한테 어떻게 더 잘해 줄 거야?"],["D","I will share snacks and play with him more.","간식을 나눠 주고 더 많이 놀아 줄 거예요."],["P","How do people keep resolutions?","사람들은 다짐을 어떻게 지킬까?"],["D","They keep them little by little, every day.","매일 조금씩 지켜 나가요."]],"wrap":[["P","Real promises, real Dayoon! Say your three resolutions one more time.","진짜 약속, 진짜 다윤! 세 가지 다짐을 한 번 더 말해 줘."],["D","I will speak English ten minutes every day. I will pack my bag at night. And I will be nicer to Siheon, little by little!","매일 10분씩 영어로 말할 거예요. 밤에 가방을 쌀 거예요. 그리고 조금씩 시헌이에게 더 잘해 줄 거예요!"]],"tip":"다짐 세 가지를 체크리스트로 만들어 일주일만 실천 스티커를 붙여 보세요. resolution이 실제 습관이 됩니다."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"3주차 총정리","interview":true,"pool":["What will you do next year? Tell me three plans.","What is your number one goal for next year?","What are your three wishes for the new year?","What will you be in the future?","What will you design first as a designer?","Where will you travel someday, and what will you do there?","What will you pack in your suitcase?","What did you put in the time capsule?","When will you open the time capsule?","What is your most important resolution, and how will you keep it?"],"tip":"모든 대답에 will이 들어가는지 확인해 주세요. 과거형이 섞여 나오면 '그건 지난주 문법!'이라고 웃으며 짚어 주세요."}]},{"sub":"1년 대장정 피날레","days":[{"emoji":"🔤","title":"Day 1 · My Year in Three Words","sub":"세 단어로 말하는 올해","words":[["describe","묘사하다","디스크라이브"],["choose","고르다","추즈"],["brave","용감한","브레이브"]],"sentence":["I choose three words to describe my year.","올해를 묘사할 세 단어를 골라요."],"main":[["P","Finale week, Dayoon! Mission one: describe your whole year in only THREE words. Choose carefully!","피날레 주간이야, 다윤! 첫 미션, 올해 전체를 딱 '세 단어'로 묘사하기. 신중하게 골라 봐!"],["D","Only three?! My year was so big! Hmm... okay. Word one: busy!","겨우 세 개요?! 제 한 해는 엄청 컸는데! 음... 좋아요. 첫 단어, busy!"],["P","Busy! Why busy?","바빴다! 왜 busy야?"],["D","School, skating, art, English, and taking care of Siheon. My schedule was full like Dad's suitcase!","학교, 스케이트, 미술, 영어, 그리고 시헌이 돌보기까지. 제 일정은 아빠 여행 가방처럼 꽉 찼었어요!"],["P","Haha! Word two?","하하! 두 번째 단어는?"],["D","Word two: brave. I raised my hand in class, I did speeches, and I tried new jumps. Third-grade me couldn't do that!","두 번째 단어는 brave요. 수업 시간에 손도 들고, 스피치도 하고, 새 점프도 시도했어요. 3학년의 저는 못 했을걸요!"],["P","So true. And the final word? Choose the best one!","정말 그래. 마지막 단어는? 최고의 단어로 골라 봐!"],["D","Word three: delicious! Because... pasta, strawberries, beach food, birthday cake. My year was yummy!","세 번째 단어는 delicious! 왜냐면... 파스타, 딸기, 바다 음식, 생일 케이크. 제 한 해는 맛있었거든요!"],["P","Haha! Busy, brave, and delicious! The most Dayoon year ever! Can you describe next year in one word?","하하! 바쁘고, 용감하고, 맛있었다! 역대 가장 다윤다운 한 해네! 내년을 한 단어로 표현하면?"],["D","Bigger! Next year, everything will be bigger — my dreams, my speeches, and maybe... me!","Bigger요! 내년엔 모든 게 더 커질 거예요. 제 꿈도, 스피치도, 그리고 어쩌면... 저도요!"]],"role":[["P","What three words describe your year?","네 한 해를 묘사하는 세 단어는 뭐야?"],["D","Busy, brave, and delicious!","바쁘고, 용감하고, 맛있었어요!"],["P","Why did you choose the word brave?","왜 brave를 골랐어?"],["D","Because I did speeches and tried new things.","스피치도 하고 새로운 것들을 시도했으니까요."],["P","What word describes your family this year?","올해 너희 가족을 묘사하는 단어는?"],["D","Warm! We hugged and laughed a lot.","따뜻함이요! 많이 안아 주고 많이 웃었어요."],["P","What word do you want for next year?","내년을 위한 단어는 뭘로 하고 싶어?"],["D","Bigger! My dreams will grow bigger.","Bigger요! 제 꿈이 더 커질 거예요."]],"wrap":[["P","Perfect three words! Now explain them in three sentences, one for each word.","완벽한 세 단어야! 이제 단어마다 한 문장씩, 세 문장으로 설명해 줘."],["D","My year was busy with school, skating, art, and English. I was brave because I did speeches and new jumps. And it was delicious, full of pasta and strawberries!","제 한 해는 학교, 스케이트, 미술, 영어로 바빴어요. 스피치와 새 점프를 해내서 용감했어요. 그리고 파스타와 딸기로 가득해서 맛있었어요!"]],"tip":"부모님의 한 해 세 단어도 공유해 주세요. 서로의 단어를 비교하는 재미가 설명 문장을 더 끌어냅니다."},{"emoji":"🪞","title":"Day 2 · Then and Now","sub":"일 년 전 나 vs 지금 나","words":[["change","변화, 변하다","체인지"],["different","다른","디퍼런트"],["progress","발전","프로그레스"]],"sentence":["I am different from one year ago.","나는 일 년 전과 달라요."],"main":[["P","Mirror game! On the left, Dayoon from one year ago. On the right, today's Dayoon. Compare them!","거울 게임이야! 왼쪽엔 일 년 전 다윤, 오른쪽엔 오늘의 다윤. 둘을 비교해 봐!"],["D","Okay! One year ago, Dayoon was shorter. Now I am three centimeters taller! I measured!","좋아요! 일 년 전 다윤이는 키가 더 작았어요. 지금은 3센티미터 더 커요! 재봤어요!"],["P","Three centimeters of progress! What about English?","3센티미터의 발전이네! 영어는 어때?"],["D","Big change! Then, I answered with one word. Now, I answer with long sentences and jokes!","큰 변화죠! 그때는 한 단어로 대답했어요. 지금은 긴 문장에 개그까지 곁들여 대답해요!"],["P","The jokes are the biggest change! Haha! What about your feelings?","개그가 제일 큰 변화지! 하하! 마음은 어때?"],["D","Then, I was scared of mistakes. Now I know mistakes are okay. Different Dayoon!","그때는 실수가 무서웠어요. 지금은 실수해도 괜찮다는 걸 알아요. 달라진 다윤이죠!"],["P","That is real progress, not just centimeters! Is anything the same?","그게 진짜 발전이야, 센티미터보다도! 그대로인 것도 있어?"],["D","Yes! I still love drawing, sky blue, and pasta. Some things never change!","네! 여전히 그림, 하늘색, 파스타를 사랑해요. 어떤 건 절대 안 변해요!"],["P","The Dayoon classics! Last question: which Dayoon do you like more?","다윤 클래식이지! 마지막 질문. 어느 다윤이가 더 좋아?"],["D","Today's Dayoon! But I say thank you to past Dayoon. She practiced hard for me!","오늘의 다윤이요! 하지만 과거의 다윤이에게 고맙다고 말할래요. 절 위해 열심히 연습해 줬으니까요!"]],"role":[["P","How are you different from one year ago?","일 년 전과 어떻게 달라?"],["D","I am taller, braver, and better at English.","키도 크고, 더 용감하고, 영어도 늘었어요."],["P","What was your biggest change this year?","올해 가장 큰 변화는 뭐였어?"],["D","I stopped being scared of mistakes.","실수를 무서워하지 않게 된 거요."],["P","What stayed the same?","그대로인 건 뭐야?"],["D","My love for drawing and pasta stayed the same.","그림과 파스타 사랑은 그대로예요."],["P","What progress made you happiest?","어떤 발전이 제일 기뻤어?"],["D","Speaking English in long sentences!","영어로 긴 문장을 말하게 된 거요!"]],"wrap":[["P","Then and now, well done! Compare the two Dayoons in three sentences.","과거와 현재, 잘했어! 두 다윤이를 세 문장으로 비교해 줘."],["D","One year ago, I was shorter and quieter. Now I am taller, braver, and I speak English in long sentences. But my love for drawing and pasta never changed!","일 년 전 저는 더 작고 조용했어요. 지금은 더 크고 용감하고 영어로 긴 문장을 말해요. 하지만 그림과 파스타 사랑은 변하지 않았어요!"]],"tip":"작년 사진이나 예전 그림·글씨를 실물로 보여 주세요. Then/Now 비교가 눈에 보이면 문장이 저절로 나옵니다."},{"emoji":"🎙️","title":"Day 3 · Dayoon the Interviewer","sub":"반대로! 내가 인터뷰어","words":[["interviewer","인터뷰 진행자","인터뷰어"],["question","질문","퀘스천"],["answer","대답","앤서"]],"sentence":["May I ask you some questions about this year?","올해에 대해 몇 가지 질문해도 될까요?"],"main":[["P","Special day! Today, YOU are the interviewer, and I am the student. Ask me about my year!","특별한 날이야! 오늘은 '네가' 인터뷰어, 내가 학생이야. 나의 한 해에 대해 질문해 봐!"],["D","Yes! Power change! Hello, welcome to the Dayoon Show. May I ask you some questions about this year?","예스! 권력 교체! 안녕하세요, 다윤 쇼에 오신 걸 환영합니다. 올해에 대해 몇 가지 질문해도 될까요?"],["P","Of course, interviewer Dayoon!","물론이죠, 다윤 인터뷰어님!"],["D","Question one: what did you learn this year? Answer in past tense, please!","질문 1번. 올해 무엇을 배우셨나요? 과거형으로 대답해 주세요!"],["P","Wow, checking my grammar too?! I learned to be more patient this year.","와, 문법 검사까지?! 나는 올해 더 인내심을 갖는 법을 배웠어."],["D","Good answer! Question two: what was your best memory with me... I mean, with your student?","좋은 대답입니다! 질문 2번. 저와… 아니, 학생과의 최고의 기억은 무엇인가요?"],["P","Haha! My best memory was your first thirty-second speech. I almost cried!","하하! 최고의 기억은 너의 첫 30초 스피치였어. 나 울 뻔했잖아!"],["D","Aww! Final question: what will you do next year? Please use 'will' in your answer!","아잉! 마지막 질문입니다. 내년에는 무엇을 하실 건가요? 대답에 'will'을 꼭 써 주세요!"],["P","I will study with Dayoon again, and I will bring harder questions! Be ready!","내년에도 다윤이와 공부할 거고, 더 어려운 질문들을 가져올 거야! 각오해!"],["D","Great answers! You pass the interview! This was the Dayoon Show — good night, everyone!","훌륭한 대답이었습니다! 인터뷰 합격입니다! 지금까지 다윤 쇼였습니다. 여러분, 안녕히 주무세요!"]],"role":[["P","Now switch back! How do you start an interview politely?","이제 다시 바꾸자! 인터뷰를 어떻게 공손하게 시작하지?"],["D","May I ask you some questions?","몇 가지 질문해도 될까요?"],["P","What makes a good question?","좋은 질문의 조건은 뭘까?"],["D","A good question makes people think and talk a lot.","좋은 질문은 사람을 생각하게 하고 말을 많이 하게 해요."],["P","What was my best answer today?","오늘 내 대답 중 최고는 뭐였어?"],["D","Your answer about my first speech. It made me happy!","제 첫 스피치에 대한 대답이요. 기분이 좋았어요!"],["P","Was being the interviewer easy or hard?","인터뷰어 하는 건 쉬웠어, 어려웠어?"],["D","It was fun but hard. Making questions is real work!","재밌었지만 어려웠어요. 질문 만들기는 진짜 일이에요!"]],"wrap":[["P","The tables were turned! What did you learn as an interviewer? Two or three sentences.","입장이 바뀌었었지! 인터뷰어로서 뭘 배웠어? 두세 문장으로."],["D","Today I was the interviewer and made my own questions. I learned that asking good questions is hard work. Now I understand my teacher more!","오늘 제가 인터뷰어가 되어 직접 질문을 만들었어요. 좋은 질문을 하는 게 힘든 일이라는 걸 배웠어요. 이제 선생님을 더 이해해요!"]],"tip":"아이 질문에 일부러 문법이 틀린 대답을 하나 섞어 보세요. 아이가 잡아내면 일 년 치 실력이 증명되는 순간입니다."},{"emoji":"📝","title":"Day 4 · Building My Big Speech","sub":"1분 스피치 설계하기","words":[["prepare","준비하다","프리페어"],["topic","주제","토픽"],["part","부분","파트"]],"sentence":["My speech has three parts: past, present, and future.","내 스피치는 과거, 현재, 미래 세 부분으로 되어 있어요."],"main":[["P","Two days until your one-minute final speech! Today we prepare it like architects. Topic: 'My Amazing Year.'","1분 파이널 스피치까지 이틀 남았어! 오늘은 건축가처럼 스피치를 설계하자. 주제는 '나의 굉장한 한 해'."],["D","Like architects! Then we need a blueprint! What are the parts?","건축가처럼요! 그럼 설계도가 필요하죠! 부분들은 뭐예요?"],["P","You tell me! A strong speech has three parts, like a building has floors.","네가 말해 봐! 튼튼한 스피치는 세 부분이야. 건물에 층이 있는 것처럼."],["D","Okay! First floor: the past — what I learned and my best memories. Second floor: the present — who I am now!","좋아요! 1층은 과거, 배운 것과 최고의 기억들. 2층은 현재, 지금의 나!"],["P","Perfect! And the top floor?","완벽해! 꼭대기 층은?"],["D","Third floor: the future! My plans and my designer dream. And on the roof... a big thank you!","3층은 미래! 제 계획과 디자이너 꿈이요. 그리고 옥상에는... 커다란 감사 인사!"],["P","A thank-you roof! Beautiful building! Now, what sentence will you start with?","감사 인사 옥상이라니! 아름다운 건물이야! 자, 첫 문장은 뭘로 시작할래?"],["D","Hello everyone! One year ago, I was a quiet girl who only said yes and no. — Good hook, right?","안녕하세요, 여러분! 일 년 전 저는 yes와 no만 말하는 조용한 소녀였습니다. — 시작 멘트 괜찮죠?"],["P","Great hook! Everyone will listen! And the last sentence?","완벽한 시작이야! 모두가 귀 기울일걸! 마지막 문장은?"],["D","Thank you for listening — and watch me, because next year I will shine even brighter! Then I bow!","들어 주셔서 감사합니다. 그리고 지켜봐 주세요, 내년엔 더 밝게 빛날 테니까요! 그리고 인사!"]],"role":[["P","What is the topic of your final speech?","파이널 스피치의 주제가 뭐야?"],["D","The topic is My Amazing Year.","주제는 '나의 굉장한 한 해'예요."],["P","What are the three parts of your speech?","스피치의 세 부분은 뭐야?"],["D","Past, present, and future — like a three-floor building!","과거, 현재, 미래요. 3층 건물처럼요!"],["P","How will you start your speech?","스피치를 어떻게 시작할 거야?"],["D","With my story: one year ago, I only said yes and no.","제 이야기로요. 일 년 전 저는 yes와 no만 말했다고요."],["P","How do you prepare for a big speech?","큰 스피치는 어떻게 준비하지?"],["D","I make a plan, practice out loud, and sleep well!","계획을 세우고, 소리 내어 연습하고, 잘 자요!"]],"wrap":[["P","Blueprint complete! Explain your speech building in three sentences.","설계도 완성! 네 스피치 건물을 세 문장으로 설명해 줘."],["D","My speech has three parts: past, present, and future. I will start with my yes-no robot story and end with a bright promise. Tomorrow I will practice, and the next day — the real stage!","제 스피치는 과거, 현재, 미래 세 부분이에요. 예스노 로봇 이야기로 시작해서 밝은 약속으로 끝낼 거예요. 내일은 연습하고, 그다음 날은 진짜 무대예요!"]],"tip":"스피치 내용을 3층 건물 그림으로 그리게 해 보세요. 건축가 꿈과 연결되어 구조가 머리에 확실히 새겨집니다."},{"emoji":"🎬","title":"Day 5 · Dress Rehearsal","sub":"최종 리허설","words":[["rehearsal","리허설","리허설"],["feedback","피드백","피드백"],["voice","목소리","보이스"]],"sentence":["Practice makes perfect, so let's rehearse!","연습이 완벽을 만드니까, 리허설을 하자!"],"main":[["P","Dress rehearsal day! Tomorrow is the real stage. Run your one-minute speech, and I will give feedback!","최종 리허설 날이야! 내일이 진짜 무대야. 1분 스피치를 돌려 보자. 내가 피드백을 줄게!"],["D","Okay! Deep breath... Hello everyone! One year ago, I was a quiet girl who only said yes and no...","네! 심호흡하고... 안녕하세요, 여러분! 일 년 전 저는 yes와 no만 말하는 조용한 소녀였습니다..."],["P","Pause! Feedback one: great hook, but your voice was small. The back row can't hear you!","잠깐! 피드백 1번. 시작은 훌륭한데 목소리가 작아. 뒷줄에는 안 들려!"],["D","Got it! Bigger voice! ...I LEARNED many things! I did SPEECHES! I made JOKES in English!","알겠어요! 더 큰 목소리로! ...저는 많은 것을 배웠습니다! 스피치를 했습니다! 영어로 개그도 했습니다!"],["P","Haha, now the whole apartment can hear you! Perfect middle. Keep going!","하하, 이제 아파트 전체가 다 듣겠다! 중간 부분 완벽해. 계속해!"],["D","In the future, I will be an architect or a car designer. And next year, I will read twelve English books!","미래에 저는 건축가나 자동차 디자이너가 될 것입니다. 그리고 내년에는 영어책 열두 권을 읽을 것입니다!"],["P","Feedback two: add a smile at the end. A smile is the best decoration for a speech!","피드백 2번. 마지막에 미소를 더해 봐. 미소는 스피치 최고의 장식이야!"],["D","Thank you for listening — and watch me, because next year I will shine even brighter! — with a big smile! How was that?","들어 주셔서 감사합니다. 지켜봐 주세요, 내년엔 더 밝게 빛날 테니까요! — 활짝 웃으면서요! 어땠어요?"],["P","Fifty-eight seconds, big voice, big smile. You are ready for tomorrow!","58초, 큰 목소리, 활짝 미소. 내일 준비 완료야!"],["D","Yes!! Tonight I will practice one more time in the mirror. The mirror is my biggest fan!","예스!! 오늘 밤 거울 앞에서 한 번 더 연습할 거예요. 거울은 제 최고의 팬이거든요!"]],"role":[["P","Why do we rehearse before a big day?","큰 날 전에 왜 리허설을 할까?"],["D","Because practice makes perfect!","연습이 완벽을 만드니까요!"],["P","What feedback did you get today?","오늘 어떤 피드백을 받았어?"],["D","Bigger voice and a smile at the end.","더 큰 목소리와 마지막 미소요."],["P","How long was your speech today?","오늘 스피치는 몇 초였어?"],["D","It was fifty-eight seconds. Almost perfect!","58초였어요. 거의 완벽해요!"],["P","How do you feel about tomorrow?","내일에 대한 기분은 어때?"],["D","I feel nervous but ready. Mostly ready!","긴장되지만 준비됐어요. 거의 준비 완료!"]],"wrap":[["P","Rehearsal complete! What will you remember on stage tomorrow? Two or three sentences.","리허설 완료! 내일 무대에서 뭘 기억할 거야? 두세 문장으로."],["D","I will remember three things: big voice, eye contact, and a smile at the end. My speech is fifty-eight seconds of my whole year. Tomorrow, I will shine!","세 가지를 기억할 거예요. 큰 목소리, 눈 맞춤, 마지막 미소. 제 스피치는 제 일 년을 담은 58초예요. 내일, 저는 빛날 거예요!"]],"tip":"리허설을 휴대폰으로 촬영해 함께 보며 좋았던 점 2개, 고칠 점 1개만 말해 주세요. 내일 본 무대의 긴장이 크게 줄어듭니다."},{"emoji":"🎥","title":"Day 6 · My One-Minute Final Speech","sub":"대망의 1분 스피치 + 영상 촬영","words":[["record","녹화하다","레코드"],["stage","무대","스테이지"],["shine","빛나다","샤인"]],"sentence":["This is my one-minute speech about my amazing year.","이것은 나의 굉장한 한 해에 대한 1분 스피치입니다."],"main":[["P","The day is here! The stage is yours, the camera is recording. Dayoon's One-Minute Final Speech — action!","드디어 그날이야! 무대는 네 것, 카메라는 녹화 중. 다윤의 1분 파이널 스피치 — 액션!"],["D","Hello everyone! I am Dayoon, ten years old, from Gwacheon. One year ago, I was a quiet girl who only said yes and no.","안녕하세요, 여러분! 저는 과천에 사는 열 살 다윤입니다. 일 년 전 저는 yes와 no만 말하는 조용한 소녀였습니다."],["P","(quietly cheering) Go on, you're doing great...","(조용히 응원하며) 계속해, 아주 잘하고 있어..."],["D","This year, I learned to talk about my family, my school, and my feelings. I debated about pizza and pasta — pasta won, of course!","올해 저는 가족, 학교, 감정에 대해 말하는 법을 배웠습니다. 피자와 파스타 토론도 했죠. 당연히 파스타가 이겼습니다!"],["P","(laughing quietly) Haha, the audience loves it!","(조용히 웃으며) 하하, 관객 반응 최고야!"],["D","Now I can give speeches, tell jokes, and comfort my friends in English. I am not the yes-no robot anymore!","이제 저는 영어로 스피치도 하고, 개그도 하고, 친구도 위로할 수 있습니다. 더 이상 예스노 로봇이 아니에요!"],["P","(whispering) Last part, bring it home!","(속삭이며) 마지막 부분이야, 멋지게 마무리해!"],["D","Next year, I will read twelve English books and keep drawing my designer dream. Thank you for listening — and watch me, because I will shine even brighter!","내년에 저는 영어책 열두 권을 읽고 디자이너 꿈을 계속 그려 나갈 것입니다. 들어 주셔서 감사합니다. 지켜봐 주세요, 저는 더 밝게 빛날 테니까요!"],["P","CUT! One minute and two seconds! Perfect! The crowd goes wild!! How do you feel?!","컷! 1분 2초! 완벽해! 관중이 열광한다!! 기분이 어때?!"],["D","I did it!! One year ago: yes, no. Today: a one-minute speech! Somebody give me strawberries, I earned them!","해냈어요!! 일 년 전엔 yes, no. 오늘은 1분 스피치! 누가 딸기 좀 주세요, 저 이거 받을 자격 있어요!"]],"role":[["P","How did the recording go?","녹화는 어땠어?"],["D","It went great! One minute and two seconds!","아주 잘됐어요! 1분 2초였어요!"],["P","Which part of your speech are you most proud of?","스피치에서 어느 부분이 제일 자랑스러워?"],["D","The ending — I will shine even brighter!","마지막이요. '더 밝게 빛나겠습니다!' 부분이요!"],["P","Who will you show the video to?","영상은 누구에게 보여 줄 거야?"],["D","My family first, and maybe Minseo!","가족 먼저요. 그리고 아마 민서한테도요!"],["P","What does this video mean to you?","이 영상은 너에게 어떤 의미야?"],["     h+='<div class="seg friend"><h3>🌏 외국 친구랑 이렇게!<span class="time">보너스</span></h3>'
      +'<p style="font-size:13px;color:var(--soft);margin:-4px 0 6px">교과서엔 없지만 또래 친구들이 진짜 쓰는 표현 — 하루 '+fr.length+'개만 입에 붙이기!</p>'
      +fr.map(f=>'<div class="fx"><span class="en">'+f[0]+'</span><span class="ko">'+f[1]+' · <span class="use">'+f[2]+'</span></span></div>').join('')
      +'</div>';
  }
  h+='<div class="tip">👩 <b>부모 코칭:</b> '+d.tip+'</div>';
  return h;
}
function renderMonths(){
  monthsEl.innerHTML='';
  const g=document.createElement('button');
  g.className='mchip'+(cur.m===-1?' active':''); g.innerHTML='📋<small>안내</small>';
  g.onclick=()=>{cur={m:-1,d:0}; render();};
  monthsEl.appendChild(g);
  MONTHS.forEach((mo,i)=>{
    const b=document.createElement('button');
    b.className='mchip'+(cur.m===i?' active':'');
    b.innerHTML=mo.m+'개월차<small>'+mo.theme+'</small>';
    b.onclick=()=>{cur={m:i,d:0}; render();};
    monthsEl.appendChild(b);
  });
}
function renderTabs(){
  tabsEl.innerHTML='';
  if(cur.m<0){tabsEl.style.display='none'; return;}
  tabsEl.style.display='flex';
  if(typeof cur.w!=='number'||cur.w<0||cur.w>3)cur.w=0;
  MONTHS[cur.m].weeks.forEach((wk,i)=>{
    const b=document.createElement('button');
    b.className='tab wk'+(cur.w===i?' active':'');
    b.textContent=(i+1)+'주';
    b.title=wk.sub;
    b.onclick=()=>{cur.w=i; cur.d=0; render();};
    tabsEl.appendChild(b);
  });
  const sep=document.createElement('span');
  sep.className='tabsep';
  tabsEl.appendChild(sep);
  MONTHS[cur.m].weeks[cur.w].days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.d===i?' active':'');
    b.textContent=d.emoji+' D'+(i+1);
    b.onclick=()=>{cur.d=i; render();};
    tabsEl.appendChild(b);
  });
}
function render(){
  renderMonths(); renderTabs();
  if(cur.m===-1){
    qEl.innerHTML='<b>사용법</b> · 매달 칩을 눌러 그 달 스크립트로 이동하세요';
    mainEl.innerHTML='<div class="panel">'+guideHTML()+'</div>';
  } else {
    const mo=MONTHS[cur.m];
    if(typeof cur.w!=='number'||cur.w<0||cur.w>3)cur.w=0;
    qEl.innerHTML='<b>'+QUARTERS[mo.q].split(' — ')[0]+'</b> · '+(cur.w+1)+'주차: '+mo.weeks[cur.w].sub;
    mainEl.innerHTML='<div class="panel">'+dayHTML(mo.weeks[cur.w].days[cur.d], mo.m+'-'+(cur.d+1))+'</div>';
  }
  window.scrollTo({top:0});
}
/* (시작 위치 복원은 마지막 블록의 v3 로직에서 처리) */
render();

/* 글자 크기 */
let fs=17;
function setFont(d){ fs=Math.max(14,Math.min(22,fs+d)); document.body.style.fontSize=fs+'px';
  try{localStorage.setItem('dayoon_fs',fs)}catch(e){} }
try{const s=localStorage.getItem('dayoon_fs'); if(s&&!isNaN(+s)){fs=Math.max(14,Math.min(22,+s)); document.body.style.fontSize=fs+'px';}}catch(e){}

<script>
/* ============ 추가 기능: 🔊발음듣기 · 🎲랜덤질문 · 📝레벨테스트 · 🎙️녹음 ============ */

/* --- 🔊 발음 듣기 (브라우저 내장 음성, 인터넷 불필요) --- */
function speak(t){
  if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않아요."); return;}
  t=String(t).replace(/[()]/g," ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
  if(!t)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=0.85; u.pitch=1.05;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.indexOf("en")===0);
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window){speechSynthesis.getVoices();} // 목소리 미리 로드

function spkBtn(t){
  const b=document.createElement("button");
  b.className="spk"; b.textContent="🔊"; b.title="발음 듣기"; b.type="button";
  b.onclick=function(e){e.stopPropagation(); speak(t);};
  return b;
}
function addSpeakers(){
  document.querySelectorAll("#main .line").forEach(function(el){
    if(el.querySelector(".spk"))return;
    let t="";
    el.childNodes.forEach(function(n){if(n.nodeType===3)t+=n.textContent;});
    t=t.trim();
    if(!t||!/[a-zA-Z]/.test(t))return;
    const ko=el.querySelector(".ko"), b=spkBtn(t);
    if(ko)el.insertBefore(b,ko); else el.appendChild(b);
  });
  document.querySelectorAll("#main table.words tr").forEach(function(tr){
    const en=tr.querySelector(".en"), say=tr.querySelector(".say");
    if(!en||!say||say.querySelector(".spk"))return;
    if(!/[a-zA-Z]/.test(en.textContent))return;
    say.appendChild(spkBtn(en.textContent));
  });
  document.querySelectorAll("#main .sentence").forEach(function(el){
    if(el.querySelector(".spk"))return;
    let t="";
    el.childNodes.forEach(function(n){if(n.nodeType===3)t+=n.textContent;});
    t=t.replace(/[“”"]/g,"").trim();
    if(!t||!/[a-zA-Z]/.test(t))return;
    el.appendChild(spkBtn(t));
  });
  // 🌏 외국 친구 표현에도 발음 버튼
  document.querySelectorAll("#main .fx").forEach(function(el){
    if(el.querySelector(".spk"))return;
    const en=el.querySelector(".en");
    if(!en||!/[a-zA-Z]/.test(en.textContent))return;
    en.appendChild(spkBtn(en.textContent));
  });
}

/* --- 📝 레벨테스트 예상 질문 & 다윤이 답 --- */
const LEVELTEST=[
 {t:"① 인사 · 워밍업", lines:[
   ["P","How are you today?","오늘 기분 어때요?"],["D","I'm good, thank you.","좋아요, 감사합니다."],
   ["P","What's your name?","이름이 뭐예요?"],["D","My name is Dayoon.","제 이름은 다윤이에요."],
   ["P","How old are you?","몇 살이에요?"],["D","I'm ten years old.","열 살이에요."],
   ["P","Can you spell your name?","이름 철자를 말해줄래요?"],["D","D-A-Y-O-O-N, Dayoon.","디-에이-와이-오-오-엔, 다윤."]]},
 {t:"② 가족 · 학교", lines:[
   ["P","Tell me about your family.","가족 소개해 줄래요?"],["D","There are four people in my family. My mom, my dad, my little brother Siheon, and me.","엄마, 아빠, 동생 시헌이, 저 — 네 명이에요."],
   ["P","What grade are you in?","몇 학년이에요?"],["D","I'm in fourth grade.","4학년이에요."],
   ["P","What's your favorite subject?","좋아하는 과목은?"],["D","My favorite subject is art. I like drawing.","미술이요. 그림 그리는 걸 좋아해요."],
   ["P","Who is your best friend?","단짝은 누구예요?"],["D","My best friend is Minseo. We play together at school.","민서요. 학교에서 같이 놀아요."]]},
 {t:"③ 일상 · 취미 (가장 많이 나와요!)", lines:[
   ["P","What do you do after school?","방과 후엔 뭐 해요?"],["D","After school, I do my homework and play with my friends.","숙제하고 친구들이랑 놀아요."],
   ["P","What's your hobby?","취미가 뭐예요?"],["D","My hobby is drawing.","그림 그리기요."],
   ["P","Do you have any pets?","반려동물 있어요?"],["D","No, I don't have a pet, but I love dogs.","없지만 강아지를 좋아해요."],
   ["P","What's your favorite food?","좋아하는 음식은?"],["D","My favorite food is pasta.","파스타요."],
   ["P","What did you do last weekend?","지난 주말에 뭐 했어요?"],["D","I went to the park with my family. It was fun.","가족이랑 공원에 갔어요. 재밌었어요."]]},
 {t:"④ 그림 보고 말하기", lines:[
   ["P","What can you see in the picture?","그림에 뭐가 보여요?"],["D","I can see a dog, a tree, and two children.","강아지, 나무, 아이 둘이 보여요."],
   ["P","What is the boy doing?","남자아이가 뭐 하고 있어요?"],["D","He is playing soccer.","축구하고 있어요."],
   ["P","What color is it?","무슨 색이에요?"],["D","It's blue and white.","파란색과 흰색이에요."]]},
 {t:"⑤ 의견 · 자유 말하기 (레벨 높을 때)", lines:[
   ["P","What do you want to be in the future?","커서 뭐가 되고 싶어요?"],["D","I want to be an architect because I like drawing buildings.","건축가요, 건물 그리는 걸 좋아해서요."],
   ["P","Do you like summer or winter? Why?","여름과 겨울 중 뭐가 좋아요?"],["D","I like summer because I can swim.","여름이요, 수영할 수 있으니까요."],
   ["P","What's your dream?","꿈이 뭐예요?"],["D","My dream is to go to New Zealand and Australia.","뉴질랜드와 호주에 가보는 거예요."]]}
];
function testHTML(){
  let h="";
  LEVELTEST.forEach(function(s){
    h+='<div class="seg main"><h3>'+s.t+'</h3>'+linesHTML(s.lines)+'</div>';
  });
  h+='<div class="tip">💡 <b>팁 1:</b> 모르는 질문엔 당황하지 말고 <b>"Can you say that again, please?"</b> — 오히려 점수에 도움!</div>';
  h+='<div class="tip">💡 <b>팁 2:</b> 한 단어로 끝내지 말고 <b>because…</b>로 이유 한 문장 더!</div>';
  h+='<div class="tip">💡 <b>팁 3:</b> 그림 문제는 <b>"I can see…"</b> + <b>"He/She is …ing"</b> 두 틀이면 대부분 해결!</div>';
  h+='<div class="seg role"><h3>🆘 막혔을 때 비상 표현</h3>'
    +SOS.map(function(s){return '<div style="margin:8px 0"><b style="color:var(--pink-d)">'+s[0]+'</b><br><span style="font-weight:800">'+s[1]+'</span><br><span style="color:var(--soft);font-size:13.5px">'+s[2]+'</span></div>';}).join("")+'</div>';
  return h;
}
function addTestChip(active){
  const b=document.createElement("button");
  b.className="mchip"+(active?" active":"");
  b.innerHTML="📝<small>레벨테스트</small>";
  b.onclick=function(){cur={m:-2,d:0}; render();};
  const first=monthsEl.children[0];
  if(first&&first.nextSibling)monthsEl.insertBefore(b,first.nextSibling);
  else monthsEl.appendChild(b);
}

/* --- render 확장: 레벨테스트 탭 + 발음 버튼 자동 부착 --- */
const _renderBase=render;
render=function(){
  if(cur.m===-2){
    renderMonths();
    addTestChip(true);
    tabsEl.style.display="none";
    qEl.innerHTML="<b>📝 레벨테스트</b> · 예상 질문 & 다윤이 답 — 테스트 직전엔 이 탭만 봐도 OK";
    mainEl.innerHTML='<div class="panel">'+testHTML()+'</div>';
    addSpeakers();
    window.scrollTo({top:0});
    return;
  }
  _renderBase();
  addTestChip(false);
  addSpeakers();
};

/* --- 🎲 랜덤 질문 모드 (지금까지 배운 달의 인터뷰 질문에서 출제) --- */
function rndPool(){
  let list=[];
  const collect=function(mo){mo.weeks.forEach(function(wk){const iv=wk.days.find(function(d){return d.interview;}); if(iv&&iv.pool)list=list.concat(iv.pool);});};
  if(cur.m===-2){MONTHS.forEach(collect);}
  else{const upto=Math.max(0,cur.m); for(let i=0;i<=upto&&i<MONTHS.length;i++)collect(MONTHS[i]);}
  return list.length?list:["How are you today?"];
}
let lastQ="";
function nextRandomQ(spk){
  const qs=rndPool();
  let q=qs[Math.floor(Math.random()*qs.length)], n=0;
  while(qs.length>1&&q===lastQ&&n++<5){q=qs[Math.floor(Math.random()*qs.length)];}
  lastQ=q;
  document.getElementById("rndq").textContent=q;
  if(spk!==false)speak(q);
}
function openRandom(){document.getElementById("rndov").style.display="flex"; nextRandomQ();}
function closeRandom(){document.getElementById("rndov").style.display="none"; if("speechSynthesis" in window)speechSynthesis.cancel();}

/* --- 🎙️ 녹음해서 들어보기 --- */
let mediaRec=null, recChunks=[], recURL=null;
function toggleRec(){
  const btn=document.getElementById("recbtn");
  if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop(); return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert("이 환경에선 마이크를 쓸 수 없어요 😢\n(카톡으로 받은 파일로 열면 녹음이 안 될 수 있어요 — 웹 주소로 올리면 돼요!)");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRec=new MediaRecorder(stream);
    recChunks=[];
    mediaRec.ondataavailable=function(e){recChunks.push(e.data);};
    mediaRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      if(recURL)URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(recChunks,{type:mediaRec.mimeType||"audio/mp4"}));
      const bar=document.getElementById("recbar");
      bar.style.display="flex";
      bar.querySelector("audio").src=recURL;
      btn.classList.remove("rec-on"); btn.textContent="🎙️";
    };
    mediaRec.start();
    btn.classList.add("rec-on"); btn.textContent="⏹";
  }).catch(function(){
    alert("마이크를 사용할 수 없어요 😢\n(카톡으로 받은 파일로 열면 녹음이 안 될 수 있어요 — 웹 주소로 올리면 돼요!)");
  });
}
function closeRecbar(){
  document.getElementById("recbar").style.display="none";
  if(recURL){URL.revokeObjectURL(recURL); recURL=null;}
}

/* --- UI 주입: 플로팅 버튼 + 오버레이 + 녹음 바 --- */
document.body.insertAdjacentHTML("beforeend",
  '<div id="rndov" onclick="if(event.target===this)closeRandom()">'
  +'<div class="card"><div class="rtitle">🎲 랜덤 질문</div>'
  +'<div class="rsub">지금까지 배운 달의 인터뷰 질문에서 나와요 — 대본 없이 대답해보기!</div>'
  +'<div class="q" id="rndq"></div>'
  +'<div class="btns">'
  +'<button class="b1" onclick="speak(document.getElementById(\'rndq\').textContent)">🔊 다시 듣기</button>'
  +'<button class="b2" onclick="nextRandomQ()">다음 질문 →</button>'
  +'<button class="b3" onclick="closeRandom()">닫기</button>'
  +'</div></div></div>'
  +'<div id="recbar"><span class="rlabel">🎧 내 발음</span><audio controls></audio>'
  +'<button class="rclose" onclick="closeRecbar()">✕</button></div>');

(function(){
  const fb=document.querySelector(".fontbtn");
  const rnd=document.createElement("button");
  rnd.className="toolbtn"; rnd.textContent="🎲"; rnd.title="랜덤 질문"; rnd.type="button"; rnd.onclick=openRandom;
  const rec=document.createElement("button");
  rec.className="toolbtn"; rec.id="recbtn"; rec.textContent="🎙️"; rec.title="녹음해서 들어보기"; rec.type="button"; rec.onclick=toggleRec;
  fb.insertBefore(rec,fb.firstChild);
  fb.insertBefore(rnd,fb.firstChild);
})();

/* 새 기능 반영해서 다시 그리기 */
render();
</script>

function stampSet(){ try{return new Set(JSON.parse(localStorage.getItem('dayoon_stamps')||'[]'));}catch(e){return new Set();} }
function saveStamps(s){ try{localStorage.setItem('dayoon_stamps',JSON.stringify(Array.from(s)));}catch(e){} }

function lsGet(k,fb){ try{const v=JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?fb:v;}catch(e){return fb;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

/* --- 🍞 토스트 알림 --- */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); if(!t)return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2200);
}

function getCoins(){ return lsGet('dayoon_coins',0); }
function setCoins(n){ lsSet('dayoon_coins',Math.max(0,n)); }
function coinOnAdd(){
  let gain=10; const tot=stampSet().size;
  const paid=lsGet('dayoon_bonuspaid',{w:0,mo:0});
  let msg='도장 쾅! +10 🪙';
  if(tot>0&&tot%7===0&&tot>paid.w){gain+=50; paid.w=tot; msg='도장 '+tot+'개 — 한 주 완성 보너스 +50 🎁';}
  if(tot>0&&tot%28===0&&tot>paid.mo){gain+=200; paid.mo=tot; msg='도장 '+tot+'개 — 한 달 완성 보너스 +200 🏆';}
  lsSet('dayoon_bonuspaid',paid);
  setCoins(getCoins()+gain);
  showToast(msg);
}

/* --- 📌 진도: m=개월차(0~11) · w=주차(0~3, 같은 7일 반복) · d=Day(0~6) --- */
function getProg(){ const p=lsGet('dayoon_prog',null); if(!(p&&typeof p.m==='number'))return {m:0,w:0,d:0};
  return {m:Math.min(11,Math.max(0,p.m|0)), w:Math.min(3,Math.max(0,p.w|0)), d:Math.min(6,Math.max(0,p.d|0))}; }
function saveProg(p){ lsSet('dayoon_prog',p); }
function shiftProg(dir){
  const p=getProg(); p.d+=dir;
  if(p.d>6){p.d=0;p.w++;} if(p.w>3){p.w=0;p.m++;}
  if(p.d<0){p.d=6;p.w--;} if(p.w<0){p.w=3;p.m--;}
  if(p.m>11){p.m=11;p.w=3;p.d=6;} if(p.m<0){p.m=0;p.w=0;p.d=0;}
  saveProg(p);
}
function progPct(){ const p=getProg(); return Math.min(100,Math.round((p.m*28+p.w*7+p.d)/336*100)); }

function currentStreak(){
  const s=stampSet(); if(!s.size)return 0;
  const d=new Date(); d.setHours(0,0,0,0);
  if(!s.has(dkey(d))) d.setDate(d.getDate()-1); // 오늘 아직 안 찍었으면 어제부터 세기
  let n=0;
  while(s.has(dkey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function monthCount(y,m){ let c=0; stampSet().forEach(function(k){var p=k.split('-'); if(+p[0]===y&&+p[1]===m)c++;}); return c; }

function weekCount(){
  const t=new Date(); t.setHours(0,0,0,0);
  const dow=(t.getDay()+6)%7; // 월요일=0
  const s=stampSet(); let c=0;
  for(let i=0;i<=dow;i++){const d=new Date(t); d.setDate(t.getDate()-(dow-i)); if(s.has(dkey(d)))c++;}
  return c;
}

    +'<div class="tc-main">'+(p.m+1)+'개월차 · '+(p.w+1)+'주차 · '+pd.emoji+' '+pd.title+'</div>'

    +'<div class="tc-gauge"><div style="width:'+progPct()+'%"></div></div>'
    +'<div class="tc-pct">1년 전체 진도 '+progPct()+'% <span>(336일 전부 다른 스크립트)</span></div>'
    +'<button type="button" class="tc-go" onclick="goToday()">오늘 스크립트 열기 →</button></div>';
  h+='<button class="bigstamp'+(todayStamped?' done':'')+'" type="button" onclick="stampToday()">'
    +(todayStamped?'오늘 도장 완료! 🎉<small>잘했어요 · 다시 누르면 취소</small>':'오늘 연습 끝! 도장 쾅 🟢<small>'+((typeof chkToday==='function'&&chkToday().list.length)?'오늘 체크한 연습이 이미 진도에 반영됐어요 · 도장 = 🪙10':'도장 1개 = 🪙10 + 진도 한 칸')+'</small>')+'</button>';
  const wk=weekCount();
  h+='<div class="weekline">📅 이번 주 '+wk+'/7일 연습'+(wk>=7?' — 완벽한 한 주! 🎉':(wk>=4?' — 아주 잘하고 있어요! 👏':''))+'</div>';
  h+='<div class="cal"><div class="cal-head">'

  h+='<div class="cal-grid">';
  ['일','월','화','수','목','금','토'].forEach(function(w,i){h+='<div class="dow'+(i===0?' sun':'')+'">'+w+'</div>';});

    const key=dkey(cd), stamped=s.has(key), isToday=key===todayKey, future=cd>today;
    const cls='cell'+(stamped?' stamped':'')+(isToday?' today':'')+(future?' future':'')+(justStamped===key?' pop':'');
    const attr=future?'':' tabindex="0" role="button" onclick="toggleStamp(\''+key+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleStamp(\''+key+'\');}"';
    h+='<div class="'+cls+'"'+attr+'><span class="dn">'+d+'</span></div>';

  h+='</div></div>';

  h+=shopHTML();

function stampToday(){
  const d=new Date(); const k=dkey(d); const s=stampSet();
  if(s.has(k)){ s.delete(k); saveStamps(s); coinOnRemove(); shiftProg(-1); }
  else { s.add(k); justStamped=k; saveStamps(s); coinOnAdd(); shiftProg(1); }
  calView={y:d.getFullYear(), m:d.getMonth()+1}; // 오늘이 보이는 달로
  render();
}
function toggleStamp(key){
  const s=stampSet();
  const isToday = key===dkey(new Date());
  if(s.has(key)){ s.delete(key); saveStamps(s); coinOnRemove(); if(isToday)shiftProg(-1); }
  else { s.add(key); justStamped=key; saveStamps(s); coinOnAdd(); if(isToday)shiftProg(1); }
  render();
}
function calShift(dir){
  let mm=calView.m+dir, yy=calView.y;
  if(mm<1){mm=12;yy--;} if(mm>12){mm=1;yy++;}
  const now=new Date();
  if(yy*12+mm > now.getFullYear()*12+(now.getMonth()+1))return; // 미래 달 금지
  calView={y:yy,m:mm}; render();
}
function addHomeChip(active){

/* --- render 확장: 홈(m===-3) 처리 + 모든 화면에 홈 칩 --- */
/* 시작 위치는 전용 키(v3)에 저장 — 기존 v2는 앞선 render가 먼저 덮어써서 "처음이면 홈"이 안 먹음 */
function persistPos(){ try{localStorage.setItem('dayoon_pos_v3',JSON.stringify(cur));}catch(e){} }
const _renderWithTest=render;
render=function(){
  if(cur.m===-3){
    renderMonths(); addTestChip(false); addHomeChip(true);
    tabsEl.style.display='none';
    qEl.innerHTML='<b>🏠 홈</b> · 연습한 날은 달력에 도장을 찍어요';
    mainEl.innerHTML='<div class="panel">'+homeHTML(calView.y, calView.m)+'</div>';
    persistPos();
    window.scrollTo({top:0});
    return;
  }
  _renderWithTest();
  addHomeChip(false);
  persistPos();
};

/* --- 시작 위치: v3 복원(홈/레벨테스트 포함), 저장된 게 없으면(첫 방문) 홈 --- */
(function(){
  let c={m:-3,d:0};
  try{const s=localStorage.getItem('dayoon_pos_v3'); if(s){const p=JSON.parse(s);
    if(p&&typeof p.m==='number'&&p.m>=-4&&p.m<MONTHS.length){c=p;
      if(typeof c.w!=='number'||c.w<0||c.w>3)c.w=0;
      if(c.m>=0&&!(MONTHS[c.m]&&MONTHS[c.m].weeks&&MONTHS[c.m].weeks[c.w]&&MONTHS[c.m].weeks[c.w].days[c.d]))c.d=0;}
  }}catch(e){}
  cur=c;
})();
render();
</script>
