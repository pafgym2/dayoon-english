<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e85a98">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="다윤이 영어">
<title>다윤이 화상영어 — 1년 스크립트</title>
<style>
  :root{
    --bg:#fff7fb; --card:#ffffff; --ink:#33303a; --soft:#7a7686;
    --pink:#ff7eb3; --pink-d:#e85a98; --blue:#5aa9ff; --mint:#4fd1b5;
    --yellow:#ffd166; --line:#f0e6ee; --shadow:0 6px 18px rgba(232,90,152,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:40px; font-size:17px;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(135deg,var(--pink),var(--pink-d));
    color:#fff; padding:12px 16px 10px; box-shadow:0 4px 14px rgba(232,90,152,.25);
  }
  header h1{margin:0; font-size:17px; font-weight:800; letter-spacing:-.3px;}
  header p{margin:2px 0 0; font-size:12px; opacity:.92;}
  .months{
    display:flex; gap:6px; overflow-x:auto; padding:9px 12px 4px;
    background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .months::-webkit-scrollbar{display:none;}
  .mchip{
    flex:0 0 auto; border:none; cursor:pointer; font-weight:700;
    padding:7px 12px; border-radius:12px; font-size:13.5px;
    background:#f4f0f6; color:#6b6477; white-space:nowrap; transition:.15s;
    line-height:1.25; text-align:center;
  }
  .mchip small{display:block; font-size:10.5px; font-weight:600; opacity:.75;}
  .mchip.active{background:var(--pink-d); color:#fff; box-shadow:var(--shadow);}
  .qlabel{font-size:11px; color:var(--soft); padding:4px 14px 6px; background:#fff; border-bottom:1px solid var(--line);}
  .qlabel b{color:var(--pink-d);}
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:9px 12px;
    background:#fff; border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; border:none; cursor:pointer; font-weight:700;
    padding:8px 13px; border-radius:999px; font-size:14px;
    background:#fbeef5; color:var(--pink-d); white-space:nowrap; transition:.15s;
  }
  .tab.active{background:var(--pink); color:#fff; box-shadow:var(--shadow);}
  main{padding:16px 14px 0; max-width:680px; margin:0 auto;}
  .panel{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .daytitle{font-size:20px; font-weight:800; margin:4px 0 14px; letter-spacing:-.4px;}
  .daytitle .emoji{margin-right:6px;}
  .daytitle .sub{font-size:14px;color:var(--soft);font-weight:600;}

  .seg{
    background:var(--card); border-radius:16px; padding:14px 15px;
    margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .seg h3{margin:0 0 10px; font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .time{margin-left:auto; font-size:12px; font-weight:700; color:#fff; background:var(--blue); padding:2px 9px; border-radius:999px;}
  .seg.warm h3 .time{background:var(--mint);}
  .seg.words h3 .time{background:var(--yellow); color:#7a5a00;}
  .seg.main h3 .time{background:var(--pink);}
  .seg.role h3 .time{background:#a78bfa;}
  .seg.wrap h3 .time{background:#34c77b;}
  .seg.friend{background:#fffdf5; border-color:#ffe9c2;}
  .seg.friend h3 .time{background:#ff9f43;}
  .fx{margin:9px 0;}
  .fx .en{font-weight:800; font-size:15.5px;}
  .fx .ko{color:var(--soft); font-size:13.5px; display:block;}
  .fx .use{color:#c07b1f; font-size:12.5px; font-weight:700;}

  .line{margin:5px 0; padding-left:30px; position:relative;}
  .line .who{
    position:absolute; left:0; top:0; font-weight:800; font-size:13px;
    width:24px; text-align:center; border-radius:6px; padding:1px 0;
  }
  .line.p .who{background:#e7f0ff; color:#2b6fd1;}
  .line.d .who{background:#ffe6f0; color:var(--pink-d);}
  .line .ko{color:var(--soft); font-size:13.5px; display:block; margin-top:1px;}

  .repeat{
    background:#fff4f9; border:1px dashed var(--pink); color:var(--pink-d);
    border-radius:10px; padding:7px 11px; font-size:13.5px; font-weight:700;
    margin:8px 0; text-align:center;
  }
  .sentence{
    background:linear-gradient(135deg,#fff6da,#ffe9c2); border-radius:12px;
    padding:11px 13px; font-weight:800; margin-top:8px; font-size:16px;
  }
  .sentence small{display:block; font-weight:600; color:#8a6d2f; font-size:13px; margin-top:2px;}

  table.words{width:100%; border-collapse:collapse; margin-top:4px;}
  table.words td{padding:7px 8px; border-bottom:1px solid var(--line); font-size:15px;}
  table.words tr:last-child td{border-bottom:none;}
  table.words .en{font-weight:800;}
  table.words .ko{color:var(--soft); font-size:13.5px;}
  table.words .say{color:var(--blue); font-weight:700; font-size:13.5px; text-align:right;}

  .tip{
    background:#f3fff9; border-left:4px solid var(--mint); border-radius:0 12px 12px 0;
    padding:10px 13px; font-size:13.5px; color:#2c5e4e; margin-top:6px;
  }
  .tip b{color:#1f8a6b;}

  .pill{display:inline-block; background:#fbeef5; color:var(--pink-d); font-weight:700;
    border-radius:999px; padding:3px 10px; font-size:12.5px; margin:3px 4px 3px 0;}

  .howto{background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:14px;}
  .howto table{width:100%; border-collapse:collapse;}
  .howto td{padding:9px 6px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top;}
  .howto tr:last-child td{border-bottom:none;}
  .howto .wk{font-weight:800; color:var(--pink-d); white-space:nowrap;}
  .stamp{text-align:center; font-size:15px; font-weight:800; color:#34c77b; margin-top:10px;}

  .fontbtn{position:fixed; right:14px; bottom:16px; z-index:40; display:flex; gap:8px;}
  .fontbtn button{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); font-size:18px; font-weight:800; color:var(--pink-d);
  }
  .note{font-size:12.5px; color:var(--soft); text-align:center; margin:18px 0 0;}
</style>
</head>
<body>

<header>
  <h1>🗣️ 다윤이 화상영어 — 1년 스크립트</h1>

he check, please. Goodbye, see you again!","전부 맛있었어요! 계산서 주세요. 안녕히 계세요, 또 만나요!"]],"tip":"이번 주 배운 걸 이어 붙여 입장부터 계산까지 풀코스 식당 놀이를 한 번 해 보세요. 10분이면 일주일 복습이 끝나요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"3주차 총정리","interview":true,"pool":["You enter a restaurant with Mom. What do you say first?","May I take your order? What would you like?","You do not want mushrooms. What do you say?","You are the waiter. What do you recommend?","How do you order a pizza on the phone?","What is your address for the pizza delivery?","The soup is very salty. What do you say?","What dessert do you like after a meal?","How do you ask for the bill?","What do you say when you leave the restaurant?"],"tip":"질문마다 상황극처럼 목소리를 바꿔 주세요(전화 목소리, 종업원 목소리). 상황이 그려지면 문장이 저절로 따라 나와요."}]},{"sub":"마트와 간식","days":[{"emoji":"📘","title":"Day 1 · Shopping List","sub":"장보기 목록 만들기","words":[["list","목록","리스트"],["need","필요하다","니드"],["buy","사다","바이"]],"sentence":["We need eggs and milk.","우리는 달걀이랑 우유가 필요해."],"main":[["P","Dayoon, help me! We go to the mart today. What do we need?","다윤아, 도와줘! 오늘 마트에 가야 해. 뭐가 필요하지?"],["D","We need eggs and milk!","달걀이랑 우유가 필요해요!"],["P","Right! Let us make a shopping list. What else?","맞아! 장보기 목록을 만들자. 또 뭐가 있지?"],["D","We need strawberries... a LOT of strawberries!","딸기도 필요해요... 아주 많이요!"],["P","Ha ha, of course. Anything for Siheon?","하하, 역시. 시헌이 건 없어?"],["D","Siheon needs cheese. He loves cheese like a mouse!","시헌이는 치즈가 필요해요. 생쥐처럼 치즈를 좋아하거든요!"],["P","Okay! Eggs, milk, strawberries, cheese. What about candy?","좋아! 달걀, 우유, 딸기, 치즈. 사탕은?"],["D","Candy is not on the list... but please, please, please?","사탕은 목록에 없는데... 제발, 제발, 제발요?"],["P","Hmm, okay. ONE candy. Say it in English!","음, 좋아. 딱 한 개! 영어로 말해 봐!"],["D","Yes! We need to buy one candy... maybe two!","네! 사탕 한 개를 사야 해요... 어쩌면 두 개!"]],"role":[["P","What do we need at the mart? Tell me three things.","마트에서 뭐가 필요해? 세 가지 말해 줘."],["D","We need eggs, milk, and strawberries.","달걀, 우유, 딸기가 필요해요."],["P","What does Siheon need?","시헌이는 뭐가 필요해?"],["D","He needs cheese!","치즈가 필요해요!"],["P","Is candy on the list?","사탕도 목록에 있어?"],["D","No... but I want to buy one!","아니요... 그래도 하나 사고 싶어요!"],["P","Why do we make a shopping list?","장보기 목록은 왜 만들까?"],["D","So we do not forget things!","물건을 안 까먹으려고요!"]],"wrap":[["P","Read me our shopping list in English!","우리 장보기 목록을 영어로 읽어 줘!"],["D","We need eggs, milk, strawberries, and cheese for Siheon. And one candy for me!","달걀, 우유, 딸기, 그리고 시헌이 치즈가 필요해. 그리고 내 사탕 한 개!"]],"tip":"진짜 장 보러 가기 전에 아이와 영어로 목록을 만들어 보세요. We need ~ 패턴이 생활 속에서 바로 쓰여요."},{"emoji":"📗","title":"Day 2 · Where Are the Strawberries?","sub":"마트에서 물건 찾기","words":[["aisle","(마트) 통로, 코너","아일"],["find","찾다","파인드"],["corner","코너, 구역","코너"]],"sentence":["Where can I find the strawberries?","딸기는 어디에서 찾을 수 있나요?"],"main":[["P","We are at the mart! I cannot find the strawberries. Can you ask?","마트에 왔어! 딸기를 못 찾겠네. 네가 물어볼래?"],["D","Excuse me, where can I find the strawberries?","실례합니다, 딸기는 어디에서 찾을 수 있나요?"],["P","They are in the fruit corner, next to the apples.","과일 코너에 있어요, 사과 옆이요."],["D","Thank you! Mom, this way! The fruit corner is over there!","감사합니다! 엄마, 이쪽이에요! 과일 코너가 저기 있어요!"],["P","Now we need milk. Where is the milk?","이제 우유가 필요해. 우유는 어디 있지?"],["D","Milk is in the cold corner... brrr! It is like winter here!","우유는 차가운 코너에 있어요... 부르르! 여긴 겨울 같아요!"],["P","Ha ha! And where are the cookies?","하하! 그럼 과자는 어디 있지?"],["D","Aisle three! I remember, because I love aisle three!","3번 통로요! 기억해요, 제가 3번 통로를 사랑하거든요!"],["P","You know this mart better than me!","네가 나보다 마트를 더 잘 아는구나!"],["D","Yes! I am the mart king... no, the mart queen!","네! 저는 마트 왕... 아니, 마트 여왕이에요!"]],"role":[["P","How do you ask for the strawberries?","딸기가 어디 있는지 어떻게 물어보지?"],["D","Excuse me, where can I find the strawberries?","실례합니다, 딸기는 어디에서 찾을 수 있나요?"],["P","They are next to the apples. Where is that?","사과 옆에 있어요. 그게 어디지?"],["D","The fruit corner!","과일 코너요!"],["P","Where is the milk?","우유는 어디 있어?"],["D","It is in the cold corner.","차가운 코너에 있어요."],["P 아, 건축가 다윤! 그다음엔 뭘 할까?"],["D","Find pretty shells and jump over the waves!","예쁜 조개껍데기를 찾고 파도를 뛰어넘어요!"]],"role":[["P","What can you see at the beach?","해변에서 뭐가 보여?"],["D","I can see the sea, the sand, and the waves!","바다, 모래, 파도가 보여요!"],["P","What do we build with sand?","모래로 뭘 만들지?"],["D","We build a sandcastle!","모래성을 쌓아요!"],["P","Oh no, a wave is coming! What do we say?","어어, 파도가 온다! 뭐라고 하지?"],["D","Run! Save the castle!","도망쳐요! 성을 지켜요!"],["P","Who designs the new castle?","새 성은 누가 설계하지?"],["D","Me! Architect Dayoon!","저요! 건축가 다윤!"]],"wrap":[["P","Tell me about our day at the beach!","우리 해변에서의 하루를 이야기해 줘!"],["D","At the beach, I can see waves and white sand. We build a sandcastle with ten towers, and I design it!","해변에서는 파도랑 하얀 모래가 보여. 우리는 탑이 열 개인 모래성을 쌓는데, 내가 설계해!"]],"tip":"모래성 '설계'는 건축가 꿈과 이어지는 포인트예요. 스케치북에 모래성 설계도를 그리며 탑 개수를 영어로 세어 보세요."},{"emoji":"📙","title":"Day 3 · Ice Cream Shop","sub":"아이스크림 가게 놀이","words":[["scoop","(아이스크림) 한 스쿱","스쿱"],["cone","콘","콘"],["flavor","맛","플레이버"]],"sentence":["One strawberry scoop, please!","딸기 맛 한 스쿱 주세요!"],"main":[["P","Welcome to Cool Ice Cream Shop! What flavor would you like?","쿨 아이스크림 가게에 오신 걸 환영합니다! 무슨 맛으로 드릴까요?"],["D","One strawberry scoop, please!","딸기 맛 한 스쿱 주세요!"],["P","Cup or cone?","컵으로 드릴까요, 콘으로 드릴까요?"],["D","Cone, please! I like to eat the cone at the end!","콘으로 주세요! 마지막에 콘 먹는 게 좋아요!"],["P","Here you are! Oh no, it is so hot today. Eat fast!","여기 있어요! 이런, 오늘 너무 덥네요. 빨리 드세요!"],["D","Ahh, it is melting! Drip, drip! Nom nom nom!","으아, 녹고 있어요! 뚝, 뚝! 냠냠냠!"],["P","Ha ha! Would you like one more scoop?","하하! 한 스쿱 더 드릴까요?"],["D","Yes! One mint chocolate scoop on top, please!","네! 위에 민트초코 한 스쿱 올려 주세요!"],["P","A two-scoop tower! Be careful, do not drop it!","두 스쿱 탑이네요! 조심해요, 떨어뜨리지 마세요!"],["D","The best tower ever! Ice cream tower, please do not fall!","역대 최고의 탑이에요! 아이스크림 탑아, 제발 무너지지 마!"]],"role":[["P","What flavor would you like?","무슨 맛으로 드릴까요?"],["D","One strawberry scoop, please!","딸기 맛 한 스쿱 주세요!"],["P","Cup or cone?","컵이요, 콘이요?"],["D","Cone, please!","콘으로 주세요!"],["P","It is hot! What happens to ice cream in the sun?","덥네요! 아이스크림은 햇볕에서 어떻게 되죠?"],["D","It melts! Drip, drip!","녹아요! 뚝, 뚝!"],["P","Would you like one more scoop?","한 스쿱 더 드릴까요?"],["D","Yes! Mint chocolate on top, please!","네! 위에 민트초코 올려 주세요!"]],"wrap":[["P","Order your dream ice cream in two sentences!","꿈의 아이스크림을 두 문장으로 주문해 봐!"],["D","One strawberry scoop on a cone, please! And one mint chocolate scoop on top — my ice cream tower!","콘에 딸기 한 스쿱 주세요! 그리고 위에 민트초코 한 스쿱 — 나의 아이스크림 탑이에요!"]],"tip":"flavor, scoop, cone은 해외 아이스크림 가게에서 그대로 쓰는 단어예요. 실제 아이스크림을 먹는 날 주문 놀이로 시켜 보세요."},{"emoji":"📕","title":"Day 4 · Splash! Water Park","sub":"워터파크 놀이","words":[["slide","미끄럼틀","슬라이드"],["splash","첨벙 (물이 튀다)","스플래시"],["tube","튜브","튜브"]],"sentence":["The water slide is so fast!","워터 슬라이드는 정말 빨라!"],"main":[["P","Welcome to Splash Water Park! What do you want to ride first?","스플래시 워터파크에 온 걸 환영해! 먼저 뭘 타고 싶어?"],["D","The big water slide! It looks so fast!","커다란 워터 슬라이드요! 엄청 빨라 보여요!"],["P","Are you scared?","무섭지 않아?"],["D","A little... but I am brave! Let's go!","조금요... 그래도 저는 용감해요! 가요!"],["P","Three, two, one... go! Whoosh!","셋, 둘, 하나... 출발! 슈웅!"],["D","Splash!! That was awesome! One more time!","첨벙!! 완전 최고였어요! 한 번 더요!"],["P","Ha ha! Next, the lazy river. Grab your tube!","하하! 다음은 유수풀이야. 튜브 잡아!"],["D","This tube looks like a giant donut!","이 튜브는 거대한 도넛 같아요!"],["P","Do not eat the tube, Dayoon!","다윤아, 튜브 먹으면 안 돼!"],["D","Ha ha, I won't! Float, float... this is the best day ever!","하하, 안 먹어요! 둥둥, 둥둥... 인생 최고의 날이에요!"]],"role":[["P","What do you ride first at the water park?","워터파크에서 먼저 뭘 타?"],["D","The big water slide!","커다란 워터 슬라이드요!"],["P","Is the slide slow?","슬라이드가 느려?"],["D","No! It is so fast! Whoosh!","아니요! 엄청 빨라요! 슈웅!"],["P","What do we need for the lazy river?","유수풀에는 뭐가 필요하지?"],["D","We need a tube!","튜브가 필요해요!"],["P","What does your tube look like?","네 튜브는 뭐처럼 생겼어?"],["D","It looks like a giant donut!","거대한 도넛처럼 생겼어요!"]],"wrap":[["P","Tell me about the water park!","워터파크 이야기를 해 줘!"],["D","The water slide is so fast — whoosh, splash! Then I float on a donut tube. It is the best day ever!","워터 슬라이드는 엄청 빨라 — 슈웅, 첨벙! 그다음 도넛 튜브를 타고 둥둥 떠다녀. 인생 최고의 날이야!"]],"tip":"whoosh, splash 같은 소리 표현을 온몸으로 크게 말하게 해 주세요. 의성어는 영어 말하기의 부끄러움을 깨는 최고의 도구예요."},{"emoji":"📒","title":"Day 5 · Summer Night","sub":"여름밤 이야기","words":[["watermelon","수박","워터멜론"],["star","별","스타"],["fan","선풍기","팬"]],"sentence":["We eat watermelon on summer nights.","우리는 여름밤에 수박을 먹어."],"main":[["P","It is a hot summer night. What does your family do?","더운 여름밤이야. 너희 가족은 뭘 해?"],["D","We eat cold watermelon together!","다 같이 시원한 수박을 먹어요!"],["P","Yum! Who eats the most watermelon?","맛있겠다! 수박은 누가 제일 많이 먹어?"],["D","Siheon! His face gets all wet, ha ha!","시헌이요! 얼굴이 다 젖어요, 하하!"],["P","Ha ha! What can you see in the night sky?","하하! 밤하늘엔 뭐가 보여?"],["D","I can see stars and the moon!","별이랑 달이 보여요!"],["P","What sound do you hear on summer nights?","여름밤엔 무슨 소리가 들려?"],["D","Cicadas! Meem-meem-meem! They are so loud!","매미요! 맴맴맴! 엄청 시끄러워요!"],["P","How do you sleep on hot nights?","더운 밤엔 어떻게 자?"],["D","I sleep next to the fan. Good night, fan, my best friend! Ha ha!","선풍기 옆에서 자요. 잘 자, 선풍기야, 나의 단짝! 하하!"]],"role":[["P","What does your family eat on summer nights?","여름밤에 가족들이 뭘 먹어?"],["D","We eat cold watermelon!","시원한 수박을 먹어요!"],["P","What can you see in the night sky?","밤하늘엔 뭐가 보여?"],["D","I can see stars and the moon.","별이랑 달이 보여요."],["P","What sound do cicadas make?","매미는 무슨 소리를 내?"],["D","Meem-meem-meem! So loud!","맴맴맴! 엄청 시끄러워요!"],["P","What is your best friend on hot nights?","더운 밤 너의 단짝은 누구야?"],["D","The fan! Good night, fan!","선풍기요! 잘 자, 선풍기야!"]],"wrap":[["P","Tell me about a summer night at your home!","너희 집 여름밤 이야기를 해 줘!"],["D","On summer nights, we eat cold watermelon, and Siheon's face gets all wet. I see stars, hear cicadas, and sleep next to my fan!","여름밤엔 시원한 수박을 먹는데, 시헌이 얼굴이 다 젖어. 나는 별을 보고, 매미 소리를 듣고, 선풍기 옆에서 자!"]],"tip":"오늘 밤 진짜 수박을 먹으며 대사를 재연해 보세요. 실제 상황과 겹친 문장은 평생 기억에 남아요."},{"emoji":"📓","title":"Day 6 · My Summer Plan","sub":"나의 여름 계획","words":[["plan","계획","플랜"],["practice","연습하다","프랙티스"],["memory","추억","메모리"]],"sentence":["This summer, I will visit the beach with my family.","이번 여름에 나는 가족과 함께 해변에 갈 거야."],"main":[["P","Summer vacation is coming! What is your plan?","여름 방학이 다가와! 네 계획은 뭐야?"],["D","This summer, I will visit the beach with my family!","이번 여름엔 가족들이랑 해변에 갈 거예요!"],["P","Sounds fun! What else will you do?","재밌겠다! 또 뭘 할 거야?"],["D","I will practice skating and draw every day!","스케이트 연습도 하고 매일 그림도 그릴 거예요!"],["P","Will you study English, too?","영어 공부도 할 거야?"],["D","Yes... a little! Ha ha! I will speak English at the beach!","네... 조금요! 하하! 해변에서 영어로 말할 거예요!"],["P","Good plan! What food will you eat this summer?","좋은 계획이야! 이번 여름엔 무슨 음식을 먹을 거야?"],["D","Watermelon, ice cream, and cold noodles!","수박, 아이스크림, 그리고 냉면이요!"],["P","Last question! What memory do you want to make?","마지막 질문! 어떤 추억을 만들고 싶어?"],["D","A happy family memory — swimming with Mom, Dad, and Siheon!","행복한 가족 추억이요 — 엄마, 아빠, 시헌이랑 수영하는 거요!"]],"role":[["P","What is your summer plan?","네 여름 계획은 뭐야?"],["D","I will visit the beach with my family!","가족들이랑 해변에 갈 거예요!"],["P","What will you practice?","뭘 연습할 거야?"],["D","I will practice skating!","스케이트를 연습할 거예요!"],["P","What food will you eat this summer?","이번 여름엔 뭘 먹을 거야?"],["D","Watermelon and cold noodles!","수박이랑 냉면이요!"],["P","What memory do you want to make?","어떤 추억을 만들고 싶어?"],["D","A happy memory with my family!","가족들과의 행복한 추억이요!"]],"wrap":[["P","Tell me your big summer plan in three sentences!","너의 여름 대계획을 세 문장으로 말해 줘!"],["D","This summer, I will visit the beach with my family. I will practice skating and draw every day. I want to make a happy family memory!","이번 여름엔 가족들이랑 해변에 갈 거야. 스케이트 연습도 하고 매일 그림도 그릴 거야. 행복한 가족 추억을 만들고 싶어!"]],"tip":"I will ~ 계획 말하기로 두 달 과정을 마무리해요. 아이가 말한 계획을 종이에 적어 냉장고에 붙이면 여름 내내 복습이 돼요."},{"emoji":"🏆","title":"Day 7 · Weekly Interview","sub":"4주차 총정리","interview":true,"pool":["Why do
