<title>손해보험 용어노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700;900&display=swap">
<style>
  :root{
    --paper:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEFF5;
    --ink:#15223A; --muted:#58657A; --line:#D8DFE8;
    --accent:#1D4E89; --accent-ink:#FFFFFF; --accent-soft:#E2EBF6;
    --amber:#B86E00; --amber-soft:#FBF0DC;
    --good:#1C7A4B; --good-soft:#E1F3E9;
    --bad:#B3392C; --bad-soft:#F8E4E1;
    --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#0E1520; --surface:#16202E; --surface-2:#1E2A3B;
      --ink:#E5EBF3; --muted:#9AA7BA; --line:#2A3849;
      --accent:#7EAEE6; --accent-ink:#0E1520; --accent-soft:#1C2E47;
      --amber:#F0A94A; --amber-soft:#33281A;
      --good:#56C590; --good-soft:#15352A;
      --bad:#F08477; --bad-soft:#3A1F1C;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0E1520; --surface:#16202E; --surface-2:#1E2A3B;
    --ink:#E5EBF3; --muted:#9AA7BA; --line:#2A3849;
    --accent:#7EAEE6; --accent-ink:#0E1520; --accent-soft:#1C2E47;
    --amber:#F0A94A; --amber-soft:#33281A;
    --good:#56C590; --good-soft:#15352A;
    --bad:#F08477; --bad-soft:#3A1F1C;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-tap-highlight-color:transparent;}
  .wrap{max-width:680px; margin:0 auto; padding-inline:16px; padding-block:0 48px;}
  button{font:inherit; color:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  header.top{padding-block:22px 14px; display:flex; flex-direction:column; gap:4px;}
  .eyebrow{font-size:12px; letter-spacing:.08em; color:var(--amber); font-weight:600;}
  h1{font-family:var(--serif); font-weight:900; font-size:28px; line-height:1.25; margin:0; text-wrap:balance;}
  .sub{color:var(--muted); font-size:14px; margin:0;}

  nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); display:flex; gap:4px; padding-block:8px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{flex:1; border:0; background:transparent; padding:10px 6px; border-radius:8px; font-weight:600; color:var(--muted); font-size:15px;}
  .tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line) inset;}
  .tab .count{font-size:12px; font-weight:600; color:var(--bad); margin-left:4px; font-variant-numeric:tabular-nums;}

  section.panel{display:flex; flex-direction:column; gap:18px;}
  .label{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.02em; margin:0 0 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--surface); padding:8px 12px; border-radius:999px; font-size:14px; font-weight:500; display:inline-flex; gap:6px; align-items:center;}
  .chip .n{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chip[aria-pressed="true"] .n{color:inherit; opacity:.8;}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mode{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:14px; text-align:left; display:flex; flex-direction:column; gap:2px;}
  .mode b{font-size:15px;}
  .mode span{font-size:13px; color:var(--muted);}
  .mode[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; background:var(--accent-soft);}

  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .primary{border:0; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:16px; padding:14px 20px; border-radius:12px; flex:1; min-height:52px;}
  .primary:disabled{opacity:.45; cursor:not-allowed;}
  .ghost{border:1px solid var(--line); background:var(--surface); font-weight:600; padding:12px 16px; border-radius:12px;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column;}
  .stat b{font-size:22px; font-variant-numeric:tabular-nums; font-family:var(--serif);}
  .stat span{font-size:12px; color:var(--muted);}

  /* 퀴즈 화면 */
  .progress{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .bar{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); transition:width .3s;}
  .qcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 18px; display:flex; flex-direction:column; gap:10px;}
  .qcat{font-size:12px; font-weight:600; color:var(--amber); letter-spacing:.04em;}
  .qask{font-size:13px; color:var(--muted); margin:0;}
  .qtext{margin:0; font-size:17px; line-height:1.65;}
  .qtext.term{font-family:var(--serif); font-size:30px; font-weight:900; line-height:1.3;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:14px 14px 14px 12px; text-align:left; display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.55;}
  .opt .k{flex:0 0 26px; height:26px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted);}
  .opt.termopt{font-family:var(--serif); font-weight:700; font-size:18px; align-items:center;}
  .opt.correct{border-color:var(--good); background:var(--good-soft);}
  .opt.correct .k{background:var(--good); border-color:var(--good); color:var(--surface);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .opt.wrong .k{background:var(--bad); border-color:var(--bad); color:var(--surface);}
  .opt:disabled{cursor:default;}
  .feedback{border-radius:12px; padding:14px; background:var(--surface-2); display:flex; flex-direction:column; gap:6px; font-size:14.5px;}
  .feedback .verdict{font-weight:700; font-size:15px;}
  .feedback.ok .verdict{color:var(--good);}
  .feedback.no .verdict{color:var(--bad);}
  .feedback .def{margin:0;}
  .feedback .def b{font-family:var(--serif);}
  .tip{margin:0; padding:10px 12px; border-radius:8px; background:var(--amber-soft); font-size:14px;}
  .tip::before{content:"현장 포인트 · "; font-weight:700; color:var(--amber);}

  /* 결과 */
  .score{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 18px; display:flex; flex-direction:column; gap:4px; align-items:flex-start;}
  .score .big{font-family:var(--serif); font-size:44px; font-weight:900; line-height:1.1; font-variant-numeric:tabular-nums;}
  .score .big small{font-size:20px; color:var(--muted); font-weight:700;}
  .score p{margin:0; color:var(--muted);}

  /* 용어집 */
  .search{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; font:inherit; color:var(--ink);}
  .gloss{display:flex; flex-direction:column; border-top:1px solid var(--line);}
  .entry{padding:14px 2px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px;}
  .entry .head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .entry h3{margin:0; font-family:var(--serif); font-size:19px; font-weight:700;}
  .entry .alias{font-size:13px; color:var(--muted);}
  .entry .cat{margin-left:auto; font-size:12px; color:var(--amber); font-weight:600;}
  .entry p{margin:0; font-size:15px;}
  .entry .tip{margin-top:4px;}
  .entry.missed h3::after{content:" · 틀린 적 있음"; font-family:var(--sans); font-size:12px; color:var(--bad); font-weight:600;}
  .empty{color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:18px; text-align:center;}
  .note{font-size:12.5px; color:var(--muted); margin:0;}

  @media (max-width:420px){ h1{font-size:24px;} .qtext.term{font-size:26px;} .stat b{font-size:19px;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">신입 설계사 교육 · 시범버전</span>
    <h1>손해보험 용어노트</h1>
    <p class="sub">현장에서 매일 쓰는 용어를 4지선다로 익혀요. 틀린 문제는 오답노트에 모아 둡니다.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true" data-tab="quiz">퀴즈</button>
    <button class="tab" role="tab" id="tab-gloss" aria-selected="false" data-tab="gloss">용어집</button>
    <button class="tab" role="tab" id="tab-wrong" aria-selected="false" data-tab="wrong">오답노트<span class="count" id="wrongCount"></span></button>
  </nav>

  <!-- 퀴즈 설정 -->
  <section class="panel" id="p-setup">
    <div class="stats" id="stats"></div>
    <div>
      <p class="label">분야 선택 (여러 개 가능)</p>
      <div class="chips" id="cats"></div>
    </div>
    <div>
      <p class="label">문제 방식</p>
      <div class="modes">
        <button class="mode" id="mode-def" data-mode="def" aria-pressed="true"><b>뜻 → 용어</b><span>설명을 읽고 용어 고르기</span></button>
        <button class="mode" id="mode-term" data-mode="term" aria-pressed="false"><b>용어 → 뜻</b><span>용어를 보고 설명 고르기</span></button>
      </div>
    </div>
    <div>
      <p class="label">문제 수</p>
      <div class="chips" id="counts"></div>
    </div>
    <div class="row"><button class="primary" id="start">퀴즈 시작</button></div>
    <p class="note">교육용 시범 자료입니다. 약관·법령은 개정될 수 있으니 실제 안내 전에는 회사 최신 약관과 교육자료로 확인하세요.</p>
  </section>

  <!-- 퀴즈 진행 -->
  <section class="panel" id="p-quiz" hidden>
    <div class="progress"><span id="qnum">1 / 10</span><div class="bar"><i id="qbar" style="width:0%"></i></div><span id="qscore">정답 0</span></div>
    <div class="qcard">
      <span class="qcat" id="qcat"></span>
      <p class="qask" id="qask"></p>
      <p class="qtext" id="qtext"></p>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback" hidden></div>
    <div class="row">
      <button class="ghost" id="quit">그만하기</button>
      <button class="primary" id="next" hidden>다음 문제</button>
    </div>
  </section>

  <!-- 결과 -->
  <section class="panel" id="p-result" hidden>
    <div class="score">
      <span class="eyebrow">이번 퀴즈 결과</span>
      <span class="big" id="rscore">0<small> / 10</small></span>
      <p id="rmsg"></p>
    </div>
    <div class="row">
      <button class="primary" id="retryWrong">틀린 문제만 다시</button>
      <button class="ghost" id="toSetup">처음으로</button>
    </div>
    <div>
      <p class="label" id="rlistLabel">틀린 용어</p>
      <div class="gloss" id="rlist"></div>
    </div>
  </section>

  <!-- 용어집 -->
  <section class="panel" id="p-gloss" hidden>
    <input class="search" id="q" type="search" placeholder="용어나 설명으로 찾기 (예: 대위, 자차)" aria-label="용어 검색">
    <div class="chips" id="gcats"></div>
    <div class="gloss" id="glist"></div>
  </section>

  <!-- 오답노트 -->
  <section class="panel" id="p-wrong" hidden>
    <div class="row">
      <button class="primary" id="wrongQuiz">오답만 퀴즈 풀기</button>
      <button class="ghost" id="wrongClear">비우기</button>
    </div>
    <p class="note" id="wrongConfirm" hidden>한 번 더 누르면 오답노트가 비워집니다.</p>
    <div class="gloss" id="wlist"></div>
  </section>
</div>

<script>
(function(){
  // ── 용어 데이터 ──────────────────────────────
  // c: 분야, t: 용어, a: 다른 이름, d: 뜻, p: 현장 포인트
  var TERMS = [
    // 기본개념
    {c:"기본개념", t:"보험계약자", d:"보험회사와 보험계약을 체결하고 보험료를 낼 의무를 지는 사람.", p:"계약자·피보험자·수익자가 모두 다를 수 있어요. 청약서에서 세 사람을 먼저 구분하게 하세요."},
    {c:"기본개념", t:"피보험자", d:"손해보험에서 보험사고로 손해를 입었을 때 보험금을 청구할 권리가 있는 사람.", p:"생명보험의 '피보험자(보험 대상자)'와 뜻이 달라서 신입들이 가장 많이 헷갈려요."},
    {c:"기본개념", t:"피보험이익", d:"보험의 목적(물건 등)에 대해 피보험자가 가지는 경제적 이해관계. 손해보험계약이 보호하는 대상.", p:"집주인과 세입자는 같은 건물이라도 피보험이익이 달라요."},
    {c:"기본개념", t:"보험가액", d:"피보험이익을 돈으로 평가한 금액. 손해보험에서 보상받을 수 있는 법률상 최고한도.", p:"'얼마짜리 물건인가'가 보험가액, '얼마로 가입했나'가 보험가입금액이에요."},
    {c:"기본개념", t:"보험가입금액", a:"보험금액", d:"계약할 때 정한 금액으로, 보험회사가 지급하는 보험금의 약정 최고한도.", p:"보험가액과 비교해서 초과·일부·전부보험이 나뉩니다."},
    {c:"기본개념", t:"초과보험", d:"보험가입금액이 보험가액을 현저하게 넘는 보험.", p:"많이 가입해도 실제 손해 이상은 받지 못하니 보험료만 더 내는 셈이에요."},
    {c:"기본개념", t:"일부보험", d:"보험가입금액이 보험가액보다 적은 보험. 원칙적으로 가입 비율만큼 비례해서 보상.", p:"가액 1억 건물을 5천만 원에 가입했다면 손해의 절반만 보상돼요(약관에 따라 예외 있음)."},
    {c:"기본개념", t:"중복보험", d:"같은 목적·같은 사고에 여러 계약이 있고, 가입금액 합계가 보험가액을 넘는 경우. 각 회사가 비율대로 나눠 보상.", p:"실손보험을 두 곳에 들어도 두 배로 받지 못하는 이유예요."},
    {c:"기본개념", t:"실손보상의 원칙", a:"이득금지의 원칙", d:"실제로 입은 손해만큼만 보상하고, 보험으로 이익을 보지 못하게 하는 손해보험의 기본 원칙.", p:"중복보험·일부보험·대위가 모두 이 원칙에서 나와요."},
    {c:"기본개념", t:"청구권대위", d:"보험금을 지급한 보험회사가 그 한도에서 피보험자가 제3자(가해자)에게 가지는 손해배상청구권을 넘겨받는 것.", p:"보험금을 받은 뒤 가해자에게 같은 손해를 또 청구할 수 없어요."},
    {c:"기본개념", t:"잔존물대위", d:"보험목적이 전부 멸실되어 보험금 전액을 지급한 보험회사가 남은 물건에 대한 권리를 취득하는 것.", p:"전손 처리된 차량의 소유권이 보험회사로 넘어가는 경우가 대표적이에요."},
    {c:"기본개념", t:"계약 전 알릴 의무", a:"고지의무", d:"청약할 때 청약서 질문에 중요한 사항을 사실대로 알려야 하는 의무.", p:"위반하면 계약 해지나 보험금 부지급으로 이어질 수 있어요. 대신 적어주면 안 됩니다."},
    {c:"기본개념", t:"계약 후 알릴 의무", a:"통지의무", d:"계약 후 직업 변경처럼 위험이 뚜렷하게 커지는 변화가 생기면 보험회사에 알려야 하는 의무.", p:"오토바이를 타기 시작했거나 직업이 바뀐 고객에게 꼭 안내하세요."},
    {c:"기본개념", t:"면책사유", d:"사고가 나도 약관에 따라 보험회사가 보험금을 지급하지 않는 사유.", p:"고의 사고, 전쟁 등이 대표적이에요. 상담할 때 '안 되는 경우'도 함께 설명해야 민원이 줄어요."},
    {c:"기본개념", t:"자기부담금", a:"공제금액", d:"손해액 가운데 보험회사가 보상하지 않고 피보험자가 직접 부담하는 금액.", p:"자기부담금이 높을수록 보험료는 낮아지는 구조예요."},

    // 자동차보험
    {c:"자동차보험", t:"대인배상Ⅰ", d:"자동차손해배상보장법에 따라 반드시 가입해야 하는 담보. 다른 사람을 죽거나 다치게 했을 때 법에서 정한 한도까지 보상.", p:"'책임보험'이라고도 불러요. 미가입 시 과태료 대상입니다."},
    {c:"자동차보험", t:"대인배상Ⅱ", d:"대인배상Ⅰ의 한도를 넘는 사람 피해를 보상하는 임의 담보.", p:"보통 '무한'으로 가입해요. 큰 인사사고는 대인Ⅰ만으로 부족합니다."},
    {c:"자동차보험", t:"대물배상", d:"사고로 다른 사람의 차량이나 재물에 입힌 손해를 보상. 일정 금액까지는 의무가입.", p:"외제차·고가 시설물 사고를 생각해서 한도를 넉넉히 권하는 편이에요."},
    {c:"자동차보험", t:"자기신체사고", a:"자손", d:"피보험자 본인이 자동차 사고로 죽거나 다쳤을 때 가입금액 한도에서 정해진 기준으로 보상.", p:"'자동차상해'와 둘 중 하나를 고르는 구조가 많아요."},
    {c:"자동차보험", t:"자동차상해", a:"자상", d:"자기신체사고 대신 고를 수 있는 담보로, 본인 과실과 관계없이 실제 손해를 기준으로 폭넓게 보상.", p:"보험료는 자손보다 비싸지만 보상 범위가 넓어요."},
    {c:"자동차보험", t:"무보험자동차에 의한 상해", d:"보험에 들지 않은 차나 뺑소니 차량 때문에 피보험자가 죽거나 다쳤을 때 보상.", p:"상대방이 보험이 없어도 내 보험에서 보상받을 수 있는 담보예요."},
    {c:"자동차보험", t:"자기차량손해", a:"자차", d:"피보험자 자신의 차량이 사고로 부서지거나 도난당했을 때 그 손해를 보상.", p:"자기부담금 비율과 최소·최대 금액을 함께 설명하세요."},
    {c:"자동차보험", t:"과실상계", d:"피해자에게도 잘못이 있으면 그 과실 비율만큼 손해배상액을 줄이는 것.", p:"'8:2 사고'라고 할 때의 그 비율이 과실비율이에요."},
    {c:"자동차보험", t:"대차료", d:"사고로 차량을 수리하는 동안 다른 차를 빌리는 데 드는 비용. 대물배상에서 인정 기간 동안 보상.", p:"렌트 대신 교통비로 받는 방식도 있어요."},
    {c:"자동차보험", t:"전손", a:"전부손해", d:"차량이 완전히 파손되어 수리가 불가능하거나, 수리비가 차량가액을 넘는 경우.", p:"전손 처리하면 차량가액 기준으로 보상하고 잔존물은 보험회사가 가져갈 수 있어요."},

    // 화재·재물보험
    {c:"화재·재물보험", t:"화재보험", d:"화재(벼락 포함)로 생긴 직접손해와 불을 끄느라 생긴 소방손해, 피난하면서 생긴 피난손해를 보상하는 보험.", p:"물로 불을 끄다 젖은 물건도 '소방손해'로 보상돼요."},
    {c:"화재·재물보험", t:"재조달가액", d:"보험목적과 같은 종류·품질의 새 물건을 다시 사거나 짓는 데 드는 금액. 감가상각을 빼지 않음.", p:"'신가(新價)'라고도 해요. 재조달가액 특약이 있으면 새것 기준으로 보상받아요."},
    {c:"화재·재물보험", t:"시가", d:"재조달가액에서 사용 기간에 따른 감가상각을 뺀, 현재 시점의 가치.", p:"일반 화재보험은 원칙적으로 시가 기준으로 손해를 계산해요."},
    {c:"화재·재물보험", t:"80% 공동보험조항", a:"코인슈어런스", d:"보험가입금액이 보험가액의 80% 이상이면 가입금액 한도에서 실제 손해를 보상하고, 미만이면 비례해서 보상하는 조항.", p:"가액 1억, 가입 6천, 손해 3천 → 3천 × 6천 ÷ (1억 × 80%) = 2,250만 원."},
    {c:"화재·재물보험", t:"특수건물", d:"화재보험법에서 정한 일정 규모 이상의 건물. 신체손해배상책임을 포함한 화재보험에 의무 가입.", p:"대형 상가, 병원, 공장 등이 해당돼요. 영업할 때 의무가입 여부부터 확인하세요."},
    {c:"화재·재물보험", t:"풍수재", d:"태풍, 홍수, 호우, 해일 등 자연재해로 생긴 손해. 일반 화재보험에서는 특약으로 보상.", p:"화재보험만으로는 침수 피해가 보상되지 않는 경우가 많아요."},

    // 배상책임보험
    {c:"배상책임보험", t:"배상책임보험", d:"피보험자가 다른 사람에게 법률상 손해배상책임을 지게 되어 생긴 손해를 보상하는 보험.", p:"'법률상' 책임이 핵심이에요. 도의적으로 물어준 돈은 보상 대상이 아닐 수 있어요."},
    {c:"배상책임보험", t:"일상생활배상책임", d:"일상생활 중 우연한 사고로 다른 사람의 몸이나 재물에 피해를 입혀 법률상 배상책임을 질 때 보상하는 특약.", p:"아랫집 누수, 아이가 친구 휴대폰을 떨어뜨린 경우 등. 적은 보험료로 활용도가 높아요."},
    {c:"배상책임보험", t:"생산물배상책임", a:"PL보험", d:"제조·판매한 제품의 결함으로 다른 사람에게 신체나 재산 피해가 생겼을 때의 배상책임을 보상.", p:"음식점, 제조업체 영업할 때 자주 나오는 상품이에요."},
    {c:"배상책임보험", t:"시설소유관리자배상책임", d:"건물·시설을 소유하거나 관리하면서, 시설의 결함이나 업무 중 사고로 다른 사람에게 피해를 입혔을 때의 배상책임을 보상.", p:"매장 바닥에 손님이 미끄러져 다친 경우가 대표 사례예요."},
    {c:"배상책임보험", t:"보상한도액", d:"배상책임보험에서 한 사고 또는 보험기간 전체에 대해 보험회사가 지급하는 최고 금액.", p:"'1사고당'과 '총 보상한도'를 구분해서 설명하세요."},

    // 장기손해보험
    {c:"장기손해보험", t:"실손의료보험", d:"실제로 부담한 의료비를 자기부담금을 빼고 보상하는 보험.", p:"여러 개 가입해도 실제 의료비 이상은 받지 못하고 비례해서 나눠 보상돼요."},
    {c:"장기손해보험", t:"상해", d:"급격하고 우연한 외래의 사고로 신체에 입은 피해.", p:"'급격성·우연성·외래성' 세 가지를 모두 갖춰야 해요. 질병과 구분하는 기준입니다."},
    {c:"장기손해보험", t:"후유장해", d:"상해나 질병을 치료한 뒤에도 신체에 남은, 회복이 어려운 영구적인 손상 상태.", p:"장해분류표의 지급률에 따라 보험금이 정해져요."},
    {c:"장기손해보험", t:"갱신형", d:"일정 기간마다 나이와 손해율 등을 반영해 보험료를 다시 계산하고 계약을 이어가는 형태.", p:"처음 보험료는 싸지만 갱신 때 오를 수 있다는 점을 반드시 안내하세요."},
    {c:"장기손해보험", t:"해지환급금", d:"계약을 중간에 해지할 때 보험회사가 계약자에게 돌려주는 금액.", p:"초기에 해지하면 낸 보험료보다 훨씬 적거나 없을 수 있어요."},
    {c:"장기손해보험", t:"청약철회", d:"보험증권을 받은 날부터 15일 안에 청약을 취소할 수 있는 제도. 단, 청약한 날부터 30일이 지나면 불가.", p:"철회하면 낸 보험료를 돌려받아요. 신입 시험 단골 문제입니다."},

    // 보상실무
    {c:"보상실무", t:"손해사정", d:"사고가 났을 때 손해액을 조사·평가하고 지급할 보험금을 계산하는 일.", p:"손해사정사가 맡아요. 고객이 별도 손해사정사를 선임할 수도 있어요."},
    {c:"보상실무", t:"보험금 청구권 소멸시효", d:"보험금을 청구할 수 있는 권리는 3년 동안 행사하지 않으면 사라짐.", p:"오래된 병원비도 3년 안이면 청구할 수 있다고 안내해 주세요."},
    {c:"보상실무", t:"사고 통지", d:"보험사고가 생긴 것을 알았을 때 지체 없이 보험회사에 알리는 것.", p:"늦게 알려서 손해가 커진 부분은 보상받지 못할 수 있어요."},
    {c:"보상실무", t:"손해방지비용", d:"사고가 났을 때 손해가 커지지 않도록 막는 데 쓴 필요하고 유익한 비용. 보험회사가 부담.", p:"불이 번지지 않게 쓴 소화기 비용 등이 해당돼요."}
  ];
  TERMS.forEach(function(x,i){ x.id = i; });
  var CATS = ["기본개념","자동차보험","화재·재물보험","배상책임보험","장기손해보험","보상실무"];

  // ── 저장 (실패해도 동작) ──────────────────────
  var KEY = "nonlife-terms-v1";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  var store = load();
  store.wrong = store.wrong || {};      // id → 틀린 횟수
  store.seen = store.seen || {};        // id → 1
  store.best = store.best || 0;         // 최고 정답률(%)

  var $ = function(id){ return document.getElementById(id); };
  var state = { cats: CATS.slice(), mode:"def", count:10, gcat:"전체" };
  var quiz = null;

  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function wrongIds(){ return Object.keys(store.wrong).map(Number).filter(function(id){ return TERMS[id]; }); }

  // ── 탭 ─────────────────────────────────────
  var panels = { setup:$("p-setup"), quiz:$("p-quiz"), result:$("p-result"), gloss:$("p-gloss"), wrong:$("p-wrong") };
  function show(name){
    Object.keys(panels).forEach(function(k){ panels[k].hidden = (k !== name); });
    var tab = (name==="setup"||name==="quiz"||name==="result") ? "quiz" : name;
    document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.tab===tab ? "true":"false"); });
    if(name==="setup") renderSetup();
    if(name==="gloss") renderGloss();
    if(name==="wrong") renderWrong();
    window.scrollTo(0,0);
  }
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){
      var t = b.dataset.tab;
      if(t==="quiz") show(quiz && !quiz.done ? "quiz" : "setup"); else show(t);
    });
  });
  function updateWrongCount(){ var n = wrongIds().length; $("wrongCount").textContent = n ? n : ""; }

  // ── 설정 화면 ────────────────────────────────
  function renderSetup(){
    var seen = Object.keys(store.seen).length;
    $("stats").innerHTML =
      '<div class="stat"><b>'+TERMS.length+'</b><span>전체 용어</span></div>'+
      '<div class="stat"><b>'+seen+'</b><span>풀어본 용어</span></div>'+
      '<div class="stat"><b>'+(store.best ? store.best+'%' : '–')+'</b><span>최고 정답률</span></div>';
    $("cats").innerHTML = CATS.map(function(c){
      var n = TERMS.filter(function(x){ return x.c===c; }).length;
      return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(state.cats.indexOf(c)>-1)+'">'+esc(c)+' <span class="n">'+n+'</span></button>';
    }).join("");
    $("cats").querySelectorAll(".chip").forEach(function(b){
      b.addEventListener("click", function(){
        var c = b.dataset.cat, i = state.cats.indexOf(c);
        if(i>-1) state.cats.splice(i,1); else state.cats.push(c);
        renderSetup();
      });
    });
    $("counts").innerHTML = [5,10,20].map(function(n){
      return '<button class="chip" data-n="'+n+'" aria-pressed="'+(state.count===n)+'">'+n+'문제</button>';
    }).join("");
    $("counts").querySelectorAll(".chip").forEach(function(b){
      b.addEventListener("click", function(){ state.count = Number(b.dataset.n); renderSetup(); });
    });
    ["def","term"].forEach(function(m){ $("mode-"+m).setAttribute("aria-pressed", state.mode===m ? "true":"false"); });
    var pool = TERMS.filter(function(x){ return state.cats.indexOf(x.c)>-1; });
    $("start").disabled = pool.length < 4;
    $("start").textContent = pool.length < 4 ? "분야를 하나 이상 골라 주세요" : "퀴즈 시작 · "+Math.min(state.count,pool.length)+"문제";
    updateWrongCount();
  }
  ["def","term"].forEach(function(m){ $("mode-"+m).addEventListener("click", function(){ state.mode = m; renderSetup(); }); });
  $("start").addEventListener("click", function(){
    var pool = TERMS.filter(function(x){ return state.cats.indexOf(x.c)>-1; });
    startQuiz(shuffle(pool).slice(0, state.count));
  });

  // ── 퀴즈 ─────────────────────────────────────
  function makeOptions(ans){
    // 같은 분야 오답을 우선 섞어서 난이도를 올림
    var same = shuffle(TERMS.filter(function(x){ return x.c===ans.c && x.id!==ans.id; }));
    var other = shuffle(TERMS.filter(function(x){ return x.c!==ans.c; }));
    var picks = same.slice(0,2).concat(other).slice(0,3);
    return shuffle(picks.concat([ans]));
  }
  function startQuiz(items){
    quiz = { items:items, i:0, score:0, missed:[], done:false, mode:state.mode };
    show("quiz"); renderQ();
  }
  function renderQ(){
    var q = quiz.items[quiz.i], total = quiz.items.length;
    $("qnum").textContent = (quiz.i+1)+" / "+total;
    $("qbar").style.width = (quiz.i/total*100)+"%";
    $("qscore").textContent = "정답 "+quiz.score;
    $("qcat").textContent = q.c;
    var byDef = quiz.mode==="def";
    $("qask").textContent = byDef ? "다음 설명에 맞는 용어는?" : "이 용어의 뜻으로 알맞은 것은?";
    $("qtext").className = "qtext" + (byDef ? "" : " term");
    $("qtext").textContent = byDef ? q.d : q.t;
    var opts = makeOptions(q);
    $("opts").innerHTML = opts.map(function(o,k){
      return '<button class="opt'+(byDef?' termopt':'')+'" data-id="'+o.id+'"><span class="k">'+(k+1)+'</span><span>'+esc(byDef ? o.t : o.d)+'</span></button>';
    }).join("");
    $("opts").querySelectorAll(".opt").forEach(function(b){ b.addEventListener("click", function(){ answer(Number(b.dataset.id)); }); });
    $("feedback").hidden = true; $("next").hidden = true;
  }
  function answer(id){
    var q = quiz.items[quiz.i], ok = id===q.id;
    $("opts").querySelectorAll(".opt").forEach(function(b){
      var bid = Number(b.dataset.id);
      b.disabled = true;
      if(bid===q.id) b.classList.add("correct");
      else if(bid===id) b.classList.add("wrong");
    });
    store.seen[q.id] = 1;
    if(ok){ quiz.score++; if(store.wrong[q.id]) delete store.wrong[q.id]; }
    else { quiz.missed.push(q); store.wrong[q.id] = (store.wrong[q.id]||0)+1; }
    save(); updateWrongCount();
    var chosen = TERMS[id];
    var fb = $("feedback");
    fb.className = "feedback " + (ok ? "ok":"no");
    fb.innerHTML =
      '<span class="verdict">'+(ok ? "정답이에요" : "아쉬워요. 정답은 ‘"+esc(q.t)+"’")+'</span>'+
      '<p class="def"><b>'+esc(q.t)+'</b>'+(q.a ? ' ('+esc(q.a)+')' : '')+' — '+esc(q.d)+'</p>'+
      (!ok ? '<p class="def" style="color:var(--muted)">고른 답 <b>'+esc(chosen.t)+'</b>: '+esc(chosen.d)+'</p>' : '')+
      '<p class="tip">'+esc(q.p)+'</p>';
    fb.hidden = false;
    $("qscore").textContent = "정답 "+quiz.score;
    $("next").hidden = false;
    $("next").textContent = quiz.i+1 < quiz.items.length ? "다음 문제" : "결과 보기";
    $("next").focus({preventScroll:true});
    fb.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  $("next").addEventListener("click", function(){
    quiz.i++;
    if(quiz.i < quiz.items.length){ renderQ(); window.scrollTo(0,0); }
    else finish();
  });
  $("quit").addEventListener("click", function(){ quiz = null; show("setup"); });

  function finish(){
    quiz.done = true;
    var total = quiz.items.length, pct = Math.round(quiz.score/total*100);
    if(pct > store.best){ store.best = pct; save(); }
    $("rscore").innerHTML = quiz.score+'<small> / '+total+'</small>';
    $("rmsg").textContent = pct===100 ? "모두 맞혔어요. 다른 분야나 반대 방식으로도 풀어 보세요."
      : pct>=70 ? "정답률 "+pct+"%. 틀린 용어만 한 번 더 보면 충분해요."
      : "정답률 "+pct+"%. 용어집에서 뜻과 현장 포인트를 읽고 다시 풀어 보세요.";
    $("retryWrong").hidden = quiz.missed.length===0;
    $("rlistLabel").textContent = quiz.missed.length ? "틀린 용어 "+quiz.missed.length+"개" : "틀린 용어가 없어요";
    $("rlist").innerHTML = quiz.missed.map(entryHTML).join("");
    show("result");
  }
  $("retryWrong").addEventListener("click", function(){ startQuiz(shuffle(quiz.missed)); });
  $("toSetup").addEventListener("click", function(){ quiz = null; show("setup"); });

  // ── 용어집 / 오답노트 ─────────────────────────
  function entryHTML(x){
    return '<div class="entry'+(store.wrong[x.id] ? ' missed':'')+'"><div class="head"><h3>'+esc(x.t)+'</h3>'+
      (x.a ? '<span class="alias">'+esc(x.a)+'</span>' : '')+'<span class="cat">'+esc(x.c)+'</span></div>'+
      '<p>'+esc(x.d)+'</p><p class="tip">'+esc(x.p)+'</p></div>';
  }
  function renderGloss(){
    var all = ["전체"].concat(CATS);
    $("gcats").innerHTML = all.map(function(c){
      return '<button class="chip" data-g="'+esc(c)+'" aria-pressed="'+(state.gcat===c)+'">'+esc(c)+'</button>';
    }).join("");
    $("gcats").querySelectorAll(".chip").forEach(function(b){ b.addEventListener("click", function(){ state.gcat = b.dataset.g; renderGloss(); }); });
    var q = $("q").value.trim();
    var list = TERMS.filter(function(x){
      if(state.gcat!=="전체" && x.c!==state.gcat) return false;
      if(!q) return true;
      return (x.t+" "+(x.a||"")+" "+x.d+" "+x.p).indexOf(q) > -1;
    });
    $("glist").innerHTML = list.length ? list.map(entryHTML).join("") : '<div class="empty">‘'+esc(q)+'’에 맞는 용어가 없어요.</div>';
  }
  $("q").addEventListener("input", renderGloss);

  function renderWrong(){
    var ids = wrongIds().sort(function(a,b){ return store.wrong[b]-store.wrong[a]; });
    $("wrongQuiz").disabled = ids.length===0;
    $("wrongClear").hidden = ids.length===0;
    $("wrongConfirm").hidden = true; clearArmed = false;
    $("wlist").innerHTML = ids.length ? ids.map(function(id){ return entryHTML(TERMS[id]); }).join("")
      : '<div class="empty">아직 틀린 용어가 없어요. 퀴즈에서 틀린 용어가 여기에 모이고, 다시 맞히면 빠집니다.</div>';
  }
  $("wrongQuiz").addEventListener("click", function(){ startQuiz(shuffle(wrongIds().map(function(id){ return TERMS[id]; }))); });
  var clearArmed = false;
  $("wrongClear").addEventListener("click", function(){
    if(!clearArmed){ clearArmed = true; $("wrongConfirm").hidden = false; $("wrongClear").textContent = "정말 비우기"; return; }
    store.wrong = {}; save(); updateWrongCount(); $("wrongClear").textContent = "비우기"; renderWrong();
  });

  show("setup");
})();
</script>
